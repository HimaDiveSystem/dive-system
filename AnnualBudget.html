<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الميزانية السنوية</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI','Cairo',Arial,sans-serif; background:#0f172a; color:#e2e8f0; min-height:100vh; }
.app { display:flex; min-height:100vh; }
.sidebar { width:250px; background:#020617; border-left:1px solid #1e293b; padding:20px 0; }
.logo { padding:0 20px 20px; font-size:20px; font-weight:800; color:#f5c842; border-bottom:1px solid #1e293b; margin-bottom:15px; }
.nav-item { padding:12px 20px; color:#94a3b8; cursor:pointer; transition:.2s; border-right:3px solid transparent; }
.nav-item:hover, .nav-item.active { background:#0f172a; color:#f5c842; border-right-color:#f5c842; }
.main { flex:1; padding:25px; overflow-y:auto; }
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; flex-wrap:wrap; gap:15px; }
.header h1 { font-size:24px; color:#f5c842; }
.filters { display:flex; gap:10px; flex-wrap:wrap; }
.filters select, .filters button { padding:10px 15px; border-radius:8px; border:1px solid #334155; background:#1e293b; color:#e2e8f0; font-family:inherit; }
.filters button { background:#f5c842; color:#0f172a; font-weight:700; cursor:pointer; border:none; }
.filters button:hover { background:#facc15; }
.cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:15px; margin-bottom:25px; }
.card { background:linear-gradient(135deg, #1e293b, #0f172a); padding:20px; border-radius:12px; border:1px solid #334155; }
.card .label { font-size:12px; color:#94a3b8; margin-bottom:8px; }
.card .value { font-size:22px; font-weight:800; }
.card .sub { font-size:11px; color:#64748b; margin-top:6px; }
.card.revenue .value { color:#10b981; }
.card.costs .value { color:#ef4444; }
.card.profit .value { color:#3b82f6; }
.card.margin .value { color:#a78bfa; }
.card.growth .value { color:#f59e0b; }
.section { background:#1e293b; border-radius:12px; padding:20px; margin-bottom:20px; border:1px solid #334155; }
.section-title { font-size:16px; font-weight:700; color:#f5c842; margin-bottom:15px; padding-bottom:10px; border-bottom:1px solid #334155; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { background:#0f172a; padding:10px; text-align:right; color:#94a3b8; }
td { padding:10px; border-bottom:1px solid #334155; }
.positive { color:#10b981; font-weight:700; }
.negative { color:#ef4444; font-weight:700; }
.chart-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
.chart-box { background:#1e293b; border-radius:12px; padding:20px; border:1px solid #334155; height:350px; }
.chart-full { background:#1e293b; border-radius:12px; padding:20px; border:1px solid #334155; height:400px; margin-bottom:20px; }
.loading { text-align:center; padding:50px; color:#94a3b8; }
.two-cols { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
@media (max-width:900px) { .chart-grid, .two-cols { grid-template-columns:1fr; } .sidebar { display:none; } }
@media print { .sidebar, .filters { display:none !important; } body { background:#fff; color:#000; } .section, .card, .chart-box, .chart-full { background:#fff !important; border:1px solid #ccc; color:#000; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">💰 التقارير المالية</div>
    <div class="nav-item" onclick="location.href='DailyFinancialReport.html'">📊 التقرير اليومي</div>
    <div class="nav-item active">📅 التقرير السنوي</div>
  </aside>
  <main class="main">
    <div class="header">
      <h1>📅 الميزانية السنوية</h1>
      <div class="filters">
        <select id="yearSelect"></select>
        <button onclick="loadReport()">🔍 عرض</button>
        <button onclick="window.print()">🖨️ طباعة</button>
        <button onclick="exportExcel()">📥 Excel</button>
      </div>
    </div>
    <div id="content"><div class="loading">جاري التحميل...</div></div>
  </main>
</div>

<script>
let currentUser = null;
let lastReport = null;

const API_URL = 'https://script.google.com/macros/s/AKfycb__YOUR_DEPLOYMENT_ID__/exec';

async function api(action, params = {}) {
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  for (const k in params) url.searchParams.set(k, params[k]);
  const res = await fetch(url.toString());
  return res.json();
}

function fmt(n) {
  if (n === undefined || n === null) return '0.00';
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

async function init() {
  try {
    const sess = localStorage.getItem('currentUser');
    if (sess) currentUser = JSON.parse(sess);
  } catch(e) {}
  if (!currentUser) {
    document.getElementById('content').innerHTML = '<div class="loading">⚠️ يجب تسجيل الدخول أولاً</div>';
    return;
  }
  
  const sel = document.getElementById('yearSelect');
  const curYear = new Date().getFullYear();
  for (let y = curYear; y >= curYear - 5; y--) {
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y;
    sel.appendChild(opt);
  }
  loadReport();
}

async function loadReport() {
  const year = document.getElementById('yearSelect').value;
  document.getElementById('content').innerHTML = '<div class="loading">⏳ جاري حساب 12 شهراً... قد يستغرق دقيقة</div>';
  
  const res = await api('getAnnualBudgetReport', {
    year, centerName: currentUser.centerName
  });
  
  if (!res.success) {
    document.getElementById('content').innerHTML = `<div class="loading">❌ ${res.message}</div>`;
    return;
  }
  
  lastReport = res;
  renderReport(res);
}

function renderReport(r) {
  const s = r.summary;
  let html = '';
  
  // Cards
  html += `<div class="cards">
    <div class="card revenue"><div class="label">إجمالي الإيرادات</div><div class="value">${fmt(s.revenueLE)} LE</div></div>
    <div class="card costs"><div class="label">إجمالي التكاليف</div><div class="value">${fmt(s.costsLE)} LE</div></div>
    <div class="card profit"><div class="label">صافي الربح</div><div class="value">${fmt(s.profitLE)} LE</div></div>
    <div class="card margin"><div class="label">هامش الربح</div><div class="value">${fmt(s.profitMargin)}%</div></div>
    <div class="card growth"><div class="label">نمو الإيرادات</div><div class="value" style="color:${r.yoyComparison.revenueGrowth >= 0 ? '#10b981' : '#ef4444'}">${fmt(r.yoyComparison.revenueGrowth)}%</div><div class="sub">مقارنة بـ ${r.yoyComparison.previousYear}</div></div>
    <div class="card growth"><div class="label">نمو الربح</div><div class="value" style="color:${r.yoyComparison.profitGrowth >= 0 ? '#10b981' : '#ef4444'}">${fmt(r.yoyComparison.profitGrowth)}%</div></div>
  </div>`;
  
  // Line chart شهري
  html += `<div class="chart-full"><canvas id="chartMonthly"></canvas></div>`;
  
  // Pie charts
  html += `<div class="chart-grid">
    <div class="chart-box"><canvas id="chartRevenueType"></canvas></div>
    <div class="chart-box"><canvas id="chartCostsType"></canvas></div>
  </div>`;
  
  // Table: أفضل/أسوأ شهر
  html += `<div class="section"><div class="section-title">🏆 ملخص الشهور</div>
    <div class="two-cols">
      <div style="background:rgba(16,185,129,.15); padding:15px; border-radius:8px;">
        <div style="color:#10b981; font-size:12px; margin-bottom:5px;">أفضل شهر</div>
        <div style="font-size:20px; font-weight:800;">${r.bestMonth.month}</div>
        <div style="color:#10b981; margin-top:5px;">ربح: ${fmt(r.bestMonth.profitLE)} LE</div>
      </div>
      <div style="background:rgba(239,68,68,.15); padding:15px; border-radius:8px;">
        <div style="color:#ef4444; font-size:12px; margin-bottom:5px;">أسوأ شهر</div>
        <div style="font-size:20px; font-weight:800;">${r.worstMonth.month}</div>
        <div style="color:#ef4444; margin-top:5px;">ربح: ${fmt(r.worstMonth.profitLE)} LE</div>
      </div>
    </div>
  </div>`;
  
  // Table: 12 شهر
  html += `<div class="section"><div class="section-title">📊 التفصيل الشهري</div>
    <table><thead><tr><th>الشهر</th><th>الإيرادات</th><th>التكاليف</th><th>صافي الربح</th><th>الهامش</th><th>فواتير</th><th>Pending</th></tr></thead><tbody>`;
  r.monthly.forEach(m => {
    const cls = m.profitLE >= 0 ? 'positive' : 'negative';
    html += `<tr>
      <td><b>${m.month}</b></td>
      <td class="positive">${fmt(m.revenueLE)}</td>
      <td class="negative">${fmt(m.costsLE)}</td>
      <td class="${cls}">${fmt(m.profitLE)}</td>
      <td>${fmt(m.profitMargin)}%</td>
      <td>${m.invoicesCount}</td>
      <td style="color:#f59e0b">${m.pendingCount}</td>
    </tr>`;
  });
  const totRev = r.monthly.reduce((s,m)=>s+m.revenueLE,0);
  const totCost = r.monthly.reduce((s,m)=>s+m.costsLE,0);
  const totProf = r.monthly.reduce((s,m)=>s+m.profitLE,0);
  const totInv = r.monthly.reduce((s,m)=>s+m.invoicesCount,0);
  const totPend = r.monthly.reduce((s,m)=>s+m.pendingCount,0);
  html += `<tr style="background:#0f172a; font-weight:700">
    <td>الإجمالي</td><td class="positive">${fmt(totRev)}</td><td class="negative">${fmt(totCost)}</td><td>${fmt(totProf)}</td><td>${fmt(s.profitMargin)}%</td><td>${totInv}</td><td>${totPend}</td>
  </tr></tbody></table></div>`;
  
  // تحليل الإيرادات
  html += `<div class="section"><div class="section-title">💰 تحليل الإيرادات</div>
    <table><thead><tr><th>النوع</th><th>المبلغ LE</th><th>النسبة</th></tr></thead><tbody>`;
  const totalRevAll = r.revenueByType.confirmed + r.revenueByType.other + r.revenueByType.exchange;
  Object.entries({
    'فواتير مؤكدة': r.revenueByType.confirmed,
    'إيرادات أخرى': r.revenueByType.other,
    'أرباح تحويل عملة': r.revenueByType.exchange
  }).forEach(([k, v]) => {
    const pct = totalRevAll > 0 ? (v / totalRevAll * 100).toFixed(1) : 0;
    html += `<tr><td>${k}</td><td class="positive">${fmt(v)}</td><td>${pct}%</td></tr>`;
  });
  html += `</tbody></table></div>`;
  
  // تحليل التكاليف
  html += `<div class="section"><div class="section-title">💸 تحليل التكاليف</div>
    <table><thead><tr><th>النوع</th><th>المبلغ LE</th><th>النسبة</th></tr></thead><tbody>`;
  const totalCostAll = Object.values(r.costsByType).reduce((s,v)=>s+v,0);
  Object.entries({
    'تنفيذ رحلات': r.costsByType.direct,
    'رسوم إلزامية': r.costsByType.mandatory,
    'عمولات سيلز': r.costsByType.commissions,
    'مرتبات': r.costsByType.salaries,
    'مصروفات تشغيلية': r.costsByType.operational,
    'استردادات': r.costsByType.refunds,
    'خسائر تحويل عملة': r.costsByType.exchangeLoss
  }).forEach(([k, v]) => {
    if (v === 0) return;
    const pct = totalCostAll > 0 ? (v / totalCostAll * 100).toFixed(1) : 0;
    html += `<tr><td>${k}</td><td class="negative">${fmt(v)}</td><td>${pct}%</td></tr>`;
  });
  html += `</tbody></table></div>`;
  
  // تحليل المصروفات حسب الحساب
  if (r.expensesByAccount.length > 0) {
    html += `<div class="section"><div class="section-title">📋 المصروفات حسب الحساب</div>
      <table><thead><tr><th>الحساب</th><th>العدد</th><th>الإجمالي LE</th></tr></thead><tbody>`;
    r.expensesByAccount.forEach(a => {
      html += `<tr><td>${a.name}</td><td>${a.count}</td><td class="negative">${fmt(a.totalLE)}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  }
  
  // مقارنة سنوية
  html += `<div class="section"><div class="section-title">🔄 مقارنة مع ${r.yoyComparison.previousYear}</div>
    <table><thead><tr><th>المؤشر</th><th>${r.year}</th><th>${r.yoyComparison.previousYear}</th><th>التغيير</th></tr></thead><tbody>
    <tr><td>الإيرادات</td><td class="positive">${fmt(s.revenueLE)}</td><td>${fmt(r.yoyComparison.previousYearData.revenueLE)}</td><td class="${r.yoyComparison.revenueGrowth >= 0 ? 'positive' : 'negative'}">${fmt(r.yoyComparison.revenueGrowth)}%</td></tr>
    <tr><td>التكاليف</td><td class="negative">${fmt(s.costsLE)}</td><td>${fmt(r.yoyComparison.previousYearData.costsLE)}</td><td>-</td></tr>
    <tr><td>صافي الربح</td><td class="positive">${fmt(s.profitLE)}</td><td>${fmt(r.yoyComparison.previousYearData.profitLE)}</td><td class="${r.yoyComparison.profitGrowth >= 0 ? 'positive' : 'negative'}">${fmt(r.yoyComparison.profitGrowth)}%</td></tr>
    </tbody></table></div>`;
  
  document.getElementById('content').innerHTML = html;
  drawCharts(r);
}

function drawCharts(r) {
  // Line chart شهري
  new Chart(document.getElementById('chartMonthly'), {
    type: 'line',
    data: {
      labels: r.monthly.map(m => m.month),
      datasets: [
        { label: 'الإيرادات', data: r.monthly.map(m => m.revenueLE), borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,.1)', tension: .3, fill: true },
        { label: 'التكاليف', data: r.monthly.map(m => m.costsLE), borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,.1)', tension: .3, fill: true },
        { label: 'صافي الربح', data: r.monthly.map(m => m.profitLE), borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,.1)', tension: .3, fill: false }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#e2e8f0' } }, title: { display: true, text: `الأداء الشهري — ${r.year}`, color: '#f5c842' } },
      scales: {
        x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
        y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
      }
    }
  });
  
  // Pie Revenue
  new Chart(document.getElementById('chartRevenueType'), {
    type: 'doughnut',
    data: {
      labels: ['فواتير مؤكدة', 'إيرادات أخرى', 'تحويل عملة'],
      datasets: [{ data: [r.revenueByType.confirmed, r.revenueByType.other, r.revenueByType.exchange], backgroundColor: ['#10b981','#3b82f6','#f59e0b'] }]
    },
    options: { plugins: { legend: { labels: { color: '#e2e8f0' } }, title: { display: true, text: 'توزيع الإيرادات', color: '#f5c842' } } }
  });
  
  // Pie Costs
  new Chart(document.getElementById('chartCostsType'), {
    type: 'doughnut',
    data: {
      labels: ['تنفيذ', 'رسوم', 'عمولات', 'مرتبات', 'تشغيلية', 'استردادات'],
      datasets: [{ data: [r.costsByType.direct, r.costsByType.mandatory, r.costsByType.commissions, r.costsByType.salaries, r.costsByType.operational, r.costsByType.refunds], backgroundColor: ['#ef4444','#dc2626','#f97316','#a855f7','#6366f1','#f59e0b'] }]
    },
    options: { plugins: { legend: { labels: { color: '#e2e8f0' } }, title: { display: true, text: 'توزيع التكاليف', color: '#f5c842' } } }
  });
}

function exportExcel() {
  if (!lastReport) return alert('اعرض التقرير أولاً');
  const r = lastReport;
  let csv = '\uFEFF';
  csv += `الميزانية السنوية ${r.year}\n\n`;
  csv += 'الشهر,الإيرادات,التكاليف,صافي الربح,الهامش %,فواتير,Pending\n';
  r.monthly.forEach(m => {
    csv += `${m.month},${m.revenueLE},${m.costsLE},${m.profitLE},${m.profitMargin},${m.invoicesCount},${m.pendingCount}\n`;
  });
  csv += `الإجمالي,${r.summary.revenueLE},${r.summary.costsLE},${r.summary.profitLE},${r.summary.profitMargin}\n\n`;
  csv += 'تحليل التكاليف\n';
  Object.entries(r.costsByType).forEach(([k,v]) => { csv += `${k},${v}\n`; });
  
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `AnnualBudget_${r.year}.csv`;
  link.click();
}

init();
</script>
</body>
</html>
