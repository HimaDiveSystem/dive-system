<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes">
  <title>الميزانية السنوية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <script src="ui.js"></script>
  <script src="config.js"></script>
  <script src="session.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --navy: #0f1f3d; --navy2: #1a3260; --gold: #f5c842; --gold2: #e6b800;
      --blue: #2563eb; --green: #16a34a; --red: #dc2626; --purple: #7c3aed;
      --bg: #f0f4f8; --card: #fff; --border: #dde4f0; --text: #1a2540; --text-lt: #5a6a8a;
      --radius: 16px; --shadow: 0 4px 24px rgba(15,31,61,.10);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    
    .header { background: linear-gradient(135deg, var(--navy), var(--navy2)); color: white; padding: 13px 22px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(15,31,61,.25); flex-wrap: wrap; gap: 10px; }
    .header h2 { color: var(--gold); font-size: 18px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .user-chip { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); border-radius: 40px; padding: 4px 13px; color: white; font-size: 12px; font-weight: 600; }
    .back-btn { background: transparent; border: 2px solid rgba(255,255,255,.3); color: white; padding: 4px 13px; border-radius: 40px; cursor: pointer; font-weight: 700; font-size: 12px; font-family: 'Cairo', sans-serif; transition: all .2s; }
    .back-btn:hover { border-color: var(--gold); color: var(--gold); }
    
    .page { max-width: 1200px; margin: 0 auto; padding: 20px 16px 50px; }
    .filter-card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 18px; margin-bottom: 18px; }
    .fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
    .fg { display: flex; flex-direction: column; gap: 5px; }
    .fg label { font-size: 11px; font-weight: 700; color: var(--text-lt); text-transform: uppercase; letter-spacing: .4px; }
    .fc { padding: 8px 12px; border: 2px solid var(--border); border-radius: 10px; font-size: 13px; font-family: 'Cairo', sans-serif; color: var(--text); background: white; height: 40px; }
    .fc:focus { border-color: var(--blue); outline: none; }
    .fbtn { padding: 9px 22px; border: none; border-radius: 40px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: 'Cairo', sans-serif; transition: all .2s; display: flex; align-items: center; gap: 6px; }
    .fbtn-run { background: linear-gradient(135deg, var(--navy), var(--navy2)); color: var(--gold); }
    
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .card { background: linear-gradient(135deg, #1e293b, #0f172a); padding: 20px; border-radius: 12px; border: 1px solid #334155; color: #fff; }
    .card .label { font-size: 12px; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
    .card .value { font-size: 22px; font-weight: 800; }
    .card .sub { font-size: 11px; color: #64748b; margin-top: 6px; }
    .card.revenue .value { color: #10b981; }
    .card.costs .value { color: #ef4444; }
    .card.profit .value { color: #3b82f6; }
    .card.margin .value { color: #a78bfa; }
    .card.growth .value { color: #f59e0b; }
    
    .section { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .section-title { font-size: 16px; font-weight: 700; color: var(--navy); margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #f1f5f9; padding: 10px; text-align: right; color: var(--text-lt); font-weight: 600; }
    td { padding: 10px; border-bottom: 1px solid var(--border); }
    tr:hover td { background: #f8fafc; }
    .positive { color: var(--green); font-weight: 700; }
    .negative { color: var(--red); font-weight: 700; }
    
    .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .chart-full { background: #fff; border-radius: 12px; padding: 20px; border: 1px solid var(--border); box-shadow: var(--shadow); height: 400px; margin-bottom: 20px; }
    .chart-box { background: #fff; border-radius: 12px; padding: 20px; border: 1px solid var(--border); box-shadow: var(--shadow); height: 350px; }
    .two-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    
    .loading { text-align: center; padding: 50px; color: var(--text-lt); }
    .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    @media (max-width: 900px) { .chart-grid, .two-cols { grid-template-columns: 1fr; } }
    @media print { .header, .filter-card, .user-chip, .back-btn { display: none !important; } body { background: #fff; } .card, .section, .chart-box, .chart-full { box-shadow: none; border: 1px solid #ccc; } }
  </style>
</head>
<body>

  <div class="header">
    <h2>📈 الميزانية السنوية</h2>
    <div class="header-right">
      <span class="user-chip" id="userNameDisplay">جاري التحميل...</span>
      <button class="back-btn" onclick="goBack()">← رجوع</button>
    </div>
  </div>

  <div class="page">
    <div class="filter-card">
      <div class="fgrid">
        <div class="fg"><label>اختر السنة</label><select class="fc" id="yearSelect"></select></div>
        <div style="display:flex; align-items:flex-end; gap:10px;">
          <button class="fbtn fbtn-run" onclick="loadReport()">🔍 عرض التقرير</button>
          <button class="fbtn" style="background:#e2e8f0; color:#0f1f3d;" onclick="window.print()">🖨️ طباعة</button>
        </div>
      </div>
    </div>

    <div id="content">
      <div class="loading"><div class="spinner"></div>جاري تحميل البيانات...</div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let lastReport = null;

    function fmt(n) {
      if (n === undefined || n === null) return '0.00';
      return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof Theme !== 'undefined' && Theme.applyToPage) {
        Theme.applyToPage();
        Theme.setPageTitle('الميزانية السنوية');
      }

      if (!Session.checkValidity()) return;
      currentUser = Session.getUser();
      if (!currentUser) return;

      document.getElementById('userNameDisplay').textContent = currentUser.name || 'User';

      // تعبئة قائمة السنوات
      const sel = document.getElementById('yearSelect');
      const curYear = new Date().getFullYear();
      for (let y = curYear; y >= curYear - 5; y--) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y;
        sel.appendChild(opt);
      }
      
      loadReport();
    });

    async function loadReport() {
      const year = document.getElementById('yearSelect').value;
      document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div>⏳ جاري حساب 12 شهراً... قد يستغرق دقيقة</div>';

      try {
        const res = await callGAS('getAnnualBudgetReport', {
          year: year,
          centerName: currentUser.centerName
        });

        if (!res.success) {
          document.getElementById('content').innerHTML = `<div class="loading" style="color:var(--red);">❌ ${res.message}</div>`;
          return;
        }

        lastReport = res;
        renderReport(res);

      } catch (e) {
        document.getElementById('content').innerHTML = `<div class="loading" style="color:var(--red);">❌ خطأ في الاتصال: ${e.message}</div>`;
      }
    }

    function renderReport(r) {
      const s = r.summary;
      let html = '';

      // KPI Cards
      html += `<div class="cards">
        <div class="card revenue"><div class="label">إجمالي الإيرادات</div><div class="value">${fmt(s.revenueLE)} LE</div></div>
        <div class="card costs"><div class="label">إجمالي التكاليف</div><div class="value">${fmt(s.costsLE)} LE</div></div>
        <div class="card profit"><div class="label">صافي الربح</div><div class="value">${fmt(s.profitLE)} LE</div></div>
        <div class="card margin"><div class="label">هامش الربح</div><div class="value">${fmt(s.profitMargin)}%</div></div>
        <div class="card growth"><div class="label">نمو الإيرادات</div><div class="value" style="color:${r.yoyComparison.revenueGrowth >= 0 ? '#10b981' : '#ef4444'}">${fmt(r.yoyComparison.revenueGrowth)}%</div><div class="sub">مقارنة بـ ${r.yoyComparison.previousYear}</div></div>
        <div class="card growth"><div class="label">نمو الربح</div><div class="value" style="color:${r.yoyComparison.profitGrowth >= 0 ? '#10b981' : '#ef4444'}">${fmt(r.yoyComparison.profitGrowth)}%</div></div>
      </div>`;

      // Chart Line (Monthly)
      html += `<div class="chart-full"><canvas id="chartMonthly"></canvas></div>`;

      // Pie Charts
      html += `<div class="chart-grid">
        <div class="chart-box"><canvas id="chartRevenueType"></canvas></div>
        <div class="chart-box"><canvas id="chartCostsType"></canvas></div>
      </div>`;

      // Best/Worst Month
      html += `<div class="section"><div class="section-title">🏆 ملخص الشهور</div>
        <div class="two-cols">
          <div style="background:#f0fdf4; padding:15px; border-radius:8px; border:1px solid #bbf7d0;">
            <div style="color:#166534; font-size:12px; margin-bottom:5px; font-weight:700;">أفضل شهر</div>
            <div style="font-size:20px; font-weight:800; color:#166534;">${r.bestMonth.month}</div>
            <div style="color:#166534; margin-top:5px;">ربح: ${fmt(r.bestMonth.profitLE)} LE</div>
          </div>
          <div style="background:#fef2f2; padding:15px; border-radius:8px; border:1px solid #fecaca;">
            <div style="color:#991b1b; font-size:12px; margin-bottom:5px; font-weight:700;">أسوأ شهر</div>
            <div style="font-size:20px; font-weight:800; color:#991b1b;">${r.worstMonth.month}</div>
            <div style="color:#991b1b; margin-top:5px;">ربح: ${fmt(r.worstMonth.profitLE)} LE</div>
          </div>
        </div>
      </div>`;

      // Monthly Table
      html += `<div class="section"><div class="section-title">📊 التفصيل الشهري</div>
        <table><thead><tr><th>الشهر</th><th>الإيرادات</th><th>التكاليف</th><th>صافي الربح</th><th>الهامش</th><th>فواتير</th><th>Pending</th></tr></thead><tbody>`;
      r.monthly.forEach(m => {
        const cls = m.profitLE >= 0 ? 'positive' : 'negative';
        html += `<tr>
          <td><b>${m.month}</b></td>
          <td class="positive">${fmt(m.revenueLE)}</td>
          <td class="negative">${fmt(m.costsLE)}</td>
          <td class="${cls}">${fmt(m.profitLE)}</td>
          <td>${fmt(m.profitMargin)}%</td>
          <td>${m.invoicesCount}</td>
          <td style="color:#d97706">${m.pendingCount}</td>
        </tr>`;
      });
      const totRev = r.monthly.reduce((s,m)=>s+m.revenueLE,0);
      const totCost = r.monthly.reduce((s,m)=>s+m.costsLE,0);
      const totProf = r.monthly.reduce((s,m)=>s+m.profitLE,0);
      const totInv = r.monthly.reduce((s,m)=>s+m.invoicesCount,0);
      html += `<tr style="background:#f8fafc; font-weight:700">
        <td>الإجمالي</td><td class="positive">${fmt(totRev)}</td><td class="negative">${fmt(totCost)}</td><td>${fmt(totProf)}</td><td>${fmt(s.profitMargin)}%</td><td>${totInv}</td><td>-</td>
      </tr></tbody></table></div>`;

      // Costs Breakdown
      if (r.expensesByAccount.length > 0) {
        html += `<div class="section"><div class="section-title">📋 المصروفات حسب الحساب</div>
          <table><thead><tr><th>الحساب</th><th>العدد</th><th>الإجمالي LE</th></tr></thead><tbody>`;
        r.expensesByAccount.forEach(a => {
          html += `<tr><td>${a.name}</td><td>${a.count}</td><td class="negative">${fmt(a.totalLE)}</td></tr>`;
        });
        html += `</tbody></table></div>`;
      }

      document.getElementById('content').innerHTML = html;
      drawCharts(r);
    }

    function drawCharts(r) {
      Chart.defaults.color = '#5a6a8a';
      Chart.defaults.borderColor = '#e2e8f0';

      // Line Chart
      new Chart(document.getElementById('chartMonthly'), {
        type: 'line',
        data: {
          labels: r.monthly.map(m => m.month),
          datasets: [
            { label: 'الإيرادات', data: r.monthly.map(m => m.revenueLE), borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,.1)', tension: .3, fill: true },
            { label: 'التكاليف', data: r.monthly.map(m => m.costsLE), borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,.1)', tension: .3, fill: true },
            { label: 'صافي الربح', data: r.monthly.map(m => m.profitLE), borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,.1)', tension: .3, fill: false }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'top' }, title: { display: true, text: `الأداء الشهري — ${r.year}`, font: { size: 16, family: 'Cairo' }, color: '#0f1f3d' } },
          scales: { x: { grid: { display: false } }, y: { beginAtZero: true } }
        }
      });

      // Revenue Pie
      new Chart(document.getElementById('chartRevenueType'), {
        type: 'doughnut',
        data: {
          labels: ['فواتير مؤكدة', 'إيرادات أخرى', 'تحويل عملة'],
          datasets: [{ data: [r.revenueByType.confirmed, r.revenueByType.other, r.revenueByType.exchange], backgroundColor: ['#10b981','#3b82f6','#f59e0b'] }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' }, title: { display: true, text: 'توزيع الإيرادات', color: '#0f1f3d', font: { family: 'Cairo' } } } }
      });

      // Costs Pie
      new Chart(document.getElementById('chartCostsType'), {
        type: 'doughnut',
        data: {
          labels: ['تنفيذ رحلات', 'رسوم إلزامية', 'عمولات سيلز', 'مرتبات', 'مصروفات تشغيلية'],
          datasets: [{ data: [r.costsByType.direct, r.costsByType.mandatory, r.costsByType.commissions, r.costsByType.salaries, r.costsByType.operational], backgroundColor: ['#ef4444','#dc2626','#f97316','#a855f7','#6366f1'] }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' }, title: { display: true, text: 'توزيع التكاليف', color: '#0f1f3d', font: { family: 'Cairo' } } } }
      });
    }

    function goBack() {
      if (currentUser && currentUser.type === 'Accountant') {
        window.location.href = 'AccountantDashboard.html';
      } else {
        window.location.href = 'Dashboard.html';
      }
    }
  </script>
</body>
</html>
