<!DOCTYPE html>
<html dir="ltr">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="theme-color" content="#1e2b4f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes">
  <title>Daily Trips Report</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="ui.js"></script>
  <script src="config.js"></script>
  <script src="session.js"></script>

  <style>
    :root{
      --navy:#0f1f3d;--navy2:#1a3260;--gold:#f5c842;--gold2:#e6b800;
      --blue:#2563eb;--green:#16a34a;--red:#dc2626;--orange:#ea580c;
      --bg:#f0f4f8;--card:#fff;--border:#dde4f0;--text:#1a2540;--text-lt:#5a6a8a;
      --gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-500:#64748b;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:15px;}

    /* ===== Header ===== */
    .header{
      background:linear-gradient(135deg,var(--navy),var(--navy2));
      color:white;padding:12px 22px;
      display:flex;justify-content:space-between;align-items:center;
      flex-wrap:wrap;gap:12px;border-radius:14px 14px 0 0;
      box-shadow:0 4px 16px rgba(15,31,61,.2);
    }
    .header h2{color:var(--gold);font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px;}
    .header-right{display:flex;align-items:center;gap:8px;}
    .user-chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:40px;padding:4px 13px;color:white;font-size:12px;font-weight:600;}
    .back-btn{background:transparent;border:2px solid rgba(255,255,255,.3);color:white;padding:5px 14px;border-radius:40px;cursor:pointer;font-weight:700;font-size:12px;font-family:'Cairo',sans-serif;transition:all .2s;}
    .back-btn:hover{border-color:var(--gold);color:var(--gold);}

    /* ===== Filter Bar ===== */
    .filter-bar{
      background:white;border:2px solid var(--border);border-top:none;
      padding:14px 20px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;
    }
    .fg{display:flex;flex-direction:column;gap:4px;}
    .fg label{font-size:11px;font-weight:700;color:var(--text-lt);text-transform:uppercase;letter-spacing:.4px;}
    .fc{padding:8px 12px;border:2px solid var(--border);border-radius:10px;font-size:13px;font-family:'Cairo',sans-serif;background:white;min-height:38px;}
    .fc:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.1);}
    .btn{padding:9px 20px;border:none;border-radius:24px;font-weight:700;font-size:12px;cursor:pointer;font-family:'Cairo',sans-serif;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
    .btn:hover{transform:translateY(-1px);}
    .btn-go{background:var(--navy);color:var(--gold);}
    .btn-go:hover{background:var(--navy2);}
    .btn-reset{background:#f1f5f9;color:var(--text);}
    .btn-export{background:var(--green);color:white;}
    .btn-print{background:var(--orange);color:white;}

    /* ===== Summary Strip ===== */
    .summary-strip{
      background:linear-gradient(135deg,#eef2f8,#e0e8f3);
      border:2px solid var(--border);border-top:none;
      padding:14px 20px;
      display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;
    }
    .sum-item{
      background:white;border-radius:12px;padding:12px 14px;text-align:center;
      border:1px solid var(--border);box-shadow:0 2px 6px rgba(15,31,61,.05);
    }
    .sum-item .lbl{font-size:11px;color:var(--text-lt);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;}
    .sum-item .val{font-size:22px;font-weight:900;color:var(--navy);}

    /* ===== Content ===== */
    .content{padding:16px 0;}
    .loader-wrap{text-align:center;padding:60px 20px;color:var(--text-lt);}
    .spinner{width:36px;height:36px;border:4px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .no-data{text-align:center;padding:50px;color:var(--text-lt);font-size:14px;background:white;border-radius:12px;border:2px dashed var(--border);}

    /* ===== Trip Card ===== */
    .trip-card{
      background:white;border-radius:14px;overflow:hidden;
      margin-bottom:18px;box-shadow:0 4px 14px rgba(15,31,61,.08);
      border:1px solid var(--border);
    }
     .trip-header{
      background:linear-gradient(135deg,var(--navy),var(--navy2));
      color:var(--gold);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px 18px;
    }
    .trip-header .trip-title{
      font-size:16px;font-weight:900;display:flex;align-items:center;gap:10px;
    }
    .trip-header .trip-icon{
      background:rgba(245,200,66,.2);border-radius:8px;padding:4px 9px;font-size:16px;
    }
    
    /* ===== Table ===== */
    .tbl-scroll{overflow-x:auto;max-width:100%;}
    .tbl{width:100%;border-collapse:collapse;font-size:11.5px;min-width:1200px;}
    .tbl thead th{
      background:var(--navy2);color:var(--gold);
      padding:9px 7px;font-size:11px;font-weight:700;
      text-align:center;white-space:nowrap;
      border-right:1px solid rgba(255,255,255,.08);
    }
    .tbl thead th:first-child{text-align:left;padding-left:14px;}
    .tbl tbody td{
      padding:7px 6px;text-align:center;
      border-bottom:1px solid #eef2f9;
      color:var(--text);
      white-space:nowrap;
      vertical-align:middle;
    }
    .tbl tbody td:first-child{text-align:left;padding-left:14px;}
    .tbl tbody tr:hover{background:#f5f9ff;}
    .tbl tfoot td{
      background:#dbeafe;color:var(--navy);
      border-top:2px solid var(--navy);border-bottom:2px solid var(--navy);
      padding:10px 7px;font-size:11.5px;font-weight:700;text-align:center;
    }
    .tbl tfoot td:first-child{text-align:left;padding-left:14px;}

    .vlink{color:var(--blue);font-weight:700;cursor:pointer;}
    .vlink:hover{text-decoration:underline;}
    .st-pending{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;background:#fef9c3;color:#854d0e;}
    .st-confirmed{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;background:#dcfce7;color:#166534;}
    .st-cancel{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;background:#fee2e2;color:#991b1b;}
    .st-refund{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;background:#fef3c7;color:#92400e;}
    .acts-cell{max-width:220px;white-space:normal;word-break:break-word;line-height:1.3;text-align:left;font-size:11px;}
    .amt{font-family:monospace;}
    .num-col{color:var(--navy);font-weight:700;}
    .zero-col{color:#cbd5e1;}

    /* ===== Modal ===== */
    .a-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(3px);}
    .a-modal.open{display:flex;}
    .a-box{background:white;width:90%;max-width:340px;border-radius:20px;padding:24px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.3);}
    .a-icon{font-size:44px;margin-bottom:12px;}
    .a-msg{color:var(--navy);font-size:14px;font-weight:700;margin-bottom:18px;white-space:pre-wrap;line-height:1.6;}
    .a-btn{padding:9px 24px;border:none;border-radius:30px;background:var(--navy);color:var(--gold);font-weight:700;font-size:13px;cursor:pointer;font-family:'Cairo',sans-serif;}
      .pdf-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:6px;
  background:var(--orange);color:white;
  text-decoration:none;font-size:12px;
  transition:all .2s;
}
.pdf-btn:hover{background:#c2410c;transform:scale(1.1);}
.pdf-btn.disabled{background:#cbd5e1;cursor:not-allowed;}
    .tbl td.acts-cell{
  max-width:200px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  text-align:left;
  font-size:10px;
}
    /* ===== Footer ===== */
    .footer{text-align:center;padding:16px 0 6px;color:#94a3b8;font-size:11px;border-top:1px solid #e2e8f0;margin-top:20px;}
/* ===== Print ===== */
/* ✅ @page يجب أن يكون خارج @media */
@page {
  size: A4 landscape;
  margin: 5mm;
}

@media print {
  body{background:white;padding:0;}
  .header,.filter-bar,.summary-strip,.footer,.no-print{display:none !important;}
  .trip-card{box-shadow:none;border:1px solid #ccc;page-break-inside:avoid;margin-bottom:14px;}
  .tbl thead th{
    background:#f1f5f9 !important;
    color:#0f1f3d !important;
    border:1px solid #94a3b8 !important;
    border-bottom:2px solid #0f1f3d !important;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  .trip-header{
    background:white !important;
    color:#0f1f3d !important;
    border:2px solid #0f1f3d !important;
    border-radius:4px !important;
    padding:8px 14px !important;
    margin-bottom:0 !important;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  .trip-header .trip-title{ color:#0f1f3d !important; font-size:13px !important; }
  .trip-header .trip-icon{ background:#e2e8f0 !important; color:#0f1f3d !important; }
  .trip-header .stat{ background:#f1f5f9 !important; border:1px solid #94a3b8 !important; color:#0f1f3d !important; }
  .trip-header .stat .n{ color:#0f1f3d !important; }
  .tbl{ border:1px solid #94a3b8 !important; font-size:9px !important; min-width:auto !important; }
  .tbl thead th{ padding:5px 3px !important; font-size:9px !important; }
  .tbl tbody td{ padding:4px 3px !important; font-size:9px !important; border-bottom:1px solid #cbd5e1 !important; }
  .tbl tfoot td{
    padding:5px 3px !important;
    font-size:9px !important;
    background:#f1f5f9 !important;
    color:#0f1f3d !important;
    border-top:2px solid #0f1f3d !important;
    border-bottom:2px solid #0f1f3d !important;
  }
  .trip-card{ page-break-inside:auto; }
}
    
    @media(max-width:640px){
      .filter-bar{flex-direction:column;align-items:stretch;}
      .fg{width:100%;}
      .fc{width:100%;}
      .btn{width:100%;justify-content:center;}
      body{padding:8px;}
    }
    /* ===== Dropdown Wrapper ===== */
.dropdown-wrapper { position: relative; display: inline-block; }
.dropdown-arrow { font-size: 9px; margin-right: 4px; opacity: 0.7; }
.dropdown-menu {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  min-width: 280px;
  max-width: 400px;
  background: white;
  border: 2px solid var(--navy);
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(15, 31, 61, 0.2);
  z-index: 1000;
  overflow: hidden;
}
.dropdown-menu.open { display: block; animation: dropdownFadeIn 0.2s ease-out; }
@keyframes dropdownFadeIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
.dropdown-header {
  background: var(--navy);
  color: var(--gold);
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
}
.dropdown-header label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 700; }
.dropdown-header input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--gold); }
.dropdown-close {
  background: transparent;
  border: none;
  color: var(--gold);
  font-size: 16px;
  cursor: pointer;
  padding: 0 6px;
  font-weight: 700;
}
.dropdown-close:hover { opacity: 0.7; }
.dropdown-body { max-height: 320px; overflow-y: auto; padding: 6px 0; }
.dropdown-body::-webkit-scrollbar { width: 8px; }
.dropdown-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.dropdown-body::-webkit-scrollbar-thumb:hover { background: var(--text-lt); }
.trip-checkbox-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  cursor: pointer;
  transition: background 0.15s;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text);
  border-bottom: 1px solid #f1f5f9;
}
.trip-checkbox-item:last-child { border-bottom: none; }
.trip-checkbox-item:hover { background: #f0f6ff; }
.trip-checkbox-item input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--navy); flex-shrink: 0; }
.trip-checkbox-item .trip-count {
  margin-right: auto;
  font-size: 11px;
  color: var(--text-lt);
  font-weight: 700;
  background: #f1f5f9;
  padding: 2px 8px;
  border-radius: 12px;
}
.dropdown-footer {
  padding: 10px 14px;
  border-top: 1px solid var(--border);
  background: #f8fafc;
  display: flex;
  justify-content: stretch;
}
    /* ✅ رؤوس الأعمدة القابلة للترتيب */
th.sortable {
  cursor: pointer;
  user-select: none;
  position: relative;
  padding-right: 22px;
  transition: background-color 0.2s;
}

th.sortable:hover {
  background-color: #e3f2fd;
}

/* ✅ مؤشر الترتيب */
th.sortable::after {
  content: '⇅';
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 11px;
  color: #999;
  opacity: 0.6;
}

th.sortable.sort-asc::after {
  content: '▲';
  color: #1976d2;
  opacity: 1;
}

th.sortable.sort-desc::after {
  content: '▼';
  color: #1976d2;
  opacity: 1;
}
    /* ✅ ملخص المتبقي حسب العملة */
/* ✅ الشريط الأيمن في الهيدر */
.trip-header-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

/* ✅ شارة Bookings */
.trip-stat-badge {
  background: rgba(255, 255, 255, 0.12);
  color: #e2e8f0;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid rgba(255, 255, 255, 0.18);
  white-space: nowrap;
}

.trip-stat-badge b {
  color: #fbbf24;
  font-size: 14px;
}

/* ✅ مجموعة المتبقي داخل الهيدر */
.header-remaining {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 4px 10px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.header-remaining-label {
  color: #e2e8f0;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}

/* ✅ شريحة كل عملة */
.currency-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 14px;
  border: 1.5px solid;
  background: rgba(255, 255, 255, 0.08);
  font-size: 12px;
  font-weight: bold;
  white-space: nowrap;
  transition: transform 0.15s, background 0.15s;
}

.currency-chip:hover {
  transform: translateY(-1px);
  background: rgba(255, 255, 255, 0.15);
}

.currency-chip-code {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.5px;
  padding: 1px 5px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.15);
}

.currency-chip-amount {
  font-family: 'Courier New', monospace;
  font-size: 13px;
}

/* ✅ للموبايل */
@media (max-width: 768px) {
  .trip-header-right {
    gap: 6px;
  }
  .header-remaining {
    padding: 3px 8px;
    gap: 5px;
  }
  .currency-chip {
    padding: 2px 8px;
    font-size: 11px;
  }
  .currency-chip-amount {
    font-size: 11px;
  }
}
.dropdown-footer .btn { width: 100%; justify-content: center; padding: 10px; font-size: 13px; }
@media (max-width: 640px) {
  .dropdown-menu { min-width: 260px; max-width: 320px; }
}
  </style>
</head>
<body>

<!-- ===== Header ===== -->
<div class="header">
  <h2>📅 Daily Trips Report</h2>
  <div class="header-right">
    <span class="user-chip" id="userNameDisplay">...</span>
    <button class="back-btn" onclick="goBack()">← Back</button>
  </div>
</div>

<!-- ===== Filter Bar ===== -->
<div class="filter-bar no-print">
  <div class="fg">
  <label>📅 From Date</label>
  <input type="date" class="fc" id="filterFromDate" onchange="loadReport()">
</div>

<div class="fg">
  <label>📅 To Date</label>
  <input type="date" class="fc" id="filterToDate" onchange="loadReport()">
</div>

  <div class="fg">
    <label>🏢 Branch</label>
    <select class="fc" id="filterBranch" onchange="loadReport()">
      <option value="">All Branches</option>
    </select>
  </div>

  <div class="fg">
    <label>🔍 Search</label>
    <input type="text" class="fc" id="filterSearch" placeholder="Voucher / Guest / Hotel..." oninput="applySearch()">
  </div>

  <button class="btn btn-go" onclick="loadReport()">📊 Show Report</button>
  <button class="btn btn-reset" onclick="resetFilters()">🔄 Reset</button>
  <!-- ✅ زر Export Excel مع قائمة منسدلة -->
<div class="dropdown-wrapper">
  <button class="btn btn-export" onclick="toggleTripDropdown('excelDropdown', event)">
    📎 Export Excel <span class="dropdown-arrow">▼</span>
  </button>
  <div class="dropdown-menu" id="excelDropdown">
    <div class="dropdown-header">
      <label>
        <input type="checkbox" id="excelSelectAll" onchange="toggleSelectAll('excel')">
        <strong>تحديد الكل</strong>
      </label>
      <button class="dropdown-close" onclick="closeTripDropdown('excelDropdown', event)">✕</button>
    </div>
    <div class="dropdown-body" id="excelTripList">
      <!-- سيتم ملؤها بواسطة JavaScript -->
    </div>
    <div class="dropdown-footer">
      <button class="btn btn-export" onclick="exportToExcelSelected()">📎 تصدير المحدد</button>
    </div>
  </div>
</div>

<!-- ✅ زر Print مع قائمة منسدلة -->
<div class="dropdown-wrapper">
  <button class="btn btn-print" onclick="toggleTripDropdown('printDropdown', event)">
    🖨️ Print <span class="dropdown-arrow">▼</span>
  </button>
  <div class="dropdown-menu" id="printDropdown">
    <div class="dropdown-header">
      <label>
        <input type="checkbox" id="printSelectAll" onchange="toggleSelectAll('print')">
        <strong>تحديد الكل</strong>
      </label>
      <button class="dropdown-close" onclick="closeTripDropdown('printDropdown', event)">✕</button>
    </div>
    <div class="dropdown-body" id="printTripList">
      <!-- سيتم ملؤها بواسطة JavaScript -->
    </div>
    <div class="dropdown-footer">
      <button class="btn btn-print" onclick="printSelectedTrips()">🖨️ طباعة المحدد</button>
    </div>
  </div>
</div>
</div>

<!-- ===== Summary Strip ===== -->
<div class="summary-strip no-print" id="summaryStrip" style="display:none;">
  <div class="sum-item"><div class="lbl">Total Trips</div><div class="val" id="sumTrips">0</div></div>
  <div class="sum-item"><div class="lbl">Total Bookings</div><div class="val" id="sumBookings">0</div></div>
  <div class="sum-item">
  <div class="lbl">Total Rest</div>
  <div class="val" id="sumRest">0</div>
</div>
</div>

<!-- ===== Content ===== -->
<div class="content" id="content">
  <div class="loader-wrap"><div class="spinner"></div>Loading...</div>
</div>

<!-- ===== Footer ===== -->
<div class="footer">
  <span>© 2025 <strong style="color:#1e2b4f;">🌊 Dive System</strong> — جميع الحقوق محفوظة</span>
</div>

<!-- ===== Modal ===== -->
<div id="alertModal" class="a-modal">
  <div class="a-box">
    <div class="a-icon" id="aIcon">ℹ️</div>
    <div class="a-msg" id="aMsg"></div>
    <button class="a-btn" onclick="closeAlert()">OK</button>
  </div>
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DASH = CONFIG.DASHBOARD_PAGES || {
  Admin: 'Dashboard.html',
  Owner: 'OwnerDashboard.html',
  Sales: 'SalesDashboard.html',
  Accountant: 'AccountantDashboard.html',
  Customer: 'CustomerDashboard.html'
};
const ALLOWED = ['Admin','Owner','Sales','Accountant','FinancialManager','CenterManager','BranchManager','OperationsManager'];

let currentUser = null;
let allInvoices = [];
let groupedTrips = {};  // { tripName: [invoices] }
let summaryData = {};
// ✅ حالة الفلتر

// JSONP
// ============================================================
function gas(action, params = {}, retryCount = 0) {
  return new Promise((resolve, reject) => {
    const user = Session.getUser();
    if (user && user.centerName && !params.centerName) {
      params.centerName = user.centerName;
    }
    if (user && user.centerId && !params.centerId) {
      params.centerId = user.centerId;
    }
    
    const callbackName = 'cb_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
    const url = new URL(CONFIG.GAS_URL);
    url.searchParams.set('action', action);
    url.searchParams.set('callback', callbackName);
    url.searchParams.set('_t', Date.now());
    
    Object.keys(params).forEach(key => {
      if (params[key] !== undefined && params[key] !== null && params[key] !== '') {
        if (typeof params[key] === 'object') {
          url.searchParams.set(key, JSON.stringify(params[key]));
        } else {
          url.searchParams.set(key, String(params[key]));
        }
      }
    });
    
    console.log(`📡 [${action}] Attempt ${retryCount + 1}...`);
    
    let isResolved = false;
    const script = document.createElement('script');
    
    // ✅ مهلة 120 ثانية
    const timeout = setTimeout(() => {
      if (isResolved) return;
      isResolved = true;
      cleanup();
      
      // ✅ إعادة المحاولة
      if (retryCount < 2) {
        console.warn(`⏰ [${action}] Timeout, retrying (${retryCount + 2}/3)...`);
        setTimeout(() => {
          gas(action, params, retryCount + 1).then(resolve).catch(reject);
        }, 1500);
      } else {
        reject(new Error('Timeout after 3 attempts: ' + action));
      }
    }, 120000);
    
    const cleanup = () => {
      clearTimeout(timeout);
      try { delete window[callbackName]; } catch(e) {}
      try { if (script.parentNode) script.parentNode.removeChild(script); } catch(e) {}
    };
    
    window[callbackName] = function(data) {
      if (isResolved) return;
      isResolved = true;
      console.log(`✅ [${action}] Success`);
      cleanup();
      resolve(data);
    };
    
    script.onerror = function() {
      if (isResolved) return;
      isResolved = true;
      cleanup();
      
      if (retryCount < 2) {
        console.warn(`❌ [${action}] Network error, retrying (${retryCount + 2}/3)...`);
        setTimeout(() => {
          gas(action, params, retryCount + 1).then(resolve).catch(reject);
        }, 1500);
      } else {
        reject(new Error('Network error after 3 attempts: ' + action));
      }
    };
    
    script.src = url.toString();
    document.body.appendChild(script);
  });
}

function escHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function fmtTime(t) {
  if (!t) return '';
  const m = String(t).match(/(\d{1,2}):(\d{2})/);
  return m ? String(m[1]).padStart(2,'0') + ':' + m[2] : String(t).substring(0,5);
}

function formatPhoneNumber(phone) {
  if (!phone) return '';
  let p = String(phone).trim();
  if (p.startsWith('00')) p = '+' + p.substring(2);

  else if (!p.startsWith('+')) p = '+' + p;
  return p;

// ============================================================
async function fetchTripItemsForTrips(tripNames) {
  const result = {};
  const missingTrips = [];
  
  // ✅ 1. التحقق من الكاش أولاً
  for (const tripName of tripNames) {
    if (tripItemsCache.has(tripName)) {
      result[tripName] = tripItemsCache.get(tripName);
    } else {
      missingTrips.push(tripName);
    }
  }
  
  // ✅ 2. إذا كانت جميع الرحلات في الكاش، ارجع فوراً
  if (missingTrips.length === 0) {
    console.log(`⚡ fetchTripItemsForTrips: جميع ${tripNames.length} رحلة من الكاش`);
    return result;
  }
  
  // ✅ 3. محاولة الطلب الدفعي (طلب واحد)
  try {
    console.log(`📡 fetchTripItemsForTrips: جلب ${missingTrips.length} رحلة (طلب دفعي)`);
    
    const batchResult = await gas('getTripItemsBatch', {
      tripNames: JSON.stringify(missingTrips),
      centerName: currentUser?.centerName || ''
    });
    
    // ✅ التحقق من أن النتيجة صحيحة (Object وليس مصفوفة)
    if (batchResult && typeof batchResult === 'object' && !Array.isArray(batchResult)) {
      for (const tripName of missingTrips) {
        const items = Array.isArray(batchResult[tripName]) ? batchResult[tripName] : [];
        tripItemsCache.set(tripName, items);  // ✅ حفظ في الكاش
        result[tripName] = items;
      }
      console.log(`✅ fetchTripItemsForTrips: تم جلب ${missingTrips.length} رحلة (دفعة واحدة)`);
      return result;
    }
    
    // ❌ إذا فشلت الطريقة الدفعية، استخدم fallback
    console.warn('⚠️ getTripItemsBatch لم تُرجع Object صحيح، العودة للطريقة الفردية');
  } catch(batchErr) {
    console.warn('⚠️ getTripItemsBatch فشل:', batchErr.message);
  }
  
  // ✅ 4. Fallback: الطريقة الفردية (إذا لم تكن getTripItemsBatch موجودة)
  console.log(`📡 fetchTripItemsForTrips: ${missingTrips.length} طلب فردي (Fallback)`);
  await Promise.all(missingTrips.map(async (tripName) => {
    try {
      const items = await getTripItems(tripName, currentUser?.centerName || '');
      tripItemsCache.set(tripName, items);
      result[tripName] = items;
    } catch(e) {
      console.error(`❌ فشل جلب ${tripName}:`, e);
      result[tripName] = [];
      tripItemsCache.set(tripName, []);
    }
  }));
  
  return result;
}

  // ✅ التحقق من النطاق الزمني
function validateDateRange(fromDate, toDate) {
  const from = new Date(fromDate);
  const to = new Date(toDate);
  
  if (isNaN(from) || isNaN(to)) {
    showAlert('تواريخ غير صحيحة', '⚠️');
    return false;
  }
  
  if (from > to) {
    showAlert('تاريخ البداية يجب أن يكون قبل تاريخ النهاية', '⚠️');
    return false;
  }
  
  const diffDays = Math.ceil((to - from) / (1000 * 60 * 60 * 24));
  
  if (diffDays > 180) {
    showAlert(`⚠️ النطاق الزمني كبير جداً (${diffDays} يوم)\nقد يستغرق التحميل وقتاً أطول.`, '⚠️');
  } else if (diffDays > 90) {
    console.log(`ℹ️ النطاق الزمني: ${diffDays} يوم`);
  }
  
  return true;
}

let sortState = {
  column: null,
  direction: 'asc'
};

// ✅ أنواع الأعمدة حسب الفهرس
const COLUMN_TYPES = {
  1:  'voucher',    // Voucher - ترتيب نصي مع أرقام
  2:  'date',       // Active Date
  3:  'time',       // Time
  4:  'string',     // Guest Name
  5:  'string',     // Nationality
  6:  'string',     // Hotel / Room
  7:  'number',     // Adult
  8:  'number',     // Child
  9:  'number',     // Inf
  10: 'number',     // 1 Intro
  11: 'number',     // 2 Intro
  12: 'number',     // Diver
  13: 'number',     // C.D.
  14: 'number',     // S.R.
  15: 'string',     // Trip / Activities
  16: 'string',     // Supplier
  17: 'string',     // Customer
  18: 'string',     // Sales Name
  19: 'string',     // Currency
  20: 'number',     // Rest
  21: 'string',     // State
  22: 'string'      // PDF (no-sort عادة)
};

// ✅ تحويل القيمة حسب نوع العمود
function parseSortValue(value, type) {
  if (value === null || value === undefined) {
    return type === 'number' ? -Infinity : '';
  }
  
  const str = String(value).trim();
  if (!str) return type === 'number' ? -Infinity : '';
  
  // ✅ الأرقام
  if (type === 'number') {
    // إزالة الفواصل والرموز ما عدا الأرقام والنقطة والسالب
    const cleaned = str.replace(/[^\d.\-]/g, '');
    const num = parseFloat(cleaned);
    return isNaN(num) ? -Infinity : num;
  }
  
  // ✅ التواريخ (dd/mm/yyyy أو dd-mm-yyyy)
  if (type === 'date') {
    // جرّب dd/mm/yyyy أولاً
    const dmy = str.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);
    if (dmy) {
      let d = parseInt(dmy[1], 10);
      let m = parseInt(dmy[2], 10) - 1;
      let y = parseInt(dmy[3], 10);
      if (y < 100) y += 2000;  // 24 → 2024
      const date = new Date(y, m, d);
      return isNaN(date.getTime()) ? 0 : date.getTime();
    }
    // جرّب yyyy-mm-dd (ISO)
    const iso = str.match(/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})/);
    if (iso) {
      const date = new Date(
        parseInt(iso[1], 10),
        parseInt(iso[2], 10) - 1,
        parseInt(iso[3], 10)
      );
      return isNaN(date.getTime()) ? 0 : date.getTime();
    }
    // جرّب Date.parse كخيار أخير
    const ts = Date.parse(str);
    return isNaN(ts) ? 0 : ts;
  }
  
  // ✅ الأوقات (HH:MM أو HH:MM:SS)
  if (type === 'time') {
    // قد يكون بصيغة 12 ساعة مع AM/PM
    const ampm = str.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM|ص|م)?/i);
    if (ampm) {
      let h = parseInt(ampm[1], 10);
      const m = parseInt(ampm[2], 10) || 0;
      const s = parseInt(ampm[3], 10) || 0;
      const period = (ampm[4] || '').toUpperCase();
      
      if ((period === 'PM' || period === 'م') && h < 12) h += 12;
      if ((period === 'AM' || period === 'ص') && h === 12) h = 0;
      
      return h * 3600 + m * 60 + s;
    }
    return 0;
  }
  
  // ✅ رقم الفاتورة (Voucher) — ترتيب طبيعي مع أرقام
  if (type === 'voucher') {
    // إزالة المسافات
    return str;
  }
  
  // ✅ نص عادي
  return str;
}

// ✅ مقارنة قيمتين
function compareValues(a, b, type) {
  const va = parseSortValue(a, type);
  const vb = parseSortValue(b, type);
  
  if (type === 'string' || type === 'voucher') {
    // ✅ ترتيب طبيعي (natural sort): INV-2 قبل INV-10
    return String(va).localeCompare(String(vb), 'ar', {
      numeric: true,
      sensitivity: 'base'
    });
  }
  
  if (va < vb) return -1;
  if (va > vb) return 1;
  return 0;
}

// ✅ ترتيب الجدول حسب العمود
function sortTableByColumn(columnIndex, table) {
  const tbody = table.querySelector('tbody');
  if (!tbody) return;
  
  const rows = Array.from(tbody.querySelectorAll('tr'));
  if (rows.length === 0) return;
  
  // تحديد الاتجاه
  let direction = 'asc';
  if (sortState.column === columnIndex && sortState.direction === 'asc') {
    direction = 'desc';
  }
  sortState.column = columnIndex;
  sortState.direction = direction;
  
  const type = COLUMN_TYPES[columnIndex] || 'string';
  
  // ترتيب الصفوف
  rows.sort((rowA, rowB) => {
    const cellA = rowA.cells[columnIndex];
    const cellB = rowB.cells[columnIndex];
    if (!cellA || !cellB) return 0;
    
    const valA = cellA.textContent || '';
    const valB = cellB.textContent || '';
    
    const cmp = compareValues(valA, valB, type);
    return direction === 'asc' ? cmp : -cmp;
  });
  
  // إعادة إدراج الصفوف
  rows.forEach(row => tbody.appendChild(row));
  
  // إعادة ترقيم عمود #
  renumberRows(tbody);
  
  // تحديث مؤشرات الرأس
  updateSortIndicators(table, columnIndex, direction);
  
  console.log(`✅ ترتيب: عمود ${columnIndex} (${direction})`);
}

// ✅ إعادة ترقيم العمود الأول
function renumberRows(tbody) {
  const rows = tbody.querySelectorAll('tr');
  rows.forEach((row, idx) => {
    if (row.cells[0]) {
      // فقط إذا كانت الخلية تحتوي رقماً صرفاً
      const txt = row.cells[0].textContent.trim();
      if (/^\d+$/.test(txt)) {
        row.cells[0].textContent = idx + 1;
      }
    }
  });
}

// ✅ تحديث مؤشرات الرأس
function updateSortIndicators(table, columnIndex, direction) {
  const headers = table.querySelectorAll('thead th');
  headers.forEach((th, idx) => {
    th.classList.remove('sort-asc', 'sort-desc');
    if (idx === columnIndex) {
      th.classList.add(direction === 'asc' ? 'sort-asc' : 'sort-desc');
    }
  });
}

// ✅ تفعيل الترتيب على كل الجداول
function enableColumnSorting() {
  const tables = document.querySelectorAll('#content table');
  
  if (!tables.length) {
    console.warn('⚠️ لا توجد جداول لتفعيل الترتيب');
    return;
  }
  
  let totalColumns = 0;
  
  tables.forEach(table => {
    const headers = table.querySelectorAll('thead th');
    
    headers.forEach((th, idx) => {
      // تجاهل عمود #
      if (idx === 0) return;
      // تجاهل الأعمدة المميزة بـ no-sort
      if (th.classList.contains('no-sort')) return;
      // تجاهل عمود PDF
      const headerText = th.textContent.trim().toLowerCase();
      if (headerText === 'pdf' || headerText.includes('تحميل')) return;
      
      th.classList.add('sortable');
      th.setAttribute('title', 'اضغط للترتيب');
      
      // إزالة المستمع القديم
      if (th._sortHandler) {
        th.removeEventListener('click', th._sortHandler);
      }
      
      th._sortHandler = () => sortTableByColumn(idx, table);
      th.addEventListener('click', th._sortHandler);
      
      totalColumns++;
    });
  });
  
  console.log(`✅ تم تفعيل الترتيب على ${totalColumns} عمود في ${tables.length} جدول`);
}

/**
 * يحسب إجمالي المتبقي لكل عملة
 * @param {Array} invoices - مصفوفة الفواتير
 * @returns {Object} - { USD: 1250, EUR: 320, ... }
 */
function calculateRemainingByCurrency(invoices) {
  const totals = {};
  
  if (!Array.isArray(invoices)) return totals;
  
  invoices.forEach(inv => {
    // ✅ العملة
    let currency = String(inv.invoiceCurrency || '').trim().toUpperCase();
    if (!currency) currency = 'غير محدد';
    currency = normalizeCurrency(currency);
    
    // ✅ المتبقي (row[0] = rest)
    const remaining = parseNumberSafe(inv.rest);
    
    // ✅ تخطي القيم الصفرية لتقليل الفوضى
    if (remaining === 0) return;
    
    // ✅ تراكم
    if (!totals[currency]) totals[currency] = 0;
    totals[currency] += remaining;
  });
  
  return totals;
}

/**
 * توحيد أسماء العملات
 */
function normalizeCurrency(cur) {
  const cleaned = String(cur || '').replace(/\s+/g, '').toUpperCase();
  
  const map = {
    'USD': 'USD', 'US$': 'USD', '$': 'USD', 'DOLLAR': 'USD',
    'DOLLARS': 'USD', 'دولار': 'USD', 'دولارامريكي': 'USD',
    
    'EUR': 'EUR', '€': 'EUR', 'EURO': 'EUR', 'EUROS': 'EUR',
    'يورو': 'EUR', 'يوروأوروبي': 'EUR',
    
    'GBP': 'GBP', '£': 'GBP', 'POUND': 'GBP', 'POUNDS': 'GBP',
    'STERLING': 'GBP', 'جنيه': 'GBP', 'جنيهإسترليني': 'GBP',
    'إسترليني': 'GBP', 'استرليني': 'GBP',
    
    'EGP': 'EGP', 'LE': 'EGP', 'ج.م': 'EGP', 'ج.م.': 'EGP',
    'جنيهمصري': 'EGP', 'EGYPTIANPOUND': 'EGP',
    
    'SAR': 'SAR', 'ريال': 'SAR', 'ر.س': 'SAR', 'SR': 'SAR',
    'SAR': 'SAR', 'ريالسعودي': 'SAR',
    
    'AED': 'AED', 'درهم': 'AED', 'د.إ': 'AED', 'AED': 'AED',
    'درهمإماراتي': 'AED',
    
    'KWD': 'KWD', 'دينار': 'KWD', 'د.ك': 'KWD',
    
    'CHF': 'CHF', 'فرنك': 'CHF', 'فرنكسويسري': 'CHF',
    
    'JPY': 'JPY', '¥': 'JPY', 'ين': 'JPY',
    
    'TRY': 'TRY', '₺': 'TRY', 'ليرة': 'TRY',
    
    'RUB': 'RUB', '₽': 'RUB', 'روبل': 'RUB'
  };
  
  // إزالة النقاط من النهاية
  const key = cleaned.replace(/\.+$/, '');
  return map[key] || map[cleaned] || cleaned;
}

/**
 * تحويل آمن إلى رقم
 */
function parseNumberSafe(val) {
  if (val === null || val === undefined || val === '') return 0;
  if (typeof val === 'number') return isNaN(val) ? 0 : val;
  const cleaned = String(val).replace(/[^\d.\-]/g, '');
  const num = parseFloat(cleaned);
  return isNaN(num) ? 0 : num;
}

/**
 * تنسيق المبلغ
 */
function formatMoney(amount) {
  const num = parseNumberSafe(amount);
  return num.toLocaleString('en-US', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

/**
 * بناء HTML لملخص المتبقي حسب العملات
 * @param {Object} totals - { USD: 1250, EUR: 320, ... }
 */
function buildRemainingByCurrencyHTML(totals) {
  const currencies = Object.keys(totals).filter(c => totals[c] !== 0);
  
  if (currencies.length === 0) return '';
  
  // ✅ ترتيب العملات
  const priority = ['USD', 'EUR', 'GBP', 'EGP', 'SAR', 'AED', 'KWD', 'CHF'];
  currencies.sort((a, b) => {
    const ia = priority.indexOf(a);
    const ib = priority.indexOf(b);
    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1;
    if (ib !== -1) return 1;
    return a.localeCompare(b);
  });
  
  // ✅ ألوان فاتحة للخلفية الكحلية
  const colors = {
    'USD': '#4ade80',  // أخضر فاتح
    'EUR': '#60a5fa',  // أزرق فاتح
    'GBP': '#c084fc',  // بنفسجي فاتح
    'EGP': '#fb923c',  // برتقالي فاتح
    'SAR': '#22d3ee',  // تركوازي فاتح
    'AED': '#f472b6',  // وردي فاتح
    'KWD': '#fbbf24',  // أصفر فاتح
    'CHF': '#f87171',  // أحمر فاتح
    'JPY': '#fca5a5',
    'TRY': '#5eead4',
    'RUB': '#a5b4fc',
    'غير محدد': '#cbd5e1'
  };
  
  const itemsHTML = currencies.map(cur => {
    const amount = totals[cur];
    const color = colors[cur] || '#e2e8f0';
    const isNegative = amount < 0;
    const sign = isNegative ? '⚠ ' : '';
    
    return `
      <span class="currency-chip" style="color:${color}; border-color:${color};">
        <span class="currency-chip-code">${cur}</span>
        <span class="currency-chip-amount">${sign}${formatMoney(Math.abs(amount))}</span>
      </span>
    `;
  }).join('');
  
  return `
    <div class="header-remaining">
      <span class="header-remaining-label">💰 المتبقي:</span>
      ${itemsHTML}
    </div>
  `;
}

// ✅ تحويل dd/MMM/yyyy إلى كائن Date
// ============================================================
function parseActiveDateToObj(dateStr) {
  if (!dateStr) return new Date(9999, 11, 31);  // ✅ في النهاية
  
  const months = {
    'jan': 0, 'feb': 1, 'mar': 2, 'apr': 3, 'may': 4, 'jun': 5,
    'jul': 6, 'aug': 7, 'sep': 8, 'oct': 9, 'nov': 10, 'dec': 11
  };
  
  const match = String(dateStr).match(/^(\d{1,2})\/([A-Za-z]{3})\/(\d{4})$/);
  if (!match) return new Date(9999, 11, 31);
  
  const day = parseInt(match[1]);
  const monthKey = match[2].toLowerCase();
  const year = parseInt(match[3]);
  const month = months[monthKey];
  
  if (month === undefined) return new Date(9999, 11, 31);
  
  return new Date(year, month, day);
}
// ============================================================
// GROUP BY TRIP
// ============================================================
function groupByTrip(invoices) {
  const groups = {};
  
  for (const inv of invoices) {
    const tripName = (inv.trip || inv.Trip || 'Unassigned Trip').trim() || 'Unassigned Trip';
    if (!groups[tripName]) groups[tripName] = [];
    groups[tripName].push(inv);
  }
  
  const sorted = {};
  Object.keys(groups).sort().forEach(tripName => {
    sorted[tripName] = groups[tripName].sort((a, b) => {
      // 1️⃣ Active Date (زمني)
      const dateCompare = parseActiveDateToObj(a.activeDate).getTime() 
                        - parseActiveDateToObj(b.activeDate).getTime();
      if (dateCompare !== 0) return dateCompare;
      
      // 2️⃣ Time (زمني)
      const timeToMinutes = (t) => {
        const m = String(t || '').match(/(\d{1,2}):(\d{2})/);
        if (!m) return 9999;
        return parseInt(m[1]) * 60 + parseInt(m[2]);
      };
      const timeCompare = timeToMinutes(a.time) - timeToMinutes(b.time);
      if (timeCompare !== 0) return timeCompare;
      
      // 3️⃣ Sales Name (نصي عربي)
      const salesCompare = String(a.salesName || '').trim()
                            .localeCompare(String(b.salesName || '').trim(), 'ar');
      if (salesCompare !== 0) return salesCompare;
      
      // 4️⃣ Supplier (نصي عربي)
      const suppCompare = String(a.supplier || '').trim()
                           .localeCompare(String(b.supplier || '').trim(), 'ar');
      if (suppCompare !== 0) return suppCompare;
      
      // 5️⃣ Customer (نصي عربي)
      const custCompare = String(a.customer || '').trim()
                           .localeCompare(String(b.customer || '').trim(), 'ar');
      if (custCompare !== 0) return custCompare;
      
      // 6️⃣ Voucher No (احتياطي)
      return String(a.voucherNo || '').localeCompare(String(b.voucherNo || ''));
    });
  });
  
  return sorted;
}

// ============================================================
// CALCULATE SUMMARY
// ============================================================
function calculateSummary(groups) {
  const totalTrips = Object.keys(groups).length;
  let totalBookings = 0;
  const restByCurrency = {};   // ✅ { USD: 1250, EUR: 320, ... }
  
  for (const tripName in groups) {
    const invoices = groups[tripName];
    totalBookings += invoices.length;
    
    for (const inv of invoices) {
      const rest = parseFloat(inv.rest) || 0;
      if (rest === 0) continue;   // ✅ تخطي الصفر
      
      // ✅ توحيد العملة
      let currency = String(inv.invoiceCurrency || '').trim().toUpperCase();
      if (!currency) currency = 'غير محدد';
      currency = normalizeCurrency(currency);
      
      // ✅ تراكم حسب العملة
      if (!restByCurrency[currency]) restByCurrency[currency] = 0;
      restByCurrency[currency] += rest;
    }
  }
  
  return {
    totalTrips: totalTrips,
    totalBookings: totalBookings,
    restByCurrency: restByCurrency,   // ✅ كائن العملات
    totalRest: Object.values(restByCurrency).reduce((a, b) => a + b, 0).toFixed(2)  // للتوافق
  };
}
// ============================================================
// RENDER SUMMARY
// ============================================================
function renderSummary(summary) {
  document.getElementById('sumTrips').textContent = summary.totalTrips;
  document.getElementById('sumBookings').textContent = summary.totalBookings;
  
  // ✅ عرض المتبقي حسب العملة
  const restEl = document.getElementById('sumRest');
  
  if (summary.restByCurrency && Object.keys(summary.restByCurrency).length > 0) {
    // ✅ بناء HTML للعملات
    const priority = ['USD', 'EUR', 'GBP', 'EGP', 'SAR', 'AED', 'KWD', 'CHF'];
    const currencies = Object.keys(summary.restByCurrency).sort((a, b) => {
      const ia = priority.indexOf(a);
      const ib = priority.indexOf(b);
      if (ia !== -1 && ib !== -1) return ia - ib;
      if (ia !== -1) return -1;
      if (ib !== -1) return 1;
      return a.localeCompare(b);
    });
    
    const itemsHTML = currencies.map(cur => {
      const amount = summary.restByCurrency[cur];
      return `<span style="display:inline-block;margin:0 3px;font-size:13px;">
        <b>${cur}:</b> ${formatMoney(amount)}
      </span>`;
    }).join('');
    
    restEl.innerHTML = itemsHTML;
    restEl.style.fontSize = '14px';
    restEl.style.display = 'flex';
    restEl.style.flexWrap = 'wrap';
    restEl.style.justifyContent = 'center';
    restEl.style.gap = '8px';
  } else {
    restEl.textContent = '0.00';
  }
  
  document.getElementById('summaryStrip').style.display = 'grid';
}

function populateTripCheckboxes(prefix) {
  const containerId = prefix === 'excel' ? 'excelTripList' : 'printTripList';
  const container = document.getElementById(containerId);
  const selectedSet = prefix === 'excel' ? excelSelectedTrips : printSelectedTripsSet;

    return;
  }
  
  let html = '';
  tripNames.forEach(tripName => {
    const count = groupedTrips[tripName].length;
    const isChecked = selectedSet.has(tripName) ? 'checked' : '';
    // ✅ استخدام encodeURIComponent لتجنب مشاكل الاقتباس
    const escapedName = tripName.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    
    html += '<label class="trip-checkbox-item">';
    html += '<input type="checkbox" ' + isChecked + ' ';
    html += 'data-trip-name="' + escapedName + '" ';
    html += 'onchange="onTripCheckboxChange(\'' + prefix + '\', this)">';
    html += '<span>' + escHtml(tripName) + '</span>';
    html += '<span class="trip-count">' + count + '</span>';
    html += '</label>';
  });
  
  container.innerHTML = html;

// ✅ عند تغيير Checkbox
function onTripCheckboxChange(prefix, checkbox) {
  const tripName = checkbox.getAttribute('data-trip-name');
  const selectedSet = prefix === 'excel' ? excelSelectedTrips : printSelectedTripsSet;
  
  if (checkbox.checked) {
    selectedSet.add(tripName);
  } else {
    selectedSet.delete(tripName);
  }
  
  // ✅ تحديث "تحديد الكل"
  updateSelectAllState(prefix);
}

// ✅ تحديد / إلغاء تحديد الكل
function toggleSelectAll(prefix) {
  const selectAllCheckbox = document.getElementById(prefix + 'SelectAll');
  const selectedSet = prefix === 'excel' ? excelSelectedTrips : printSelectedTripsSet;
  const containerId = prefix === 'excel' ? 'excelTripList' : 'printTripList';
  const container = document.getElementById(containerId);
  
  const allCheckboxes = container.querySelectorAll('input[type="checkbox"]');
  
  if (selectAllCheckbox.checked) {
    // ✅ تحديد الكل
    allCheckboxes.forEach(cb => {
      cb.checked = true;
      const tripName = cb.getAttribute('data-trip-name');
      selectedSet.add(tripName);
    });
  } else {
    // ❌ إلغاء الكل
    allCheckboxes.forEach(cb => {
      cb.checked = false;
    });
    selectedSet.clear();
  }
}

// ✅ تحديث حالة "تحديد الكل"
function updateSelectAllState(prefix) {
  const selectAllCheckbox = document.getElementById(prefix + 'SelectAll');
  const containerId = prefix === 'excel' ? 'excelTripList' : 'printTripList';
  const container = document.getElementById(containerId);
  
  const allCheckboxes = container.querySelectorAll('input[type="checkbox"]');
  const checkedCount = Array.from(allCheckboxes).filter(cb => cb.checked).length;
  
  if (checkedCount === 0) {
    selectAllCheckbox.checked = false;
    selectAllCheckbox.indeterminate = false;
  } else if (checkedCount === allCheckboxes.length) {
    selectAllCheckbox.checked = true;
    selectAllCheckbox.indeterminate = false;
  } else {
    selectAllCheckbox.checked = false;
    selectAllCheckbox.indeterminate = true;
  }
}

// ============================================================
// PRINT SELECTED TRIPS
// ============================================================
function printSelectedTrips() {
  closeTripDropdown('printDropdown');
  
  if (!allInvoices.length) {
    showAlert('لا توجد بيانات للطباعة', '⚠️');
    return;
  }
  
  // ✅ إذا لم يختر المستخدم أي رحلة، اطبع الكل
  const selectedTrips = printSelectedTripsSet.size > 0 
    ? Array.from(printSelectedTripsSet)
    : Object.keys(groupedTrips);
  
  // ✅ بناء مجموعة فرعية من الرحلات
  const filteredGroups = {};
  selectedTrips.forEach(tripName => {
    if (groupedTrips[tripName]) {
      filteredGroups[tripName] = groupedTrips[tripName];
    }
  });
  
  if (Object.keys(filteredGroups).length === 0) {
    showAlert('لم يتم اختيار أي رحلة', '⚠️');
    return;
  }
  
  // ✅ حفظ الحالة الحالية للصفحة
  const contentEl = document.getElementById('content');
  const originalContent = contentEl.innerHTML;
  
  // ✅ إعادة عرض الرحلات المحددة فقط
  const tripItemsMap = window._tripItemsMap || {};
  const filteredTripItems = {};
  selectedTrips.forEach(tripName => {
    if (tripItemsMap[tripName]) {
      filteredTripItems[tripName] = tripItemsMap[tripName];
    }
  });
  
  // ✅ عرض الرحلات المحددة فقط
  renderTrips(filteredGroups, filteredTripItems);
  
  // ✅ إضافة style للطباعة
  const printStyle = document.createElement('style');
  printStyle.id = 'print-landscape-temp';
  printStyle.innerHTML = '@page { size: A4 landscape; margin: 5mm; }';
  document.head.appendChild(printStyle);
  
  // ✅ تنفيذ الطباعة
  setTimeout(() => {
    window.print();
    
    // ✅ استعادة المحتوى الأصلي بعد الطباعة
    setTimeout(() => {
      contentEl.innerHTML = originalContent;
      const styleEl = document.getElementById('print-landscape-temp');
      if (styleEl) styleEl.remove();
    }, 500);
  }, 200);
}

// ============================================================
// LOAD BRANCHES
// ============================================================
async function loadBranches() {
  try {
    const branches = await gas('getActiveBranches');
    if (Array.isArray(branches)) {
      const select = document.getElementById('filterBranch');
      branches.forEach(b => {
        if (b.centerName === currentUser?.centerName) {
          const opt = document.createElement('option');
          opt.value = b.name;
          opt.textContent = b.name;
          select.appendChild(opt);
        }
      });
    }
  } catch(e) {
    console.warn('loadBranches error:', e);
  }
}

    Theme.applyToPage();
    Theme.setPageTitle('Daily Trips Report');
  }
  
  // التحقق من الجلسة
  if (!Session.checkValidity()) {
    location.href = 'index.html';
    return;
  }
  
  currentUser = Session.getUser();
  if (!currentUser) {
    location.href = 'index.html';
    return;
  }
  
  // التحقق من الصلاحية
  if (!ALLOWED.includes(currentUser.type)) {
    showAlert('ليس لديك صلاحية لعرض هذا التقرير', '🚫');
    setTimeout(() => location.href = DASH[currentUser.type] || 'Dashboard.html', 2000);
    return;
  }
  
  // عرض اسم المستخدم
  document.getElementById('userNameDisplay').textContent = currentUser.name || 'User';
  
 const today = new Date();
