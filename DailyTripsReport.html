<!DOCTYPE html>
<html dir="ltr">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="theme-color" content="#1e2b4f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes">
  <title>Daily Trips Report</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="ui.js"></script>
  <script src="config.js"></script>
  <script src="session.js"></script>

  <style>
    :root{
      --navy:#0f1f3d;--navy2:#1a3260;--gold:#f5c842;--gold2:#e6b800;
      --blue:#2563eb;--green:#16a34a;--red:#dc2626;--orange:#ea580c;
      --purple:#7c3aed;--teal:#0d9488;
      --bg:#f0f4f8;--card:#fff;--border:#dde4f0;--text:#1a2540;--text-lt:#5a6a8a;
      --gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-500:#64748b;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:15px;}

    .header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:white;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-radius:14px 14px 0 0;box-shadow:0 4px 16px rgba(15,31,61,.2);}
    .header h2{color:var(--gold);font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px;}
    .header-right{display:flex;align-items:center;gap:8px;}
    .user-chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:40px;padding:4px 13px;color:white;font-size:12px;font-weight:600;}
    .back-btn{background:transparent;border:2px solid rgba(255,255,255,.3);color:white;padding:5px 14px;border-radius:40px;cursor:pointer;font-weight:700;font-size:12px;font-family:'Cairo',sans-serif;transition:all .2s;}
    .back-btn:hover{border-color:var(--gold);color:var(--gold);}

    .filter-bar{background:white;border:2px solid var(--border);border-top:none;padding:14px 20px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
    .fg{display:flex;flex-direction:column;gap:4px;}
    .fg label{font-size:11px;font-weight:700;color:var(--text-lt);text-transform:uppercase;letter-spacing:.4px;}
    .fc{padding:8px 12px;border:2px solid var(--border);border-radius:10px;font-size:13px;font-family:'Cairo',sans-serif;background:white;min-height:38px;}
    .fc:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.1);}
    .btn{padding:9px 20px;border:none;border-radius:24px;font-weight:700;font-size:12px;cursor:pointer;font-family:'Cairo',sans-serif;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
    .btn:hover{transform:translateY(-1px);}
    .btn-go{background:var(--navy);color:var(--gold);}
    .btn-go:hover{background:var(--navy2);}
    .btn-reset{background:#f1f5f9;color:var(--text);}
    .btn-export{background:var(--green);color:white;}
    .btn-print{background:var(--orange);color:white;}

    .summary-strip{background:linear-gradient(135deg,#eef2f8,#e0e8f3);border:2px solid var(--border);border-top:none;padding:14px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
    .sum-item{background:white;border-radius:12px;padding:12px 14px;text-align:center;border:1px solid var(--border);box-shadow:0 2px 6px rgba(15,31,61,.05);}
    .sum-item .lbl{font-size:11px;color:var(--text-lt);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;}
    .sum-item .val{font-size:22px;font-weight:900;color:var(--navy);}

    .content{padding:16px 0;}
    .loader-wrap{text-align:center;padding:60px 20px;color:var(--text-lt);}
    .spinner{width:36px;height:36px;border:4px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .no-data{text-align:center;padding:50px;color:var(--text-lt);font-size:14px;background:white;border-radius:12px;border:2px dashed var(--border);}

    /* Trip Card */
    .trip-card{background:white;border-radius:14px;overflow:hidden;margin-bottom:18px;box-shadow:0 4px 14px rgba(15,31,61,.08);border:1px solid var(--border);}
    .trip-header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:var(--gold);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:14px 18px;}
    .trip-header .trip-title{font-size:16px;font-weight:900;display:flex;align-items:center;gap:10px;}
    .trip-header .trip-icon{background:rgba(245,200,66,.2);border-radius:8px;padding:4px 9px;font-size:16px;}

    .tbl-scroll{overflow-x:auto;max-width:100%;}
    .tbl{width:100%;border-collapse:collapse;font-size:11.5px;min-width:1200px;}
    .tbl thead th{background:var(--navy2);color:var(--gold);padding:9px 7px;font-size:11px;font-weight:700;text-align:center;white-space:nowrap;border-right:1px solid rgba(255,255,255,.08);}
    .tbl thead th:first-child{text-align:left;padding-left:14px;}
    .tbl tbody td{padding:7px 6px;text-align:center;border-bottom:1px solid #eef2f9;color:#000;font-weight:700;white-space:nowrap;vertical-align:middle;}
    .tbl tbody td:first-child{text-align:left;padding-left:14px;}
    .tbl tbody tr:hover{background:#f5f9ff;}
    .tbl tfoot td{background:#dbeafe;color:var(--navy);border-top:2px solid var(--navy);border-bottom:2px solid var(--navy);padding:10px 7px;font-size:11.5px;font-weight:700;text-align:center;}
    .tbl tfoot td:first-child{text-align:left;padding-left:14px;}

    .vlink{color:var(--blue);font-weight:700;cursor:pointer;}
    .vlink:hover{text-decoration:underline;}
    .st-pending{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;background:#fef9c3;color:#854d0e;}
    .st-confirmed{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;background:#dcfce7;color:#166534;}
    .st-cancel{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;background:#fee2e2;color:#991b1b;}
    .st-refund{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;background:#fef3c7;color:#92400e;}
    .acts-cell{max-width:220px;white-space:normal;word-break:break-word;line-height:1.3;text-align:left;font-size:11px;}
    .num-col{color:var(--navy);font-weight:700;}
    .zero-col{color:#cbd5e1;}

    /* Alert Modal */
    .a-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(3px);}
    .a-modal.open{display:flex;}
    .a-box{background:white;width:90%;max-width:340px;border-radius:20px;padding:24px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.3);}
    .a-icon{font-size:44px;margin-bottom:12px;}
    .a-msg{color:var(--navy);font-size:14px;font-weight:700;margin-bottom:18px;white-space:pre-wrap;line-height:1.6;}
    .a-btn{padding:9px 24px;border:none;border-radius:30px;background:var(--navy);color:var(--gold);font-weight:700;font-size:13px;cursor:pointer;font-family:'Cairo',sans-serif;}

    .pdf-btn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;background:var(--orange);color:white;text-decoration:none;font-size:12px;transition:all .2s;}
    .pdf-btn:hover{background:#c2410c;transform:scale(1.1);}
    .pdf-btn.disabled{background:#cbd5e1;cursor:not-allowed;}
    .tbl td.acts-cell{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;font-size:10px;}

    .footer{text-align:center;padding:16px 0 6px;color:#94a3b8;font-size:11px;border-top:1px solid #e2e8f0;margin-top:20px;}

    @page { size: A4 landscape; margin: 5mm; }
    @media print {
      body{background:white;padding:0;}
      .header,.filter-bar,.summary-strip,.footer,.no-print,.tabs-container,.action-bar{display:none !important;}
      .trip-card{box-shadow:none;border:1px solid #ccc;page-break-inside:avoid;margin-bottom:14px;}
      .tbl thead th{background:#f1f5f9 !important;color:#0f1f3d !important;border:1px solid #94a3b8 !important;border-bottom:2px solid #0f1f3d !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
      .trip-header{background:white !important;color:#0f1f3d !important;border:2px solid #0f1f3d !important;border-radius:4px !important;padding:8px 14px !important;margin-bottom:0 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
      .tbl{ border:1px solid #94a3b8 !important; font-size:9px !important; min-width:auto !important; }
      .tbl thead th{ padding:5px 3px !important; font-size:9px !important; }
      .tbl tbody td{ padding:4px 3px !important; font-size:9px !important; border-bottom:1px solid #cbd5e1 !important; }
      .tbl tfoot td{padding:5px 3px !important;font-size:9px !important;background:#f1f5f9 !important;color:#0f1f3d !important;border-top:2px solid #0f1f3d !important;border-bottom:2px solid #0f1f3d !important;}
    }
    
    @media(max-width:640px){
      .filter-bar{flex-direction:column;align-items:stretch;}
      .fg{width:100%;}
      .fc{width:100%;}
      .btn{width:100%;justify-content:center;}
      body{padding:8px;}
    }

    /* Dropdown */
    .dropdown-wrapper { position: relative; display: inline-block; }
    .dropdown-arrow { font-size: 9px; margin-right: 4px; opacity: 0.7; }
    .dropdown-menu {display: none;position: absolute;top: calc(100% + 6px);left: 0;min-width: 280px;max-width: 400px;background: white;border: 2px solid var(--navy);border-radius: 12px;box-shadow: 0 8px 24px rgba(15, 31, 61, 0.2);z-index: 1000;overflow: hidden;}
    .dropdown-menu.open { display: block; animation: dropdownFadeIn 0.2s ease-out; }
    @keyframes dropdownFadeIn {from { opacity: 0; transform: translateY(-8px); }to { opacity: 1; transform: translateY(0); }}
    .dropdown-header {background: var(--navy);color: var(--gold);padding: 10px 14px;display: flex;justify-content: space-between;align-items: center;font-size: 13px;}
    .dropdown-header label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 700; }
    .dropdown-header input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--gold); }
    .dropdown-close {background: transparent;border: none;color: var(--gold);font-size: 16px;cursor: pointer;padding: 0 6px;font-weight: 700;}
    .dropdown-close:hover { opacity: 0.7; }
    .dropdown-body { max-height: 320px; overflow-y: auto; padding: 6px 0; }
    .trip-checkbox-item {display: flex;align-items: center;gap: 10px;padding: 9px 14px;cursor: pointer;transition: background 0.15s;font-size: 12.5px;font-weight: 600;color: var(--text);border-bottom: 1px solid #f1f5f9;}
    .trip-checkbox-item:last-child { border-bottom: none; }
    .trip-checkbox-item:hover { background: #f0f6ff; }
    .trip-checkbox-item input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--navy); flex-shrink: 0; }
    .trip-checkbox-item .trip-count {margin-right: auto;font-size: 11px;color: var(--text-lt);font-weight: 700;background: #f1f5f9;padding: 2px 8px;border-radius: 12px;}
    .dropdown-footer {padding: 10px 14px;border-top: 1px solid var(--border);background: #f8fafc;display: flex;justify-content: stretch;}
    .dropdown-footer .btn { width: 100%; justify-content: center; padding: 10px; font-size: 13px; }
    @media (max-width: 640px) { .dropdown-menu { min-width: 260px; max-width: 320px; } }

    /* Sortable headers */
    th.sortable {cursor: pointer;user-select: none;position: relative;padding-right: 22px;transition: background-color 0.2s;}
    th.sortable:hover { background-color: #e3f2fd; }
    th.sortable::after {content: '⇅';position: absolute;right: 6px;top: 50%;transform: translateY(-50%);font-size: 11px;color: #999;opacity: 0.6;}
    th.sortable.sort-asc::after { content: '▲'; color: #1976d2; opacity: 1; }
    th.sortable.sort-desc::after { content: '▼'; color: #1976d2; opacity: 1; }

    /* Trip header right */
    .trip-header-right {display: flex;align-items: center;gap: 12px;flex-wrap: wrap;justify-content: flex-end;}
    .trip-stat-badge {background: rgba(255, 255, 255, 0.12);color: #e2e8f0;padding: 6px 14px;border-radius: 20px;font-size: 13px;font-weight: 500;border: 1px solid rgba(255, 255, 255, 0.18);white-space: nowrap;}
    .trip-stat-badge b { color: #fbbf24; font-size: 14px; }
    .header-remaining {display: flex;align-items: center;gap: 8px;flex-wrap: wrap;padding: 4px 10px;background: rgba(255, 255, 255, 0.06);border-radius: 20px;border: 1px solid rgba(255, 255, 255, 0.1);}
    .header-remaining-label {color: #e2e8f0;font-size: 12px;font-weight: 600;white-space: nowrap;}
    .currency-chip {display: inline-flex;align-items: center;gap: 6px;padding: 3px 10px;border-radius: 14px;border: 1.5px solid;background: rgba(255, 255, 255, 0.08);font-size: 12px;font-weight: bold;white-space: nowrap;transition: transform 0.15s, background 0.15s;}
    .currency-chip:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.15); }
    .currency-chip-code {font-size: 10px;font-weight: 800;letter-spacing: 0.5px;padding: 1px 5px;border-radius: 6px;background: rgba(255, 255, 255, 0.15);}
    .currency-chip-amount { font-family: 'Courier New', monospace; font-size: 13px; }

    @media (max-width: 768px) {
      .trip-header-right { gap: 6px; }
      .header-remaining { padding: 3px 8px; gap: 5px; }
      .currency-chip { padding: 2px 8px; font-size: 11px; }
      .currency-chip-amount { font-size: 11px; }
    }

    /* ═══ Tabs System ═══ */
    .tabs-container{padding:14px 20px 0;max-width:1800px;margin:0 auto;}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:700px;}
    .tab{background:white;border:2px solid var(--border);border-radius:14px;padding:12px 14px;cursor:pointer;transition:all .25s;text-align:center;font-family:inherit;}
    .tab:hover{transform:translateY(-2px);border-color:var(--gold);}
    .tab.active{background:linear-gradient(135deg,var(--navy),var(--navy2));color:white;border-color:var(--gold);}
    .tab-icon{font-size:22px;margin-bottom:4px;}
    .tab-title{font-size:13px;font-weight:800;color:var(--navy);}
    .tab.active .tab-title{color:var(--gold);}
    .tab-content{display:none;}
    .tab-content.active{display:block;}

    /* ═══ Vehicle Chips ═══ */
    .veh-chip{display:inline-flex;align-items:center;gap:4px;background:var(--purple);color:#fff;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;margin:1px;cursor:pointer;white-space:nowrap;}
    .veh-chip:hover{background:#6d28d9;}
    .veh-chip .chip-remove{cursor:pointer;background:rgba(255,255,255,.25);border-radius:50%;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;}
    .veh-chip .chip-remove:hover{background:rgba(255,255,255,.5);}
    .veh-add-btn{display:inline-block;background:#f0f4ff;color:var(--navy);padding:4px 10px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;border:1px dashed var(--blue);}
    .veh-add-btn:hover{background:#e0e8ff;}
    .veh-add-btn.disabled{background:#fee2e2;color:#991b1b;border-color:var(--red);cursor:not-allowed;opacity:.6;}

    /* ═══ Beneficiaries ═══ */
    .section-group{margin-bottom:18px;}
    .section-header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:var(--gold);border-radius:12px 12px 0 0;font-weight:800;font-size:14px;flex-wrap:nowrap;overflow:hidden;}
    .section-header>span:not(.section-header-count):not(.section-header-icon){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
    .section-header-icon{flex-shrink:0;font-size:20px;}
    .section-header-count{flex-shrink:0;margin-right:auto;background:rgba(245,200,66,.2);border:1px solid rgba(245,200,66,.4);padding:3px 12px;border-radius:20px;font-size:12px;}
    .section-body{background:white;border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;padding:8px;}

    .beneficiary-card{background:white;border:2px solid var(--border);border-radius:12px;margin-bottom:6px;overflow:hidden;transition:all .2s;}
    .beneficiary-card:hover{border-color:var(--gold);}
    .beneficiary-card.selected{border-color:var(--blue);background:#eff6ff;}
    .beneficiary-row{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;user-select:none;}
    .beneficiary-checkbox{width:20px;height:20px;cursor:pointer;accent-color:var(--blue);flex-shrink:0;}
    .beneficiary-info{flex:1;min-width:0;}
    .beneficiary-name{font-weight:800;font-size:14px;color:#000;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
    .beneficiary-sub{font-size:11px;color:#000;margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;}
    .beneficiary-stats{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
    .badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;}
    .badge-green{background:#dcfce7;color:#166534;}
    .badge-blue{background:#dbeafe;color:#1e40af;}
    .badge-orange{background:#ffedd5;color:#9a3412;}
    .beneficiary-arrow{font-size:14px;color:var(--navy);transition:transform .3s;flex-shrink:0;}
    .beneficiary-card.open .beneficiary-arrow{transform:rotate(180deg);}
    .beneficiary-body{max-height:0;overflow:hidden;transition:max-height .4s ease;background:var(--gray-50);}
    .beneficiary-card.open .beneficiary-body{max-height:3000px;}
    .beneficiary-body-inner{padding:12px;border-top:1px solid var(--border);overflow-x:auto;}

    /* ═══ Action Bar ═══ */
    .action-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;background:white;padding:10px 14px;border-radius:12px;border:1px solid var(--border);}
    .action-btn{padding:8px 16px;border:none;border-radius:20px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
    .action-btn:hover{transform:translateY(-1px);}
    .action-btn.select-all{background:var(--blue);color:#fff;}
    .action-btn.clear-all{background:#f1f5f9;color:#000;border:1px solid var(--border);}
    .action-btn.send-wa{background:#25D366;color:#fff;}
    .action-btn.send-wa:hover{background:#128C7E;}
    .selection-count{margin-left:auto;background:var(--navy);color:var(--gold);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;}

    /* ═══ Manager Tab ═══ */
    .manager-card{background:white;border:2px solid var(--border);border-radius:14px;margin-bottom:16px;overflow:hidden;}
    .manager-card.boat-card{border-color:var(--blue);}
    .manager-card.vehicle-card{border-color:var(--purple);}
    .manager-card.vehicle-logistics-card{border-color:var(--teal);}
    .manager-card-header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:var(--gold);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;font-weight:800;font-size:14px;}
    .manager-card-body{padding:14px;}
    .manager-inv-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:12px;background:white;border-radius:8px;overflow:hidden;}
    .manager-inv-table thead th{background:var(--navy);color:var(--gold);padding:8px 6px;text-align:center;font-weight:700;font-size:11px;white-space:nowrap;}
    .manager-inv-table tbody td{padding:8px 6px;border-bottom:1px solid var(--gray-200);text-align:center;font-size:11px;color:#000;font-weight:600;}
    .manager-inv-table tbody tr:hover{background:#fef9e7;}
    .manager-inv-table .time-col{font-weight:900;color:var(--navy);font-family:monospace;}

    .final-totals-section{background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:16px;padding:20px;margin-bottom:20px;color:white;}
    .final-totals-title{font-size:16px;font-weight:900;color:var(--gold);margin-bottom:16px;text-align:center;}
    .final-totals-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
    .final-totals-grid .total-card{background:rgba(255,255,255,0.1);border:2px solid rgba(245,200,66,0.4);border-radius:12px;padding:16px;text-align:center;}
    .final-totals-grid .total-val{font-size:28px;font-weight:900;color:var(--gold);line-height:1;}
    .final-totals-grid .total-lbl{font-size:12px;color:rgba(255,255,255,0.85);margin-top:6px;font-weight:700;}

    /* ═══ Assign Modals ═══ */
    .assign-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center;z-index:9999;padding:20px;}
    .assign-modal.open{display:flex;}
    .assign-modal-content{background:#fff;border-radius:16px;max-width:950px;width:100%;max-height:88vh;overflow-y:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
    .assign-modal-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--gold);padding-bottom:12px;margin-bottom:16px;}

<script>
// ============================================================
// CONFIG & GLOBAL STATE
// ============================================================
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DASH = CONFIG.DASHBOARD_PAGES || {
  Admin: 'Dashboard.html', Owner: 'OwnerDashboard.html', Sales: 'SalesDashboard.html',
  Accountant: 'AccountantDashboard.html', Customer: 'CustomerDashboard.html'
};
const ALLOWED = ['Admin','Owner','Sales','Accountant','FinancialManager','CenterManager','BranchManager','OperationsManager'];

let currentUser = null;
let allInvoices = [];
let groupedTrips = {};
let summaryData = {};
let excelSelectedTrips = new Set();
let printSelectedTripsSet = new Set();
const tripItemsCache = new Map();

// Tabs & Beneficiaries state
let activeTab = 'trips';
let tripCategoriesMap = {};
let beneficiariesData = { vehicles: [], logistics: [], boats: [], instructors: [], helpers: [], photographers: [], suppliers: [], customers: [] };
let vehiclesMap = {}, logisticsVehiclesMap = {}, boatsMap = {}, instructorsMap = {};
let selectedBeneficiaries = new Set();
let cachedVehicles = [], cachedBoats = [], cachedInstructors = [];
let currentAssignInvoice = null;

// Session check
if (typeof Session !== 'undefined' && Session.checkValidity) {
  if (!Session.checkValidity()) throw new Error('جلسة غير صالحة');
}

// ============================================================
// JSONP REQUEST
// ============================================================
function gas(action, params = {}, retryCount = 0) {
  return new Promise((resolve, reject) => {
    const user = Session.getUser();
    if (user && user.centerName && !params.centerName) params.centerName = user.centerName;
    if (user && user.centerId && !params.centerId) params.centerId = user.centerId;
    
    const callbackName = 'cb_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
    const url = new URL(CONFIG.GAS_URL);
    url.searchParams.set('action', action);
    url.searchParams.set('callback', callbackName);
    url.searchParams.set('_t', Date.now());
    
    Object.keys(params).forEach(key => {
      if (params[key] !== undefined && params[key] !== null && params[key] !== '') {
        if (typeof params[key] === 'object') {
          url.searchParams.set(key, JSON.stringify(params[key]));
        } else {
          url.searchParams.set(key, String(params[key]));
        }
      }
    });
    
    console.log(`📡 [${action}] Attempt ${retryCount + 1}...`);
    let isResolved = false;
    const script = document.createElement('script');
    
    const timeout = setTimeout(() => {
      if (isResolved) return;
      isResolved = true;
      cleanup();
      if (retryCount < 2) {
        console.warn(`⏰ [${action}] Timeout, retrying (${retryCount + 2}/3)...`);
        setTimeout(() => { gas(action, params, retryCount + 1).then(resolve).catch(reject); }, 1500);
      } else {
        reject(new Error('Timeout after 3 attempts: ' + action));
      }
    }, 120000);
    
    const cleanup = () => {
      clearTimeout(timeout);
      try { delete window[callbackName]; } catch(e) {}
      try { if (script.parentNode) script.parentNode.removeChild(script); } catch(e) {}
    };
    
    window[callbackName] = function(data) {
      if (isResolved) return;
      isResolved = true;
      console.log(`✅ [${action}] Success`);
      cleanup();
      resolve(data);
    };
    
    script.onerror = function() {
      if (isResolved) return;
      isResolved = true;
      cleanup();
      if (retryCount < 2) {
        console.warn(`❌ [${action}] Network error, retrying (${retryCount + 2}/3)...`);
        setTimeout(() => { gas(action, params, retryCount + 1).then(resolve).catch(reject); }, 1500);
      } else {
        reject(new Error('Network error after 3 attempts: ' + action));
      }
    };
    
    script.src = url.toString();
    document.body.appendChild(script);
  });
}

// ============================================================
// UTILITIES
// ============================================================
function escHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function fmtTime(t) {
  if (!t) return '';
  const m = String(t).match(/(\d{1,2}):(\d{2})/);
  return m ? String(m[1]).padStart(2,'0') + ':' + m[2] : String(t).substring(0,5);
}

function formatPhoneAsText(phone) {
  if (!phone) return '';
  let p = String(phone).replace(/^=/, '').trim();
  p = p.replace(/[^\d+]/g, '');
  return p;
}

function safeNum(val) {
  const num = parseFloat(val);
  return (num !== 0 && !isNaN(num)) ? num : '';
}

function safeVal(val) {
  return (val !== undefined && val !== null && val !== '') ? val : '';
}

function formatPhoneNumber(phone) {
  if (!phone) return '';
  let p = String(phone).trim();
  if (p.startsWith('00')) p = '+' + p.substring(2);
  else if (p.startsWith('0')) p = '+20' + p.substring(1);
  else if (!p.startsWith('+')) p = '+' + p;
  return p;
}

function showAlert(msg, icon) {
  document.getElementById('aMsg').textContent = msg;
  document.getElementById('aIcon').textContent = icon || 'ℹ️';
  document.getElementById('alertModal').classList.add('open');
}
function closeAlert() { document.getElementById('alertModal').classList.remove('open'); }

function goBack() {
  if (currentUser) Session.save(currentUser);
  window.location.href = DASH[currentUser?.type] || 'AccountantDashboard.html';
}

async function getTripItems(tripName, centerName) {
  try {
    const result = await gas('getTripItemsByName', { tripName, centerName });
    return Array.isArray(result) ? result : [];
  } catch(e) {
    console.error('getTripItems error:', e);
    return [];
  }
}

async function fetchTripItemsForTrips(tripNames) {
  const result = {};
  const missingTrips = [];
  
  for (const tripName of tripNames) {
    if (tripItemsCache.has(tripName)) result[tripName] = tripItemsCache.get(tripName);
    else missingTrips.push(tripName);
  }
  
  if (missingTrips.length === 0) {
    console.log(`⚡ fetchTripItemsForTrips: جميع ${tripNames.length} رحلة من الكاش`);
    return result;
  }
  
  try {
    console.log(`📡 fetchTripItemsForTrips: جلب ${missingTrips.length} رحلة (طلب دفعي)`);
    const batchResult = await gas('getTripItemsBatch', {
      tripNames: JSON.stringify(missingTrips),
      centerName: currentUser?.centerName || ''
    });
    
    if (batchResult && typeof batchResult === 'object' && !Array.isArray(batchResult)) {
      for (const tripName of missingTrips) {
        const items = Array.isArray(batchResult[tripName]) ? batchResult[tripName] : [];
        tripItemsCache.set(tripName, items);
        result[tripName] = items;
      }
      console.log(`✅ fetchTripItemsForTrips: تم جلب ${missingTrips.length} رحلة (دفعة واحدة)`);
      return result;
    }
    console.warn('⚠️ getTripItemsBatch لم تُرجع Object صحيح، العودة للطريقة الفردية');
  } catch(batchErr) {
    console.warn('⚠️ getTripItemsBatch فشل:', batchErr.message);
  }
  
  console.log(`📡 fetchTripItemsForTrips: ${missingTrips.length} طلب فردي (Fallback)`);
  await Promise.all(missingTrips.map(async (tripName) => {
    try {
      const items = await getTripItems(tripName, currentUser?.centerName || '');
      tripItemsCache.set(tripName, items);
      result[tripName] = items;
    } catch(e) {
      console.error(`❌ فشل جلب ${tripName}:`, e);
      result[tripName] = [];
      tripItemsCache.set(tripName, []);
    }
  }));
  
  return result;
}

function clearTripItemsCache() {
  tripItemsCache.clear();
  console.log('🗑️ تم مسح كاش بنود الرحلات');
}

function clearVehicleCache() {
  cachedVehicles = [];
  cachedBoats = [];
  cachedInstructors = [];
}

function validateDateRange(fromDate, toDate) {
  const from = new Date(fromDate);
  const to = new Date(toDate);
  if (isNaN(from) || isNaN(to)) { showAlert('تواريخ غير صحيحة', '⚠️'); return false; }
  if (from > to) { showAlert('تاريخ البداية يجب أن يكون قبل تاريخ النهاية', '⚠️'); return false; }
  const diffDays = Math.ceil((to - from) / (1000 * 60 * 60 * 24));
  if (diffDays > 180) showAlert(`⚠️ النطاق الزمني كبير جداً (${diffDays} يوم)\nقد يستغرق التحميل وقتاً أطول.`, '⚠️');
  return true;
}

function checkSingleDate() {
  const fromDate = document.getElementById('filterFromDate')?.value || '';
  const toDate = document.getElementById('filterToDate')?.value || '';
  return fromDate && fromDate === toDate;
}

function formatDateForQuery(iso) {
  if (!iso) return '';
  const p = iso.split('-');
  if (p.length !== 3) return iso;
  const d = new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2]));
  return String(d.getDate()).padStart(2,'0') + '/' + MN[d.getMonth()] + '/' + d.getFullYear();
}

// ============================================================
// TABS SWITCHING
// ============================================================
function switchTab(tabName) {
  activeTab = tabName;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tabName));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  const target = document.getElementById('tab-' + tabName);
  if (target) target.classList.add('active');
}

// ============================================================
// TRIP CATEGORIES (Diving Detection)
// ============================================================
async function loadTripCategories() {
  try {
    const res = await gas('getTripDefinitions', { centerName: currentUser?.centerName });
    if (res && res.success && Array.isArray(res.data)) {
      res.data.forEach(t => {
        tripCategoriesMap[t.TripName] = (t.Category || '').toString().trim();
      });
      console.log(`✅ تم تحميل تصنيفات ${Object.keys(tripCategoriesMap).length} رحلة`);
    }
  } catch(e) {
    console.warn('⚠️ فشل تحميل تصنيفات الرحلات:', e.message);
  }
}

function isDivingTrip(tripName) {
  const cat = (tripCategoriesMap[tripName] || '').toString().toLowerCase();
  return cat.includes('diving');
}

// ============================================================
// SORTING
// ============================================================
let sortState = { column: null, direction: 'asc' };

const COLUMN_TYPES = {
  1: 'voucher', 2: 'date', 3: 'time', 4: 'string', 5: 'string', 6: 'string',
  7: 'number', 8: 'number', 9: 'number', 10: 'number', 11: 'number', 12: 'number',
  13: 'number', 14: 'number', 15: 'string', 16: 'string', 17: 'string',
  18: 'string', 19: 'string', 20: 'number', 21: 'string', 22: 'string'
};

function parseSortValue(value, type) {
  if (value === null || value === undefined) return type === 'number' ? -Infinity : '';
  const str = String(value).trim();
  if (!str) return type === 'number' ? -Infinity : '';
  
  if (type === 'number') {
    const cleaned = str.replace(/[^\d.\-]/g, '');
    const num = parseFloat(cleaned);
    return isNaN(num) ? -Infinity : num;
  }
  
  if (type === 'date') {
    const dmy = str.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);
    if (dmy) {
      let d = parseInt(dmy[1], 10), m = parseInt(dmy[2], 10) - 1, y = parseInt(dmy[3], 10);
      if (y < 100) y += 2000;
      const date = new Date(y, m, d);
      return isNaN(date.getTime()) ? 0 : date.getTime();
    }
    const iso = str.match(/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})/);
    if (iso) {
      const date = new Date(parseInt(iso[1], 10), parseInt(iso[2], 10) - 1, parseInt(iso[3], 10));
      return isNaN(date.getTime()) ? 0 : date.getTime();
    }
    const ts = Date.parse(str);
    return isNaN(ts) ? 0 : ts;
  }
  
  if (type === 'time') {
    const ampm = str.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM|ص|م)?/i);
    if (ampm) {
      let h = parseInt(ampm[1], 10);
      const m = parseInt(ampm[2], 10) || 0;
      const s = parseInt(ampm[3], 10) || 0;
      const period = (ampm[4] || '').toUpperCase();
      if ((period === 'PM' || period === 'م') && h < 12) h += 12;
      if ((period === 'AM' || period === 'ص') && h === 12) h = 0;
      return h * 3600 + m * 60 + s;
    }
    return 0;
  }
  
  if (type === 'voucher') return str;
  return str;
}

function compareValues(a, b, type) {
  const va = parseSortValue(a, type);
  const vb = parseSortValue(b, type);
  if (type === 'string' || type === 'voucher') {
    return String(va).localeCompare(String(vb), 'ar', { numeric: true, sensitivity: 'base' });
  }
  if (va < vb) return -1;
  if (va > vb) return 1;
  return 0;
}

function sortTableByColumn(columnIndex, table) {
  const tbody = table.querySelector('tbody');
  if (!tbody) return;
  const rows = Array.from(tbody.querySelectorAll('tr'));
  if (rows.length === 0) return;
  
  let direction = 'asc';
  if (sortState.column === columnIndex && sortState.direction === 'asc') direction = 'desc';
  sortState.column = columnIndex;
  sortState.direction = direction;
  
  const type = COLUMN_TYPES[columnIndex] || 'string';
  
  rows.sort((rowA, rowB) => {
    const cellA = rowA.cells[columnIndex];
    const cellB = rowB.cells[columnIndex];
    if (!cellA || !cellB) return 0;
    const cmp = compareValues(cellA.textContent || '', cellB.textContent || '', type);
    return direction === 'asc' ? cmp : -cmp;
  });
  
  rows.forEach(row => tbody.appendChild(row));
  renumberRows(tbody);
  updateSortIndicators(table, columnIndex, direction);
}

function renumberRows(tbody) {
  const rows = tbody.querySelectorAll('tr');
  rows.forEach((row, idx) => {
    if (row.cells[0]) {
      const txt = row.cells[0].textContent.trim();
      if (/^\d+$/.test(txt)) row.cells[0].textContent = idx + 1;
    }
  });
}

function updateSortIndicators(table, columnIndex, direction) {
  const headers = table.querySelectorAll('thead th');
  headers.forEach((th, idx) => {
    th.classList.remove('sort-asc', 'sort-desc');
    if (idx === columnIndex) th.classList.add(direction === 'asc' ? 'sort-asc' : 'sort-desc');
  });
}

function enableColumnSorting() {
  const tables = document.querySelectorAll('#content table');
  if (!tables.length) return;
  
  tables.forEach(table => {
    const headers = table.querySelectorAll('thead th');
    headers.forEach((th, idx) => {
      if (idx === 0) return;
      if (th.classList.contains('no-sort')) return;
      const headerText = th.textContent.trim().toLowerCase();
      if (headerText === 'pdf' || headerText.includes('تحميل')) return;
      
      th.classList.add('sortable');
      th.setAttribute('title', 'اضغط للترتيب');
      
      if (th._sortHandler) th.removeEventListener('click', th._sortHandler);
      th._sortHandler = () => sortTableByColumn(idx, table);
      th.addEventListener('click', th._sortHandler);
    });
  });
}

// ============================================================
// REMAINING BY CURRENCY
// ============================================================
function normalizeCurrency(cur) {
  const cleaned = String(cur || '').replace(/\s+/g, '').toUpperCase();
  const map = {
    'USD': 'USD', 'US$': 'USD', '$': 'USD', 'DOLLAR': 'USD', 'DOLLARS': 'USD', 'دولار': 'USD', 'دولارامريكي': 'USD',
    'EUR': 'EUR', '€': 'EUR', 'EURO': 'EUR', 'EUROS': 'EUR', 'يورو': 'EUR', 'يوروأوروبي': 'EUR',
    'GBP': 'GBP', '£': 'GBP', 'POUND': 'GBP', 'POUNDS': 'GBP', 'STERLING': 'GBP', 'جنيه': 'GBP', 'جنيهإسترليني': 'GBP', 'إسترليني': 'GBP', 'استرليني': 'GBP',
    'EGP': 'EGP', 'LE': 'EGP', 'ج.م': 'EGP', 'ج.م.': 'EGP', 'جنيهمصري': 'EGP', 'EGYPTIANPOUND': 'EGP',
    'SAR': 'SAR', 'ريال': 'SAR', 'ر.س': 'SAR', 'SR': 'SAR', 'ريالسعودي': 'SAR',
    'AED': 'AED', 'درهم': 'AED', 'د.إ': 'AED', 'درهمإماراتي': 'AED',
    'KWD': 'KWD', 'دينار': 'KWD', 'د.ك': 'KWD',
    'CHF': 'CHF', 'فرنك': 'CHF', 'فرنكسويسري': 'CHF',
    'JPY': 'JPY', '¥': 'JPY', 'ين': 'JPY',
    'TRY': 'TRY', '₺': 'TRY', 'ليرة': 'TRY',
    'RUB': 'RUB', '₽': 'RUB', 'روبل': 'RUB'
  };
  const key = cleaned.replace(/\.+$/, '');
  return map[key] || map[cleaned] || cleaned;
}

function parseNumberSafe(val) {
  if (val === null || val === undefined || val === '') return 0;
  if (typeof val === 'number') return isNaN(val) ? 0 : val;
  const cleaned = String(val).replace(/[^\d.\-]/g, '');
  const num = parseFloat(cleaned);
  return isNaN(num) ? 0 : num;
}

function formatMoney(amount) {
  const num = parseNumberSafe(amount);
  return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function calculateRemainingByCurrency(invoices) {
  const totals = {};
  if (!Array.isArray(invoices)) return totals;
  invoices.forEach(inv => {
    let currency = String(inv.invoiceCurrency || '').trim().toUpperCase();
    if (!currency) currency = 'غير محدد';
    currency = normalizeCurrency(currency);
    const remaining = parseNumberSafe(inv.rest);
    if (remaining === 0) return;
    if (!totals[currency]) totals[currency] = 0;
    totals[currency] += remaining;
  });
  return totals;
}

function buildRemainingByCurrencyHTML(totals) {
  const currencies = Object.keys(totals).filter(c => totals[c] !== 0);
  if (currencies.length === 0) return '';
  
  const priority = ['USD', 'EUR', 'GBP', 'EGP', 'SAR', 'AED', 'KWD', 'CHF'];
  currencies.sort((a, b) => {
    const ia = priority.indexOf(a), ib = priority.indexOf(b);
    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1;
    if (ib !== -1) return 1;
    return a.localeCompare(b);
  });
  
  const colors = {
    'USD': '#4ade80', 'EUR': '#60a5fa', 'GBP': '#c084fc', 'EGP': '#fb923c',
    'SAR': '#22d3ee', 'AED': '#f472b6', 'KWD': '#fbbf24', 'CHF': '#f87171',
    'JPY': '#fca5a5', 'TRY': '#5eead4', 'RUB': '#a5b4fc', 'غير محدد': '#cbd5e1'
  };
  
  const itemsHTML = currencies.map(cur => {
    const amount = totals[cur];
    const color = colors[cur] || '#e2e8f0';
    const sign = amount < 0 ? '⚠ ' : '';
    return `<span class="currency-chip" style="color:${color}; border-color:${color};">
      <span class="currency-chip-code">${cur}</span>
      <span class="currency-chip-amount">${sign}${formatMoney(Math.abs(amount))}</span>
    </span>`;
  }).join('');
  
  return `<div class="header-remaining">
    <span class="header-remaining-label">💰 المتبقي:</span>
    ${itemsHTML}
  </div>`;
}

function parseActiveDateToObj(dateStr) {
  if (!dateStr) return new Date(9999, 11, 31);
  const months = { 'jan': 0, 'feb': 1, 'mar': 2, 'apr': 3, 'may': 4, 'jun': 5, 'jul': 6, 'aug': 7, 'sep': 8, 'oct': 9, 'nov': 10, 'dec': 11 };
  const match = String(dateStr).match(/^(\d{1,2})\/([A-Za-z]{3})\/(\d{4})$/);
  if (!match) return new Date(9999, 11, 31);
  const day = parseInt(match[1]);
  const monthKey = match[2].toLowerCase();
  const year = parseInt(match[3]);
  const month = months[monthKey];
  if (month === undefined) return new Date(9999, 11, 31);
  return new Date(year, month, day);
}

function groupByTrip(invoices) {
  const groups = {};
  for (const inv of invoices) {
    const tripName = (inv.trip || inv.Trip || 'Unassigned Trip').trim() || 'Unassigned Trip';
    if (!groups[tripName]) groups[tripName] = [];
    groups[tripName].push(inv);
  }
  
  const sorted = {};
  Object.keys(groups).sort().forEach(tripName => {
    sorted[tripName] = groups[tripName].sort((a, b) => {
      const dateCompare = parseActiveDateToObj(a.activeDate).getTime() - parseActiveDateToObj(b.activeDate).getTime();
      if (dateCompare !== 0) return dateCompare;
      const timeToMinutes = (t) => {
        const m = String(t || '').match(/(\d{1,2}):(\d{2})/);
        if (!m) return 9999;
        return parseInt(m[1]) * 60 + parseInt(m[2]);
      };
      const timeCompare = timeToMinutes(a.time) - timeToMinutes(b.time);
      if (timeCompare !== 0) return timeCompare;
      const salesCompare = String(a.salesName || '').trim().localeCompare(String(b.salesName || '').trim(), 'ar');
      if (salesCompare !== 0) return salesCompare;
      const suppCompare = String(a.supplier || '').trim().localeCompare(String(b.supplier || '').trim(), 'ar');
      if (suppCompare !== 0) return suppCompare;
      const custCompare = String(a.customer || '').trim().localeCompare(String(b.customer || '').trim(), 'ar');
      if (custCompare !== 0) return custCompare;
      return String(a.voucherNo || '').localeCompare(String(b.voucherNo || ''));
    });
  });
  return sorted;
}

function calculateSummary(groups) {
  const totalTrips = Object.keys(groups).length;
  let totalBookings = 0;
  const restByCurrency = {};
  
  for (const tripName in groups) {
    const invoices = groups[tripName];
    totalBookings += invoices.length;
    for (const inv of invoices) {
      const rest = parseFloat(inv.rest) || 0;
      if (rest === 0) continue;
      let currency = String(inv.invoiceCurrency || '').trim().toUpperCase();
      if (!currency) currency = 'غير محدد';
      currency = normalizeCurrency(currency);
      if (!restByCurrency[currency]) restByCurrency[currency] = 0;
      restByCurrency[currency] += rest;
    }
  }
  
  return { totalTrips, totalBookings, restByCurrency, totalRest: Object.values(restByCurrency).reduce((a, b) => a + b, 0).toFixed(2) };
}

function renderSummary(summary) {
  document.getElementById('sumTrips').textContent = summary.totalTrips;
  document.getElementById('sumBookings').textContent = summary.totalBookings;
  const restEl = document.getElementById('sumRest');
  
  if (summary.restByCurrency && Object.keys(summary.restByCurrency).length > 0) {
    const priority = ['USD', 'EUR', 'GBP', 'EGP', 'SAR', 'AED', 'KWD', 'CHF'];
    const currencies = Object.keys(summary.restByCurrency).sort((a, b) => {
      const ia = priority.indexOf(a), ib = priority.indexOf(b);
      if (ia !== -1 && ib !== -1) return ia - ib;
      if (ia !== -1) return -1;
      if (ib !== -1) return 1;
      return a.localeCompare(b);
    });
    
    restEl.innerHTML = currencies.map(cur => `<span style="display:inline-block;margin:0 3px;font-size:13px;"><b>${cur}:</b> ${formatMoney(summary.restByCurrency[cur])}</span>`).join('');
    restEl.style.fontSize = '14px';
    restEl.style.display = 'flex';
    restEl.style.flexWrap = 'wrap';
    restEl.style.justifyContent = 'center';
    restEl.style.gap = '8px';
  } else {
    restEl.textContent = '0.00';
  }
  
  document.getElementById('summaryStrip').style.display = 'grid';
}

async function openAssignVehiclesModal(voucherNo) {
  if (!checkSingleDate()) { showAlert('⚠️ يجب اختيار تاريخاً مفرداً (From = To)', '⚠️'); return; }
  
  const invoice = allInvoices.find(i => i.voucherNo === voucherNo);
  if (!invoice) { showAlert('❌ الفاتورة غير موجودة', '❌'); return; }
  
  currentAssignInvoice = invoice;
  const dateISO = document.getElementById('filterFromDate').value;
  
  document.getElementById('assignVehiclesModal').classList.add('open');
  document.getElementById('assignVehiclesBody').innerHTML = '<div class="loader-wrap"><div class="spinner"></div>جاري التحميل...</div>';
  
  try {
    if (cachedVehicles.length === 0) {
      cachedVehicles = await gas('getVehicles', { centerName: currentUser?.centerName }) || [];
    }
    
    const targetDate = formatDateForQuery(dateISO);
    const vehicleRecords = await gas('getVehicleTripRecords', { date: targetDate, centerName: currentUser?.centerName });
    
    let plannedVehicles = [];
    if (vehicleRecords?.success && Array.isArray(vehicleRecords.data)) {

    renderAssignVehiclesModal(plannedVehicles, invoice);

    document.getElementById('assignVehiclesBody').innerHTML = `<div class="no-data">❌ خطأ: ${escHtml(e.message)}</div>`;
  }
}

function closeAssignVehiclesModal() {
  document.getElementById('assignVehiclesModal').classList.remove('open');
  currentAssignInvoice = null;
}

function renderAssignVehiclesModal(plannedVehicles, invoice) {
  const invAdults = parseInt(invoice.adultCount) || 0;
  const invChildren = parseInt(invoice.childCount) || 0;
  const invInfants = parseInt(invoice.infantCount) || 0;
  
  let savedVehicles = [];
  try { savedVehicles = JSON.parse(invoice.VehiclesUsed || '[]'); } catch(e) {}
  
  let html = `
    <div class="remaining-pax-banner">
      <div>🏝️ ${escHtml(invoice.trip || '')} — 🧾 ${escHtml(invoice.voucherNo)}</div>
      <div style="font-size:12px;margin-top:6px;">👤 Adults: ${invAdults} | 👶 Children: ${invChildren} | 🍼 Infants: ${invInfants}</div>
      <div class="label" id="remainingPaxLabel">المتبقي: 👤 ${invAdults} | 👶 ${invChildren} | 🍼 ${invInfants}</div>
    </div>
    <div style="overflow-x:auto;max-height:400px;">
      <table class="assign-table">
        <thead>
          <tr>
            <th>🚗 Vehicle</th><th>Cap</th><th>Go Used</th><th>Ret Used</th><th>Go Avail</th><th>Ret Avail</th>
            <th>Plan Go</th><th>Plan Ret</th><th>👤</th><th>👶</th><th>🍼</th><th>☑️</th>
          </tr>
        </thead>
        <tbody>`;
  
  for (const trip of plannedVehicles) {
    const vehicle = cachedVehicles.find(v => v.id === trip.VehicleID);
    if (!vehicle) continue;
    
    const cap = parseInt(vehicle.capacity) || 0;
    const masterGo = parseInt(trip.GoCount) || 0;
    const masterRet = parseInt(trip.ReturnCount) || 0;
    const totalGoCap = cap * masterGo;
    const totalRetCap = cap * masterRet;
    
    let otherGo = 0, otherRet = 0;
    for (const inv of allInvoices) {
      if (inv.voucherNo === invoice.voucherNo) continue;
      if (inv.activeDate !== invoice.activeDate) continue;
      let vData = [];
      try { vData = JSON.parse(inv.VehiclesUsed || '[]'); } catch(e) {}
      const usage = vData.find(v => v.vehicleId === vehicle.id);
      if (usage) {
        const pax = (parseInt(usage.adults) || 0) + (parseInt(usage.children) || 0);
        otherGo += pax;
        otherRet += pax;
      }
    }
    
    const availGo = Math.max(0, totalGoCap - otherGo);
    const availRet = Math.max(0, totalRetCap - otherRet);
    const saved = savedVehicles.find(v => v.vehicleId === vehicle.id) || {};
    const isSelected = !!saved.vehicleId;
    
    html += `<tr id="vrow-${vehicle.id}">
      <td style="background:var(--navy);color:var(--gold);font-weight:700;">${escHtml(vehicle.licensePlate || vehicle.id)}</td>
      <td>${cap}</td>
      <td class="v-go-used">${otherGo} / ${totalGoCap}</td>
      <td class="v-ret-used">${otherRet} / ${totalRetCap}</td>
      <td class="v-go-avail" style="color:${availGo===0?'red':'green'};font-weight:700;">${availGo}</td>
      <td class="v-ret-avail" style="color:${availRet===0?'red':'green'};font-weight:700;">${availRet}</td>
      <td><input type="number" value="${masterGo}" disabled></td>
      <td><input type="number" value="${masterRet}" disabled></td>
      <td><input type="number" class="a-adult" data-id="${vehicle.id}" value="${saved.adults||''}" min="0" ${!isSelected?'disabled':''}></td>
      <td><input type="number" class="a-child" data-id="${vehicle.id}" value="${saved.children||''}" min="0" ${!isSelected?'disabled':''}></td>
      <td><input type="number" class="a-infant" data-id="${vehicle.id}" value="${saved.infants||''}" min="0" ${!isSelected?'disabled':''}></td>
      <td><input type="checkbox" class="a-select" data-id="${vehicle.id}"
        data-cap="${cap}" data-base-go="${otherGo}" data-base-ret="${otherRet}"
        data-max-go="${totalGoCap}" data-max-ret="${totalRetCap}"
        ${isSelected?'checked':''}></td>
    </tr>`;
  }
  
  html += `</tbody></table></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;">
      <button class="btn btn-reset" onclick="closeAssignVehiclesModal()">إلغاء</button>
      <button class="btn btn-go" onclick="saveAssignVehicles()">✅ حفظ</button>
    </div>`;
  
  document.getElementById('assignVehiclesBody').innerHTML = html;
  setTimeout(() => attachAssignVehicleEvents(), 50);
}

function attachAssignVehicleEvents() {
 function updateRemaining() {
    const invA = parseInt(currentAssignInvoice.adultCount) || 0;
    const invC = parseInt(currentAssignInvoice.childCount) || 0;
    const invI = parseInt(currentAssignInvoice.infantCount) || 0;
    
    let totA = 0, totC = 0, totI = 0;
    document.querySelectorAll('#assignVehiclesModal .a-select:checked').forEach(cb => {
      const id = cb.dataset.id;
      totA += parseInt(document.querySelector(`#assignVehiclesModal .a-adult[data-id="${id}"]`)?.value) || 0;
      totC += parseInt(document.querySelector(`#assignVehiclesModal .a-child[data-id="${id}"]`)?.value) || 0;
      totI += parseInt(document.querySelector(`#assignVehiclesModal .a-infant[data-id="${id}"]`)?.value) || 0;
    });
    
    const lbl = document.getElementById('remainingPaxLabel');
    if (lbl) lbl.innerHTML = `المتبقي: 👤 ${invA-totA} | 👶 ${invC-totC} | 🍼 ${invI-totI}`;
    return { remA: invA-totA, remC: invC-totC, remI: invI-totI };
  }
  
  function recalc(id) {
    const row = document.getElementById(`vrow-${id}`);
    if (!row) return;
    const cb = document.querySelector(`#assignVehiclesModal .a-select[data-id="${id}"]`);
    const maxGo = parseInt(cb.dataset.maxGo) || 0;
    const maxRet = parseInt(cb.dataset.maxRet) || 0;
    const baseGo = parseInt(cb.dataset.baseGo) || 0;
    const baseRet = parseInt(cb.dataset.baseRet) || 0;
    
    let pax = 0;
    if (cb.checked) {
      const a = parseInt(document.querySelector(`#assignVehiclesModal .a-adult[data-id="${id}"]`)?.value) || 0;
      const c = parseInt(document.querySelector(`#assignVehiclesModal .a-child[data-id="${id}"]`)?.value) || 0;
      pax = a + c;
    }
    const tgo = baseGo + pax;
    const tret = baseRet + pax;
    
    row.querySelector('.v-go-used').textContent = `${tgo} / ${maxGo}`;
    row.querySelector('.v-ret-used').textContent = `${tret} / ${maxRet}`;
    row.querySelector('.v-go-avail').textContent = Math.max(0, maxGo - tgo);
    row.querySelector('.v-ret-avail').textContent = Math.max(0, maxRet - tret);
  }
  
  document.querySelectorAll('#assignVehiclesModal .a-select').forEach(cb => {
    const nc = cb.cloneNode(true);
    cb.parentNode.replaceChild(nc, cb);
    nc.addEventListener('change', (e) => {
      const id = e.target.dataset.id;
      const checked = e.target.checked;
      ['adult','child','infant'].forEach(k => {
        const inp = document.querySelector(`#assignVehiclesModal .a-${k}[data-id="${id}"]`);
        if (inp) inp.disabled = !checked;
      });
      if (checked) {
        const { remA, remC, remI } = updateRemaining();
        const cap = parseInt(e.target.dataset.cap) || 0;
        const ai = Math.min(remA, cap);
        const ci = Math.min(remC, cap - ai);
        document.querySelector(`#assignVehiclesModal .a-adult[data-id="${id}"]`).value = ai > 0 ? ai : '';
        document.querySelector(`#assignVehiclesModal .a-child[data-id="${id}"]`).value = ci > 0 ? ci : '';
        document.querySelector(`#assignVehiclesModal .a-infant[data-id="${id}"]`).value = remI > 0 ? remI : '';
      } else {
        ['adult','child','infant'].forEach(k => {
          const inp = document.querySelector(`#assignVehiclesModal .a-${k}[data-id="${id}"]`);
          if (inp) inp.value = '';
        });
      }
      updateRemaining();
      recalc(id);
    });
  });
  
  document.querySelectorAll('#assignVehiclesModal .a-adult, #assignVehiclesModal .a-child, #assignVehiclesModal .a-infant').forEach(inp => {
    const ni = inp.cloneNode(true);
    inp.parentNode.replaceChild(ni, inp);
    ni.addEventListener('input', () => {
      const id = ni.dataset.id;
      const cb = document.querySelector(`#assignVehiclesModal .a-select[data-id="${id}"]`);
      const maxGo = parseInt(cb.dataset.maxGo) || 0;
      const baseGo = parseInt(cb.dataset.baseGo) || 0;
      const a = parseInt(document.querySelector(`#assignVehiclesModal .a-adult[data-id="${id}"]`)?.value) || 0;
      const c = parseInt(document.querySelector(`#assignVehiclesModal .a-child[data-id="${id}"]`)?.value) || 0;
      const actMax = maxGo - baseGo;
      if (a + c > actMax) {
        showAlert(`⚠️ تجاوز السعة المتاحة (${actMax})`, '⚠️');
        ni.value = Math.max(0, actMax - (ni.classList.contains('a-adult') ? c : a));
      }
      updateRemaining();
      recalc(id);
    });
  });
}

async function saveAssignVehicles() {
  const inv = currentAssignInvoice;
  if (!inv) return;
  
  // ✅ الاعتماد على الأعمدة الجديدة
  const invA = parseInt(inv.adultCount) || 0;
  const invC = parseInt(inv.childCount) || 0;
  const invI = parseInt(inv.infantCount) || 0;
  
  let totA = 0, totC = 0, totI = 0;
  const selected = [];
  
  document.querySelectorAll('#assignVehiclesModal .a-select:checked').forEach(cb => {
    const id = cb.dataset.id;
    const a = parseInt(document.querySelector(`#assignVehiclesModal .a-adult[data-id="${id}"]`)?.value) || 0;
    const c = parseInt(document.querySelector(`#assignVehiclesModal .a-child[data-id="${id}"]`)?.value) || 0;
    const i = parseInt(document.querySelector(`#assignVehiclesModal .a-infant[data-id="${id}"]`)?.value) || 0;
    
    totA += a; totC += c; totI += i;
    
    const goEl = cb.closest('tr').querySelectorAll('input[type="number"]')[0];
    const retEl = cb.closest('tr').querySelectorAll('input[type="number"]')[1];
    
    selected.push({
      vehicleId: id,
      goCount: parseInt(goEl?.value) || 0,
      returnCount: parseInt(retEl?.value) || 0,
      adults: a, children: c, infants: i, totalSeats: a + c
    });
  });
  
  if (selected.length === 0) { showAlert('⚠️ اختر سيارة واحدة على الأقل', '⚠️'); return; }
  
  if (totA > invA || totC > invC || totI > invI) {
    showAlert(`❌ لا يمكن تجاوز إجمالي الفاتورة\nالفاتورة: 👤${invA} | 👶${invC} | 🍼${invI}\nالموزع: 👤${totA} | 👶${totC} | 🍼${totI}`, '⚠️');
    return;
  }
  
  const conflicts = checkTimeConflictsForInvoice(inv, selected);
  if (conflicts.length > 0) {
    const msg = conflicts.map(c => `🚗 ${c.plate}: ${c.otherTime} (${c.otherTrip}) — Voucher ${c.otherVoucher}`).join('\n');
    if (!confirm(`⚠️ تعارض في الأوقات (فرق > ساعة):\n\n${msg}\n\nهل تريد الحفظ على أي حال؟`)) return;
  }
  
  try {
    const result = await gas('assignVehiclesToInvoice', {
      voucherNo: inv.voucherNo,
      vehiclesData: JSON.stringify(selected),
      centerName: currentUser?.centerName
    });
    
    if (result?.success) {
      inv.VehiclesUsed = JSON.stringify(selected);
      showAlert('✅ تم حفظ السيارات', '✅');
      closeAssignVehiclesModal();
      loadReport();
    } else {
      showAlert('❌ فشل: ' + (result?.message || 'خطأ'), '❌');
    }
  } catch(e) {
    showAlert('❌ خطأ: ' + e.message, '❌');
  }
}

function checkTimeConflictsForInvoice(invoice, vehiclesData) {
  const currentTime = parseTimeToMin(invoice.time);
  const conflicts = [];
  
  for (const v of vehiclesData) {
    for (const other of allInvoices) {
      if (other.voucherNo === invoice.voucherNo) continue;
      if (other.activeDate !== invoice.activeDate) continue;
      let vData = [];
      try { vData = JSON.parse(other.VehiclesUsed || '[]'); } catch(e) {}
      if (!vData.find(x => x.vehicleId === v.vehicleId)) continue;
      
      const otherTime = parseTimeToMin(other.time);
      const diff = Math.abs(currentTime - otherTime);
      
      if (diff > 60 && other.trip !== invoice.trip) {
        const veh = cachedVehicles.find(x => x.id === v.vehicleId);
        conflicts.push({
          plate: veh?.licensePlate || v.vehicleId,
          otherTime: other.time || '—',
          otherTrip: other.trip,
          otherVoucher: other.voucherNo
        });
      }
    }
  }
  return conflicts;
}

function parseTimeToMin(t) {
  if (!t) return 0;
  const m = String(t).match(/(\d{1,2}):(\d{2})/);
  return m ? parseInt(m[1])*60 + parseInt(m[2]) : 0;
}

async function removeVehicleFromInvoice(voucherNo, vehicleId) {
  if (!confirm('إزالة هذه السيارة من الفاتورة؟')) return;
  const invoice = allInvoices.find(i => i.voucherNo === voucherNo);

  let vehicles = [];
  try { vehicles = JSON.parse(invoice.VehiclesUsed || '[]'); } catch(e) {}

  } catch(e) {

  }
}

async function buildBeneficiaries() {
  beneficiariesData = { vehicles: [], logistics: [], boats: [], instructors: [], helpers: [], photographers: [], suppliers: [], customers: [] };
  vehiclesMap = {}; logisticsVehiclesMap = {}; boatsMap = {}; instructorsMap = {};
  
  try {
    if (cachedVehicles.length === 0) {
      cachedVehicles = await gas('getVehicles', { centerName: currentUser?.centerName }) || [];
    }
    cachedVehicles.forEach(v => {
      const phone = formatPhoneAsText(v.driverPhone || '');
      if (v.usageType === 'passengers') vehiclesMap[v.id] = { ...v, phone };
      else if (v.usageType === 'luggage') logisticsVehiclesMap[v.id] = { ...v, phone };
    });
  } catch(e) {}
  
  try {
    if (cachedBoats.length === 0) {
      cachedBoats = await gas('getBoats', { centerName: currentUser?.centerName }) || [];
    }
    cachedBoats.forEach(b => { boatsMap[b.id] = { ...b, phone: formatPhoneAsText(b.captainPhone || '') }; });
  } catch(e) {}
  
  try {
    if (cachedInstructors.length === 0) {
      cachedInstructors = await gas('getInstructors', { centerName: currentUser?.centerName }) || [];
    }
    cachedInstructors.forEach(i => { instructorsMap[i.id] = { ...i, phone: formatPhoneAsText(i.phone || '') }; });
  } catch(e) {}
  
  let suppliersCustomersMap = {};
  try {
    const list = await gas('getAllSuppliersCustomers', { centerName: currentUser?.centerName });
    if (Array.isArray(list)) list.forEach(s => { suppliersCustomersMap[s.customerName] = s; });
  } catch(e) {}
  
  const fromDate = document.getElementById('filterFromDate').value;
  let logisticsRecords = [];
  try {
    const targetDate = formatDateForQuery(fromDate);
    const res2 = await gas('getLogisticsRecords', { date: targetDate, centerName: currentUser?.centerName });
    if (res2?.success && Array.isArray(res2.data)) logisticsRecords = res2.data;
  } catch(e) {}
  
  const vGroups = new Map(), lgGroups = new Map(), bGroups = new Map(), iGroups = new Map(), hGroups = new Map(), pGroups = new Map(), sGroups = new Map(), cGroups = new Map();
  
  for (const tripName in groupedTrips) {
    for (const inv of groupedTrips[tripName]) {
      let vData = [];
      try { vData = JSON.parse(inv.VehiclesUsed || '[]'); } catch(e) {}
      vData.forEach(v => {
        if (!v.vehicleId) return;
        if (!vGroups.has(v.vehicleId)) vGroups.set(v.vehicleId, { id: v.vehicleId, invoices: [], totalPax: 0 });
        const e = vGroups.get(v.vehicleId);
        if (!e.invoices.find(x => x.voucherNo === inv.voucherNo)) e.invoices.push(inv);
        e.totalPax += (parseInt(v.adults)||0) + (parseInt(v.children)||0);
      });
      
      let bData = [];
      try { bData = JSON.parse(inv.BoatsUsed || '[]'); } catch(e) {}
      bData.forEach(b => {
        if (!b.boatId) return;
        if (!bGroups.has(b.boatId)) bGroups.set(b.boatId, { id: b.boatId, invoices: [], totalPax: 0 });
        const e = bGroups.get(b.boatId);
        if (!e.invoices.find(x => x.voucherNo === inv.voucherNo)) e.invoices.push(inv);
        e.totalPax += (parseInt(b.adults)||0) + (parseInt(b.children)||0) + (parseInt(b.infants)||0);
      });
      
      let iData = [];
      try { iData = JSON.parse(inv.InstructorsExecution || '[]'); } catch(e) {}
      iData.forEach(ie => {
        if (!ie.instructorId) return;
        const member = instructorsMap[ie.instructorId];
        const role = (member?.role || 'Instructor');
        let map = iGroups;
        if (role === 'Helper') map = hGroups;
        else if (role === 'Photographer') map = pGroups;
        if (!map.has(ie.instructorId)) map.set(ie.instructorId, { id: ie.instructorId, invoices: [] });
        const e = map.get(ie.instructorId);
        if (!e.invoices.find(x => x.voucherNo === inv.voucherNo)) e.invoices.push(inv);
      });
      
      const sup = (inv.supplier || '').toString().trim();
      if (sup) {
        if (!sGroups.has(sup)) sGroups.set(sup, { id: sup, invoices: [] });
        const e = sGroups.get(sup);
        if (!e.invoices.find(x => x.voucherNo === inv.voucherNo)) e.invoices.push(inv);
      }
      
      const cus = (inv.customer || '').toString().trim();
      if (cus) {
        if (!cGroups.has(cus)) cGroups.set(cus, { id: cus, invoices: [] });
        const e = cGroups.get(cus);
        if (!e.invoices.find(x => x.voucherNo === inv.voucherNo)) e.invoices.push(inv);
      }
    }
  }
  
  logisticsRecords.forEach(r => {
    const vId = r.VehicleID || r.vehicleId;
    if (!vId) return;
    if (!lgGroups.has(vId)) lgGroups.set(vId, { id: vId, records: [], totalGo: 0, totalRet: 0 });
    const e = lgGroups.get(vId);
    e.records.push(r);
    e.totalGo += parseInt(r.GoCount || r.goCount) || 0;
    e.totalRet += parseInt(r.ReturnCount || r.returnCount) || 0;
  });
  
  beneficiariesData.vehicles = Array.from(vGroups.values()).map(e => {
    const v = vehiclesMap[e.id] || {};
    return { ...e, name: v.driverName || e.id, phone: v.phone || '', licensePlate: v.licensePlate || '', capacity: v.capacity || 0 };
  });
  
  beneficiariesData.logistics = Array.from(lgGroups.values()).map(e => {
    const v = logisticsVehiclesMap[e.id] || {};
    return { ...e, name: v.driverName || e.id, phone: v.phone || '', licensePlate: v.licensePlate || '', capacity: v.capacity || 0 };
  });
  
  beneficiariesData.boats = Array.from(bGroups.values()).map(e => {
    const b = boatsMap[e.id] || {};
    return { ...e, name: b.name || e.id, phone: b.phone || '', captainName: b.captainName || '', capacity: b.capacity || 0 };
  });
  
  beneficiariesData.instructors = Array.from(iGroups.values()).map(e => {
    const i = instructorsMap[e.id] || {};
    return { ...e, name: i.name || e.id, phone: i.phone || '', role: i.role || 'Instructor' };
  });
  
  beneficiariesData.helpers = Array.from(hGroups.values()).map(e => {
    const h = instructorsMap[e.id] || {};
    return { ...e, name: h.name || e.id, phone: h.phone || '', role: 'Helper' };
  });
  
  beneficiariesData.photographers = Array.from(pGroups.values()).map(e => {
    const p = instructorsMap[e.id] || {};
    return { ...e, name: p.name || e.id, phone: p.phone || '', role: 'Photographer' };
  });
  
  beneficiariesData.suppliers = Array.from(sGroups.values()).map(e => {
    const s = suppliersCustomersMap[e.id] || {};
    return { ...e, name: e.id, phone: formatPhoneAsText(s.phone || ''), category: s.category || '' };
  });
  
  beneficiariesData.customers = Array.from(cGroups.values()).map(e => {
    const c = suppliersCustomersMap[e.id] || {};
    return { ...e, name: e.id, phone: formatPhoneAsText(c.phone || ''), category: c.category || '' };
  });
}

function toggleBeneficiaryCard(key) {
  const card = document.querySelector(`.beneficiary-card[data-key="${CSS.escape(key)}"]`);
  if (card) card.classList.toggle('open');
}

function toggleBeneficiarySelection(key, cb) {
  if (cb.checked) selectedBeneficiaries.add(key);
  else selectedBeneficiaries.delete(key);
  const card = cb.closest('.beneficiary-card');
  if (card) card.classList.toggle('selected', cb.checked);
  updateSelectionCount();
}

function updateSelectionCount() {
  const el = document.getElementById('selectionCount');
  if (el) el.textContent = selectedBeneficiaries.size + ' محدد';
}

function selectAllBeneficiaries() {
  document.querySelectorAll('.beneficiary-card').forEach(card => {
    const key = card.dataset.key;
    if (!key) return;
    selectedBeneficiaries.add(key);
    const cb = card.querySelector('.beneficiary-checkbox');
    if (cb) cb.checked = true;
    card.classList.add('selected');
  });
  updateSelectionCount();
}

function clearAllBeneficiaries() {
  selectedBeneficiaries.clear();
  document.querySelectorAll('.beneficiary-card').forEach(card => {
    card.classList.remove('selected');
    const cb = card.querySelector('.beneficiary-checkbox');
    if (cb) cb.checked = false;
  });
  updateSelectionCount();
}

function sendWhatsAppTo(key, type) {
  const item = findBeneficiaryByKey(key, type);
  if (!item) return;
  const phone = cleanPhoneForWA(item.phone);
  if (!phone) { showAlert('⚠️ لا يوجد رقم هاتف لهذا المستفيد', '⚠️'); return; }
  const msg = buildWAMessage(item, type);
  window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(msg), '_blank');
}

function sendWhatsAppToSelected() {
  if (selectedBeneficiaries.size === 0) { showAlert('⚠️ لم يتم تحديد أي مستفيد', '⚠️'); return; }
  let count = 0;
  for (const key of selectedBeneficiaries) {
    const parts = key.split('_');
    const type = parts[0];
    const item = findBeneficiaryByKey(key, type);
    if (item && item.phone) {
      const phone = cleanPhoneForWA(item.phone);
      if (phone) {
        const msg = buildWAMessage(item, type);
        window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(msg), '_blank');
        count++;
        if (count >= 5) break;
      }
    }
  }
  if (count === 0) showAlert('⚠️ لا توجد أرقام هواتف صالحة', '⚠️');
  else showAlert(`✅ تم فتح ${count} محادثة واتساب`, '✅');
}

function findBeneficiaryByKey(key, type) {
  const parts = key.split('_');
  const id = parts.slice(1).join('_');
  const arr = beneficiariesData[type] || [];
  return arr.find(x => x.id === id);
}

function cleanPhoneForWA(phone) {
  if (!phone) return '';
  let p = String(phone).replace(/[^\d+]/g, '');
  p = p.replace(/^\+/, '');
  if (!p.startsWith('20')) {
    if (p.startsWith('0')) p = '20' + p.substring(1);
    else p = '20' + p;
  }
  return p.length >= 10 && p.length <= 15 ? p : '';
}

function buildWAMessage(item, type) {
  const fromStr = document.getElementById('filterFromDate').value || '';
  const toStr = document.getElementById('filterToDate').value || '';
  const period = fromStr === toStr ? fromStr : fromStr + ' → ' + toStr;
  
  const labelMap = { vehicles: '🚗 خطة عمل السائق', logistics: '🚛 خطة عمل سائق النقل', boats: '⛵ خطة عمل الكابتن', instructors: '👨‍🏫 خطة عمل المدرب', helpers: '🆘 خطة عمل المساعد', photographers: '📸 خطة عمل المصور', suppliers: '🏢 خطة عمل المنفذ', customers: '👤 خطة عمل العميل' };
  
  let msg = (labelMap[type] || '📋 خطة عمل') + '\n';
  msg += '📅 ' + period + '\n';
  msg += '━━━━━━━━━━━━━━━━\n\n';
  msg += '📌 ' + (item.name || '') + '\n';
  if (item.phone) msg += '📞 ' + item.phone + '\n';
  if (item.licensePlate) msg += '🔢 ' + item.licensePlate + '\n';
  msg += '\n';
  
  if (type === 'logistics' && item.records) {
    msg += `📋 ${item.records.length} سجل\n\n`;
    item.records.forEach((r, i) => {
      msg += `${i+1}. 🚌 ${r.TripName||''} — 🔄 Go: ${r.GoCount||0} | 🔙 Ret: ${r.ReturnCount||0}\n`;
    });
  } else if (item.invoices) {
    msg += `🧾 ${item.invoices.length} فاتورة\n\n`;
    item.invoices.forEach((inv, i) => {
      msg += `━━━ ${i+1} ━━━\n`;
      msg += `⏰ ${inv.time||'—'} | 🧾 ${inv.voucherNo||''}\n`;
      msg += `🏝️ ${inv.trip||'—'}\n`;
      msg += `🏨 ${inv.hotel||'—'} / 🚪 ${inv.roomNo||'—'}\n`;
      msg += `👤 ${inv.guestName||'—'}\n`;
      if (inv.activitiesText) msg += `📋 ${inv.activitiesText}\n`;
      msg += '\n';
    });
  }
  
  msg += '━━━━━━━━━━━━━━━━\n🌊 Dive System';
  return msg;
}

function toggleTripDropdown(dropdownId, event) {
  if (event) event.stopPropagation();
  const dropdown = document.getElementById(dropdownId);
  const isOpen = dropdown.classList.contains('open');
  document.querySelectorAll('.dropdown-menu').forEach(el => el.classList.remove('open'));
  if (!isOpen) {
    const prefix = dropdownId.replace('Dropdown', '');
    populateTripCheckboxes(prefix);
    dropdown.classList.add('open');
  }
}

function closeTripDropdown(dropdownId, event) {
  if (event) event.stopPropagation();
  document.getElementById(dropdownId).classList.remove('open');
}

function populateTripCheckboxes(prefix) {
  const containerId = prefix === 'excel' ? 'excelTripList' : 'printTripList';
  const container = document.getElementById(containerId);
  const selectedSet = prefix === 'excel' ? excelSelectedTrips : printSelectedTripsSet;
  const tripNames = Object.keys(groupedTrips).sort();
  
  if (tripNames.length === 0) {
    container.innerHTML = '<div style="padding:20px;text-align:center;color:#94a3b8;">لا توجد رحلات</div>';
    return;
  }
  
  let html = '';
  tripNames.forEach(tripName => {
    const count = groupedTrips[tripName].length;
    const isChecked = selectedSet.has(tripName) ? 'checked' : '';
    const escapedName = tripName.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    html += '<label class="trip-checkbox-item">';
    html += '<input type="checkbox" ' + isChecked + ' ';
    html += 'data-trip-name="' + escapedName + '" ';
    html += 'onchange="onTripCheckboxChange(\'' + prefix + '\', this)">';
    html += '<span>' + escHtml(tripName) + '</span>';
    html += '<span class="trip-count">' + count + '</span>';
    html += '</label>';
  });
  container.innerHTML = html;
}

function onTripCheckboxChange(prefix, checkbox) {
  const tripName = checkbox.getAttribute('data-trip-name');
  const selectedSet = prefix === 'excel' ? excelSelectedTrips : printSelectedTripsSet;
  if (checkbox.checked) selectedSet.add(tripName);
  else selectedSet.delete(tripName);
  updateSelectAllState(prefix);
}

function toggleSelectAll(prefix) {
  const selectAllCheckbox = document.getElementById(prefix + 'SelectAll');
  const selectedSet = prefix === 'excel' ? excelSelectedTrips : printSelectedTripsSet;
  const containerId = prefix === 'excel' ? 'excelTripList' : 'printTripList';
  const container = document.getElementById(containerId);
  const allCheckboxes = container.querySelectorAll('input[type="checkbox"]');
  
  if (selectAllCheckbox.checked) {
    allCheckboxes.forEach(cb => {
      cb.checked = true;
      selectedSet.add(cb.getAttribute('data-trip-name'));
    });
  } else {
    allCheckboxes.forEach(cb => { cb.checked = false; });
    selectedSet.clear();
  }
}

function updateSelectAllState(prefix) {
  const selectAllCheckbox = document.getElementById(prefix + 'SelectAll');
  const containerId = prefix === 'excel' ? 'excelTripList' : 'printTripList';
  const container = document.getElementById(containerId);
  const allCheckboxes = container.querySelectorAll('input[type="checkbox"]');
  const checkedCount = Array.from(allCheckboxes).filter(cb => cb.checked).length;
  
  if (checkedCount === 0) { selectAllCheckbox.checked = false; selectAllCheckbox.indeterminate = false; }
  else if (checkedCount === allCheckboxes.length) { selectAllCheckbox.checked = true; selectAllCheckbox.indeterminate = false; }
  else { selectAllCheckbox.checked = false; selectAllCheckbox.indeterminate = true; }
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.dropdown-wrapper')) {
    document.querySelectorAll('.dropdown-menu').forEach(el => el.classList.remove('open'));
  }
});

function buildExcelCurrencySummaryInline(restByCurrency) {
  const currencies = Object.keys(restByCurrency).filter(c => restByCurrency[c] !== 0);
  if (currencies.length === 0) return '—';
  const priority = ['USD', 'EUR', 'GBP', 'EGP', 'SAR', 'AED', 'KWD', 'CHF'];
  currencies.sort((a, b) => {
    const ia = priority.indexOf(a), ib = priority.indexOf(b);
    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1;
    if (ib !== -1) return 1;
    return a.localeCompare(b);
  });
  const colors = { 'USD': '#2e7d32', 'EUR': '#1565c0', 'GBP': '#6a1b9a', 'EGP': '#ef6c00', 'SAR': '#00838f', 'AED': '#ad1457', 'KWD': '#4e342e', 'CHF': '#c62828', 'JPY': '#b71c1c', 'TRY': '#00695c', 'RUB': '#283593', 'غير محدد': '#607d8b' };
  return currencies.map(cur => {
    const amount = restByCurrency[cur];
    const color = colors[cur] || '#37474f';
    const sign = amount < 0 ? '⚠ ' : '';
    return `<span style="color:${color}; font-weight:bold;">${cur}: ${sign}${formatMoney(Math.abs(amount))}</span>`;
  }).join(' &nbsp;|&nbsp; ');
}

async function exportToExcelWithGroups(groups, tripsToInclude) {
  const fromDate = document.getElementById('filterFromDate').value;
  const toDate = document.getElementById('filterToDate').value;
  const [fy, fm, fd] = fromDate.split('-');
  const [ty, tm, td] = toDate.split('-');
  const fromDateStr = String(fd).padStart(2,'0') + '/' + MN[+fm - 1] + '/' + fy;
  const toDateStr = String(td).padStart(2,'0') + '/' + MN[+tm - 1] + '/' + ty;
  const activeDate = fromDateStr + ' إلى ' + toDateStr;
  
  const quantityFields = ['sgl','dbl','trpl','extra','camel','dinner','vipDinner','starGazing','privateTrip','privateTransfer'];
  let totalBookings = 0;
  tripsToInclude.forEach(tripName => { if (groups[tripName]) totalBookings += groups[tripName].length; });
  
  let overallRestByCurrency = {};
  tripsToInclude.forEach(tripName => {
    if (groups[tripName]) {
      const tripRest = calculateRemainingByCurrency(groups[tripName]);
      Object.keys(tripRest).forEach(cur => {
        if (!overallRestByCurrency[cur]) overallRestByCurrency[cur] = 0;
        overallRestByCurrency[cur] += tripRest[cur];
      });
    }
  });
  const overallCurrencyInline = buildExcelCurrencySummaryInline(overallRestByCurrency);
  
  let html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"><style>';
  html += 'table{border-collapse:collapse;}';
  html += 'th{background:#1a3260;color:#f5c842;padding:8px;border:1px solid #ccc;font-weight:bold;text-align:center;}';
  html += 'td{padding:6px;border:1px solid #ccc;vertical-align:middle;text-align:center;}';
  html += '.trip-title{background:#0f1f3d;color:#f5c842;font-size:16px;font-weight:bold;padding:12px;text-align:center;}';
  html += '.summary{background:#dbeafe;font-weight:bold;}';
  html += '.phone-cell{mso-number-format:"\\@";}';
  html += '</style></head><body>';
  
  html += '<table border="1">';
  html += `<tr><td colspan="20" style="text-align:center; font-size:16px; font-weight:bold; background:#0f1f3d; color:#f5c842; padding:12px;">Daily Trips Report - ${activeDate}</td></tr>`;
  html += `<tr><td colspan="20" style="text-align:center; background:#f1f5f9; padding:8px; font-weight:bold;">Center: ${escHtml(currentUser?.centerName || '')} | Total Trips: ${tripsToInclude.length} | Total Bookings: ${totalBookings}</td></tr>`;
  html += `<tr><td colspan="20" style="text-align:center; background:#dbeafe; padding:8px; font-weight:bold;">💰 Total Rest: ${overallCurrencyInline}</td></tr>`;
  html += '</table><br>';
  
  for (const tripName of tripsToInclude) {
    const invoices = groups[tripName];
    if (!invoices) continue;
    
    html += '<table border="1">';
    html += `<tr><td colspan="15" class="trip-title">${escHtml(tripName)} (${invoices.length} Bookings)</td></tr>`;
    html += '<tr>';
    html += '<th>#</th><th>Voucher</th><th>Active Date</th><th>Time</th><th>Guest Name</th><th>Nationality</th>';
    html += '<th>Hotel</th><th>Room</th><th>Contact</th><th>Activities</th><th>Supplier</th><th>Customer</th><th>Sales Name</th><th>Currency</th><th>Rest</th>';
    html += '</tr>';
    
    for (let idx = 0; idx < invoices.length; idx++) {
      const inv = invoices[idx];
      const rest = parseFloat(inv.rest) || 0;
      const currency = (inv.invoiceCurrency || '').trim();
      html += '<tr>';
      html += `<td>${idx + 1}</td>`;
      html += `<td>${escHtml(inv.voucherNo || '')}</td>`;
      html += `<td>${escHtml(inv.activeDate || '')}</td>`;
      html += `<td>${escHtml(fmtTime(inv.time || ''))}</td>`;
      html += `<td>${escHtml(inv.guestName || '')}</td>`;
      html += `<td>${escHtml(inv.nationality || '')}</td>`;
      html += `<td>${escHtml(inv.hotel || '')}</td>`;
      html += `<td>${escHtml(inv.roomNo || '')}</td>`;
      html += `<td class="phone-cell">${escHtml(formatPhoneAsText(inv.contactNo || ''))}</td>`;
      html += `<td>${escHtml((inv.activitiesText || '').substring(0, 100))}</td>`;
      html += `<td>${escHtml(inv.supplier || '')}</td>`;
      html += `<td>${escHtml(inv.customer || '')}</td>`;
      html += `<td>${escHtml(inv.salesName || '')}</td>`;
      html += `<td>${escHtml(currency)}</td>`;
      html += `<td>${rest.toFixed(2)} ${escHtml(currency)}</td>`;
      html += '</tr>';
    }
    
    html += '<tr class="summary"><td colspan="9">📊 TOTAL</td><td colspan="5"></td><td>TOTAL</td></tr>';
    html += '</table><br>';
  }
  
  html += '</body></html>';
  
  const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'DailyTrips_' + activeDate.replace(/\//g, '-').replace(/\s/g, '_') + '.xls';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function printSelectedTrips() {
  closeTripDropdown('printDropdown');
  if (!allInvoices.length) { showAlert('لا توجد بيانات للطباعة', '⚠️'); return; }
  
  const selectedTrips = printSelectedTripsSet.size > 0 ? Array.from(printSelectedTripsSet) : Object.keys(groupedTrips);
  const filteredGroups = {};
  selectedTrips.forEach(tripName => {
    if (groupedTrips[tripName]) filteredGroups[tripName] = groupedTrips[tripName];
  });
  if (Object.keys(filteredGroups).length === 0) { showAlert('لم يتم اختيار أي رحلة', '⚠️'); return; }
  
  const contentEl = document.getElementById('content');
  const originalContent = contentEl.innerHTML;
  const tripItemsMap = window._tripItemsMap || {};
  const filteredTripItems = {};
  selectedTrips.forEach(tripName => {
    if (tripItemsMap[tripName]) filteredTripItems[tripName] = tripItemsMap[tripName];
  });
  
  renderTrips(filteredGroups, filteredTripItems);
  
  const printStyle = document.createElement('style');
  printStyle.id = 'print-landscape-temp';
  printStyle.innerHTML = '@page { size: A4 landscape; margin: 5mm; }';
  document.head.appendChild(printStyle);
  
  setTimeout(() => {
    window.print();
    setTimeout(() => {
      contentEl.innerHTML = originalContent;
      const styleEl = document.getElementById('print-landscape-temp');
      if (styleEl) styleEl.remove();
    }, 500);
  }, 200);
}

// ============================================================
async function applySearch() {
  const searchTerm = document.getElementById('filterSearch').value.trim().toLowerCase();
  let filtered = allInvoices;
  
  if (searchTerm) {
    filtered = allInvoices.filter(inv => {
      const fields = [inv.voucherNo, inv.guestName, inv.hotel, inv.roomNo, inv.contactNo, inv.nationality, inv.supplier, inv.customer, inv.notes];
      return fields.some(f => String(f || '').toLowerCase().includes(searchTerm));
    });
  }
  
  groupedTrips = groupByTrip(filtered);
  summaryData = calculateSummary(groupedTrips);
  const uniqueTrips = Object.keys(groupedTrips);
  const tripItemsMap = await fetchTripItemsForTrips(uniqueTrips);
  
  window._tripItemsMap = tripItemsMap;
  renderTrips(groupedTrips, tripItemsMap);
  renderSummary(summaryData);
  
  await buildBeneficiaries();
  renderBeneficiaries();
  renderManager();
}

async function loadBranches() {
  try {
    const branches = await gas('getActiveBranches');
    if (Array.isArray(branches)) {
      const select = document.getElementById('filterBranch');
      branches.forEach(b => {
        if (b.centerName === currentUser?.centerName) {
          const opt = document.createElement('option');
          opt.value = b.name;
          opt.textContent = b.name;
          select.appendChild(opt);
        }
      });
    }
  } catch(e) {
    console.warn('loadBranches error:', e);
  }
}

// 📄 handlePDFView — عرض أو إنشاء PDF بذكاء
// ═══════════════════════════════════════════════════════════════════
async function handlePDFView(voucherNo) {
  const invoice = allInvoices.find(i => i.voucherNo === voucherNo);
  if (!invoice) {
    showAlert('❌ الفاتورة غير موجودة', '❌');
    return;
  }

  // 1. إذا كان الرابط موجوداً → افتحه
  if (invoice.invoicePdf && invoice.invoicePdf.startsWith('http')) {
    window.open(invoice.invoicePdf, '_blank');
    return;
  }

  // 2. إذا لم يكن موجوداً → أعد إنشاءه
  showAlert('⏳ جاري إنشاء ملف PDF...', '⏳');
  
  try {
    const result = await gas('regenerateInvoicePDF', {
      voucherNo: voucherNo,
      centerName: currentUser?.centerName
    });

    if (result?.success && result.url) {
      // تحديث الرابط محلياً
      invoice.invoicePdf = result.url;
      
      // فتح الملف الجديد
      window.open(result.url, '_blank');
      
      // إغلاق رسالة الانتظار (إعادة استخدام showAlert)
      closeAlert();
      
      // إعادة رسم الجدول لتحديث حالة الزر
      renderTrips(groupedTrips, window._tripItemsMap || {});
      
    } else {
      showAlert('❌ فشل إنشاء PDF: ' + (result?.message || 'خطأ غير معروف'), '❌');
    }
  } catch(e) {
    console.error('❌ handlePDFView error:', e);
    showAlert('❌ خطأ: ' + e.message, '❌');
  }
}
