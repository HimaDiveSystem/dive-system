<!DOCTYPE html>
<html dir="ltr">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="theme-color" content="#1e2b4f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes">
  <title>Daily Trips Report</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="ui.js"></script>
  <script src="config.js"></script>
  <script src="session.js"></script>

  <style>
    :root{
      --navy:#0f1f3d;--navy2:#1a3260;--gold:#f5c842;--gold2:#e6b800;
      --blue:#2563eb;--green:#16a34a;--red:#dc2626;--orange:#ea580c;
      --bg:#f0f4f8;--card:#fff;--border:#dde4f0;--text:#1a2540;--text-lt:#5a6a8a;
      --gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-500:#64748b;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:15px;}

    /* ===== Header ===== */
    .header{
      background:linear-gradient(135deg,var(--navy),var(--navy2));
      color:white;padding:12px 22px;
      display:flex;justify-content:space-between;align-items:center;
      flex-wrap:wrap;gap:12px;border-radius:14px 14px 0 0;
      box-shadow:0 4px 16px rgba(15,31,61,.2);
    }
    .header h2{color:var(--gold);font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px;}
    .header-right{display:flex;align-items:center;gap:8px;}
    .user-chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:40px;padding:4px 13px;color:white;font-size:12px;font-weight:600;}
    .back-btn{background:transparent;border:2px solid rgba(255,255,255,.3);color:white;padding:5px 14px;border-radius:40px;cursor:pointer;font-weight:700;font-size:12px;font-family:'Cairo',sans-serif;transition:all .2s;}
    .back-btn:hover{border-color:var(--gold);color:var(--gold);}

    /* ===== Filter Bar ===== */
    .filter-bar{
      background:white;border:2px solid var(--border);border-top:none;
      padding:14px 20px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;
    }
    .fg{display:flex;flex-direction:column;gap:4px;}
    .fg label{font-size:11px;font-weight:700;color:var(--text-lt);text-transform:uppercase;letter-spacing:.4px;}
    .fc{padding:8px 12px;border:2px solid var(--border);border-radius:10px;font-size:13px;font-family:'Cairo',sans-serif;background:white;min-height:38px;}
    .fc:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.1);}
    .btn{padding:9px 20px;border:none;border-radius:24px;font-weight:700;font-size:12px;cursor:pointer;font-family:'Cairo',sans-serif;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
    .btn:hover{transform:translateY(-1px);}
    .btn-go{background:var(--navy);color:var(--gold);}
    .btn-go:hover{background:var(--navy2);}
    .btn-reset{background:#f1f5f9;color:var(--text);}
    .btn-export{background:var(--green);color:white;}
    .btn-print{background:var(--orange);color:white;}

    /* ===== Summary Strip ===== */
    .summary-strip{
      background:linear-gradient(135deg,#eef2f8,#e0e8f3);
      border:2px solid var(--border);border-top:none;
      padding:14px 20px;
      display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;
    }
    .sum-item{
      background:white;border-radius:12px;padding:12px 14px;text-align:center;
      border:1px solid var(--border);box-shadow:0 2px 6px rgba(15,31,61,.05);
    }
    .sum-item .lbl{font-size:11px;color:var(--text-lt);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;}
    .sum-item .val{font-size:22px;font-weight:900;color:var(--navy);}

    /* ===== Content ===== */
    .content{padding:16px 0;}
    .loader-wrap{text-align:center;padding:60px 20px;color:var(--text-lt);}
    .spinner{width:36px;height:36px;border:4px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .no-data{text-align:center;padding:50px;color:var(--text-lt);font-size:14px;background:white;border-radius:12px;border:2px dashed var(--border);}

    /* ===== Trip Card ===== */
    .trip-card{
      background:white;border-radius:14px;overflow:hidden;
      margin-bottom:18px;box-shadow:0 4px 14px rgba(15,31,61,.08);
      border:1px solid var(--border);
    }
    .trip-header{
      background:linear-gradient(135deg,var(--navy),var(--navy2));
      color:var(--gold);padding:14px 20px;
      display:flex;justify-content:space-between;align-items:center;
      flex-wrap:wrap;gap:10px;
    }
    .trip-header .trip-title{
      font-size:16px;font-weight:900;display:flex;align-items:center;gap:10px;
    }
    .trip-header .trip-icon{
      background:rgba(245,200,66,.2);border-radius:8px;padding:4px 9px;font-size:16px;
    }
    .trip-header .trip-stats{
      display:flex;gap:14px;flex-wrap:wrap;
    }
    .trip-header .stat{
      background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
      padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;color:white;
    }
    .trip-header .stat .n{color:var(--gold);font-weight:900;margin-left:4px;}

    /* ===== Table ===== */
    .tbl-scroll{overflow-x:auto;max-width:100%;}
    .tbl{width:100%;border-collapse:collapse;font-size:11.5px;min-width:1200px;}
    .tbl thead th{
      background:var(--navy2);color:var(--gold);
      padding:9px 7px;font-size:11px;font-weight:700;
      text-align:center;white-space:nowrap;
      border-right:1px solid rgba(255,255,255,.08);
    }
    .tbl thead th:first-child{text-align:left;padding-left:14px;}
    .tbl tbody td{
      padding:7px 6px;text-align:center;
      border-bottom:1px solid #eef2f9;
      color:var(--text);
      white-space:nowrap;
      vertical-align:middle;
    }
    .tbl tbody td:first-child{text-align:left;padding-left:14px;}
    .tbl tbody tr:hover{background:#f5f9ff;}
    .tbl tfoot td{
      background:#dbeafe;color:var(--navy);
      border-top:2px solid var(--navy);border-bottom:2px solid var(--navy);
      padding:10px 7px;font-size:11.5px;font-weight:700;text-align:center;
    }
    .tbl tfoot td:first-child{text-align:left;padding-left:14px;}

    .vlink{color:var(--blue);font-weight:700;cursor:pointer;}
    .vlink:hover{text-decoration:underline;}
    .st-pending{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;background:#fef9c3;color:#854d0e;}
    .st-confirmed{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;background:#dcfce7;color:#166534;}
    .st-cancel{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;background:#fee2e2;color:#991b1b;}
    .st-refund{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;background:#fef3c7;color:#92400e;}
    .acts-cell{max-width:220px;white-space:normal;word-break:break-word;line-height:1.3;text-align:left;font-size:11px;}
    .amt{font-family:monospace;}
    .num-col{color:var(--navy);font-weight:700;}
    .zero-col{color:#cbd5e1;}

    /* ===== Modal ===== */
    .a-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(3px);}
    .a-modal.open{display:flex;}
    .a-box{background:white;width:90%;max-width:340px;border-radius:20px;padding:24px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.3);}
    .a-icon{font-size:44px;margin-bottom:12px;}
    .a-msg{color:var(--navy);font-size:14px;font-weight:700;margin-bottom:18px;white-space:pre-wrap;line-height:1.6;}
    .a-btn{padding:9px 24px;border:none;border-radius:30px;background:var(--navy);color:var(--gold);font-weight:700;font-size:13px;cursor:pointer;font-family:'Cairo',sans-serif;}
      .pdf-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:6px;
  background:var(--orange);color:white;
  text-decoration:none;font-size:12px;
  transition:all .2s;
}
.pdf-btn:hover{background:#c2410c;transform:scale(1.1);}
.pdf-btn.disabled{background:#cbd5e1;cursor:not-allowed;}
    .tbl td.acts-cell{
  max-width:200px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  text-align:left;
  font-size:10px;
}
    /* ===== Footer ===== */
    .footer{text-align:center;padding:16px 0 6px;color:#94a3b8;font-size:11px;border-top:1px solid #e2e8f0;margin-top:20px;}
/* ===== Print ===== */
@page {
  size: A4 landscape;  /* ✅ وضعية أفقية */
  margin: 5mm;
}

@media print {
  body{background:white;padding:0;}
  .header,.filter-bar,.summary-strip,.footer,.no-print{display:none !important;}
  .trip-card{box-shadow:none;border:1px solid #ccc;page-break-inside:avoid;margin-bottom:14px;}
  .tbl thead th{background:#1a3260 !important;color:#f5c842 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .trip-header{background:#1a3260 !important;color:#f5c842 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  
  /* ✅ تحسين الطباعة */
  .tbl{font-size:9px !important;min-width:auto !important;}
  .tbl thead th{padding:5px 3px !important;font-size:9px !important;}
  .tbl tbody td{padding:4px 3px !important;font-size:9px !important;}
  .tbl tfoot td{padding:5px 3px !important;font-size:9px !important;}
  .trip-card{page-break-inside:auto;}
}
    
    @media(max-width:640px){
      .filter-bar{flex-direction:column;align-items:stretch;}
      .fg{width:100%;}
      .fc{width:100%;}
      .btn{width:100%;justify-content:center;}
      body{padding:8px;}
    }
  </style>
</head>
<body>

<!-- ===== Header ===== -->
<div class="header">
  <h2>📅 Daily Trips Report</h2>
  <div class="header-right">
    <span class="user-chip" id="userNameDisplay">...</span>
    <button class="back-btn" onclick="goBack()">← Back</button>
  </div>
</div>

<!-- ===== Filter Bar ===== -->
<div class="filter-bar no-print">
  <div class="fg">
    <label>📅 Active Date</label>
    <input type="date" class="fc" id="filterDate" onchange="loadReport()">
  </div>

  <div class="fg">
    <label>🏢 Branch</label>
    <select class="fc" id="filterBranch" onchange="loadReport()">
      <option value="">All Branches</option>
    </select>
  </div>

  <div class="fg">
    <label>🔍 Search</label>
    <input type="text" class="fc" id="filterSearch" placeholder="Voucher / Guest / Hotel..." oninput="applySearch()">
  </div>

  <button class="btn btn-go" onclick="loadReport()">📊 Show Report</button>
  <button class="btn btn-reset" onclick="resetFilters()">🔄 Reset</button>
  <button class="btn btn-export" onclick="exportToExcel()">📎 Export Excel</button>
  <button class="btn btn-print" onclick="window.print()">🖨️ Print</button>
</div>

<!-- ===== Summary Strip ===== -->
<div class="summary-strip no-print" id="summaryStrip" style="display:none;">
  <div class="sum-item"><div class="lbl">Total Trips</div><div class="val" id="sumTrips">0</div></div>
  <div class="sum-item"><div class="lbl">Total Bookings</div><div class="val" id="sumBookings">0</div></div>
  <div class="sum-item"><div class="lbl">Total Rest</div><div class="val" id="sumRest">0</div></div>
</div>

<!-- ===== Content ===== -->
<div class="content" id="content">
  <div class="loader-wrap"><div class="spinner"></div>Loading...</div>
</div>

<!-- ===== Footer ===== -->
<div class="footer">
  <span>© 2025 <strong style="color:#1e2b4f;">🌊 Dive System</strong> — جميع الحقوق محفوظة</span>
</div>

<!-- ===== Modal ===== -->
<div id="alertModal" class="a-modal">
  <div class="a-box">
    <div class="a-icon" id="aIcon">ℹ️</div>
    <div class="a-msg" id="aMsg"></div>
    <button class="a-btn" onclick="closeAlert()">OK</button>
  </div>
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DASH = CONFIG.DASHBOARD_PAGES || {
  Admin: 'Dashboard.html',
  Owner: 'OwnerDashboard.html',
  Sales: 'SalesDashboard.html',
  Accountant: 'AccountantDashboard.html',
  Customer: 'CustomerDashboard.html'
};
const ALLOWED = ['Admin','Owner','Sales','Accountant','FinancialManager','CenterManager','BranchManager','OperationsManager'];

let currentUser = null;
let allInvoices = [];
let groupedTrips = {};  // { tripName: [invoices] }
let summaryData = {};

// ============================================================
// SESSION CHECK
// ============================================================
if (typeof Session !== 'undefined' && Session.checkValidity) {
  if (!Session.checkValidity()) {
    throw new Error('جلسة غير صالحة');
  }
}

// ============================================================
// JSONP
// ============================================================
function gas(action, params = {}) {
  return new Promise((resolve, reject) => {
    const user = Session.getUser();
    if (user && user.centerName && !params.centerName) {
      params.centerName = user.centerName;
    }
    if (user && user.centerId && !params.centerId) {
      params.centerId = user.centerId;
    }
    
    const callbackName = 'cb_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
    const url = new URL(CONFIG.GAS_URL);
    url.searchParams.set('action', action);
    url.searchParams.set('callback', callbackName);
    url.searchParams.set('_t', Date.now());
    
    Object.keys(params).forEach(key => {
      if (params[key] !== undefined && params[key] !== null && params[key] !== '') {
        if (typeof params[key] === 'object') {
          url.searchParams.set(key, JSON.stringify(params[key]));
        } else {
          url.searchParams.set(key, String(params[key]));
        }
      }
    });
    
    window[callbackName] = function(data) {
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
      resolve(data);
    };
    
    const script = document.createElement('script');
    script.src = url.toString();
    script.onerror = function() {
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
      reject(new Error('JSONP failed: ' + action));
    };
    
    document.body.appendChild(script);
    
    setTimeout(() => {
      if (window[callbackName]) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        reject(new Error('Timeout: ' + action));
      }
    }, 45000);
  });
}

// ============================================================
// UTILITIES
// ============================================================
function escHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function fmtTime(t) {
  if (!t) return '';
  const m = String(t).match(/(\d{1,2}):(\d{2})/);
  return m ? String(m[1]).padStart(2,'0') + ':' + m[2] : String(t).substring(0,5);
}
// ✅ تحويل رقم الهاتف إلى نص صريح (لمنع Excel/Sheets من تحويله لصيغة علمية)
function formatPhoneAsText(phone) {
  if (!phone) return '';
  // ✅ إزالة علامة = من البداية إن وجدت
  let p = String(phone).replace(/^=/, '').trim();
  // ✅ إزالة أي أحرف غير رقمية و +
  p = p.replace(/[^\d+]/g, '');
  return p;
}
function safeNum(val) {
  const num = parseFloat(val);
  return (num !== 0 && !isNaN(num)) ? num : '';
}

function safeVal(val) {
  return (val !== undefined && val !== null && val !== '') ? val : '';
}

function formatPhoneNumber(phone) {
  if (!phone) return '';
  let p = String(phone).trim();
  if (p.startsWith('00')) p = '+' + p.substring(2);
  else if (p.startsWith('0')) p = '+20' + p.substring(1);
  else if (!p.startsWith('+')) p = '+' + p;
  return p;
}

function showAlert(msg, icon) {
  document.getElementById('aMsg').textContent = msg;
  document.getElementById('aIcon').textContent = icon || 'ℹ️';
  document.getElementById('alertModal').classList.add('open');
}
function closeAlert() {
  document.getElementById('alertModal').classList.remove('open');
}

function goBack() {
  if (currentUser) Session.save(currentUser);
  window.location.href = DASH[currentUser?.type] || 'AccountantDashboard.html';
}
// ✅ جلب بنود الرحلة من TripDefinitions
async function getTripItems(tripName, centerName) {
  try {
    const result = await gas('getTripItemsByName', {
      tripName: tripName,
      centerName: centerName
    });
    return Array.isArray(result) ? result : [];
  } catch(e) {
    console.error('getTripItems error:', e);
    return [];
  }
}
// ============================================================
// LOAD REPORT
// ============================================================
async function loadReport() {
  const dateStr = document.getElementById('filterDate').value;
  if (!dateStr) {
    showAlert('الرجاء اختيار التاريخ', '⚠️');
    return;
  }
  
  // تحويل yyyy-mm-dd إلى dd/MMM/yyyy
  const [y, m, d] = dateStr.split('-');
  const activeDate = String(d).padStart(2,'0') + '/' + MN[+m - 1] + '/' + y;
  
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loader-wrap"><div class="spinner"></div>جاري التحميل...</div>';
  document.getElementById('summaryStrip').style.display = 'none';
  
  try {
    // ✅ استخدام دالة getInvoicesByDate لجلب فواتير التاريخ فقط (سريع!)
    const invoices = await gas('getInvoicesByDate', {
      dateStr: activeDate,
      centerName: currentUser?.centerName || '',
      branchName: document.getElementById('filterBranch').value || ''
    });
    
    if (!Array.isArray(invoices) || !invoices.length) {
      content.innerHTML = '<div class="no-data">🚫 لا توجد رحلات في هذا التاريخ</div>';
      return;
    }
    
    allInvoices = invoices;
    
    // ✅ تطبيق الفلتر على البحث (إن وجد)
    const searchTerm = document.getElementById('filterSearch').value.trim().toLowerCase();
    let filtered = invoices;
    if (searchTerm) {
      filtered = invoices.filter(inv => {
        const fields = [
          inv.voucherNo, inv.guestName, inv.hotel, inv.roomNo,
          inv.contactNo, inv.nationality, inv.supplier, inv.customer,
          inv.notes
        ];
        return fields.some(f => String(f || '').toLowerCase().includes(searchTerm));
      });
    }
    
    // ✅ تجميع حسب الرحلة
    groupedTrips = groupByTrip(filtered);
    
    // ✅ ✅ ✅ جلب بنود جميع الرحلات مسبقاً
    const uniqueTrips = Object.keys(groupedTrips);
    console.log(`📋 جلب بنود ${uniqueTrips.length} رحلة...`);
    
    const tripItemsMap = {};
    await Promise.all(uniqueTrips.map(async (tripName) => {
      try {
        // داخل loadReport
const items = await getTripItems(tripName, currentUser?.centerName || '');
        tripItemsMap[tripName] = Array.isArray(items) ? items : [];
        console.log(`  ✅ ${tripName}: ${tripItemsMap[tripName].length} بند`);
      } catch(e) {
        console.error(`  ❌ فشل جلب بنود ${tripName}:`, e);
        tripItemsMap[tripName] = [];
      }
    }));
    
    // ✅ حساب الإحصائيات
    summaryData = calculateSummary(groupedTrips);
    
    // ✅ عرض - تمرير tripItemsMap
    renderTrips(groupedTrips, tripItemsMap);
    renderSummary(summaryData);
    
  } catch(e) {
    console.error('loadReport error:', e);
    content.innerHTML = `<div class="no-data">❌ خطأ: ${escHtml(e.message)}</div>`;
  }
}

// ============================================================
// GROUP BY TRIP
// ============================================================
function groupByTrip(invoices) {
  const groups = {};
  
  for (const inv of invoices) {
    const tripName = (inv.trip || inv.Trip || 'Unassigned Trip').trim() || 'Unassigned Trip';
    
    if (!groups[tripName]) {
      groups[tripName] = [];
    }
    groups[tripName].push(inv);
  }
  
  // ✅ ترتيب الرحلات أبجدياً
  const sorted = {};
  Object.keys(groups).sort().forEach(tripName => {
    // ✅ ترتيب الفواتير داخل كل رحلة حسب الوقت
    sorted[tripName] = groups[tripName].sort((a, b) => {
      const ta = String(a.time || a.Time || '').trim();
      const tb = String(b.time || b.Time || '').trim();
      return ta.localeCompare(tb);
    });
  });
  
  return sorted;
}

// ============================================================
// CALCULATE SUMMARY
// ============================================================
function calculateSummary(groups) {
  const totalTrips = Object.keys(groups).length;
  let totalBookings = 0;
  let totalRest = 0;
  
  for (const tripName in groups) {
    const invoices = groups[tripName];
    totalBookings += invoices.length;
    
    for (const inv of invoices) {
      const rest = parseFloat(inv.rest) || 0;
      totalRest += rest;
    }
  }
  
  return {
    totalTrips: totalTrips,
    totalBookings: totalBookings,
    totalRest: totalRest.toFixed(2)
  };
}
// ============================================================
// RENDER SUMMARY
// ============================================================
function renderSummary(summary) {
  document.getElementById('sumTrips').textContent = summary.totalTrips;
  document.getElementById('sumBookings').textContent = summary.totalBookings;
  document.getElementById('sumRest').textContent = summary.totalRest;
  document.getElementById('summaryStrip').style.display = 'grid';
}

// ============================================================
// RENDER TRIPS
// ============================================================
function renderTrips(groups, tripItemsMap = {}) {
  const content = document.getElementById('content');
  
  if (!Object.keys(groups).length) {
    content.innerHTML = '<div class="no-data">🚫 لا توجد رحلات</div>';
    return;
  }
  
  let html = '';
  let tripIndex = 0;
  
  for (const tripName in groups) {
    tripIndex++;
    const invoices = groups[tripName];
    const tripItems = tripItemsMap[tripName] || [];
    html += renderTripCard(tripName, invoices, tripIndex, tripItems);
  }
  
  content.innerHTML = html;
}
// ============================================================
// RENDER TRIP CARD
// ============================================================
function renderTripCard(tripName, invoices, index, tripItems) {
  // ✅ 1. تحديد بنود الرحلة
  const itemNames = (Array.isArray(tripItems) && tripItems.length > 0) 
    ? tripItems 
    : ['Item1', 'Item2', 'Item3', 'Item4', 'Item5', 'Item6', 'Item7', 'Item8', 'Item9', 'Item10'];
  
  const quantityFields = [
    'sgl', 'dbl', 'trpl', 'extra', 'camel',
    'dinner', 'vipDinner', 'starGazing', 'privateTrip', 'privateTransfer'
  ];
  
  // ✅ 2. حساب إجماليات كل بند
  const itemTotals = {};
  for (let i = 0; i < itemNames.length && i < quantityFields.length; i++) {
    itemTotals[i] = invoices.reduce((sum, inv) => sum + (parseFloat(inv[quantityFields[i]]) || 0), 0);
  }
  
  let totalRest = invoices.reduce((sum, inv) => sum + (parseFloat(inv.rest) || 0), 0);
  
  // ✅ 3. رؤوس الأعمدة
  let itemsHeaders = '';
  for (let i = 0; i < itemNames.length && i < 10; i++) {
    itemsHeaders += `<th>${escHtml(itemNames[i])}</th>`;
  }
  
  // ✅ 4. بناء البطاقة
  let html = `
    <div class="trip-card">
      <div class="trip-header">
        <div class="trip-title">
          <span class="trip-icon">🏝️</span>
          <span>${index}. ${escHtml(tripName)}</span>
        </div>
        <div class="trip-stats">
          <span class="stat">📋 Bookings: <span class="n">${invoices.length}</span></span>
          <span class="stat">💰 Rest: <span class="n">${totalRest.toFixed(2)}</span></span>
        </div>
      </div>
      <div class="tbl-scroll">
        <table class="tbl">
          <thead>
            <tr>
              <th>#</th>
              <th>Voucher</th>
              <th>Time</th>
              <th>Guest Name</th>
              <th>Nationality</th>
              <th>Hotel / Room</th>
              <th>Contact</th>
              ${itemsHeaders}
              <th>Activities</th>
              <th>Supplier</th>
              <th>Customer</th>
              <th>Sales Name</th>
              <th>Currency</th>
              <th>Rest</th>
              <th>State</th>
              <th class="no-print">PDF</th>
            </tr>
          </thead>
          <tbody>
  `;
  
  // ✅ 5. صفوف الفواتير
  invoices.forEach((inv, idx) => {
    const rest = parseFloat(inv.rest) || 0;
    const currency = (inv.invoiceCurrency || '').trim();
    const state = (inv.state || '').toLowerCase();
    const activitiesText = inv.activitiesText || '';
    
    let stateClass = 'st-pending';
    let stateLabel = '⏳ Pending';
    if (state === 'confirmed') { stateClass = 'st-confirmed'; stateLabel = '✅ Confirmed'; }
    else if (state === 'cancel') { stateClass = 'st-cancel'; stateLabel = '❌ Cancel'; }
    else if (state === 'refund') { stateClass = 'st-refund'; stateLabel = '💰 Refund'; }
    
    const restClass = rest > 0 ? 'num-col' : 'zero-col';
    const restDisplay = rest > 0 ? rest.toFixed(2) + ' ' + currency : '✓';
    
    // ✅ بنود الرحلة
    let itemsCells = '';
    for (let i = 0; i < itemNames.length && i < quantityFields.length; i++) {
      const qty = parseFloat(inv[quantityFields[i]]) || 0;
      itemsCells += `<td>${qty > 0 ? qty : '—'}</td>`;
    }
    
    // ✅ PDF Button
    const pdfBtn = (inv.invoicePdf && inv.invoicePdf.startsWith('http'))
      ? `<a href="${escHtml(inv.invoicePdf)}" target="_blank" class="pdf-btn" title="Open PDF">📄</a>`
      : `<span class="pdf-btn disabled" title="No PDF">—</span>`;
    
    html += `
      <tr>
        <td>${idx + 1}</td>
        <td><span class="vlink">${escHtml(inv.voucherNo || '')}</span></td>
        <td>${escHtml(fmtTime(inv.time || ''))}</td>
        <td>${escHtml(inv.guestName || '—')}</td>
        <td>${escHtml(inv.nationality || '—')}</td>
        <td>${escHtml(inv.hotel || '—')} / ${escHtml(inv.roomNo || '—')}</td>
        <td class="phone-cell">${escHtml(formatPhoneAsText(inv.contactNo || ''))}</td>
        ${itemsCells}
        <td class="acts-cell" title="${escHtml(activitiesText)}">
          ${escHtml(activitiesText.substring(0, 60))}${activitiesText.length > 60 ? '...' : ''}
        </td>
        <td>${escHtml(inv.supplier || '—')}</td>
        <td>${escHtml(inv.customer || '—')}</td>
        <td>${escHtml(inv.salesName || '—')}</td>
        <td>${escHtml(currency)}</td>
        <td class="${restClass}">${restDisplay}</td>
        <td><span class="${stateClass}">${stateLabel}</span></td>
        <td class="no-print">${pdfBtn}</td>
      </tr>
    `;
  });
  
  // ✅ 6. صف الإجماليات
  let totalsCells = '';
  for (let i = 0; i < itemNames.length && i < quantityFields.length; i++) {
    totalsCells += `<td>${itemTotals[i] || 0}</td>`;
  }
  
  html += `
          </tbody>
          <tfoot>
            <tr>
              <td colspan="7">📊 TOTAL (${invoices.length} Bookings)</td>
              ${totalsCells}
              <td colspan="7"></td>
              <td>${totalRest.toFixed(2)}</td>
              <td></td>
              <td class="no-print"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  `;
  
  return html;
}
// ============================================================
// APPLY SEARCH
// ============================================================
async function applySearch() {
  // إعادة الفلترة من allInvoices
  const searchTerm = document.getElementById('filterSearch').value.trim().toLowerCase();
  let filtered = allInvoices;
  
  if (searchTerm) {
    filtered = allInvoices.filter(inv => {
      const fields = [
        inv.voucherNo, inv.guestName, inv.hotel, inv.roomNo,
        inv.contactNo, inv.nationality, inv.supplier, inv.customer,
        inv.notes
      ];
      return fields.some(f => String(f || '').toLowerCase().includes(searchTerm));
    });
  }
  
  groupedTrips = groupByTrip(filtered);
  summaryData = calculateSummary(groupedTrips);
  
  // ✅ جلب بنود الرحلات
  const uniqueTrips = Object.keys(groupedTrips);
  const tripItemsMap = {};
  await Promise.all(uniqueTrips.map(async (tripName) => {
    try {
      const items = await gas('getTripItemsByName', {
        tripName: tripName,
        centerName: currentUser?.centerName || ''
      });
      tripItemsMap[tripName] = Array.isArray(items) ? items : [];
    } catch(e) {
      tripItemsMap[tripName] = [];
    }
  }));
  
  renderTrips(groupedTrips, tripItemsMap);
  renderSummary(summaryData);
}
// ============================================================
// RESET FILTERS
// ============================================================
function resetFilters() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('filterDate').value = today;
  document.getElementById('filterBranch').value = '';
  document.getElementById('filterSearch').value = '';
  loadReport();
}

// ============================================================
// EXPORT TO EXCEL
// ============================================================
async function exportToExcel() {
  if (!allInvoices.length) {
    showAlert('لا توجد بيانات للتصدير', '⚠️');
    return;
  }
  
  const dateStr = document.getElementById('filterDate').value;
  const [y, m, d] = dateStr.split('-');
  const activeDate = String(d).padStart(2,'0') + '/' + MN[+m - 1] + '/' + y;
  
  // ✅ جلب بنود الرحلات
  const uniqueTrips = Object.keys(groupedTrips);
  const tripItemsMap = {};
  await Promise.all(uniqueTrips.map(async (tripName) => {
    try {
      const items = await gas('getTripItemsByName', {
        tripName: tripName,
        centerName: currentUser?.centerName || ''
      });
      tripItemsMap[tripName] = Array.isArray(items) ? items : [];
    } catch(e) {
      tripItemsMap[tripName] = [];
    }
  }));
  
  const quantityFields = ['sgl','dbl','trpl','extra','camel','dinner','vipDinner','starGazing','privateTrip','privateTransfer'];
  
  let html = `
    <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">
    <head>
      <meta charset="UTF-8">
      <style>
        th{background:#1a3260;color:#f5c842;padding:8px;border:1px solid #ccc;font-weight:bold;}
        td{padding:6px;border:1px solid #ccc;}
        .trip-title{background:#0f1f3d;color:#f5c842;font-size:16px;font-weight:bold;padding:12px;text-align:center;}
        .summary{background:#dbeafe;font-weight:bold;}
      </style>
    </head>
    <body>
      <h2 style="text-align:center;">📅 Daily Trips Report - ${activeDate}</h2>
      <p style="text-align:center;">Center: ${escHtml(currentUser?.centerName || '')}</p>
      <p style="text-align:center;">Total Trips: ${summaryData.totalTrips} | Total Bookings: ${summaryData.totalBookings} | Total Rest: ${summaryData.totalRest}</p>
  `;
  
  for (const tripName in groupedTrips) {
    const invoices = groupedTrips[tripName];
    const itemNames = tripItemsMap[tripName] || [];
    
    // ✅ رؤوس البنود الديناميكية
    let itemsHeaders = '';
    for (let i = 0; i < itemNames.length && i < 10; i++) {
      itemsHeaders += `<th>${escHtml(itemNames[i])}</th>`;
    }
    
    // ✅ إجماليات البنود
    const itemTotals = {};
    for (let i = 0; i < itemNames.length && i < quantityFields.length; i++) {
      itemTotals[i] = invoices.reduce((sum, inv) => sum + (parseFloat(inv[quantityFields[i]]) || 0), 0);
    }
    
    let tripRest = invoices.reduce((sum, inv) => sum + (parseFloat(inv.rest) || 0), 0);
    
    html += `
      <table border="1">
        <tr><td colspan="${8 + itemNames.length + 3}" class="trip-title">🏝️ ${escHtml(tripName)} (${invoices.length} Bookings)</td></tr>
        <tr>
          <th>#</th><th>Voucher</th><th>Time</th><th>Guest Name</th><th>Nationality</th>
          <th>Hotel</th><th>Room</th><th>Contact</th>
          ${itemsHeaders}
          <th>Supplier</th><th>Customer</th><th>Rest</th>
        </tr>
    `;
    
    invoices.forEach((inv, idx) => {
      let itemsCells = '';
      for (let i = 0; i < itemNames.length && i < quantityFields.length; i++) {
        const qty = parseFloat(inv[quantityFields[i]]) || 0;
        itemsCells += `<td>${qty > 0 ? qty : ''}</td>`;
      }
      const rest = parseFloat(inv.rest) || 0;
      const currency = (inv.invoiceCurrency || '').trim();
      
      html += `
        <tr>
          <td>${idx + 1}</td>
          <td>${escHtml(inv.voucherNo || '')}</td>
          <td>${escHtml(fmtTime(inv.time || ''))}</td>
          <td>${escHtml(inv.guestName || '')}</td>
          <td>${escHtml(inv.nationality || '')}</td>
          <td>${escHtml(inv.hotel || '')}</td>
          <td>${escHtml(inv.roomNo || '')}</td>
          <td>${escHtml(formatPhoneNumber(inv.contactNo || ''))}</td>
          ${itemsCells}
          <td>${escHtml(inv.supplier || '')}</td>
          <td>${escHtml(inv.customer || '')}</td>
          <td>${rest.toFixed(2)} ${escHtml(currency)}</td>
        </tr>
      `;
    });
    
    // ✅ صف الإجماليات
    let totalsCells = '';
    for (let i = 0; i < itemNames.length && i < quantityFields.length; i++) {
      totalsCells += `<td>${itemTotals[i] || 0}</td>`;
    }
    
    html += `
        <tr class="summary">
          <td colspan="8">TOTAL</td>
          ${totalsCells}
          <td colspan="2"></td>
          <td>${tripRest.toFixed(2)}</td>
        </tr>
      </table>
      <br>
    `;
  }
  
  html += '</body></html>';
  
  const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `DailyTrips_${activeDate.replace(/\//g, '-')}.xls`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ============================================================
// LOAD BRANCHES
// ============================================================
async function loadBranches() {
  try {
    const branches = await gas('getActiveBranches');
    if (Array.isArray(branches)) {
      const select = document.getElementById('filterBranch');
      branches.forEach(b => {
        if (b.centerName === currentUser?.centerName) {
          const opt = document.createElement('option');
          opt.value = b.name;
          opt.textContent = b.name;
          select.appendChild(opt);
        }
      });
    }
  } catch(e) {
    console.warn('loadBranches error:', e);
  }
}

// ============================================================
// INITIALIZATION
// ============================================================
document.addEventListener('DOMContentLoaded', async function() {
  // تطبيق الثيم
  if (typeof Theme !== 'undefined' && Theme.applyToPage) {
    Theme.applyToPage();
    Theme.setPageTitle('Daily Trips Report');
  }
  
  // التحقق من الجلسة
  if (!Session.checkValidity()) {
    location.href = 'index.html';
    return;
  }
  
  currentUser = Session.getUser();
  if (!currentUser) {
    location.href = 'index.html';
    return;
  }
  
  // التحقق من الصلاحية
  if (!ALLOWED.includes(currentUser.type)) {
    showAlert('ليس لديك صلاحية لعرض هذا التقرير', '🚫');
    setTimeout(() => location.href = DASH[currentUser.type] || 'Dashboard.html', 2000);
    return;
  }
  
  // عرض اسم المستخدم
  document.getElementById('userNameDisplay').textContent = currentUser.name || 'User';
  
  // تعيين التاريخ الافتراضي (اليوم)
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('filterDate').value = today;
  
  // تحميل الفروع
  await loadBranches();
  
  // تحميل التقرير
  await loadReport();
});

// ============================================================
// KEYBOARD SHORTCUTS
// ============================================================
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && e.target.id === 'filterSearch') {
    applySearch();
  }
  if (e.key === 'Escape') {
    closeAlert();
  }
});
