<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes">
  <title>💰 المصروفات والإيرادات 🌊 | Dive System</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- ====== IMPORT CONFIG & SESSION & UI ====== -->
  <script src="config.js"></script>
  <script src="session.js"></script>
  <script src="ui.js"></script>

  <style>
    /* ====== المتغيرات الموحدة ====== */
    :root {
      --color-primary: #132a4a;
      --color-primary-dark: #0c1c30;
      --color-primary-light: #1f3f6b;
      --color-secondary: #f2b632;
      --color-secondary-light: #ffd873;
      --color-teal: #159895;
      --color-success: #16a34a;
      --color-success-dark: #0e7a37;
      --color-danger: #e0403a;
      --color-danger-dark: #b91c1c;
      --color-warning: #f59e0b;
      --color-info: #2f8fd9;
      --color-bg: #eef4fb;
      --color-card: #ffffff;
      --color-text: #16233c;
      --color-text-light: #6b7893;
      --color-border: #e3ebf5;
      --radius-lg: 16px;
      --radius-md: 10px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 3px rgba(19,42,74,0.06);
      --shadow-md: 0 6px 20px rgba(19,42,74,0.10);
      --shadow-lg: 0 10px 32px rgba(19,42,74,0.16);
      --font-primary: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-primary); }
    html { scroll-behavior: smooth; }
    body {
      background: var(--color-bg);
      min-height: 100vh;
      color: var(--color-text);
      font-size: 15px;
    }

    ::selection { background: var(--color-secondary-light); color: var(--color-primary-dark); }

    /* ── Main Content ── */
    .main-content {
      max-width: 1500px;
      margin: 0 auto;
      padding: 18px 20px 30px;
    }

    /* ====== HEADER ====== */
    .header {
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
      color: white;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-radius: var(--radius-lg);
      margin-bottom: 16px;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }
    .header::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 90% -20%, rgba(21,152,149,0.35), transparent 60%);
      pointer-events: none;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }
    .header-left h2 {
      color: var(--color-secondary);
      font-size: 20px;
      font-weight: 900;
      margin: 0;
      letter-spacing: .2px;
    }
    .info-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: rgba(255,255,255,0.08);
      padding: 6px 14px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .info-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12.5px;
    }
    .info-label { color: #9fb3d1; }
    .info-value { color: var(--color-secondary); font-weight: 700; }
    .user-chip {
      background: rgba(255,255,255,0.16);
      border-radius: 30px;
      padding: 5px 12px;
      font-size: 12.5px;
      font-weight: 700;
    }

    /* ====== أزرار الشريط العلوي ====== */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }
    .header-btn {
      padding: 9px 18px;
      border: none;
      border-radius: 30px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      font-family: var(--font-primary);
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
    }
    .header-btn:hover { transform: translateY(-2px); filter: brightness(1.05); box-shadow: var(--shadow-md); }
    .header-btn:active { transform: translateY(0); }
    .header-btn-exp { background: var(--color-danger); color: white; }
    .header-btn-rev { background: var(--color-success); color: white; }
    .header-btn-cash { background: var(--color-secondary); color: var(--color-primary-dark); }
    .header-btn-excel { background: #1e7a4c; color: white; }
    .header-btn-gray { background: rgba(255,255,255,0.14); color: white; border: 1px solid rgba(255,255,255,0.22); }
    .header-btn-gray:hover { background: rgba(255,255,255,0.24); }
    .header-btn-active { background: var(--color-secondary); color: var(--color-primary-dark); }
    .back-btn {
      background: transparent;
      border: 2px solid rgba(255,255,255,.35);
      color: white;
      padding: 8px 18px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      font-family: var(--font-primary);
      transition: all .15s ease;
    }
    .back-btn:hover { border-color: var(--color-secondary); color: var(--color-secondary); transform: translateY(-2px); }

    /* ====== CARD BASE ====== */
    .card {
      background: var(--color-card);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--color-border);
    }
    .card-title {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--color-primary);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    /* ====== FILTERS BAR ====== */
    .filters-bar { }
    .filters-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .filter-group label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--color-text-light);
    }
    .filter-group input {
      padding: 8px 12px;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      width: 140px;
      font-family: var(--font-primary);
      height: 38px;
      background: #fbfcfe;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .filter-group input:focus {
      border-color: var(--color-info);
      outline: none;
      box-shadow: 0 0 0 3px rgba(47,143,217,0.15);
      background: white;
    }
    .search-group { flex: 1 1 200px; min-width: 160px; }
    .search-group input { width: 100%; }
    .filter-divider {
      width: 1px;
      align-self: stretch;
      background: var(--color-border);
      margin: 0 2px;
    }
    .btn-sm {
      padding: 9px 16px;
      border: none;
      border-radius: 30px;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
      font-family: var(--font-primary);
      transition: transform .15s ease, box-shadow .15s ease;
      height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn-sm:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
    .btn-primary-sm { background: var(--color-primary); color: var(--color-secondary); }
    .btn-gray-sm { background: #eef2f8; color: var(--color-text); border: 1px solid var(--color-border); }
    .btn-gray-sm:hover { background: #e3eaf5; }

    /* ====== EDIT BANNER ====== */
    .ebanner {
      background: linear-gradient(90deg, #fff6df, #fff1c7);
      border-radius: var(--radius-lg);
      padding: 12px 18px;
      display: none;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: #7a5b06;
      margin-bottom: 14px;
      border: 1.5px solid var(--color-secondary);
      box-shadow: var(--shadow-sm);
    }
    .ebanner.show { display: flex; }
    .ecancel {
      background: white;
      border: 1px solid #e7c766;
      cursor: pointer;
      color: #7a5b06;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      transition: all .15s ease;
    }
    .ecancel:hover { background: #fff3d6; }

    /* ====== DATA ROW ====== */
    .data-row-bar {
      display: flex;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 12px;
    }
    .data-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .data-field label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--color-text-light);
    }
    .data-field .fc {
      padding: 9px 12px;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      height: 40px;
      font-family: var(--font-primary);
      background: #fbfcfe;
      width: 100%;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .data-field .fc:focus {
      border-color: var(--color-info);
      outline: none;
      box-shadow: 0 0 0 3px rgba(47,143,217,0.15);
      background: white;
    }
    .data-field .fc.err { border-color: var(--color-danger); box-shadow: 0 0 0 3px rgba(224,64,58,0.12); }
    .data-field-details { flex: 2 1 260px; min-width: 220px; }
    .data-field-account { flex: 1 1 160px; min-width: 140px; }
    .data-field-acctype { flex: 1 1 140px; min-width: 120px; }
    .data-field-month { width: 100px; }
    .data-field-year { width: 90px; }

    /* ====== CURRENCY SECTION ====== */
    .currency-row-bar {
      display: flex;
      align-items: stretch;
      flex-wrap: wrap;
      gap: 14px;
    }
    .currency-panel {
      flex: 1 1 320px;
      background: #f7fafd;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
    }
    .currency-panel-head {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 800;
      color: var(--color-primary);
      margin-bottom: 10px;
    }
    .currency-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 10px;
    }
    .cur-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .cur-field label {
      font-size: 11px;
      font-weight: 800;
      color: var(--color-text-light);
      text-align: center;
    }
    .cur-field input {
      padding: 8px 6px;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 700;
      height: 44px;
      font-family: var(--font-primary);
      text-align: center;
      background: white;
      transition: border-color .15s ease, box-shadow .15s ease;
      color: var(--color-primary);
    }
    .cur-field input:focus {
      border-color: var(--color-teal);
      outline: none;
      box-shadow: 0 0 0 3px rgba(21,152,149,0.15);
    }
    .currency-save-col {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ====== SAVE BUTTON ====== */
    .btn-save {
      padding: 12px 28px;
      border: none;
      border-radius: 30px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      font-family: var(--font-primary);
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-md);
      white-space: nowrap;
      width: 100%;
      justify-content: center;
    }
    .btn-save:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .btn-save:active { transform: translateY(0); }
    .btn-save:disabled { opacity: .7; cursor: not-allowed; transform: none; }
    .btn-save-exp { background: linear-gradient(135deg, var(--color-danger), var(--color-danger-dark)); color: white; }
    .btn-save-rev { background: linear-gradient(135deg, var(--color-success), var(--color-success-dark)); color: white; }

    /* ====== COMBOBOX - مع z-index عالي لظهورها خارج الإطار ====== */
    .cbw { position: relative; display: inline-block; width: 100%; }
    .cbarr {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #a8b4c8;
      font-size: 10px;
      pointer-events: none;
    }
    .cbdd {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      z-index: 9999 !important; /* ✅ ظهر فوق كل العناصر */
      background: white;
      border: 1.5px solid var(--color-primary-light);
      border-radius: var(--radius-sm);
      min-width: 100%;
      max-height: 190px;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
    }
    .cbdd.open { display: block; }
    .cbo {
      padding: 9px 12px;
      cursor: pointer;
      font-size: 13px;
      color: var(--color-text);
      border-bottom: 1px solid var(--color-border);
      transition: background .1s ease;
    }
    .cbo:last-child { border-bottom: none; }
    .cbo:hover, .cbo.hi { background: #eaf2fc; }
    .cbo.dim { color: #a8b4c8; font-style: italic; cursor: default; }
    .cbo.dim:hover { background: white; }

    /* ====== TABLE ====== */
    .table-section {
      background: var(--color-card);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--color-border);
    }
    .table-wrap {
      overflow-x: auto;
      overflow-y: auto;
      width: 100%;
      max-height: 58vh;
      -webkit-overflow-scrolling: touch;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      font-family: var(--font-primary);
      min-width: 1050px;
    }
    thead th {
      background: var(--color-primary);
      color: var(--color-secondary);
      padding: 12px 8px;
      font-weight: 800;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 10;
      cursor: pointer;
      text-align: center;
      border-right: 1px solid rgba(255,255,255,0.08);
      font-size: 12.5px;
      user-select: none;
      transition: background .15s ease;
    }
    thead th:hover { background: var(--color-primary-light); }
    thead th:last-child { border-right: none; }
    tbody td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--color-border);
      white-space: nowrap;
      text-align: center;
      background: white;
      font-size: 12.5px;
    }
    tbody tr:hover td { background: #f4f9ff; }
    tbody tr.sel td { background: #fff3cd; }
    td.amt {
      text-align: center;
      font-family: 'Courier New', monospace;
      font-size: 12.5px;
      font-weight: 700;
      direction: ltr;
      color: var(--color-primary);
    }
    .dbtn {
      padding: 6px 12px;
      border: none;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      color: white;
      background: var(--color-danger);
      transition: transform .15s ease, filter .15s ease;
    }
    .dbtn:hover { background: var(--color-danger-dark); transform: translateY(-1px); }
    .dbtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .no-data {
      text-align: center;
      padding: 40px 16px;
      color: var(--color-text-light);
      font-size: 14px;
    }
    .loader {
      text-align: center;
      padding: 40px 16px;
      color: var(--color-text-light);
      font-size: 13px;
    }
    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-info);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ====== TOTALS ====== */
    .totals-footer {
      background: var(--color-primary-dark);
      color: var(--color-secondary);
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      justify-content: flex-start;
      font-size: 12.5px;
      font-weight: 700;
    }
    .total-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .total-label { color: #8fa3c4; }
    .total-value { color: var(--color-secondary); font-size: 13px; }

    /* ====== MODAL ====== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10,20,35,.6);
      align-items: center;
      justify-content: center;
      z-index: 99999;
      backdrop-filter: blur(2px);
    }
    .modal.open { display: flex; }
    .alert-box {
      background: white;
      width: 90%;
      max-width: 340px;
      border-radius: var(--radius-lg);
      padding: 26px 22px;
      text-align: center;
      box-shadow: var(--shadow-lg);
      animation: pop .18s ease;
    }
    @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .alert-icon { font-size: 34px; margin-bottom: 8px; }
    .alert-msg {
      color: var(--color-primary);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    /* ====== TOAST ====== */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      color: white;
      z-index: 99998;
      box-shadow: var(--shadow-lg);
      transform: translateY(60px);
      opacity: 0;
      transition: .3s;
      pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast-success { background: var(--color-success); }
    .toast-error { background: var(--color-danger); }
    .toast-info { background: var(--color-info); }

    /* ====== FOOTER ====== */
    .footer {
      text-align: center;
      padding: 16px 0 4px;
      color: #94a3b8;
      font-size: 12px;
      margin-top: 10px;
    }

    /* ====== RESPONSIVE ====== */
    @media (max-width: 900px) {
      .currency-grid { grid-template-columns: repeat(4, minmax(0,1fr)); }
    }

    @media (max-width: 768px) {
      .main-content { padding: 10px 10px 20px; }
      .header { padding: 12px 14px; }
      .header-left h2 { font-size: 16px; }
      .header-actions { width: 100%; }
      .header-btn, .back-btn { font-size: 12px; padding: 8px 14px; }
      .filter-group input { width: 118px; }
      .data-field-details { flex: 1 1 100%; }
      .data-field-account, .data-field-acctype { flex: 1 1 47%; }
      .currency-panel { flex: 1 1 100%; }
      .currency-save-col { flex: 1 1 100%; }
      .table-wrap { max-height: 45vh; }
      table { min-width: 760px; font-size: 12px; }
    }

    @media (max-width: 480px) {
      .header-left { gap: 8px; }
      .info-group { display: none; }
      .header-left h2 { font-size: 14px; }
      .currency-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .filters-row { gap: 8px; }
      .filter-group input { width: 100%; }
      .search-group { flex: 1 1 100%; }
      table { min-width: 620px; }
    }
/* ====== الإطار الخارجي الكحلي ====== */
body {
  background: var(--color-bg);
  min-height: 100vh;
  padding: 0;
  margin: 0;
}

/* ✅ إضافة الإطار الكحلي حول الصفحة */
.main-content {
  max-width: 1400px;
  margin: 0 auto;
  padding: 28px 36px;
  min-height: 80vh;
  background: #f0f8ff;
  border-radius: 0;
  box-shadow: none;
}

/* ✅ إضافة border خارجي كحلي */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  border: 8px solid var(--color-primary);
  pointer-events: none;
  z-index: 9999;
  border-radius: 0;
  box-shadow: inset 0 0 30px rgba(30,43,79,0.08);
}

@media (max-width: 768px) {
  body::before {
    border-width: 4px;
  }
}

@media (max-width: 480px) {
  body::before {
    border-width: 2px;
  }
}
    .table-wrap::-webkit-scrollbar { height: 6px; width: 6px; }
    .table-wrap::-webkit-scrollbar-track { background: #e1e8ed; border-radius: 4px; }
    .table-wrap::-webkit-scrollbar-thumb { background: var(--color-primary); border-radius: 4px; }
  </style>
</head>
<body>

<div class="main-content">

  <!-- ====== HEADER ====== -->
  <div class="header">
    <div class="header-left">
      <h2>💰 المصروفات والإيرادات</h2>
      <div class="info-group">
        <div class="info-item"><span class="info-label">🏢</span><span class="info-value" id="infoCenter">—</span></div>
        <div class="info-item"><span class="info-label">🏪</span><span class="info-value" id="infoBranch">—</span></div>
        <span class="user-chip" id="userChip">...</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="header-btn header-btn-exp" id="btnExp" onclick="switchType('expense')">📤 Expense</button>
      <button class="header-btn header-btn-gray" id="btnRev" onclick="switchType('revenue')">📥 Revenue</button>

<div class="toast" id="toast"></div>

<script>
// ====== CONFIG & STATE ======
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const YEARS = ['2024','2025','2026','2027','2028','2029','2030'];
const DROPDOWN_IDS = ['monthDD','yearDD','detailsDD','accDD','typeDD'];

let currentUser = null;
let currentType = 'expense';
let allRows = [], filteredRows = [];
let sortCol = -1, sortDir = 1;
let editRowNum = -1, selectedIdx = -1;
let optionsCache = {};

// ====== HELPERS ======
function gasGet(params, retryCount = 0) {
  return new Promise((resolve, reject) => {
    if (currentUser && currentUser.centerName) {
      params.centerName = currentUser.centerName;
    }
    const qs = Object.entries(params).map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&');
    const url = CONFIG.GAS_URL ? `${CONFIG.GAS_URL}?${qs}` : null;
    if (!url) {
      reject(new Error('CONFIG.GAS_URL غير معرف في config.js'));
      return;
    }

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 30000);

    fetch(url, {
      signal: controller.signal,
      headers: { 'Accept': 'application/json' }
    })
      .then(r => {
        clearTimeout(timeoutId);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(resolve)
      .catch(err => {
        clearTimeout(timeoutId);
        if (retryCount < 2) {
          console.log(`⚠️ محاولة إعادة الاتصال (${retryCount + 1}/2)...`);
          setTimeout(() => {
            gasGet(params, retryCount + 1).then(resolve).catch(reject);
          }, 2000);
        } else {
          reject(err);
        }
      });
  });
}

function isoToDD(iso) {
  if(!iso) return '';
  const parts = iso.split('-');
  if(parts.length !== 3) return iso;
  const year = parts[0];
  const month = parts[1];
  const day = parts[2];
  const monthIndex = parseInt(month) - 1;
  return `${day.padStart(2,'0')}/${MN[monthIndex]}/${year}`;
}

function ddToISO(dd) {
  if(!dd) return '';
  const m = dd.match(/^(\d{1,2})\/([A-Za-z]{3})\/(\d{4})$/);
  if(!m) return '';
  const idx = MN.findIndex(x => x.toLowerCase() === m[2].toLowerCase());
  return idx<0 ? '' : `${m[3]}-${String(idx+1).padStart(2,'0')}-${m[1].padStart(2,'0')}`;
}

function ddToTs(dd) {
  const iso = ddToISO(dd);
  if(!iso) return 0;
  const t = new Date(iso).getTime();
  return isNaN(t) ? 0 : t;
}

function todayISO() {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function fmtNum(v) {
  const n = parseFloat(v) || 0;
  return n===0 ? '' : (Number.isInteger(n) ? n.toString() : n.toFixed(2));
}

function escapeHtml(str) {
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, function(m) {
    if(m==='&') return '&amp;';
    if(m==='<') return '&lt;';
    if(m==='>') return '&gt;';
    if(m==='"') return '&quot;';
    if(m==="'") return '&#39;';
    return m;
  });
}

function truncate(str, maxLen) {
  if(!str) return '';
  if(str.length<=maxLen) return str;
  return str.substring(0,maxLen)+'...';
}

function showToast(msg, type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className=`toast toast-${type} show`;
  setTimeout(()=>t.className='toast',2500);
}

function showAlert(msg, icon='ℹ️'){
  const modal = document.getElementById('alertModal');
  const alertIcon = document.getElementById('alertIcon');
  const alertMsg = document.getElementById('alertMsg');
  const mBtns = document.getElementById('mBtns');
  if (modal && alertIcon && alertMsg && mBtns) {
    alertIcon.textContent = icon;
    alertMsg.textContent = msg;
    mBtns.innerHTML = `<button class="btn-sm btn-primary-sm" onclick="closeAlert()" style="padding:9px 24px;">موافق</button>`;
    modal.classList.add('open');
  } else {
    alert(msg);
  }
}

function closeAlert() {
  document.getElementById('alertModal').classList.remove('open');
}

function closeModal() {
  document.getElementById('alertModal').classList.remove('open');
}

// ====== ✅ دالة التحقق من صلاحية التعديل/الحذف ======
function canModify(row) {
  if (!row || !row.date) return false;
  const rowDate = new Date(ddToISO(row.date));
  const today = new Date();
  rowDate.setHours(0, 0, 0, 0);
  today.setHours(0, 0, 0, 0);
  return rowDate.getTime() === today.getTime();
}

// ====== ✅ دالة التحقق من أن التاريخ = اليوم ======
function isToday(row) {
  if (!row || !row.date) return false;
  const rowDate = new Date(ddToISO(row.date));
  const today = new Date();
  rowDate.setHours(0, 0, 0, 0);
  today.setHours(0, 0, 0, 0);
  return rowDate.getTime() === today.getTime();
}

// ====== DATE FUNCTIONS ======
function onDateChange(){
  const iso = document.getElementById('fDateInput').value;
  if(!iso) return;
  const parts = iso.split('-');
  if(parts.length !== 3) return;

  const year = parts[0];
  const month = parts[1];
  const monthIndex = parseInt(month) - 1;

  document.getElementById('fMonth').value = MN[monthIndex] || '';
  document.getElementById('fYear').value = year;

  loadListForDate(iso);
}

function loadListForDate(iso) {
  const sheet = currentType === 'expense' ? 'Expenses' : 'Other_Revenues';
  const targetDate = iso ? isoToDD(iso) : isoToDD(todayISO());

  console.log(`📅 جلب بيانات ${sheet} للتاريخ: ${targetDate}`);

  document.getElementById('tableWrap').innerHTML = '<div class="loader"><div class="spinner"></div>جاري التحميل...</div>';

  gasGet({action:'getExpenseRevenueRows', sheet, dateFrom: targetDate, dateTo: targetDate})
    .then(data => {
      console.log(`✅ تم جلب ${data?.length || 0} سجل من ${sheet}`);
      allRows = Array.isArray(data) ? data : [];
      filteredRows = [...allRows];
      if(sortCol>=0) doSort();
      renderTable();
      renderTotals();

      const fromInput = document.getElementById('fFromDate');
      const toInput = document.getElementById('fToDate');
      if (iso) {
        fromInput.value = iso;
        toInput.value = iso;
      }
    })
    .catch(err => {
      console.log(`❌ loadList error:`, err);
      document.getElementById('tableWrap').innerHTML = `
        <div class="no-data" style="color:#dc2626;">
          <div style="font-size:30px;margin-bottom:6px;">⚠️</div>
          <div style="font-weight:800;">فشل الاتصال بالخادم</div>
          <div style="font-size:12px;margin-top:4px;color:#666;">${escapeHtml(err.message)}</div>
          <button onclick="retryLoad()" style="margin-top:10px;padding:8px 20px;background:var(--color-primary);color:var(--color-secondary);border:none;border-radius:30px;cursor:pointer;font-weight:700;font-size:12.5px;">🔄 إعادة المحاولة</button>
        </div>
      `;
    });
}

function retryLoad() {
  const iso = document.getElementById('fDateInput').value || todayISO();
  loadListForDate(iso);
}

// ====== TYPE SWITCHER ======
function switchType(type){
  currentType = type;
  const expBtn = document.getElementById('btnExp');
  const revBtn = document.getElementById('btnRev');
  const saveBtn = document.getElementById('saveBtn');

  if(type==='expense'){
    expBtn.className = 'header-btn header-btn-exp';
    revBtn.className = 'header-btn header-btn-gray';
    saveBtn.textContent = '💾 حفظ Expense';
    saveBtn.className = 'btn-save btn-save-exp';
  } else {
    revBtn.className = 'header-btn header-btn-rev';
    expBtn.className = 'header-btn header-btn-gray';
    saveBtn.textContent = '💾 حفظ Revenue';
    saveBtn.className = 'btn-save btn-save-rev';
  }
  cancelEdit();
  loadOptions();
  const iso = document.getElementById('fDateInput').value || todayISO();
  loadListForDate(iso);
}

// ====== LOAD OPTIONS ======
function loadOptions(){
  const sheet = currentType==='expense' ? 'Expenses' : 'Other_Revenues';
  if(optionsCache[sheet]){ applyOptions(optionsCache[sheet]); return; }
  return gasGet({action:'getSheetOptions', sheet}).then(d=>{ if(d){ optionsCache[sheet]=d; applyOptions(d); } }).catch(()=>{});
}

function applyOptions(d){
  buildDropdown('detailsDD', d.details || [], 'fDetails');
  buildDropdown('accDD', d.account || [], 'fAcc');
  buildDropdown('typeDD', d.accountType || [], 'fAccT');
}

function buildDropdown(ddId, items, inputId){
  const dd = document.getElementById(ddId);
  if(!dd) return;
  dd.innerHTML = items.map(o => `<div class="cbo" onclick="pickCB('${inputId}','${ddId}', this.dataset.val)" data-val="${escapeHtml(o)}">${escapeHtml(o)}</div>`).join('');
  if(!items.length) dd.innerHTML = '<div class="cbo dim">لا توجد خيارات</div>';
}

// ====== COMBOBOX ======
function cbf(inp, optKey, ddId){
  let items = [];
  if(optKey === 'MO') items = MN;
  else if(optKey === 'YR') items = YEARS;
  else if(optKey === 'DT') items = optionsCache[currentType==='expense'?'Expenses':'Other_Revenues']?.details || [];
  else if(optKey === 'AC') items = optionsCache[currentType==='expense'?'Expenses':'Other_Revenues']?.account || [];
  else if(optKey === 'AT') items = optionsCache[currentType==='expense'?'Expenses':'Other_Revenues']?.accountType || [];
  const val = document.getElementById(inp).value.toLowerCase();
  const filtered = items.filter(i => i.toLowerCase().includes(val));
  const dd = document.getElementById(ddId);
  if(filtered.length){
    dd.innerHTML = filtered.map(o => `<div class="cbo" onclick="pickCB('${inp}','${ddId}', this.dataset.val)" data-val="${escapeHtml(o)}">${escapeHtml(o)}</div>`).join('');
  } else {
    dd.innerHTML = '<div class="cbo dim">لا توجد نتائج</div>';
  }
  cbo(ddId);
}

function cbo(ddId){
  DROPDOWN_IDS.forEach(id => {
    if(id !== ddId) document.getElementById(id)?.classList.remove('open');
  });
  document.getElementById(ddId)?.classList.add('open');
}

function pickCB(inp, ddId, val){
  document.getElementById(inp).value = val;
  document.getElementById(ddId).classList.remove('open');
  document.getElementById(inp).classList.remove('err');
}

document.addEventListener('click', function(e){
  if(!e.target.closest('.cbw')){
    DROPDOWN_IDS.forEach(id=>document.getElementById(id)?.classList.remove('open'));
  }
});

// ====== APPLY DATE FILTER ======
function applyDateFilter() {
  const fromDate = document.getElementById('fFromDate').value;
  const toDate = document.getElementById('fToDate').value;
  const searchText = document.getElementById('fSearch').value;
  const sheet = currentType === 'expense' ? 'Expenses' : 'Other_Revenues';

  let fromDD = fromDate ? isoToDD(fromDate) : '';
  let toDD = toDate ? isoToDD(toDate) : '';

  if (!fromDD && !toDD) {
    const today = todayISO();
    fromDD = isoToDD(today);
    toDD = isoToDD(today);
  }
  else if (!fromDD && toDD) {
    fromDD = toDD;
  } else if (fromDD && !toDD) {
    toDD = fromDD;
  }
  else {
    const date1 = new Date(ddToISO(fromDD));
    const date2 = new Date(ddToISO(toDD));
    if (date1 > date2) {
      const temp = fromDD;
      fromDD = toDD;
      toDD = temp;
    }
  }

  document.getElementById('tableWrap').innerHTML = '<div class="loader"><div class="spinner"></div>جاري البحث...</div>';

  gasGet({action: 'getExpenseRevenueRows', sheet, dateFrom: fromDD, dateTo: toDD})
    .then(data => {
      if (Array.isArray(data)) {
        let rows = data;
        if (searchText) {
          rows = rows.filter(r => {
            const str = [r.date, r.details, r.account, r.accountType, r.expenseNo].map(x=>x||'').join(' ').toLowerCase();
            return str.includes(searchText.toLowerCase());
          });
        }
        allRows = rows;
        filteredRows = [...allRows];
        if (sortCol >= 0) doSort();
        renderTable();
        renderTotals();
        showToast(`تم العثور على ${filteredRows.length} سجل`, 'success');
      } else {
        showAlert('فشل جلب البيانات', '❌');
      }
    }).catch(err => {
      console.error('❌ applyDateFilter error:', err);
      document.getElementById('tableWrap').innerHTML = `
        <div class="no-data" style="color:#dc2626;">
          <div style="font-size:30px;margin-bottom:6px;">⚠️</div>
          <div style="font-weight:800;">فشل الاتصال بالخادم</div>
          <div style="font-size:12px;margin-top:4px;color:#666;">${escapeHtml(err.message)}</div>
          <button onclick="applyDateFilter()" style="margin-top:10px;padding:8px 20px;background:var(--color-primary);color:var(--color-secondary);border:none;border-radius:30px;cursor:pointer;font-weight:700;font-size:12.5px;">🔄 إعادة المحاولة</button>
        </div>
      `;
      showAlert('خطأ في الاتصال: ' + err.message, '❌');
    });
}

// ====== FILTER & SORT ======
const COL_KEYS = ['expenseNo','date','details','usd','eur','gbp','le','vUSD','vEUR','vGBP','vLE','account','accountType','month','year','centerName','branchName'];
const NUM_COLS = ['usd','eur','gbp','le','vUSD','vEUR','vGBP','vLE'];
const HEADERS = [
  'رقم', 'التاريخ', 'التفاصيل', '$', '€', '£', 'LE', 'V$', 'V€', 'V£', 'VLE', 'الحساب', 'النوع', 'الشهر', 'السنة', 'المركز', 'الفرع'
];

function doSort(){
  const key = COL_KEYS[sortCol];
  filteredRows.sort((a,b)=>{
    let va = a[key]??'', vb = b[key]??'';
    if(key==='date'){ va = ddToTs(va)||0; vb = ddToTs(vb)||0; }
    else if(NUM_COLS.includes(key)){ va = parseFloat(va)||0; vb = parseFloat(vb)||0; }
    else{ va = String(va).toLowerCase(); vb = String(vb).toLowerCase(); }
    return va<vb ? -sortDir : va>vb ? sortDir : 0;
  });
}

function setSort(col){
  sortDir = (sortCol===col) ? -sortDir : 1;
  sortCol = col;
  doSort();
  renderTable();
  renderTotals();
}

function resetFilter(){
  document.getElementById('fFromDate').value = '';
  document.getElementById('fToDate').value = '';
  document.getElementById('fSearch').value = '';
  const iso = document.getElementById('fDateInput').value || todayISO();
  loadListForDate(iso);
}

// ====== RENDER TABLE ======
function renderTable() {
  const wrap = document.getElementById('tableWrap');
  if (!filteredRows.length) {
    wrap.innerHTML = '<div class="no-data">📭 لا توجد سجلات لعرضها</div>';
    return;
  }

  let html = `<table>`;
  html += `<thead><tr>`;
  HEADERS.forEach((h, i) => {
    const arrow = (sortCol === i) ? (sortDir === 1 ? ' ↑' : ' ↓') : '';
    html += `<th onclick="setSort(${i})">${h}${arrow}</th>`;
  });
  html += `<th>حذف</th></tr></thead><tbody>`;

  filteredRows.forEach((r, i) => {
    const rowClass = (i === selectedIdx) ? 'sel' : '';
    const isEditable = canModify(r);
    const todayFlag = isToday(r);
    
    html += `<tr ondblclick="loadRow(${i})" class="${rowClass}">
      <td style="font-weight:700;">${escapeHtml(r.expenseNo || '-')}</td>
      <td>${escapeHtml(r.date || '-')}</td>
      <td style="text-align:right;white-space:normal;word-break:break-word;max-width:180px;" title="${escapeHtml(r.details || '')}">${escapeHtml(truncate(r.details || '-', 32))}</td>
      <td class="amt">${fmtNum(r.usd)}</td>
      <td class="amt">${fmtNum(r.eur)}</td>
      <td class="amt">${fmtNum(r.gbp)}</td>
      <td class="amt">${fmtNum(r.le)}</td>
      <td class="amt">${fmtNum(r.vUSD)}</td>
      <td class="amt">${fmtNum(r.vEUR)}</td>
      <td class="amt">${fmtNum(r.vGBP)}</td>
      <td class="amt">${fmtNum(r.vLE)}</td>

      <td>${escapeHtml(r.accountType || '-')}</td>
      <td>${escapeHtml(r.month || '-')}</td>

  wrap.innerHTML = html;
}

// ====== FORM COLLECT & VALIDATE ======
function collectForm(){
  const dateISO = document.getElementById('fDateInput').value;
  return {
    date: dateISO ? isoToDD(dateISO) : '',
    details: document.getElementById('fDetails').value.trim(),
    usd: parseFloat(document.getElementById('fUSD').value)||0,
    eur: parseFloat(document.getElementById('fEUR').value)||0,
    gbp: parseFloat(document.getElementById('fGBP').value)||0,
    le: parseFloat(document.getElementById('fLE').value)||0,
    vUSD: parseFloat(document.getElementById('fVUSD').value)||0,
    vEUR: parseFloat(document.getElementById('fVEUR').value)||0,
    vGBP: parseFloat(document.getElementById('fVGBP').value)||0,
    vLE: parseFloat(document.getElementById('fVLE').value)||0,
    account: document.getElementById('fAcc').value.trim(),
    accountType: document.getElementById('fAccT').value.trim(),
    month: document.getElementById('fMonth').value.trim(),
    year: document.getElementById('fYear').value.trim(),
    centerName: currentUser?.centerName || '',
    branchName: currentUser?.branchName || '',
    userID: currentUser?.id || currentUser?.name || ''
  };
}

function validate(row){
  let ok = true;
  const dateEl = document.getElementById('fDateInput');
  if(!row.date){ dateEl.classList.add('err'); dateEl.classList.add('fc'); ok=false; }
  else { dateEl.classList.remove('err'); }
  if(!row.details){ document.getElementById('fDetails').classList.add('err'); ok=false; }
  else { document.getElementById('fDetails').classList.remove('err'); }
  const hasAmount = [row.usd,row.eur,row.gbp,row.le,row.vUSD,row.vEUR,row.vGBP,row.vLE].some(v=>v>0);
  if(!hasAmount){ showToast('يجب إدخال مبلغ واحد على الأقل','error'); ok=false; }
  return ok;
}

function resetForm(){
  ['fDetails','fAcc','fAccT','fUSD','fEUR','fGBP','fLE','fVUSD','fVEUR','fVGBP','fVLE'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){ el.value=''; el.classList.remove('err'); }
  });
  const iso = todayISO();
  document.getElementById('fDateInput').value = iso;
  const parts = iso.split('-');
  if (parts.length === 3) {
    const year = parts[0];
    const month = parts[1];
    const monthIndex = parseInt(month) - 1;
    document.getElementById('fMonth').value = MN[monthIndex] || '';
    document.getElementById('fYear').value = year;
  }
  document.getElementById('fDateInput').classList.remove('err');
  cancelEdit();
}

// ====== SUBMIT (SAVE/UPDATE) ======
async function submitEntry(){
  const row = collectForm();
  if(!validate(row)) return;
  const sheet = currentType==='expense' ? 'Expenses' : 'Other_Revenues';
  const isEdit = editRowNum > 0 ? '1' : '0';
  const params = {
    action:'saveExpRev', sheet, isEdit, rowNum: editRowNum>0 ? editRowNum : 0,
    date:row.date, details:row.details,
    usd:row.usd, eur:row.eur, gbp:row.gbp, le:row.le,
    vUSD:row.vUSD, vEUR:row.vEUR, vGBP:row.vGBP, vLE:row.vLE,
    account:row.account, accountType:row.accountType,
    month:row.month, year:row.year,
    branchName:row.branchName, userID:row.userID
  };
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = '⏳ جاري الحفظ...';
  try {
    const res = await gasGet(params);
    if(res.success){
      showToast(isEdit==='1' ? '✅ تم التحديث بنجاح' : '✅ تم الحفظ بنجاح', 'success');
      cancelEdit();
      resetForm();
      delete optionsCache[sheet];
      const iso = document.getElementById('fDateInput').value || todayISO();
      loadListForDate(iso);
    } else {
      showAlert(res.message || 'فشل الحفظ', '❌');
    }
  } catch(err) {
    showAlert('خطأ: '+err.message, '❌');
  } finally {
    btn.disabled = false;
    btn.textContent = currentType==='expense' ? '💾 حفظ Expense' : '💾 حفظ Revenue';
  }
}

// ====== ✅ EDIT & DELETE مع التحكم بالصلاحيات ======
function loadRow(idx) {
  const r = filteredRows[idx];
  if (!r) return;

  const isEditable = canModify(r);
  const todayFlag = isToday(r);

  selectedIdx = idx;
  editRowNum = r._rowNum;

  const setVal = (id, val) => { const el = document.getElementById(id); if(el){ el.value = val || ''; el.classList.remove('err'); } };

  const dateISO = ddToISO(r.date);
  setVal('fDateInput', dateISO);
  setVal('fMonth', r.month);
  setVal('fYear', r.year);
  setVal('fDetails', r.details);
  setVal('fAcc', r.account);
  setVal('fAccT', r.accountType);
  
  // ✅ إذا كان التعديل مسموحاً (تاريخ اليوم) → يمكن تعديل المدفوعات
  // ✅ إذا كان التعديل غير مسموح (تاريخ سابق) → تعطيل حقول المدفوعات
  const paymentFields = ['fUSD','fEUR','fGBP','fLE','fVUSD','fVEUR','fVGBP','fVLE'];
  if (todayFlag) {
    // ✅ فاتورة اليوم: يمكن تعديل كل شيء
    setVal('fUSD', fmtNum(r.usd));
    setVal('fEUR', fmtNum(r.eur));
    setVal('fGBP', fmtNum(r.gbp));
    setVal('fLE', fmtNum(r.le));
    setVal('fVUSD', fmtNum(r.vUSD));
    setVal('fVEUR', fmtNum(r.vEUR));
    setVal('fVGBP', fmtNum(r.vGBP));
    setVal('fVLE', fmtNum(r.vLE));
    paymentFields.forEach(id => {
      const el = document.getElementById(id);
      if(el) { el.disabled = false; el.style.opacity = '1'; el.style.background = 'white'; }
    });
    document.getElementById('editRowLabel').textContent = r.expenseNo || 'صف ' + editRowNum + ' (قابل للتعديل الكامل)';
  } else {
    // ✅ فاتورة سابقة: تعطيل حقول المدفوعات (يُسمح فقط بتعديل التفاصيل)
    paymentFields.forEach(id => {
      const el = document.getElementById(id);
      if(el) { el.disabled = true; el.style.opacity = '0.6'; el.style.background = '#f0f0f0'; }
    });
    setVal('fUSD', '');
    setVal('fEUR', '');
    setVal('fGBP', '');
    setVal('fLE', '');
    setVal('fVUSD', '');
    setVal('fVEUR', '');
    setVal('fVGBP', '');
    setVal('fVLE', '');
    document.getElementById('editRowLabel').textContent = r.expenseNo || 'صف ' + editRowNum + ' (🔒 تعديل التفاصيل فقط)';
  }

  document.getElementById('ebanner').classList.add('show');

  const btn = document.getElementById('saveBtn');
  btn.textContent = currentType === 'expense' ? '✏️ تحديث Expense' : '✏️ تحديث Revenue';

  renderTable();
  showToast(todayFlag ? '✅ تم تحميل السطر للتعديل الكامل' : '🔒 تم تحميل السطر (تعديل التفاصيل فقط)', todayFlag ? 'success' : 'info');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit(){
  selectedIdx = -1;
  editRowNum = -1;
  document.getElementById('ebanner').classList.remove('show');
  const btn = document.getElementById('saveBtn');
  btn.textContent = currentType==='expense' ? '💾 حفظ Expense' : '💾 حفظ Revenue';
  
  // ✅ إعادة تفعيل جميع حقول المدفوعات
  ['fUSD','fEUR','fGBP','fLE','fVUSD','fVEUR','fVGBP','fVLE'].forEach(id => {
    const el = document.getElementById(id);
    if(el) { el.disabled = false; el.style.opacity = '1'; el.style.background = 'white'; }
  });
  
  renderTable();
}

function confirmDelete(idx) {
  const r = filteredRows[idx];
  if(!r) return;

  // ✅ التحقق: هل الفاتورة من اليوم؟
  if (!isToday(r)) {
    showAlert('⚠️ لا يمكن حذف سجلات من أيام سابقة. يمكنك حذف سجلات اليوم فقط.', '🚫');
    return;
  }

  if (confirm(`🗑️ هل أنت متأكد من حذف هذا السجل؟\n\nالتفاصيل: ${r.details || '-'}\nالتاريخ: ${r.date || '-'}\nرقم المعاملة: ${r.expenseNo || '-'}`)) {
    const sheet = currentType==='expense' ? 'Expenses' : 'Other_Revenues';
    gasGet({action:'deleteExpRev', sheet, rowNum: r._rowNum})
      .then(res => {
        if(res.success){
          showToast('🗑️ تم الحذف بنجاح', 'success');
          allRows = allRows.filter(x => x._rowNum !== r._rowNum);
          const iso = document.getElementById('fDateInput').value || todayISO();
          loadListForDate(iso);
          if(editRowNum === r._rowNum) cancelEdit();
        } else {
          showAlert(res.message || 'فشل الحذف', '❌');
        }
      }).catch(err => showAlert('خطأ: '+err.message, '❌'));
  }
}

// ====== EXPORT TO EXCEL (CSV) ======
function exportToExcel() {
  if (!filteredRows || filteredRows.length === 0) {
    showAlert('لا توجد بيانات لتصديرها', '📊');
    return;
  }

  const headers = ['رقم المعاملة', 'التاريخ', 'التفاصيل', '$', '€', '£', 'LE', 'V$', 'V€', 'V£', 'VLE', 'الحساب', 'نوع الحساب', 'الشهر', 'السنة', 'المركز', 'الفرع'];
  const rows = filteredRows.map(r => [
    r.expenseNo || '',
    r.date || '',
    r.details || '',
    fmtNum(r.usd),
    fmtNum(r.eur),
    fmtNum(r.gbp),
    fmtNum(r.le),
    fmtNum(r.vUSD),
    fmtNum(r.vEUR),
    fmtNum(r.vGBP),
    fmtNum(r.vLE),
    r.account || '',
    r.accountType || '',
    r.month || '',
    r.year || '',
    r.centerName || '',
    r.branchName || ''
  ]);

  const sums = { usd:0, eur:0, gbp:0, le:0, vUSD:0, vEUR:0, vGBP:0, vLE:0 };
  filteredRows.forEach(r => {
    sums.usd += parseFloat(r.usd)||0;
    sums.eur += parseFloat(r.eur)||0;
    sums.gbp += parseFloat(r.gbp)||0;
    sums.le += parseFloat(r.le)||0;
    sums.vUSD += parseFloat(r.vUSD)||0;
    sums.vEUR += parseFloat(r.vEUR)||0;
    sums.vGBP += parseFloat(r.vGBP)||0;
    sums.vLE += parseFloat(r.vLE)||0;
  });

  rows.push([
    'الإجمالي', '', '',
    fmtNum(sums.usd), fmtNum(sums.eur), fmtNum(sums.gbp), fmtNum(sums.le),
    fmtNum(sums.vUSD), fmtNum(sums.vEUR), fmtNum(sums.vGBP), fmtNum(sums.vLE),
    '', '', '', '', ''
  ]);

  let csv = headers.map(h => `"${h}"`).join(';') + '\n';
  rows.forEach(row => {
    csv += row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(';') + '\n';
  });

  const type = currentType === 'expense' ? 'Expenses' : 'Revenues';
  const date = new Date().toISOString().slice(0, 10);
  const fileName = `${type}_${date}.csv`;

  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);
  link.setAttribute('href', url);
  link.setAttribute('download', fileName);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);

  showToast(`📊 تم تصدير ${filteredRows.length} سجل إلى Excel`, 'success');
}
