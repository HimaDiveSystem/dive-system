<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes">
  <meta name="theme-color" content="#132a4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>💰 المصروفات والإيرادات 🌊 | Dive System</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="config.js"></script>
  <script src="session.js"></script>
  <script src="ui.js"></script>
  <script src="GuidedPayments.js"></script>
  
  <style>
    /* ====== المتغيرات الموحدة ====== */
    :root {
      --color-primary: #132a4a;
      --color-primary-dark: #0c1c30;
      --color-primary-light: #1f3f6b;
      --color-secondary: #f2b632;
      --color-secondary-light: #ffd873;
      --color-teal: #159895;
      --color-success: #16a34a;
      --color-success-dark: #0e7a37;
      --color-danger: #e0403a;
      --color-danger-dark: #b91c1c;
      --color-warning: #f59e0b;
      --color-info: #2f8fd9;
      --color-bg: #eef4fb;
      --color-card: #ffffff;
      --color-text: #16233c;
      --color-text-light: #6b7893;
      --color-border: #e3ebf5;
      --radius-lg: 16px;
      --radius-md: 10px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 3px rgba(19,42,74,0.06);
      --shadow-md: 0 6px 20px rgba(19,42,74,0.10);
      --shadow-lg: 0 10px 32px rgba(19,42,74,0.16);
      --font-primary: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-primary); }
    html { scroll-behavior: smooth; }
    body {
      background: var(--color-bg);
      min-height: 100vh;
      color: var(--color-text);
      font-size: 15px;
    }

    ::selection { background: var(--color-secondary-light); color: var(--color-primary-dark); }

    .main-content { max-width: 1500px; margin: 0 auto; padding: 18px 20px 30px; }

    /* ====== HEADER ====== */
    .header {
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
      color: white; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px; border-radius: var(--radius-lg); margin-bottom: 16px;
      box-shadow: var(--shadow-lg); position: relative; overflow: hidden;
    }
    .header::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(circle at 90% -20%, rgba(21,152,149,0.35), transparent 60%);
      pointer-events: none;
    }
    .header-left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; position: relative; z-index: 1; }
    .header-left h2 { color: var(--color-secondary); font-size: 20px; font-weight: 900; margin: 0; letter-spacing: .2px; }
    
    .info-group {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      background: rgba(255,255,255,0.08); padding: 6px 14px; border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .info-item { display: flex; align-items: center; gap: 4px; font-size: 12.5px; }
    .info-label { color: #9fb3d1; }
    .info-value { color: var(--color-secondary); font-weight: 700; }
    .user-chip { background: rgba(255,255,255,0.16); border-radius: 30px; padding: 5px 12px; font-size: 12.5px; font-weight: 700; }

    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: relative; z-index: 1; }
    .header-btn {
      padding: 9px 18px; border: none; border-radius: 30px; font-weight: 700; font-size: 13px;
      cursor: pointer; font-family: var(--font-primary); transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
      display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--shadow-sm);
    }
    .header-btn:hover { transform: translateY(-2px); filter: brightness(1.05); box-shadow: var(--shadow-md); }
    .header-btn-exp { background: var(--color-danger); color: white; }
    .header-btn-rev { background: var(--color-success); color: white; }
    .header-btn-cash { background: var(--color-secondary); color: var(--color-primary-dark); }
    .header-btn-excel { background: #1e7a4c; color: white; }
    .header-btn-gray { background: rgba(255,255,255,0.14); color: white; border: 1px solid rgba(255,255,255,0.22); }
    .header-btn-gray:hover { background: rgba(255,255,255,0.24); }
    .back-btn {
      background: transparent; border: 2px solid rgba(255,255,255,.35); color: white;
      padding: 8px 18px; border-radius: 30px; cursor: pointer; font-weight: 700; font-size: 13px;
      transition: all .15s ease;
    }
    .back-btn:hover { border-color: var(--color-secondary); color: var(--color-secondary); transform: translateY(-2px); }

    /* ====== CARD BASE ====== */
    .card {
      background: var(--color-card); border-radius: var(--radius-lg); padding: 16px 20px;
      margin-bottom: 14px; box-shadow: var(--shadow-sm); border: 1px solid var(--color-border);
      overflow: visible !important;
    }
    .card-title { font-size: 12.5px; font-weight: 800; color: var(--color-primary); display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }

    /* ====== FILTERS ====== */
    .filters-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    .filter-group label { font-size: 11.5px; font-weight: 700; color: var(--color-text-light); }
    .filter-group input {
      padding: 8px 12px; border: 1.5px solid var(--color-border); border-radius: var(--radius-sm);
      font-size: 13.5px; width: 140px; height: 38px; background: #fbfcfe; transition: border-color .15s ease;
    }
    .filter-group input:focus { border-color: var(--color-info); outline: none; background: white; }
    .search-group { flex: 1 1 200px; min-width: 160px; }
    .search-group input { width: 100%; }
    .filter-divider { width: 1px; align-self: stretch; background: var(--color-border); margin: 0 2px; }
    
    .btn-sm {
      padding: 9px 16px; border: none; border-radius: 30px; font-weight: 700; font-size: 12.5px;
      cursor: pointer; transition: transform .15s ease; height: 38px; display: inline-flex; align-items: center; gap: 5px;
    }
    .btn-sm:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
    .btn-primary-sm { background: var(--color-primary); color: var(--color-secondary); }
    .btn-gray-sm { background: #eef2f8; color: var(--color-text); border: 1px solid var(--color-border); }
    .btn-gray-sm:hover { background: #e3eaf5; }

    /* ====== EDIT BANNER ====== */
    .ebanner {
      background: linear-gradient(90deg, #fff6df, #fff1c7); border-radius: var(--radius-lg);
      padding: 12px 18px; display: none; align-items: center; justify-content: space-between;
      font-size: 13px; font-weight: 700; color: #7a5b06; margin-bottom: 14px;
      border: 1.5px solid var(--color-secondary); box-shadow: var(--shadow-sm);
    }
    .ebanner.show { display: flex; }
    .ecancel { background: white; border: 1px solid #e7c766; cursor: pointer; color: #7a5b06; font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 20px; transition: all .15s ease; }
    .ecancel:hover { background: #fff3d6; }

    /* ====== DATA ROW ====== */
    .data-row-bar { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 12px; }
    .data-field { display: flex; flex-direction: column; gap: 4px; }
    .data-field label { font-size: 11.5px; font-weight: 700; color: var(--color-text-light); }
    .data-field .fc {
      padding: 9px 12px; border: 1.5px solid var(--color-border); border-radius: var(--radius-sm);
      font-size: 13.5px; height: 40px; background: #fbfcfe; width: 100%; transition: border-color .15s ease;
    }
    .data-field .fc:focus { border-color: var(--color-info); outline: none; background: white; }
    .data-field .fc.err { border-color: var(--color-danger); }
    .data-field .fc:disabled { background: #f0f0f0; color: #888; cursor: not-allowed; }
    
    .data-field-details { flex: 2 1 260px; min-width: 220px; }
    .data-field-account { flex: 1 1 160px; min-width: 140px; }
    .data-field-acctype { flex: 1 1 140px; min-width: 120px; }
    .data-field-month { width: 100px; }
    .data-field-year { width: 90px; }

    /* ====== CURRENCY SECTION ====== */
    .currency-row-bar { display: flex; align-items: stretch; flex-wrap: wrap; gap: 14px; }
    .currency-panel { flex: 1 1 320px; background: #f7fafd; border: 1.5px solid var(--color-border); border-radius: var(--radius-md); padding: 12px 14px; }
    .currency-panel-head { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: var(--color-primary); margin-bottom: 10px; }
    .currency-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
    .cur-field { display: flex; flex-direction: column; gap: 4px; }
    .cur-field label { font-size: 11px; font-weight: 800; color: var(--color-text-light); text-align: center; }
    .cur-field input {
      padding: 8px 6px; border: 1.5px solid var(--color-border); border-radius: var(--radius-sm);
      font-size: 15px; font-weight: 700; height: 44px; text-align: center; background: white; transition: border-color .15s ease;
    }
    .cur-field input:focus { border-color: var(--color-teal); outline: none; }
    .cur-field input:disabled { background: #f0f0f0; color: #888; cursor: not-allowed; }
    .currency-save-col { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }

    /* ====== SAVE BUTTON ====== */
    .btn-save {
      padding: 12px 28px; border: none; border-radius: 30px; font-weight: 800; font-size: 15px;
      cursor: pointer; transition: transform .15s ease; display: inline-flex; align-items: center; gap: 8px;
      box-shadow: var(--shadow-md); white-space: nowrap; width: 100%; justify-content: center;
    }
    .btn-save:hover { transform: translateY(-2px); }
    .btn-save:disabled { opacity: .7; cursor: not-allowed; transform: none; }
    .btn-save-exp { background: linear-gradient(135deg, var(--color-danger), var(--color-danger-dark)); color: white; }
    .btn-save-rev { background: linear-gradient(135deg, var(--color-success), var(--color-success-dark)); color: white; }

    /* ====== COMBOBOX ====== */
    .cbw { position: relative; display: inline-block; width: 100%; }
    .cbarr { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #a8b4c8; font-size: 10px; pointer-events: none; }
    .cbdd {
      display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 9999 !important;
      background: white; border: 1.5px solid var(--color-primary-light); border-radius: var(--radius-sm);
      min-width: 100%; max-height: 190px; overflow-y: auto; box-shadow: var(--shadow-lg);
    }
    .cbdd.open { display: block; }
    .cbo { padding: 9px 12px; cursor: pointer; font-size: 13px; color: var(--color-text); border-bottom: 1px solid var(--color-border); transition: background .1s ease; }
    .cbo:last-child { border-bottom: none; }
    .cbo:hover, .cbo.hi { background: #eaf2fc; }
    .cbo.dim { color: #a8b4c8; font-style: italic; cursor: default; }
    .cbo.dim:hover { background: white; }

    /* ====== TABLE ====== */
    .table-section { background: var(--color-card); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--color-border); }
    .table-wrap { overflow-x: auto; overflow-y: auto; width: 100%; max-height: 58vh; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1100px; }
    thead th {
      background: var(--color-primary); color: var(--color-secondary); padding: 12px 8px;
      font-weight: 800; white-space: nowrap; position: sticky; top: 0; z-index: 10;
      cursor: pointer; text-align: center; border-right: 1px solid rgba(255,255,255,0.08); font-size: 12.5px;
    }
    thead th:hover { background: var(--color-primary-light); }
    tbody td { padding: 10px 8px; border-bottom: 1px solid var(--color-border); white-space: nowrap; text-align: center; background: white; font-size: 12.5px; }
    tbody tr:hover td { background: #f4f9ff; }
    tbody tr.sel td { background: #fff3cd; }
    td.amt { text-align: center; font-family: 'Courier New', monospace; font-size: 12.5px; font-weight: 700; direction: ltr; color: var(--color-primary); }
    
    .dbtn { padding: 6px 12px; border: none; border-radius: 20px; font-size: 11.5px; font-weight: 700; cursor: pointer; color: white; transition: transform .15s ease; }
    .dbtn:hover { transform: translateY(-1px); }
    .dbtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .dbtn-danger { background: var(--color-danger); }
    .dbtn-danger:hover { background: var(--color-danger-dark); }
    .dbtn-warning { background: var(--color-warning); }
    .dbtn-warning:hover { background: #d97706; }

    .no-data { text-align: center; padding: 40px 16px; color: var(--color-text-light); font-size: 14px; }
    .loader { text-align: center; padding: 40px 16px; color: var(--color-text-light); font-size: 13px; }
    .spinner { width: 26px; height: 26px; border: 3px solid var(--color-border); border-top-color: var(--color-info); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ====== TOTALS ====== */
    .totals-footer {
      background: var(--color-primary-dark); color: var(--color-secondary); padding: 12px 18px;
      display: flex; flex-wrap: wrap; gap: 18px; justify-content: flex-start; font-size: 12.5px; font-weight: 700;
    }
    .total-item { display: flex; align-items: center; gap: 4px; }
    .total-label { color: #8fa3c4; }
    .total-value { color: var(--color-secondary); font-size: 13px; }

    /* ====== MODALS ====== */
    .modal { display: none; position: fixed; inset: 0; background: rgba(10,20,35,.6); align-items: center; justify-content: center; z-index: 99999; backdrop-filter: blur(2px); }
    .modal.open { display: flex; }
    .alert-box {
      background: white; width: 90%; max-width: 400px; border-radius: var(--radius-lg);
      padding: 26px 22px; text-align: center; box-shadow: var(--shadow-lg); animation: pop .18s ease;
    }
    @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .alert-icon { font-size: 40px; margin-bottom: 10px; }
    .alert-msg { color: var(--color-primary); font-size: 14px; font-weight: 700; margin-bottom: 20px; line-height: 1.6; white-space: pre-wrap; }

    /* ====== TOAST ====== */
    .toast {
      position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 12px;
      font-size: 13.5px; font-weight: 700; color: white; z-index: 99998; box-shadow: var(--shadow-lg);
      transform: translateY(60px); opacity: 0; transition: .3s; pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast-success { background: var(--color-success); }
    .toast-error { background: var(--color-danger); }
    .toast-info { background: var(--color-info); }

    /* ====== FOOTER ====== */
    .footer { text-align: center; padding: 16px 0 4px; color: #94a3b8; font-size: 12px; margin-top: 10px; }

    /* ====== RESPONSIVE ====== */
    @media (max-width: 768px) {
      .main-content { padding: 10px 10px 20px; }
      .header { padding: 12px 14px; }
      .header-left h2 { font-size: 16px; }
      .header-actions { width: 100%; }
      .header-btn, .back-btn { font-size: 12px; padding: 8px 14px; }
      .filter-group input { width: 118px; }
      .data-field-details { flex: 1 1 100%; }
      .data-field-account, .data-field-acctype { flex: 1 1 47%; }
      .currency-panel { flex: 1 1 100%; }
      .currency-save-col { flex: 1 1 100%; }
      .table-wrap { max-height: 45vh; }
      table { min-width: 760px; font-size: 12px; }
    }
    @media (max-width: 480px) {
      .header-left { gap: 8px; }
      .info-group { display: none; }
      .header-left h2 { font-size: 14px; }
      .currency-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .filters-row { gap: 8px; }
      .filter-group input { width: 100%; }
      .search-group { flex: 1 1 100%; }
      table { min-width: 620px; }
    }

    /* ====== الإطار الخارجي الكحلي ====== */
    body { background: var(--color-primary); min-height: 100vh; padding: 0; margin: 0; }
    .main-content {
      max-width: 1400px; margin: 0 auto; padding: 28px 36px; min-height: 80vh;
      background: #f0f8ff; border-radius: 0; border: 8px solid var(--color-primary);
      box-shadow: 0 0 0 4px rgba(30,43,79,0.1);
    }
    @media (max-width: 768px) { .main-content { border-width: 4px; padding: 16px 18px; } }
    @media (max-width: 480px) { .main-content { border-width: 2px; padding: 8px 10px; } }
    
    .table-wrap::-webkit-scrollbar { height: 6px; width: 6px; }
    .table-wrap::-webkit-scrollbar-track { background: #e1e8ed; border-radius: 4px; }
    .table-wrap::-webkit-scrollbar-thumb { background: var(--color-primary); border-radius: 4px; }

    /* ====== تصميم الأزرار الموجّهة ====== */
    .btn-guided { border: none; color: white; font-weight: 800; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: all 0.2s ease; }
    .btn-guided:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    .btn-guided-supplier { background: linear-gradient(135deg, #1e3a8a, #1e40af); }
    .btn-guided-employee { background: linear-gradient(135deg, #6d28d9, #7c3aed); }
    .btn-guided-trip { background: linear-gradient(135deg, #ea580c, #f97316); }
  </style>
</head>
<body>

<div class="main-content">

  <div class="header">
    <div class="header-left">
      <h2>💰 المصروفات والإيرادات</h2>
      <div class="info-group">
        <div class="info-item"><span class="info-label">🏢</span><span class="info-value" id="infoCenter">—</span></div>
        <div class="info-item"><span class="info-label">🏪</span><span class="info-value" id="infoBranch">—</span></div>
        <span class="user-chip" id="userChip">...</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="header-btn header-btn-exp" id="btnExp" onclick="switchType('expense')">📤 Expense</button>
      <button class="header-btn header-btn-gray" id="btnRev" onclick="switchType('revenue')">📥 Revenue</button>
      <button class="header-btn header-btn-cash" onclick="goToCashRegister()">💰 الخزينة</button>
      <button class="header-btn header-btn-excel" onclick="exportToExcel()">📊 Excel</button>
      <button class="back-btn" onclick="goBack()">← عودة</button>
    </div>
  </div>

  <div class="card filters-bar">
    <div class="filters-row">
      <div class="filter-group"><label>📅 التاريخ</label><input type="date" id="fDateInput" onchange="onDateChange()" dir="ltr"></div>
      <button class="btn-sm btn-gray-sm" onclick="resetForm()">🔄 Reset</button>
      <span class="filter-divider"></span>
      <div class="filter-group"><label>📅 من</label><input type="date" id="fFromDate" dir="ltr"></div>
      <div class="filter-group"><label>📅 إلى</label><input type="date" id="fToDate" dir="ltr"></div>
      <button class="btn-sm btn-primary-sm" onclick="applyDateFilter()">🔍 تطبيق</button>
      
      <button class="btn-sm btn-guided btn-guided-supplier" onclick="GuidedPayments.open('supplier', '', currentUser?.centerName)">💸 دفعة لمنفذ</button>
      <button class="btn-sm btn-guided btn-guided-employee" onclick="GuidedPayments.open('employee', '', currentUser?.centerName)">👤 دفعة لموظف</button>
      <button class="btn-sm btn-guided btn-guided-trip" onclick="GuidedPayments.open('trip', '', currentUser?.centerName)">🏝️ مصروف رحلة</button>
      
      <div class="filter-group search-group"><label>🔍 بحث</label><input type="text" id="fSearch" placeholder="ابحث بالتفاصيل، الحساب، الرقم..."></div>
      <button class="btn-sm btn-gray-sm" onclick="resetFilter()">✕ إعادة ضبط</button>
    </div>
  </div>

  <div class="ebanner" id="ebanner">
    <span>✏️ جاري تعديل السجل: <strong id="editRowLabel">—</strong></span>
    <button class="ecancel" onclick="cancelEdit()">✕ إلغاء التعديل</button>
  </div>

  <div class="card">
    <div class="card-title">📝 بيانات الحركة</div>
    <div class="data-row-bar">
      <div class="data-field data-field-details">
        <label>📋 التفاصيل *</label>
        <div class="cbw">
          <input type="text" class="fc" id="fDetails" placeholder="اكتب شرح الحركة..." oninput="cbf('fDetails','DT','detailsDD')" onfocus="cbo('detailsDD')" onclick="cbo('detailsDD')" autocomplete="off">
          <span class="cbarr">▾</span>
          <div class="cbdd" id="detailsDD"></div>
        </div>
      </div>
      <div class="data-field data-field-account">
        <label>🏦 الحساب</label>
        <div class="cbw">
          <input type="text" class="fc" id="fAcc" placeholder="اختر الحساب..." oninput="cbf('fAcc','AC','accDD')" onfocus="cbo('accDD')" onclick="cbo('accDD')" autocomplete="off">
          <span class="cbarr">▾</span>
          <div class="cbdd" id="accDD"></div>
        </div>
      </div>
      <div class="data-field data-field-acctype">
        <label>🏷️ النوع</label>
        <div class="cbw">
          <input type="text" class="fc" id="fAccT" placeholder="نوع الحساب..." oninput="cbf('fAccT','AT','typeDD')" onfocus="cbo('typeDD')" onclick="cbo('typeDD')" autocomplete="off">
          <span class="cbarr">▾</span>
          <div class="cbdd" id="typeDD"></div>
        </div>
      </div>
      <div class="data-field data-field-month">
        <label>📆 الشهر</label>
        <div class="cbw">
          <input type="text" class="fc" id="fMonth" placeholder="Mar" oninput="cbf('fMonth','MO','monthDD')" onfocus="cbo('monthDD')" onclick="cbo('monthDD')" autocomplete="off">

<div class="toast" id="toast"></div>

<script>
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const YEARS = ['2024','2025','2026','2027','2028','2029','2030'];
const DROPDOWN_IDS = ['monthDD','yearDD','detailsDD','accDD','typeDD'];

let currentUser = null;
let currentType = 'expense';
let allRows = [], filteredRows = [];
let sortCol = -1, sortDir = 1;
let editRowNum = -1, selectedIdx = -1;
let pendingDeleteRowNum = null;
let pendingDeleteRowData = null;
let pendingCancelRowNum = null;
let pendingCancelRowData = null;
let optionsCache = {};

function gasGet(params, retryCount = 0) {
  return new Promise((resolve, reject) => {
    if (currentUser && currentUser.centerName) params.centerName = currentUser.centerName;
    const action = params.action || '';
    if (!action) { reject(new Error('action مطلوب')); return; }
    
    const cb = 'cb_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
    params.callback = cb;
    
    const qs = Object.entries(params)
      .filter(([k, v]) => v !== undefined && v !== null)
      .map(([k, v]) => k + '=' + encodeURIComponent(String(v ?? '')))
      .join('&');
    
    const script = document.createElement('script');
    const timeout = setTimeout(() => {
      delete window[cb]; script.remove();
      if (retryCount < 2) { setTimeout(() => gasGet(params, retryCount + 1).then(resolve).catch(reject), 1500); }
      else reject(new Error('انتهى الوقت'));
    }, 60000);
    
    window[cb] = (data) => { clearTimeout(timeout); delete window[cb]; script.remove(); resolve(data); };
    script.onerror = () => {
      clearTimeout(timeout); delete window[cb]; script.remove();
      if (retryCount < 2) { setTimeout(() => gasGet(params, retryCount + 1).then(resolve).catch(reject), 1500); }
      else reject(new Error('خطأ في الاتصال'));
    };
    script.src = CONFIG.GAS_URL + '?' + qs;
    document.head.appendChild(script);
  });
}

function isoToDD(iso) { if(!iso) return ''; const p = iso.split('-'); return p.length!==3 ? iso : `${p[2].padStart(2,'0')}/${MN[parseInt(p[1])-1]}/${p[0]}`; }
function ddToISO(dd) { if(!dd) return ''; const m = dd.match(/^(\d{1,2})\/([A-Za-z]{3})\/(\d{4})$/); if(!m) return ''; const idx = MN.findIndex(x => x.toLowerCase() === m[2].toLowerCase()); return idx<0 ? '' : `${m[3]}-${String(idx+1).padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
function ddToTs(dd) { const iso = ddToISO(dd); return !iso ? 0 : (new Date(iso).getTime() || 0); }
function todayISO() { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; }

function fmtNum(v) { const n = parseFloat(v) || 0; return n===0 ? '' : (Number.isInteger(n) ? n.toString() : n.toFixed(2)); }
function escapeHtml(s) { if(!s) return ''; return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function truncate(s, l) { if(!s) return ''; return s.length<=l ? s : s.substring(0,l)+'...'; }

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast toast-${type} show`;
  setTimeout(() => t.className='toast', 2500);
}

function showAlert(msg, icon='ℹ️', customBtns = null) {
  document.getElementById('alertIcon').textContent = icon;
  document.getElementById('alertMsg').textContent = msg;
  document.getElementById('mBtns').innerHTML = customBtns || `<button class="btn-sm btn-primary-sm" onclick="closeAlert()" style="padding:9px 24px;">موافق</button>`;
  document.getElementById('alertModal').classList.add('open');
}
function closeAlert() { document.getElementById('alertModal').classList.remove('open'); }

function isToday(row) {
  if (!row || !row.date) return false;
  const d = new Date(ddToISO(row.date)); const t = new Date();
  d.setHours(0,0,0,0); t.setHours(0,0,0,0);
  return d.getTime() === t.getTime();
}

function onDateChange() {
  const iso = document.getElementById('fDateInput').value;
  if(!iso) return;
  const p = iso.split('-'); if(p.length!==3) return;
  document.getElementById('fMonth').value = MN[parseInt(p[1])-1] || '';
  document.getElementById('fYear').value = p[0];
  loadListForDate(iso);
}

function loadListForDate(iso) {
  const sheet = currentType === 'expense' ? 'Expenses' : 'Other_Revenues';
  const targetDate = iso ? isoToDD(iso) : isoToDD(todayISO());
  document.getElementById('tableWrap').innerHTML = '<div class="loader"><div class="spinner"></div>جاري التحميل...</div>';
  
  gasGet({action:'getExpenseRevenueRows', sheet, dateFrom: targetDate, dateTo: targetDate})
    .then(data => {
      allRows = Array.isArray(data) ? data : [];
      filteredRows = [...allRows];
      if(sortCol>=0) doSort();
      renderTable();
      renderTotals();
      document.getElementById('fFromDate').value = iso;
      document.getElementById('fToDate').value = iso;
    })
    .catch(err => {
      document.getElementById('tableWrap').innerHTML = `<div class="no-data" style="color:var(--color-danger);">فشل الاتصال: ${escapeHtml(err.message)}</div>`;
    });
}

function switchType(type) {
  currentType = type;
  const expBtn = document.getElementById('btnExp'), revBtn = document.getElementById('btnRev'), saveBtn = document.getElementById('saveBtn');
  if(type==='expense') {
    expBtn.className = 'header-btn header-btn-exp'; revBtn.className = 'header-btn header-btn-gray';
    saveBtn.textContent = '💾 حفظ Expense'; saveBtn.className = 'btn-save btn-save-exp';
  } else {
    revBtn.className = 'header-btn header-btn-rev'; expBtn.className = 'header-btn header-btn-gray';
    saveBtn.textContent = '💾 حفظ Revenue'; saveBtn.className = 'btn-save btn-save-rev';
  }
  cancelEdit(); loadOptions(); loadListForDate(document.getElementById('fDateInput').value || todayISO());
}

function loadOptions() {
  const sheet = currentType==='expense' ? 'Expenses' : 'Other_Revenues';
  if(optionsCache[sheet]) { applyOptions(optionsCache[sheet]); return; }
  gasGet({action:'getSheetOptions', sheet}).then(d => { if(d){ optionsCache[sheet]=d; applyOptions(d); } }).catch(()=>{});
}

function applyOptions(d) {
  buildDropdown('detailsDD', d.details || [], 'fDetails');
  buildDropdown('accDD', d.account || [], 'fAcc');
  buildDropdown('typeDD', d.accountType || [], 'fAccT');
}

function buildDropdown(ddId, items, inputId) {
  const dd = document.getElementById(ddId); if(!dd) return;
  dd.innerHTML = items.map(o => `<div class="cbo" onclick="pickCB('${inputId}','${ddId}', this.dataset.val)" data-val="${escapeHtml(o)}">${escapeHtml(o)}</div>`).join('');
  if(!items.length) dd.innerHTML = '<div class="cbo dim">لا توجد خيارات</div>';
}

function cbf(inp, optKey, ddId) {
  let items = [];
  if(optKey === 'MO') items = MN; else if(optKey === 'YR') items = YEARS;
  else if(optKey === 'DT') items = optionsCache[currentType==='expense'?'Expenses':'Other_Revenues']?.details || [];
  else if(optKey === 'AC') items = optionsCache[currentType==='expense'?'Expenses':'Other_Revenues']?.account || [];
  else if(optKey === 'AT') items = optionsCache[currentType==='expense'?'Expenses':'Other_Revenues']?.accountType || [];
  
  const val = document.getElementById(inp).value.toLowerCase();
  const filtered = items.filter(i => i.toLowerCase().includes(val));
  const dd = document.getElementById(ddId);
  dd.innerHTML = filtered.length ? filtered.map(o => `<div class="cbo" onclick="pickCB('${inp}','${ddId}', this.dataset.val)" data-val="${escapeHtml(o)}">${escapeHtml(o)}</div>`).join('') : '<div class="cbo dim">لا توجد نتائج</div>';
  cbo(ddId);
}

function cbo(ddId) { DROPDOWN_IDS.forEach(id => { if(id !== ddId) document.getElementById(id)?.classList.remove('open'); }); document.getElementById(ddId)?.classList.add('open'); }
function pickCB(inp, ddId, val) { document.getElementById(inp).value = val; document.getElementById(ddId).classList.remove('open'); document.getElementById(inp).classList.remove('err'); }
document.addEventListener('click', e => { if(!e.target.closest('.cbw')) DROPDOWN_IDS.forEach(id=>document.getElementById(id)?.classList.remove('open')); });

function applyDateFilter() {
  let fromDD = isoToDD(document.getElementById('fFromDate').value);
  let toDD = isoToDD(document.getElementById('fToDate').value);
  if (!fromDD && !toDD) { const t = isoToDD(todayISO()); fromDD = t; toDD = t; }
  else if (!fromDD) fromDD = toDD; else if (!toDD) toDD = fromDD;
  else if (new Date(ddToISO(fromDD)) > new Date(ddToISO(toDD))) { const temp = fromDD; fromDD = toDD; toDD = temp; }

  const searchText = document.getElementById('fSearch').value.toLowerCase();
  const sheet = currentType === 'expense' ? 'Expenses' : 'Other_Revenues';
  document.getElementById('tableWrap').innerHTML = '<div class="loader"><div class="spinner"></div>جاري البحث...</div>';

  gasGet({action: 'getExpenseRevenueRows', sheet, dateFrom: fromDD, dateTo: toDD})
    .then(data => {
      if (Array.isArray(data)) {
        let rows = data;
        if (searchText) {
          rows = rows.filter(r => [r.date, r.details, r.account, r.accountType, r.expenseNo].map(x=>x||'').join(' ').toLowerCase().includes(searchText));
        }
        allRows = rows; filteredRows = [...allRows];
        if (sortCol >= 0) doSort();
        renderTable(); renderTotals();
        showToast(`تم العثور على ${filteredRows.length} سجل`, 'success');
      }
    }).catch(err => showAlert('خطأ: ' + err.message, '❌'));
}

const COL_KEYS = ['expenseNo','date','details','usd','eur','gbp','le','vUSD','vEUR','vGBP','vLE','account','accountType','month','year','centerName','branchName'];
const NUM_COLS = ['usd','eur','gbp','le','vUSD','vEUR','vGBP','vLE'];
const HEADERS = ['رقم','التاريخ','التفاصيل','$','€','£','LE','V$','V€','V£','VLE','الحساب','النوع','الشهر','السنة','المركز','الفرع','إجراءات'];

function doSort() {
  const key = COL_KEYS[sortCol];
  filteredRows.sort((a,b) => {
    let va = a[key]??'', vb = b[key]??'';
    if(key==='date'){ va = ddToTs(va); vb = ddToTs(vb); }
    else if(NUM_COLS.includes(key)){ va = parseFloat(va)||0; vb = parseFloat(vb)||0; }
    else{ va = String(va).toLowerCase(); vb = String(vb).toLowerCase(); }
    return va<vb ? -sortDir : va>vb ? sortDir : 0;
  });
}

function setSort(col) { sortDir = (sortCol===col) ? -sortDir : 1; sortCol = col; doSort(); renderTable(); renderTotals(); }
function resetFilter() { document.getElementById('fFromDate').value=''; document.getElementById('fToDate').value=''; document.getElementById('fSearch').value=''; loadListForDate(document.getElementById('fDateInput').value || todayISO()); }

function renderTable() {
  const wrap = document.getElementById('tableWrap');
  if (!filteredRows.length) { wrap.innerHTML = '<div class="no-data">📭 لا توجد سجلات لعرضها</div>'; return; }

  let html = `<table><thead><tr>`;
  HEADERS.forEach((h, i) => {
    if (i < COL_KEYS.length) {
      const arrow = (sortCol === i) ? (sortDir === 1 ? ' ↑' : ' ↓') : '';
      html += `<th onclick="setSort(${i})">${h}${arrow}</th>`;
    } else {
      html += `<th>${h}</th>`;
    }
  });
  html += `</tr></thead><tbody>`;

  filteredRows.forEach((r, i) => {
    const rowClass = (i === selectedIdx) ? 'sel' : '';
    const todayFlag = isToday(r);
    const isCanceled = (r.details || '').includes('إلغاء') || (r.details || '').includes('عكسي');

    html += `<tr ondblclick="loadRow(${i})" class="${rowClass}">
      <td style="font-weight:700;">${escapeHtml(r.expenseNo || '-')}</td>
      <td>${escapeHtml(r.date || '-')}</td>
      <td style="text-align:right;white-space:normal;max-width:180px;" title="${escapeHtml(r.details || '')}">${escapeHtml(truncate(r.details || '-', 32))}</td>
      <td class="amt">${fmtNum(r.usd)}</td><td class="amt">${fmtNum(r.eur)}</td><td class="amt">${fmtNum(r.gbp)}</td><td class="amt">${fmtNum(r.le)}</td>
      <td class="amt">${fmtNum(r.vUSD)}</td><td class="amt">${fmtNum(r.vEUR)}</td><td class="amt">${fmtNum(r.vGBP)}</td><td class="amt">${fmtNum(r.vLE)}</td>
      <td>${escapeHtml(r.account || '-')}</td><td>${escapeHtml(r.accountType || '-')}</td>
      <td>${escapeHtml(r.month || '-')}</td><td>${escapeHtml(r.year || '-')}</td>
      <td>${escapeHtml(r.centerName || '-')}</td><td>${escapeHtml(r.branchName || '-')}</td>
      <td>
        <div style="display:flex; gap:4px; justify-content:center;">
          <button class="dbtn dbtn-danger" onclick="confirmDelete(${i})" ${!todayFlag || isCanceled ? 'disabled' : ''} title="${!todayFlag ? 'لا يمكن حذف سجلات من أيام سابقة' : isCanceled ? 'هذا السجل ملغى بالفعل' : 'حذف'}">🗑️</button>
          ${!isCanceled ? `<button class="dbtn dbtn-warning" onclick="confirmCancel(${i})" title="إلغاء عكسي">⚠️</button>` : ''}
        </div>
      </td>
    </tr>`;
  });

  html += `</tbody></table>`;
  wrap.innerHTML = html;
}

function renderTotals() {
  const sums = { usd:0, eur:0, gbp:0, le:0, vUSD:0, vEUR:0, vGBP:0, vLE:0 };
  filteredRows.forEach(r => { for(let k in sums) sums[k] += parseFloat(r[k])||0; });
  document.getElementById('totalsFooter').innerHTML = `
    <div class="total-item"><span class="total-label">📊 عدد:</span><span class="total-value">${filteredRows.length}</span></div>
    <div class="total-item"><span class="total-label">$:</span><span class="total-value">${fmtNum(sums.usd)}</span></div>
    <div class="total-item"><span class="total-label">€:</span><span class="total-value">${fmtNum(sums.eur)}</span></div>
    <div class="total-item"><span class="total-label">£:</span><span class="total-value">${fmtNum(sums.gbp)}</span></div>
    <div class="total-item"><span class="total-label">LE:</span><span class="total-value">${fmtNum(sums.le)}</span></div>
    <div class="total-item"><span class="total-label">V$:</span><span class="total-value">${fmtNum(sums.vUSD)}</span></div>
    <div class="total-item"><span class="total-label">V€:</span><span class="total-value">${fmtNum(sums.vEUR)}</span></div>
    <div class="total-item"><span class="total-label">V£:</span><span class="total-value">${fmtNum(sums.vGBP)}</span></div>
    <div class="total-item"><span class="total-label">VLE:</span><span class="total-value">${fmtNum(sums.vLE)}</span></div>
  `;
}

function collectForm() {
  const dueDateISO = document.getElementById('fDueDate').value;
  return {
    date: isoToDD(document.getElementById('fDateInput').value),
    details: document.getElementById('fDetails').value.trim(),
    usd: parseFloat(document.getElementById('fUSD').value)||0, eur: parseFloat(document.getElementById('fEUR').value)||0,
    gbp: parseFloat(document.getElementById('fGBP').value)||0, le: parseFloat(document.getElementById('fLE').value)||0,
    vUSD: parseFloat(document.getElementById('fVUSD').value)||0, vEUR: parseFloat(document.getElementById('fVEUR').value)||0,
    vGBP: parseFloat(document.getElementById('fVGBP').value)||0, vLE: parseFloat(document.getElementById('fVLE').value)||0,
    account: document.getElementById('fAcc').value.trim(), accountType: document.getElementById('fAccT').value.trim(),
    month: document.getElementById('fMonth').value.trim(), year: document.getElementById('fYear').value.trim(),
    centerName: currentUser?.centerName || '', branchName: currentUser?.branchName || '',
    userID: currentUser?.id || currentUser?.name || '',
    dueDate: dueDateISO ? isoToDD(dueDateISO) : isoToDD(document.getElementById('fDateInput').value)
  };
}

function validate(row) {
  let ok = true;
  if(!row.date){ document.getElementById('fDateInput').classList.add('err'); ok=false; }
  else document.getElementById('fDateInput').classList.remove('err');
  if(!row.details){ document.getElementById('fDetails').classList.add('err'); ok=false; }
  else document.getElementById('fDetails').classList.remove('err');
  if(![row.usd,row.eur,row.gbp,row.le,row.vUSD,row.vEUR,row.vGBP,row.vLE].some(v=>v>0)){ showToast('أدخل مبلغاً واحداً على الأقل','error'); ok=false; }
  return ok;
}

function resetForm() {
  ['fDetails','fAcc','fAccT','fUSD','fEUR','fGBP','fLE','fVUSD','fVEUR','fVGBP','fVLE','fDueDate'].forEach(id=>{ const el=document.getElementById(id); if(el){ el.value=''; el.classList.remove('err'); }});
  const iso = todayISO(); document.getElementById('fDateInput').value = iso;
  const parts = iso.split('-');
  if (parts.length === 3) { document.getElementById('fMonth').value = MN[parseInt(parts[1])-1] || ''; document.getElementById('fYear').value = parts[0]; }
  document.getElementById('fDateInput').classList.remove('err'); cancelEdit();
}

async function submitEntry() {
  const row = collectForm();
  if(!validate(row)) return;
  const sheet = currentType==='expense' ? 'Expenses' : 'Other_Revenues';
  const isEdit = editRowNum > 0 ? '1' : '0';
  
  const btn = document.getElementById('saveBtn'); btn.disabled = true; btn.textContent = '⏳ جاري الحفظ...';
  
  try {
    const res = await gasGet({
      action:'saveExpRev', sheet, isEdit, rowNum: editRowNum>0 ? editRowNum : 0,
      date:row.date, details:row.details, usd:row.usd, eur:row.eur, gbp:row.gbp, le:row.le,
      vUSD:row.vUSD, vEUR:row.vEUR, vGBP:row.vGBP, vLE:row.vLE, account:row.account, accountType:row.accountType,
      month:row.month, year:row.year, branchName:row.branchName, userID:row.userID, dueDate: row.dueDate
    });
    
    if(res.success){
      showToast(isEdit==='1' ? '✅ تم التحديث بنجاح' : '✅ تم الحفظ بنجاح', 'success');
      cancelEdit(); resetForm(); delete optionsCache[sheet];
      loadListForDate(document.getElementById('fDateInput').value || todayISO());
    } else {
      showAlert(res.message || 'فشل الحفظ', '❌');
    }
  } catch(err) {
    showAlert('خطأ: '+err.message, '❌');
  } finally {
    btn.disabled = false; btn.textContent = currentType==='expense' ? '💾 حفظ Expense' : '💾 حفظ Revenue';
  }
}
function exportToExcel() {
  if (!filteredRows || filteredRows.length === 0) {
    showAlert('لا توجد بيانات لتصديرها', '📊');
    return;
  }

  // ✅ 1. قراءة التواريخ من الفلاتر
  const fromDateVal = document.getElementById('fFromDate').value; // ISO (YYYY-MM-DD)
  const toDateVal = document.getElementById('fToDate').value;     // ISO (YYYY-MM-DD)
  
  let fileDateStr = '';
  
  if (fromDateVal && toDateVal) {
    if (fromDateVal === toDateVal) {
      // نفس اليوم
      fileDateStr = isoToDD(fromDateVal).replace(/\//g, '-');
    } else {
      // فترة زمنية
      fileDateStr = `من_${isoToDD(fromDateVal).replace(/\//g, '-')}_إلى_${isoToDD(toDateVal).replace(/\//g, '-')}`;
    }
  } else {
    // تاريخ اليوم
    fileDateStr = isoToDD(todayISO()).replace(/\//g, '-');
  }

  // 2. تجهيز البيانات
  const exportData = filteredRows.map(r => {
    return {
      expenseNo: r.expenseNo || '',
      date: r.date || '',
      details: r.details || '',
      usd: parseFloat(r.usd) || 0,
      eur: parseFloat(r.eur) || 0,
      gbp: parseFloat(r.gbp) || 0,
      le: parseFloat(r.le) || 0,
      vUSD: parseFloat(r.vUSD) || 0,
      vEUR: parseFloat(r.vEUR) || 0,
      vGBP: parseFloat(r.vGBP) || 0,
      vLE: parseFloat(r.vLE) || 0,
      account: r.account || '',
      accountType: r.accountType || '',
      month: r.month || '',
      year: r.year || '',
      centerName: r.centerName || '',
      branchName: r.branchName || ''
    };
  });

  // 3. حساب الإجماليات
  const totals = { usd: 0, eur: 0, gbp: 0, le: 0, vUSD: 0, vEUR: 0, vGBP: 0, vLE: 0 };
  exportData.forEach(r => {
    for (let k in totals) totals[k] += r[k];
  });

  // 4. بناء HTML بتنسيق Excel الاحترافي
  const typeLabel = currentType === 'expense' ? 'المصروفات' : 'الإيرادات';
  
  let html = '';
  html += '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">';
  html += '<head>';
  html += '<meta charset="UTF-8">';
  html += '<style>';
  html += 'table{border-collapse:collapse;font-family:Arial,sans-serif;font-size:10px;width:100%;}';
  html += 'th{background:#1a3260;color:#f5c842;padding:6px 4px;border:1px solid #94a3b8;font-weight:bold;text-align:center;}';
  html += 'td{padding:4px 3px;border:1px solid #cbd5e1;vertical-align:middle;text-align:center;font-size:10px;}';
  html += '.title{background:#0f1f3d;color:#f5c842;font-size:16px;font-weight:bold;padding:14px;text-align:center;}';
  html += '.subtitle{background:#f1f5f9;padding:10px;text-align:center;font-weight:bold;font-size:12px;color:#0f1f3d;}';
  html += '.totals{background:#dbeafe;font-weight:bold;color:#0f1f3d;}';
  html += '.totals td{padding:6px 4px;}';
  html += '.details-cell{text-align:right; white-space:normal; word-break:break-word; max-width:200px;}';
  html += '</style>';
  html += '</head>';
  html += '<body>';

  // 5. عنوان التقرير
  html += '<table border="1">';
  html += `<tr><td colspan="17" class="title">📊 تقرير ${typeLabel} - ${fileDateStr}</td></tr>`;
  html += `<tr><td colspan="17" class="subtitle">`;
  html += `🏢 المركز: ${escapeHtml(currentUser?.centerName || '')} &nbsp;|&nbsp; `;
  html += `👤 المستخدم: ${escapeHtml(currentUser?.name || '')} &nbsp;|&nbsp; `;
  html += `📊 عدد السجلات: ${exportData.length}`;
  html += `</td></tr>`;
  html += '</table><br>';

  // 6. جدول البيانات
  html += '<table border="1">';
  html += '<thead><tr>';
  
  const headers = ['رقم المعاملة', 'التاريخ', 'التفاصيل', '$', '€', '£', 'LE', 'V$', 'V€', 'V£', 'VLE', 'الحساب', 'النوع', 'الشهر', 'السنة', 'المركز', 'الفرع'];
  headers.forEach(h => {
    html += `<th>${h}</th>`;
  });
  html += '</tr></thead>';
  html += '<tbody>';

  // 7. صفوف البيانات
  exportData.forEach(r => {
    html += '<tr>';
    html += `<td>${escapeHtml(r.expenseNo)}</td>`;
    html += `<td>${escapeHtml(r.date)}</td>`;
    html += `<td class="details-cell">${escapeHtml(r.details)}</td>`;
    html += `<td>${r.usd || ''}</td>`;
    html += `<td>${r.eur || ''}</td>`;
    html += `<td>${r.gbp || ''}</td>`;
    html += `<td>${r.le || ''}</td>`;
    html += `<td>${r.vUSD || ''}</td>`;
    html += `<td>${r.vEUR || ''}</td>`;
    html += `<td>${r.vGBP || ''}</td>`;
    html += `<td>${r.vLE || ''}</td>`;
    html += `<td>${escapeHtml(r.account)}</td>`;
    html += `<td>${escapeHtml(r.accountType)}</td>`;
    html += `<td>${escapeHtml(r.month)}</td>`;
    html += `<td>${escapeHtml(r.year)}</td>`;
    html += `<td>${escapeHtml(r.centerName)}</td>`;
    html += `<td>${escapeHtml(r.branchName)}</td>`;
    html += '</tr>';
  });

  // 8. صف الإجماليات
  html += '<tr class="totals">';
  html += `<td colspan="3" style="text-align:center;">📊 الإجمالي (${exportData.length} حركة)</td>`;
  html += `<td>${totals.usd > 0 ? totals.usd.toFixed(2) : ''}</td>`;
  html += `<td>${totals.eur > 0 ? totals.eur.toFixed(2) : ''}</td>`;
  html += `<td>${totals.gbp > 0 ? totals.gbp.toFixed(2) : ''}</td>`;
  html += `<td>${totals.le > 0 ? totals.le.toFixed(2) : ''}</td>`;
  html += `<td>${totals.vUSD > 0 ? totals.vUSD.toFixed(2) : ''}</td>`;
  html += `<td>${totals.vEUR > 0 ? totals.vEUR.toFixed(2) : ''}</td>`;
  html += `<td>${totals.vGBP > 0 ? totals.vGBP.toFixed(2) : ''}</td>`;
  html += `<td>${totals.vLE > 0 ? totals.vLE.toFixed(2) : ''}</td>`;
  html += `<td colspan="6"></td>`;
  html += '</tr>';

  html += '</tbody></table>';
  html += '</body></html>';

  // 9. تنزيل الملف
  const blob = new Blob([html], { type: 'application/vnd.ms-excel;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  // ✅ اسم الملف سيكون ديناميكياً بناءً على التواريخ
  a.download = `${typeLabel}_${fileDateStr}.xls`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  showToast(`✅ تم تصدير ${exportData.length} سجل بنجاح`, 'success');
}
  
function loadRow(idx) {
  const r = filteredRows[idx]; if (!r) return;
  const todayFlag = isToday(r);
  selectedIdx = idx; editRowNum = r._rowNum;
  const setVal = (id, val) => { const el = document.getElementById(id); if(el){ el.value = val || ''; el.classList.remove('err'); } };

  setVal('fDateInput', ddToISO(r.date)); setVal('fMonth', r.month); setVal('fYear', r.year);
  setVal('fDetails', r.details); setVal('fAcc', r.account); setVal('fAccT', r.accountType);
  setVal('fDueDate', ddToISO(r.dueDate || r.date));

  const paymentFields = ['fUSD','fEUR','fGBP','fLE','fVUSD','fVEUR','fVGBP','fVLE'];
  if (todayFlag) {
    setVal('fUSD', fmtNum(r.usd)); setVal('fEUR', fmtNum(r.eur)); setVal('fGBP', fmtNum(r.gbp)); setVal('fLE', fmtNum(r.le));
    setVal('fVUSD', fmtNum(r.vUSD)); setVal('fVEUR', fmtNum(r.vEUR)); setVal('fVGBP', fmtNum(r.vGBP)); setVal('fVLE', fmtNum(r.vLE));
    paymentFields.forEach(id => { const el = document.getElementById(id); if(el) { el.disabled = false; el.style.opacity = '1'; el.style.background = 'white'; }});
    document.getElementById('editRowLabel').textContent = r.expenseNo || 'صف ' + editRowNum + ' (قابل للتعديل الكامل)';
  } else {
    paymentFields.forEach(id => { const el = document.getElementById(id); if(el) { el.disabled = true; el.style.opacity = '0.6'; el.style.background = '#f0f0f0'; }});
    setVal('fUSD', ''); setVal('fEUR', ''); setVal('fGBP', ''); setVal('fLE', ''); setVal('fVUSD', ''); setVal('fVEUR', ''); setVal('fVGBP', ''); setVal('fVLE', '');
    document.getElementById('editRowLabel').textContent = r.expenseNo || 'صف ' + editRowNum + ' (🔒 تعديل التفاصيل فقط - المبالغ مقفلة)';
  }

  document.getElementById('ebanner').classList.add('show');
  document.getElementById('saveBtn').textContent = currentType === 'expense' ? '✏️ تحديث Expense' : '✏️ تحديث Revenue';
  renderTable(); showToast(todayFlag ? '✅ تم تحميل السطر للتعديل الكامل' : '🔒 تم تحميل السطر (المبالغ مقفلة)', todayFlag ? 'success' : 'info');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
  selectedIdx = -1; editRowNum = -1; document.getElementById('ebanner').classList.remove('show');
  document.getElementById('saveBtn').textContent = currentType==='expense' ? '💾 حفظ Expense' : '💾 حفظ Revenue';
  ['fUSD','fEUR','fGBP','fLE','fVUSD','fVEUR','fVGBP','fVLE'].forEach(id => { const el = document.getElementById(id); if(el) { el.disabled = false; el.style.opacity = '1'; el.style.background = 'white'; }});
  renderTable();
}

function confirmDelete(idx) {
  const r = filteredRows[idx]; if(!r) return;
  if (!isToday(r)) { showAlert('⚠️ لا يمكن حذف سجلات من أيام سابقة.', '🚫'); return; }
  pendingDeleteRowNum = r._rowNum; pendingDeleteRowData = r;
  document.getElementById('deleteConfirmMsg').innerHTML = `التفاصيل: <strong>${escapeHtml(r.details)}</strong><br>التاريخ: <strong>${escapeHtml(r.date)}</strong><br>رقم المعاملة: <strong>${escapeHtml(r.expenseNo || '-')}</strong><br><br><span style="color:#dc2626; font-size:11px;">لا يمكن التراجع عن هذا الإجراء.</span>`;
  document.getElementById('deleteConfirmModal').classList.add('open');
}
function closeDeleteConfirmModal() { pendingDeleteRowNum = null; pendingDeleteRowData = null; document.getElementById('deleteConfirmModal').classList.remove('open'); }

async function executeDelete() {
  if(!pendingDeleteRowNum) return;
  const rowNum = pendingDeleteRowNum; closeDeleteConfirmModal();
  showToast('جاري الحذف...', 'info');
  try {
    const res = await gasGet({action:'deleteExpRev', sheet: currentType==='expense'?'Expenses':'Other_Revenues', rowNum: rowNum});
    if(res.success){
      showToast('🗑️ تم الحذف بنجاح', 'success');
      allRows = allRows.filter(x => x._rowNum !== rowNum);
      loadListForDate(document.getElementById('fDateInput').value || todayISO());
      if(editRowNum === rowNum) cancelEdit();
    } else { showAlert(res.message || 'فشل الحذف', '❌'); }
  } catch(err) { showAlert('خطأ: '+err.message, '❌'); }
}

function confirmCancel(idx) {
  const r = filteredRows[idx]; 
  if(!r) return;

  // ✅ التحقق من الجدول الحالي مباشرة (بدلاً من allRows)
  const targetVoucher = r.expenseNo || ''; 
  const rows = document.querySelectorAll('#tableWrap tbody tr');
  
  let isAlreadyCanceled = false;
  rows.forEach(row => {
    const detailsCell = row.querySelector('td:nth-child(3)');
    if (detailsCell) {
      const text = detailsCell.innerText;
      if (text.includes('إلغاء عكسي') && text.includes(targetVoucher)) {
        isAlreadyCanceled = true;
      }
    }
  });

  if (isAlreadyCanceled) {
    showAlert('⚠️ هذا السجل تم إلغاؤه بعمل قيد عكسي مسبقاً. لا يمكنك إلغاؤه مرتين.', '🚫');
    return;
  }
  // ✅ 2. تنظيف التفاصيل (إذا كانت تحتوي على JSON)
  let cleanDetails = r.details || '';
  if (cleanDetails.includes('{"cashUSD"') || cleanDetails.includes('{"cashEUR"')) {
    cleanDetails = cleanDetails.split('{')[0].trim(); 
  }

  // ✅ 3. تجميع المبالغ
  let amountsStr = [];
  if (Number(r.usd) > 0) amountsStr.push(`${r.usd} $`);
  if (Number(r.eur) > 0) amountsStr.push(`${r.eur} €`);
  if (Number(r.gbp) > 0) amountsStr.push(`${r.gbp} £`);
  if (Number(r.le) > 0) amountsStr.push(`${r.le} LE`);
  if (Number(r.vUSD) > 0) amountsStr.push(`${r.vUSD} Visa$`);
  if (Number(r.vEUR) > 0) amountsStr.push(`${r.vEUR} Visa€`);
  if (Number(r.vGBP) > 0) amountsStr.push(`${r.vGBP} Visa£`);
  if (Number(r.vLE) > 0) amountsStr.push(`${r.vLE} VisaLE`);

  const amountDisplay = amountsStr.length > 0 ? amountsStr.join(' + ') : '0';

  // ✅ 4. عرض النافذة
  document.getElementById('cancelConfirmMsg').innerHTML = `
    أنت على وشك إلغاء هذا السجل بعمل قيد عكسي في الشيت الآخر.<br><br>
    التفاصيل: <strong>${escapeHtml(cleanDetails)}</strong><br>
    المبلغ: <strong style="color:#ea580c; font-size:16px;">${escapeHtml(amountDisplay)}</strong><br><br>
    <span style="color:#16a34a; font-size:12px;">✅ سيتم تسجيل القيد العكسي بتاريخ اليوم (${new Date().toLocaleDateString('ar-EG')}) للحفاظ على رصيد الخزينة.</span>
  `;
  
  pendingCancelRowNum = r._rowNum;
  pendingCancelRowData = r;

  document.getElementById('cancelConfirmModal').classList.add('open');
}
  
function closeCancelConfirmModal() { pendingCancelRowNum = null; pendingCancelRowData = null; document.getElementById('cancelConfirmModal').classList.remove('open'); }

async function executeCancel() {
  if(!pendingCancelRowNum || !pendingCancelRowData) return;
  const r = pendingCancelRowData; 
  closeCancelConfirmModal();
  
  showToast('جاري الإلغاء العكسي...', 'info');
  const isExpense = currentType === 'expense';
  const targetSheet = isExpense ? 'Other_Revenues' : 'Expenses'; // الشيت العكسي
  
  // ✅ 1. تاريخ اليوم (وليس تاريخ العملية الأصلية)
  const todayIso = todayISO();
  const todayDD = isoToDD(todayIso);
  
  // ✅ 2. تغيير الحساب والنوع لتجنب التأثير على تقارير المستفيدين الحقيقيين
  const cancelAccount = 'Refund / Adjustment';
  const cancelAccountType = 'Cancel';

  try {
    const res = await gasGet({
      action: 'saveExpRev', 
      sheet: targetSheet, 
      isEdit: '0', 
      rowNum: 0,
      
      // ✅ استخدام تاريخ اليوم
      date: todayDD, 
      
      details: `إلغاء عكسي للسجل رقم ${r.expenseNo || r._rowNum} الأصلي (${r.date})`,
      
      // نفس المبالغ
      usd: r.usd, eur: r.eur, gbp: r.gbp, le: r.le,
      vUSD: r.vUSD, vEUR: r.vEUR, vGBP: r.vGBP, vLE: r.vLE,
      
      // ✅ الحساب والنوع الجديد
      account: cancelAccount, 
      accountType: cancelAccountType,
      
      month: MN[new Date().getMonth()], // شهر اليوم
      year: new Date().getFullYear().toString(), // سنة اليوم
      branchName: currentUser?.branchName || '', 
      userID: currentUser.id,
      userName: currentUser.name || ''
    });

    if(res.success) {
      showToast('✅ تم الإلغاء العكسي بنجاح (بتاريخ اليوم)', 'success');
      loadListForDate(document.getElementById('fDateInput').value || todayIso);
    } else {
      showAlert('فشل الإلغاء: ' + res.message, '❌');
    }
  } catch(err) {
    showAlert('خطأ: ' + err.message, '❌');
  }
}

window.switchType = switchType; window.onDateChange = onDateChange; window.applyDateFilter = applyDateFilter;
