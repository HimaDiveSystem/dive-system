<!DOCTYPE html>
<html dir="ltr">
<head>
  <base target="_top">
  <meta charset="UTF-8">
<meta name="theme-color" content="#0f1f3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="description" content="خطة العمل اليومية - Dive System">
<meta name="author" content="Dive System">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes">
  <title>📅 Daily Operations Plan</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="ui.js"></script>
  <script src="config.js"></script>
  <script src="session.js"></script>
  <style>
    :root {
      --navy: #0f1f3d;
      --navy2: #1a3260;
      --gold: #f5c842;
      --gold2: #e6b800;
      --blue: #2563eb;
      --green: #16a34a;
      --red: #dc2626;
      --orange: #ea580c;
      --purple: #7c3aed;
      --teal: #0d9488;
      --bg: #f0f4f8;
      --card: #fff;
      --border: #dde4f0;
      --text: #1a2540;
      --text-lt: #5a6a8a;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-500: #64748b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      direction: rtl;
    }
    
    /* ===== HEADER ===== */
    .header {
      background: linear-gradient(135deg, var(--navy), var(--navy2));
      color: white;
      padding: 12px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 3px 16px rgba(15,31,61,.25);
    }
    .header h2 {
      color: var(--gold);
      font-size: 18px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .user-chip {
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 40px;
      padding: 4px 13px;
      color: white;
      font-size: 12px;
      font-weight: 600;
    }
    .back-btn {
      background: transparent;
      border: 2px solid rgba(255,255,255,.3);
      color: white;
      padding: 4px 13px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
      font-family: 'Cairo', sans-serif;
      transition: all .2s;
    }
    .back-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }
    
    /* ===== FILTER BAR ===== */
    .filter-bar {
      position: sticky;
      top: 60px;
      z-index: 199;
      background: white;
      border-bottom: 2px solid var(--border);
      padding: 10px 20px;
      box-shadow: 0 3px 8px rgba(0,0,0,.05);
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .fg {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .fg label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-lt);
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .fc {
      padding: 8px 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Cairo', sans-serif;
      color: var(--text);
      background: white;
      height: 38px;
      min-width: 180px;
    }
    .fc:focus {
      border-color: var(--blue);
      outline: none;
    }
    .dw {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .cal-btn {
      padding: 6px 10px;
      background: var(--navy);
      color: var(--gold);
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      height: 38px;
    }
    .cal-btn:hover { background: var(--navy2); }
    .fbtns {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .fbtn {
      padding: 8px 20px;
      border: none;
      border-radius: 20px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      height: 38px;
      transition: all .2s;
    }
    .fbtn-go {
      background: var(--navy);
      color: var(--gold);
    }
    .fbtn-go:hover { background: var(--navy2); }
    .fbtn-rs {
      background: #f1f5f9;
      color: var(--text);
    }
    .fbtn-rs:hover { background: #e2e8f0; }
    .print-btn {
      background: var(--orange);
      color: white;
    }
    .print-btn:hover { background: #c2410c; }
    
    /* ===== TABS ===== */
    .tabs-container {
      padding: 16px 20px 0 20px;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
    }
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .tab {
      background: white;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all .25s;
      text-align: center;
      font-family: inherit;
      box-shadow: 0 2px 6px rgba(15,31,61,.04);
    }
    .tab:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(15,31,61,.12);
      border-color: var(--gold);
    }
    .tab.active {
      background: linear-gradient(135deg, var(--navy), var(--navy2));
      color: white;
      border-color: var(--gold);
      box-shadow: 0 8px 20px rgba(15,31,61,.25);
    }
    .tab-icon {
      font-size: 26px;
      margin-bottom: 4px;
      line-height: 1;
    }
    .tab-title {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--navy);
    }
    .tab.active .tab-title { color: var(--gold); }
    .tab-stats {
      display: flex;
      justify-content: center;
      gap: 10px;
      font-size: 11px;
      flex-wrap: wrap;
    }
    .tab-stat {
      color: var(--gray-500);
      font-weight: 600;
      white-space: nowrap;
    }
    .tab.active .tab-stat { color: #cbd5e1; }
    .tab-stat strong {
      color: var(--navy);
      font-size: 15px;
      font-weight: 900;
      margin-right: 2px;
    }
    .tab.active .tab-stat strong { color: var(--gold); }
    .tab-stat.green strong { color: var(--green); }
    .tab.active .tab-stat.green strong { color: #4ade80; }
    
    /* ===== CONTENT ===== */
    .content {
      padding: 16px 20px 30px 20px;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    /* ===== ACTION BAR ===== */
    .action-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .action-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      transition: all .2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .action-btn.select-all {
      background: var(--blue);
      color: white;
    }
    .action-btn.select-all:hover { background: #1d4ed8; }
    .action-btn.clear-all {
      background: var(--gray-100);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .action-btn.clear-all:hover { background: var(--gray-200); }
    .action-btn.send-wa {
      background: #25D366;
      color: white;
    }
    .action-btn.send-wa:hover { background: #128C7E; }
    .action-btn.send-em {
      background: var(--red);
      color: white;
    }
    .action-btn.send-em:hover { background: #b91c1c; }
    .action-btn.send-pdf {
      background: var(--purple);
      color: white;
    }
    .action-btn.send-pdf:hover { background: #6d28d9; }
    
    /* ===== ACCORDION ===== */
    .accordion-item {
      background: white;
      border-radius: 14px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(15,31,61,.06);
      overflow: hidden;
      border: 1px solid var(--border);
      transition: box-shadow .25s;
    }
    .accordion-item:hover { box-shadow: 0 4px 14px rgba(15,31,61,.12); }
    .accordion-item.warning {
      border-color: var(--orange);
      box-shadow: 0 2px 10px rgba(234,88,12,.15);
    }
    .accordion-item.danger {
      border-color: var(--red);
      box-shadow: 0 2px 10px rgba(220,38,38,.15);
    }
    .accordion-header {
      background: linear-gradient(135deg, var(--navy), var(--navy2));
      color: white;
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      user-select: none;
      flex-wrap: wrap;
    }
    .accordion-header:hover { filter: brightness(1.1); }
    .accordion-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .accordion-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: var(--gold);
      flex-shrink: 0;
    }
    .accordion-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--gold);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .accordion-subtitle {
      font-size: 11px;
      color: #cbd5e1;
      font-weight: 500;
      margin-top: 2px;
    }
    .accordion-stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .stat-badge {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      color: white;
      white-space: nowrap;
    }
    .stat-badge.green { background: rgba(22,163,74,.3); border-color: rgba(22,163,74,.5); }
    .stat-badge.orange { background: rgba(234,88,12,.3); border-color: rgba(234,88,12,.5); }
    .stat-badge.red { background: rgba(220,38,38,.3); border-color: rgba(220,38,38,.5); }
    .stat-badge.gold { background: rgba(245,200,66,.2); border-color: rgba(245,200,66,.4); color: var(--gold); }
    .accordion-arrow {
      font-size: 14px;
      color: var(--gold);
      transition: transform .3s;
      flex-shrink: 0;
    }
    .accordion-item.open .accordion-arrow { transform: rotate(180deg); }
    .accordion-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height .35s ease;
    }
    .accordion-item.open .accordion-body { max-height: 3000px; }
    .accordion-body-inner {
      padding: 14px 16px;
      background: var(--gray-50);
    }
    
    /* ===== INVOICE TABLE ===== */
    .inv-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(15,31,61,.06);
    }
    .inv-table thead th {
      background: var(--navy);
      color: var(--gold);
      padding: 10px 8px;
      text-align: center;
      font-weight: 700;
      font-size: 11px;
      white-space: nowrap;
    }
    .inv-table tbody td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--gray-200);
      text-align: center;
      white-space: nowrap;
      color: var(--text);
      font-size: 12px;
    }
    .inv-table tbody tr:last-child td { border-bottom: none; }
    .inv-table tbody tr:hover { background: #fef9e7; }
    .inv-table .time-col {
      font-weight: 900;
      color: var(--navy);
      font-family: 'Courier New', monospace;
      font-size: 13px;
    }
    .inv-table .voucher-link {
      color: var(--blue);
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
    }
    .inv-table .voucher-link:hover { color: var(--navy); }
    .inv-table .rest-pos {
      color: var(--red);
      font-weight: 800;
      font-family: 'Courier New', monospace;
    }
    .inv-table .rest-zero {
      color: var(--green);
      font-weight: 800;
    }
    .inv-table .pax-badge {
      background: var(--navy);
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      display: inline-block;
      min-width: 24px;
    }
    .inv-table .trip-name {
      font-weight: 700;
      color: var(--navy);
      white-space: normal;
      word-break: break-word;
      max-width: 200px;
    }
    .inv-table .hotel-name {
      color: var(--text);
      white-space: normal;
      word-break: break-word;
      max-width: 180px;
    }
    .total-row td {
      background: #dbeafe !important;
      font-weight: 900;
      color: var(--navy) !important;
      border-top: 2px solid var(--navy);
      font-size: 12px;
    }
    
    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-lt);
    }
    .empty-state-icon {
      font-size: 56px;
      margin-bottom: 12px;
      opacity: .6;
    }
    .empty-state h3 {
      font-size: 16px;
      color: var(--navy);
      margin-bottom: 6px;
    }
    .empty-state p {
      font-size: 13px;
      color: var(--text-lt);
    }
    
    /* ===== LOADER ===== */
    .loader-wrap {
      text-align: center;
      padding: 60px;
      color: var(--text-lt);
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* ===== MODAL ===== */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,.6);
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: white;
      border-radius: 18px;
      max-width: 600px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
      animation: slideUp .3s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px) scale(.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--gold);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .modal-header h3 {
      color: var(--navy);
      font-size: 16px;
      font-weight: 800;
    }
    .modal-close {
      font-size: 24px;
      cursor: pointer;
      color: var(--gray-500);
      background: none;
      border: none;
      padding: 0 8px;
    }
    .modal-close:hover { color: var(--red); }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-lt);
      margin-bottom: 6px;
    }
    .form-group textarea, .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-size: 13px;
      resize: vertical;
    }
    .form-group textarea:focus, .form-group input:focus, .form-group select:focus {
      border-color: var(--blue);
      outline: none;
    }
    .modal-btns {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 16px;
    }
    .modal-btn {
      padding: 10px 24px;
      border: none;
      border-radius: 30px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      transition: all .2s;
    }
    .modal-btn.primary {
      background: var(--navy);
      color: var(--gold);
    }
    .modal-btn.primary:hover { background: var(--navy2); }
    .modal-btn.cancel {
      background: var(--gray-100);
      color: var(--text);
    }
    .modal-btn.cancel:hover { background: var(--gray-200); }
    
    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 13px;
      color: white;
      z-index: 99999;
      box-shadow: 0 6px 20px rgba(0,0,0,.25);
      opacity: 0;
      transition: all .35s cubic-bezier(0.34,1.56,0.64,1);
      max-width: 90vw;
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast-success { background: var(--green); }
    .toast-error { background: var(--red); }
    .toast-info { background: var(--blue); }
    
    /* ===== FOOTER ===== */
    .footer {
      text-align: center;
      padding: 14px 0 6px 0;
      color: #94a3b8;
      font-size: 11px;
      border-top: 1px solid var(--gray-200);
      margin-top: 20px;
    }
    .footer strong { color: var(--navy); }
    
    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .tabs { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .tab { padding: 10px 8px; }
      .tab-icon { font-size: 22px; }
      .tab-title { font-size: 12px; }
      .tab-stat strong { font-size: 13px; }
      .header h2 { font-size: 15px; }
      .filter-bar { top: auto; position: static; }
      .accordion-header { padding: 10px 12px; }
      .accordion-title { font-size: 13px; }
      .stat-badge { font-size: 10px; padding: 3px 8px; }
      .inv-table { font-size: 11px; }
      .inv-table thead th, .inv-table tbody td { padding: 8px 6px; }
      .action-bar { gap: 6px; }
      .action-btn { padding: 7px 12px; font-size: 11px; }
    }
    @media (max-width: 480px) {
      .tabs { grid-template-columns: 1fr 1fr; }
      .tab-title { font-size: 11px; }
      .tab-stats { flex-direction: column; gap: 2px; }
    }
    
    /* ===== PRINT ===== */
    @media print {
      .header, .filter-bar, .action-bar, .tabs-container,
      .footer, .modal, .toast { display: none !important; }
      body { background: white; }
      .content { padding: 0; max-width: 100%; }
      .accordion-item {
        page-break-inside: avoid;
        box-shadow: none;
        border: 1px solid #ccc;
        margin-bottom: 15px;
      }
      .accordion-body { max-height: none !important; }
    }
  </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<div class="header">
  <h2>📅 خطة العمل اليومية</h2>
  <div class="header-right">
    <span class="user-chip" id="userNameDisplay">—</span>
    <button class="back-btn" onclick="goBack()">← Back</button>
  </div>
</div>

<!-- ===== FILTER BAR ===== -->
<div class="filter-bar">
  <div class="fg">
    <label>📅 التاريخ</label>
    <div class="dw">
      <input type="text" class="fc" id="dateDisplay" placeholder="dd/MMM/yyyy" readonly style="cursor:pointer;" onclick="openDatePicker()">
      <button class="cal-btn" onclick="openDatePicker()">📅</button>
      <input type="date" id="datePickerHidden" style="position:absolute;opacity:0;width:0;height:0;pointer-events:none;" onchange="onDateSelected(this.value)">
    </div>
  </div>
  <div class="fbtns">
    <button class="fbtn fbtn-go" onclick="loadAllTabs()">🔄 تحديث</button>
    <button class="fbtn fbtn-rs" onclick="goToToday()">📅 اليوم</button>
    <button class="fbtn print-btn" onclick="printCurrentTab()">🖨️ طباعة</button>
  </div>
</div>

<!-- ===== TABS ===== -->
<div class="tabs-container">
  <div class="tabs">
    <button class="tab active" data-tab="trips" onclick="switchTab('trips')">
      <div class="tab-icon">🚌</div>
      <div class="tab-title">الرحلات</div>
      <div class="tab-stats">
        <span class="tab-stat">إجمالي: <strong id="stat-trips-total">0</strong></span>
        <span class="tab-stat green">أفراد: <strong id="stat-trips-pax">0</strong></span>
      </div>
    </button>
    <button class="tab" data-tab="boats" onclick="switchTab('boats')">
      <div class="tab-icon">⛵</div>
      <div class="tab-title">المراكب</div>
      <div class="tab-stats">
        <span class="tab-stat">إجمالي: <strong id="stat-boats-total">0</strong></span>
        <span class="tab-stat green">مُشغّلة: <strong id="stat-boats-active">0</strong></span>
      </div>
    </button>

<script>
// ============================================================
// INIT
// ============================================================
let currentUser = null;
let selectedDateISO = '';
let activeTab = 'trips';

// بيانات كل تبويب
let tripsData = [];
let boatsData = [];
let vehiclesData = [];
let instructorsData = [];

// تحديد العناصر المختارة (Set من IDs)
const selectedItems = {
  trips: new Set(),
  boats: new Set(),
  vehicles: new Set(),
  instructors: new Set()
};

// ============================================================
// Session Check
// ============================================================
if (!Session.checkValidity()) {
  throw new Error('جلسة غير صالحة');
}

// ============================================================
// UTILITIES
// ============================================================
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fmtDateDDMMMYYYY(date) {
  if (!date) return '';
  const d = date instanceof Date ? date : new Date(date);
  if (isNaN(d.getTime())) return '';
  return String(d.getDate()).padStart(2, '0') + '/' + MONTHS[d.getMonth()] + '/' + d.getFullYear();
}

function isoToTxt(iso) {
  if (!iso) return '';
  const parts = iso.split('-');
  if (parts.length !== 3) return '';
  const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
  return fmtDateDDMMMYYYY(d);
}

function txtToISO(txt) {
  if (!txt) return '';
  const m = txt.match(/^(\d{1,2})\/([A-Za-z]{3})\/(\d{4})$/);
  if (!m) return '';
  const mi = MONTHS.findIndex(x => x.toLowerCase() === m[2].toLowerCase());
  if (mi === -1) return '';
  return m[3] + '-' + String(mi + 1).padStart(2, '0') + '-' + m[1].padStart(2, '0');
}

function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function escHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[m]);
}

function showToast(msg, type) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.className = 'toast toast-' + (type || 'info');
  setTimeout(() => toast.classList.add('show'), 10);
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => {
    toast.classList.remove('show');
  }, 3000);
}

function roundToTwo(n) {
  if (typeof n !== 'number' || isNaN(n)) return 0;
  return Math.round((n + Number.EPSILON) * 100) / 100;
}

function formatRest(rest, currency) {
  if (!rest || rest <= 0) return '<span class="rest-zero">✓</span>';
  return '<span class="rest-pos">' + roundToTwo(rest).toFixed(2) + ' ' + escHtml(currency) + '</span>';
}

function formatRestSummary(restObj) {
  if (!restObj || Object.keys(restObj).length === 0) {
    return '<span class="rest-zero">✓</span>';
  }
  const parts = [];
  for (const [cur, amount] of Object.entries(restObj)) {
    if (amount > 0) {
      parts.push(roundToTwo(amount).toFixed(2) + ' ' + cur);
    }
  }
  if (parts.length === 0) return '<span class="rest-zero">✓</span>';
  return '<span class="rest-pos">' + parts.join(' | ') + '</span>';
}

// ============================================================
// GAS - JSONP
// ============================================================
function gas(action, params) {
  params = params || {};
  return new Promise((resolve, reject) => {
    const user = Session.getUser();
    if (user && user.centerName && !params.centerName) {
      params.centerName = user.centerName;
    }
    
    const cbName = 'cb_' + Date.now() + '_' + Math.random().toString(36).substring(2, 10);
    const url = new URL(CONFIG.GAS_URL);
    url.searchParams.set('action', action);
    url.searchParams.set('callback', cbName);
    url.searchParams.set('_t', Date.now());
    
    Object.keys(params).forEach(key => {
      if (params[key] !== undefined && params[key] !== null && params[key] !== '') {
        url.searchParams.set(key, String(params[key]));
      }
    });
    
    const timeout = setTimeout(() => {
      if (window[cbName]) {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        reject(new Error('Timeout: ' + action));
      }
    }, 60000);
    
    window[cbName] = function(data) {
      clearTimeout(timeout);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      resolve(data);
    };
    
    const script = document.createElement('script');
    script.src = url.toString();
    script.onerror = function() {
      clearTimeout(timeout);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      reject(new Error('Network error: ' + action));
    };
    document.body.appendChild(script);
  });
}

// ============================================================
// NAVIGATION
// ============================================================
function goBack() {
  const user = Session.getUser();
  if (user) Session.save(user);
  const dash = (CONFIG.DASHBOARD_PAGES && CONFIG.DASHBOARD_PAGES[user && user.type]) || 'OperationManager.html';
  window.location.href = dash;
}

function switchTab(tabName) {
  activeTab = tabName;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tabName);
  });
  document.querySelectorAll('.tab-content').forEach(c => {
    c.classList.remove('active');
  });
  const target = document.getElementById('tab-' + tabName);
  if (target) target.classList.add('active');
}

function openDatePicker() {
  const picker = document.getElementById('datePickerHidden');
  if (!picker) return;
  picker.value = selectedDateISO || todayISO();
  try { picker.showPicker(); } catch (e) { picker.click(); }
}

function onDateSelected(iso) {
  if (!iso) return;
  selectedDateISO = iso;
  document.getElementById('dateDisplay').value = isoToTxt(iso);
  loadAllTabs();
}

function goToToday() {
  selectedDateISO = todayISO();
  document.getElementById('dateDisplay').value = isoToTxt(selectedDateISO);
  loadAllTabs();
}

function printCurrentTab() {
  window.print();
}

// ============================================================
// LOAD DATA
// ============================================================
async function loadAllTabs() {
  if (!selectedDateISO) selectedDateISO = todayISO();
  
  // إظهار loaders
  document.getElementById('tripsContent').innerHTML = '<div class="loader-wrap"><div class="spinner"></div>Loading Trips...</div>';
  document.getElementById('boatsContent').innerHTML = '<div class="loader-wrap"><div class="spinner"></div>Loading Boats...</div>';
  document.getElementById('vehiclesContent').innerHTML = '<div class="loader-wrap"><div class="spinner"></div>Loading Vehicles...</div>';
  document.getElementById('instructorsContent').innerHTML = '<div class="loader-wrap"><div class="spinner"></div>Loading Instructors...</div>';
  
  // تحميل متوازي
  const results = await Promise.allSettled([
    gas('getTripsDailyPlan', { dateISO: selectedDateISO }),
    gas('getBoatsDailyPlan', { dateISO: selectedDateISO }),
    gas('getVehiclesDailyPlan', { dateISO: selectedDateISO }),
    gas('getInstructorsDailyPlan', { dateISO: selectedDateISO })
  ]);
  
  // Trips
  if (results[0].status === 'fulfilled' && results[0].value && results[0].value.success) {
    tripsData = results[0].value.data || [];
    renderTrips();
  } else {
    tripsData = [];
    document.getElementById('tripsContent').innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><h3>فشل تحميل الرحلات</h3><p>' + escHtml(results[0].reason?.message || results[0].value?.message || 'خطأ') + '</p></div>';
  }
  
  // Boats
  if (results[1].status === 'fulfilled' && results[1].value && results[1].value.success) {
    boatsData = results[1].value.data || [];
    renderBoats();
  } else {
    boatsData = [];
    document.getElementById('boatsContent').innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><h3>فشل تحميل المراكب</h3></div>';
  }
  
  // Vehicles
  if (results[2].status === 'fulfilled' && results[2].value && results[2].value.success) {
    vehiclesData = results[2].value.data || [];
    renderVehicles();
  } else {
    vehiclesData = [];
    document.getElementById('vehiclesContent').innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><h3>فشل تحميل السيارات</h3></div>';
  }
  
  // Instructors
  if (results[3].status === 'fulfilled' && results[3].value && results[3].value.success) {
    instructorsData = results[3].value.data || [];
    renderInstructors();
  } else {
    instructorsData = [];
    document.getElementById('instructorsContent').innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><h3>فشل تحميل المدربين</h3></div>';
  }
  
  // تحديث الإحصائيات
  updateAllStats();
}

// ============================================================
// UPDATE STATS
// ============================================================
function updateAllStats() {
  // Trips
  const tripsTotal = tripsData.length;
  const tripsPax = tripsData.reduce((s, t) => s + (t.totalPassengers || 0), 0);
  document.getElementById('stat-trips-total').textContent = tripsTotal;
  document.getElementById('stat-trips-pax').textContent = tripsPax;
  
  // Boats
  const boatsTotal = boatsData.filter(b => b.isActive || b.invoiceCount > 0).length;
  const boatsActive = boatsData.filter(b => b.invoiceCount > 0).length;
  document.getElementById('stat-boats-total').textContent = boatsTotal;
  document.getElementById('stat-boats-active').textContent = boatsActive;
  
  // Vehicles
  const vehiclesTotal = vehiclesData.filter(v => v.isActive || v.invoiceCount > 0).length;
  const vehiclesActive = vehiclesData.filter(v => v.invoiceCount > 0).length;
  document.getElementById('stat-vehicles-total').textContent = vehiclesTotal;
  document.getElementById('stat-vehicles-active').textContent = vehiclesActive;
  
  // Instructors
  const instrTotal = instructorsData.filter(i => i.isActive || i.invoiceCount > 0).length;
  const instrActive = instructorsData.filter(i => i.invoiceCount > 0).length;
  document.getElementById('stat-instructors-total').textContent = instrTotal;
  document.getElementById('stat-instructors-active').textContent = instrActive;
}

// ============================================================
// RENDER TRIPS
// ============================================================
function renderTrips() {
  const container = document.getElementById('tripsContent');
  
  if (!tripsData.length) {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🚌</div><h3>لا توجد رحلات لهذا اليوم</h3><p>لم يتم العثور على فواتير مطابقة</p></div>';
    return;
  }
  
  let html = '';
  for (const trip of tripsData) {
    const tripKey = 'trip_' + trip.tripName;
    const isSelected = selectedItems.trips.has(tripKey);
    const itemClass = isSelected ? 'open' : '';
    
    html += '<div class="accordion-item ' + itemClass + '" data-key="' + escHtml(tripKey) + '">';
    html += '  <div class="accordion-header" onclick="toggleAccordion(this)">';
    html += '    <div class="accordion-left">';
    html += '      <input type="checkbox" class="accordion-checkbox" ' + (isSelected ? 'checked' : '') + ' onclick="event.stopPropagation(); toggleSelect(\'trips\', \'' + escHtml(tripKey) + '\', this)">';
    html += '      <div style="flex:1;min-width:0;">';
    html += '        <div class="accordion-title">🚌 ' + escHtml(trip.tripName) + '</div>';
    html += '        <div class="accordion-subtitle">' + trip.invoiceCount + ' فاتورة</div>';
    html += '      </div>';
    html += '    </div>';
    html += '    <div class="accordion-stats">';
    html += '      <span class="stat-badge gold">👥 ' + trip.totalPassengers + ' فرد</span>';
    html += '      <span class="stat-badge">🚗 ' + trip.vehiclesCount + '</span>';
    html += '      <span class="stat-badge">⛵ ' + trip.boatsCount + '</span>';
    html += '      <span class="stat-badge">👨‍🏫 ' + trip.instructorsCount + '</span>';
    html += '    </div>';
    html += '    <div class="accordion-arrow">▼</div>';
    html += '  </div>';
    html += '  <div class="accordion-body">';
    html += '    <div class="accordion-body-inner">';
    html += renderTripsInvoicesTable(trip.invoices, trip.totalRest);
    html += '    </div>';
    html += '  </div>';
    html += '</div>';
  }
  
  container.innerHTML = html;
}

function renderTripsInvoicesTable(invoices, totalRest) {
  let html = '<table class="inv-table">';
  html += '<thead><tr>';
  html += '<th>⏰ الوقت</th>';
  html += '<th>🧾 الفاتورة</th>';
  html += '<th>🏝️ الرحلة</th>';
  html += '<th>🏨 الفندق</th>';
  html += '<th>🚪 الغرفة</th>';
  html += '<th>👤 العميل</th>';
  html += '<th>👥 أفراد</th>';
  html += '<th>💰 المتبقي</th>';
  html += '</tr></thead><tbody>';
  
  let totalPax = 0;
  for (const inv of invoices) {
    totalPax += inv.totalPax;
    html += '<tr>';
    html += '<td class="time-col">' + escHtml(inv.time || '—') + '</td>';
    html += '<td><span class="voucher-link" onclick="viewInvoice(\'' + escHtml(inv.voucherNo) + '\')">' + escHtml(inv.voucherNo) + '</span></td>';
    html += '<td class="trip-name">' + escHtml(inv.tripName || inv.trip || '—') + '</td>';
    html += '<td class="hotel-name">' + escHtml(inv.hotel || '—') + '</td>';
    html += '<td>' + escHtml(inv.roomNo || '—') + '</td>';
    html += '<td>' + escHtml(inv.guestName || '—') + '</td>';
    html += '<td><span class="pax-badge">' + inv.totalPax + '</span></td>';
    html += '<td>' + formatRest(inv.rest, inv.currency) + '</td>';
    html += '</tr>';
  }
  
  // صف الإجماليات
  html += '<tr class="total-row">';
  html += '<td colspan="6" style="text-align:left;padding-right:14px;">📊 الإجمالي (' + invoices.length + ' فاتورة)</td>';
  html += '<td><span class="pax-badge" style="background:var(--navy2);">' + totalPax + '</span></td>';
  html += '<td>' + formatRestSummary(totalRest) + '</td>';
  html += '</tr>';
  
  html += '</tbody></table>';
  return html;
}

// ============================================================
// RENDER BOATS
// ============================================================
function renderBoats() {
  const container = document.getElementById('boatsContent');
  
  if (!boatsData.length) {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⛵</div><h3>لا توجد مراكب</h3></div>';
    return;
  }
  
  let html = '';
  for (const boat of boatsData) {
    const boatKey = 'boat_' + boat.boatId;
    const isSelected = selectedItems.boats.has(boatKey);
    
    // تحديد لون التحذير
    let itemClass = '';
    if (!boat.licenseValid) itemClass = 'danger';
    else if (boat.licenseWarning) itemClass = 'warning';
    
    // حالة الكابتن
    const captainName = boat.captainName || '—';
    const captainPhone = boat.captainPhone || '';
    
    html += '<div class="accordion-item ' + itemClass + '" data-key="' + escHtml(boatKey) + '">';
    html += '  <div class="accordion-header" onclick="toggleAccordion(this)">';
    html += '    <div class="accordion-left">';
    html += '      <input type="checkbox" class="accordion-checkbox" ' + (isSelected ? 'checked' : '') + ' onclick="event.stopPropagation(); toggleSelect(\'boats\', \'' + escHtml(boatKey) + '\', this)">';
    html += '      <div style="flex:1;min-width:0;">';
    html += '        <div class="accordion-title">⛵ ' + escHtml(boat.boatName) + '</div>';
    html += '        <div class="accordion-subtitle">👨‍✈️ ' + escHtml(captainName) + (captainPhone ? ' • 📞 ' + escHtml(captainPhone) : '') + '</div>';
    html += '      </div>';
    html += '    </div>';
    html += '    <div class="accordion-stats">';

      html += '      <span class="stat-badge red">❌ ترخيص منتهي</span>';

      html += '      <span class="stat-badge orange">⚠️ ' + boat.licenseDaysLeft + ' يوم</span>';
    }

    html += '    </div>';
    html += '  </div>';

  }
  
  container.innerHTML = html;
}

// ============================================================
// ACCORDION
// ============================================================
function toggleAccordion(headerEl) {
  const item = headerEl.closest('.accordion-item');
  if (item) item.classList.toggle('open');
}

// ============================================================
// SELECTION
// ============================================================
function toggleSelect(type, key, checkbox) {
  if (checkbox.checked) {
    selectedItems[type].add(key);
  } else {
    selectedItems[type].delete(key);
  }
}

function selectAll(type) {
  const container = document.getElementById(type + 'Content');
  const checkboxes = container.querySelectorAll('.accordion-checkbox');
  checkboxes.forEach(cb => {
    cb.checked = true;
    const item = cb.closest('.accordion-item');
    if (item) selectedItems[type].add(item.dataset.key);
  });
  showToast('تم تحديد الكل', 'info');
}

function clearAll(type) {
  const container = document.getElementById(type + 'Content');
  const checkboxes = container.querySelectorAll('.accordion-checkbox');
  checkboxes.forEach(cb => cb.checked = false);
  selectedItems[type].clear();
  showToast('تم إلغاء التحديد', 'info');
}

function viewInvoice(voucherNo) {

    return buildBoatMessage(item);
  } else if (type === 'vehicles') {
    return buildVehicleMessage(item);
  } else if (type === 'instructors') {
    return buildInstructorMessage(item);
  }
  return '';
}

// ============================================================
// SEND WHATSAPP
// ============================================================
function sendWhatsAppSelected(type) {
  const keys = Array.from(selectedItems[type]);
  if (keys.length === 0) {
    showToast('⚠️ الرجاء تحديد عنصر واحد على الأقل', 'error');
    return;
  }
  
  const items = getItemsByKeys(type, keys);
  if (items.length === 0) {
    showToast('⚠️ لم يتم العثور على العناصر المحددة', 'error');
    return;
  }
  
  // إذا كان عنصر واحد فقط، افتح واتساب مباشرة
  if (items.length === 1) {
    const item = items[0];
    const phone = getPhoneForItem(type, item);
    
    if (!phone) {
      showToast('⚠️ لا يوجد رقم هاتف مسجل', 'error');
      return;
    }
    
    const msg = buildMessage(type, item);
    openWhatsApp(phone, msg);
    return;
  }
  
  // إذا كانت متعددة، افتح modal للاختيار
  openWhatsAppSelectionModal(type, items);
}

function getPhoneForItem(type, item) {
  if (type === 'boats') return item.captainPhone || '';
  if (type === 'vehicles') return item.driverPhone || '';
  if (type === 'instructors') return item.phone || '';
  if (type === 'trips') return '';  // Trips ليس لها رقم واحد
  return '';
}

function openWhatsApp(phone, message) {
  // تنظيف الرقم (إزالة + والمسافات)
  const cleanPhone = phone.replace(/[^\d]/g, '');
  const url = 'https://wa.me/' + cleanPhone + '?text=' + encodeURIComponent(message);
  window.open(url, '_blank');
  showToast('✅ تم فتح واتساب', 'success');
}

function openWhatsAppSelectionModal(type, items) {
  const modal = document.getElementById('messageModal');
  const title = document.getElementById('messageModalTitle');
  const body = document.getElementById('messageModalBody');
  
  title.textContent = '📱 اختر الجهة للإرسال';
  
  let html = '<div style="display:flex;flex-direction:column;gap:8px;">';
  for (const item of items) {
    const phone = getPhoneForItem(type, item);
    const name = getNameForItem(type, item);
    const hasPhone = !!phone;
    
    html += '<div style="padding:12px;border:2px solid ' + (hasPhone ? 'var(--border)' : 'var(--red)') + ';border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;' + (hasPhone ? 'cursor:pointer;' : 'opacity:.5;') + '"';
    if (hasPhone) {
      html += ' onclick="sendWhatsAppForItem(\'' + type + '\', \'' + escHtml(getKeyForItem(type, item)) + '\')"';
    }
    html += '>';
    html += '<div><div style="font-weight:800;font-size:14px;color:var(--navy);">' + escHtml(name) + '</div>';
    html += '<div style="font-size:11px;color:var(--text-lt);">' + (phone ? '📞 ' + escHtml(phone) : '⚠️ لا يوجد رقم') + '</div></div>';
    html += '<div style="color:' + (hasPhone ? 'var(--green)' : 'var(--red)') + ';font-size:18px;">' + (hasPhone ? '📱' : '✖') + '</div>';
    html += '</div>';
  }
  html += '</div>';
  
  body.innerHTML = html;
  modal.classList.add('open');
}

function sendWhatsAppForItem(type, key) {
  const item = getItemByKey(type, key);
  if (!item) return;
  
  const phone = getPhoneForItem(type, item);
  if (!phone) {
    showToast('⚠️ لا يوجد رقم هاتف', 'error');
    return;
  }
  
  const msg = buildMessage(type, item);
  closeMessageModal();
  openWhatsApp(phone, msg);
}

function getItemsByKeys(type, keys) {
  const dataMap = {
    trips: tripsData,
    boats: boatsData,
    vehicles: vehiclesData,
    instructors: instructorsData
  };
  const data = dataMap[type] || [];
  
  return data.filter(item => {
    const key = getKeyForItem(type, item);
    return keys.includes(key);
  });
}

function getItemByKey(type, key) {
  const items = getItemsByKeys(type, [key]);
  return items[0] || null;
}

function getKeyForItem(type, item) {
  if (type === 'trips') return 'trip_' + item.tripName;
  if (type === 'boats') return 'boat_' + item.boatId;
  if (type === 'vehicles') return 'vehicle_' + item.vehicleId;
  if (type === 'instructors') return 'instr_' + item.instructorId;
  return '';
}

function getNameForItem(type, item) {
  if (type === 'trips') return item.tripName;
  if (type === 'boats') return item.boatName;
  if (type === 'vehicles') return item.licensePlate;
  if (type === 'instructors') return item.instructorName;
  return '';
}

// ============================================================
// SEND EMAIL
// ============================================================
function sendEmailSelected(type) {
  const keys = Array.from(selectedItems[type]);
  if (keys.length === 0) {
    showToast('⚠️ الرجاء تحديد عنصر واحد على الأقل', 'error');
    return;
  }
  
  const items = getItemsByKeys(type, keys);
  if (items.length === 0) {
    showToast('⚠️ لم يتم العثور على العناصر', 'error');
    return;
  }
  
  // فتح modal لإدخال إيميل
  const modal = document.getElementById('messageModal');
  const title = document.getElementById('messageModalTitle');
  const body = document.getElementById('messageModalBody');
  
  title.textContent = '📧 إرسال بالبريد الإلكتروني';
  
  let html = '<div class="form-group">';
  html += '<label>📧 البريد الإلكتروني للمستلم</label>';
  html += '<input type="email" id="emailRecipient" placeholder="example@email.com" required>';
  html += '</div>';
  
  html += '<div class="form-group">';
  html += '<label>📝 ملاحظات إضافية (اختياري)</label>';
  html += '<textarea id="emailNotes" rows="3" placeholder="سيتم إضافتها في نهاية الرسالة"></textarea>';
  html += '</div>';
  
  html += '<div style="background:var(--gray-50);padding:10px;border-radius:8px;font-size:11px;color:var(--text-lt);margin-bottom:12px;">';
  html += '📎 سيتم إرفاق خطة العمل الكاملة لـ <strong>' + items.length + '</strong> عنصر محدد';
  html += '</div>';
  
  html += '<div class="modal-btns">';
  html += '<button class="modal-btn cancel" onclick="closeMessageModal()">إلغاء</button>';
  html += '<button class="modal-btn primary" onclick="submitEmail(\'' + type + '\')">📧 إرسال</button>';
  html += '</div>';
  
  body.innerHTML = html;
  modal.classList.add('open');
  setTimeout(() => document.getElementById('emailRecipient').focus(), 100);
}

function submitEmail(type) {
  const email = document.getElementById('emailRecipient').value.trim();
  const notes = document.getElementById('emailNotes').value.trim();
  
  if (!email || !email.includes('@')) {
    showToast('⚠️ الرجاء إدخال بريد إلكتروني صحيح', 'error');
    return;
  }
  
  const keys = Array.from(selectedItems[type]);
  const items = getItemsByKeys(type, keys);
  
  const subject = '🌊 خطة عمل ' + getTypeLabel(type) + ' - ' + isoToTxt(selectedDateISO);
  const body = buildEmailBody(type, items, notes);
  
  // mailto
  const mailtoUrl = 'mailto:' + encodeURIComponent(email) + 
    '?subject=' + encodeURIComponent(subject) + 
    '&body=' + encodeURIComponent(body);
  
  window.location.href = mailtoUrl;
  closeMessageModal();
  showToast('✅ تم فتح عميل البريد', 'success');
}

function getTypeLabel(type) {
  const labels = { trips: 'الرحلات', boats: 'المراكب', vehicles: 'السيارات', instructors: 'المدربين' };
  return labels[type] || '';
}

function buildEmailBody(type, items, notes) {
  let body = 'خطة عمل ' + getTypeLabel(type) + '\n';
  body += '📅 التاريخ: ' + isoToTxt(selectedDateISO) + '\n';
  body += '━━━━━━━━━━━━━━━━━━\n\n';
  
  for (const item of items) {
    const name = getNameForItem(type, item);
    body += '🔹 ' + name + '\n';
    body += '   عدد الفواتير: ' + item.invoiceCount + '\n';
    
    if (type === 'boats') {
      body += '   إجمالي الأفراد: ' + item.totalPassengers + '\n';
      if (item.captainName) body += '   القائد: ' + item.captainName + '\n';
      if (item.captainPhone) body += '   هاتف القائد: ' + item.captainPhone + '\n';
    } else if (type === 'vehicles') {
      body += '   إجمالي التشغيلات: ' + item.totalTrips + '\n';
      if (item.driverName) body += '   السائق: ' + item.driverName + '\n';
      if (item.driverPhone) body += '   هاتف السائق: ' + item.driverPhone + '\n';
    } else if (type === 'trips') {
      body += '   إجمالي الأفراد: ' + item.totalPassengers + '\n';
    } else if (type === 'instructors') {
      if (item.role) body += '   الدور: ' + item.role + '\n';
    }
    
    body += '\n   📋 الجدول الزمني:\n';
    for (const inv of item.invoices) {
      body += '   ⏰ ' + (inv.time || '--:--') + ' | ' + (inv.trip || '—') + ' | ' + (inv.hotel || '—') + '\n';
    }
    body += '\n';
  }
  
  if (notes) {
    body += '━━━━━━━━━━━━━━━━━━\n';
    body += '📝 ملاحظات:\n' + notes + '\n';
  }
  
  body += '\n━━━━━━━━━━━━━━━━━━\n';
  body += 'شكراً 🙏\n';
  body += 'نظام Dive System';
  
  return body;
}

// ============================================================
// MODAL HELPERS
// ============================================================
function closeMessageModal() {
  document.getElementById('messageModal').classList.remove('open');
}

// ============================================================
// AUTO-REFRESH
// ============================================================
setInterval(() => {
  if (document.visibilityState === 'visible' && selectedDateISO) {
    // تحديث صامت كل 3 دقائق
  }
}, 180000);

// ============================================================
// INIT ON LOAD
// ============================================================
document.addEventListener('DOMContentLoaded', async () => {
  // تطبيق الثيم
  if (typeof Theme !== 'undefined' && Theme.applyToPage) {
    Theme.applyToPage();
  }
    // ✅ قراءة التاريخ من URL أو sessionStorage
  let incomingDate = '';
  try {
    const urlParams = new URLSearchParams(window.location.search);
    incomingDate = urlParams.get('date') || '';
    
    if (!incomingDate) {
      const storedDate = sessionStorage.getItem('dailyPlanDate');
      if (storedDate) {
        incomingDate = storedDate;
        sessionStorage.removeItem('dailyPlanDate');
      }
    }
  } catch(e) {
    console.warn('Failed to read incoming date:', e);
  }
  if (typeof Theme !== 'undefined' && Theme.setPageTitle) {
    Theme.setPageTitle('خطة العمل اليومية');
  }
  
  // التحقق من الجلسة
  if (!Session.checkValidity()) {
    return;
  }
  
  currentUser = Session.getUser();
  if (!currentUser) {
    location.href = 'index.html';
    return;
  }
  
  document.getElementById('userNameDisplay').textContent = currentUser.name || 'User';
  
  // تاريخ اليوم
   // ✅ استخدام التاريخ الوارد أو تاريخ اليوم
  if (incomingDate && incomingDate.match(/^\d{1,2}\/[A-Za-z]{3}\/\d{4}$/)) {
    // التاريخ بالصيغة dd/MMM/yyyy
    const isoFromIncoming = txtToISO(incomingDate);
    selectedDateISO = isoFromIncoming || todayISO();
  } else if (incomingDate && incomingDate.match(/^\d{4}-\d{2}-\d{2}$/)) {
    // التاريخ بالصيغة YYYY-MM-DD
    selectedDateISO = incomingDate;
  } else {
    selectedDateISO = todayISO();
  }
  
  document.getElementById('dateDisplay').value = isoToTxt(selectedDateISO);
  console.log('📅 Selected date:', selectedDateISO);  
  // تحميل البيانات
  await loadAllTabs();
});

// ESC لإغلاق المودال
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeMessageModal();
});
</script>
