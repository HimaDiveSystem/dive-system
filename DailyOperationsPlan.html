<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="theme-color" content="#0f1f3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="خطة العمل اليومية الموحدة - Dive System">
  <meta name="author" content="Dive System">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes">
  <title>📅 Daily Operations Plan</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="ui.js"></script>
  <script src="config.js"></script>
  <script src="session.js"></script>
  <style>
    :root {
      --navy: #0f1f3d;
      --navy2: #1a3260;
      --gold: #f5c842;
      --gold2: #e6b800;
      --blue: #2563eb;
      --blue-lt: #3b82f6;
      --green: #16a34a;
      --red: #dc2626;
      --orange: #ea580c;
      --purple: #7c3aed;
      --teal: #0d9488;
      --bg: #f0f4f8;
      --card: #fff;
      --border: #dde4f0;
      --text: #1a2540;
      --text-lt: #5a6a8a;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-500: #64748b;
      --whatsapp: #25D366;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      direction: rtl;
    }

    /* ═══════════════════════════════════════════
       HEADER
       ═══════════════════════════════════════════ */
    .header {
      background: linear-gradient(135deg, var(--navy), var(--navy2));
      color: white;
      padding: 12px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 3px 16px rgba(15,31,61,.25);
    }
    .header h2 {
      color: var(--gold);
      font-size: 18px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .user-chip {
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 40px;
      padding: 4px 13px;
      color: white;
      font-size: 12px;
      font-weight: 600;
    }
    .back-btn {
      background: transparent;
      border: 2px solid rgba(255,255,255,.3);
      color: white;
      padding: 4px 13px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
      font-family: 'Cairo', sans-serif;
      transition: all .2s;
    }
    .back-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* ═══════════════════════════════════════════
       FILTER BAR (Date From/To)
       ═══════════════════════════════════════════ */
    .filter-bar {
      position: sticky;
      top: 58px;
      z-index: 199;
      background: white;
      border-bottom: 2px solid var(--border);
      padding: 10px 20px;
      box-shadow: 0 3px 8px rgba(0,0,0,.05);
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .fg {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .fg label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-lt);
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .fc {
      padding: 8px 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Cairo', sans-serif;
      color: var(--text);
      background: white;
      height: 38px;
      min-width: 160px;
    }
    .fc:focus {
      border-color: var(--blue);
      outline: none;
    }
    .dw {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .cal-btn {
      padding: 6px 10px;
      background: var(--navy);
      color: var(--gold);
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      height: 38px;
    }
    .cal-btn:hover { background: var(--navy2); }
    .fbtns {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-left: auto;
    }
    .fbtn {
      padding: 8px 20px;
      border: none;
      border-radius: 20px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      height: 38px;
      transition: all .2s;
    }
    .fbtn-go {
      background: var(--navy);
      color: var(--gold);
    }
    .fbtn-go:hover { background: var(--navy2); }
    .fbtn-today {
      background: #f1f5f9;
      color: var(--text);
    }
    .fbtn-today:hover { background: #e2e8f0; }
    .print-btn {
      background: var(--orange);
      color: white;
    }
    .print-btn:hover { background: #c2410c; }

    /* ═══════════════════════════════════════════
       SUMMARY BAR
       ═══════════════════════════════════════════ */
    .summary-bar {
      background: linear-gradient(135deg, #f8fafc, #e2e8f0);
      border-bottom: 2px solid var(--border);
      padding: 10px 20px;
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }
    .sum-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: white;
      border-radius: 20px;
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      color: var(--navy);
    }
    .sum-item strong {
      color: var(--navy2);
      font-size: 14px;
    }

    /* ═══════════════════════════════════════════
       TABS
       ═══════════════════════════════════════════ */
    .tabs-container {
      padding: 14px 20px 0 20px;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
    }
    .tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-width: 500px;
    }
    .tab {
      background: white;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all .25s;
      text-align: center;
      font-family: inherit;
      box-shadow: 0 2px 6px rgba(15,31,61,.04);
    }
    .tab:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(15,31,61,.12);
      border-color: var(--gold);
    }
    .tab.active {
      background: linear-gradient(135deg, var(--navy), var(--navy2));
      color: white;
      border-color: var(--gold);
      box-shadow: 0 8px 20px rgba(15,31,61,.25);
    }
    .tab-icon { font-size: 22px; margin-bottom: 4px; line-height: 1; }
    .tab-title { font-size: 13px; font-weight: 800; color: var(--navy); }
    .tab.active .tab-title { color: var(--gold); }

    /* ═══════════════════════════════════════════
       CONTENT
       ═══════════════════════════════════════════ */
    .content {
      padding: 16px 20px 30px 20px;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ═══════════════════════════════════════════
       ACTION BAR
       ═══════════════════════════════════════════ */
    .action-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      align-items: center;
      background: white;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 6px rgba(15,31,61,.04);
      position: sticky;
      top: 158px;
      z-index: 50;
    }
    .action-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      transition: all .2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .action-btn.select-all { background: var(--blue); color: white; }
    .action-btn.select-all:hover { background: #1d4ed8; }
    .action-btn.clear-all {
      background: var(--gray-100);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .action-btn.clear-all:hover { background: var(--gray-200); }
    .action-btn.send-wa { background: var(--whatsapp); color: white; }
    .action-btn.send-wa:hover { background: #128C7E; }
    .action-btn.send-em { background: var(--red); color: white; }
    .action-btn.send-em:hover { background: #b91c1c; }
    .action-btn.send-pdf { background: var(--purple); color: white; }
    .action-btn.send-pdf:hover { background: #6d28d9; }
    .selection-count {
      margin-right: auto;
      background: var(--navy);
      color: var(--gold);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
    }

    /* ═══════════════════════════════════════════
       BENEFICIARY SECTIONS
       ═══════════════════════════════════════════ */
    .section-group {
      margin-bottom: 18px;
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: linear-gradient(135deg, var(--navy), var(--navy2));
      color: var(--gold);
      border-radius: 12px 12px 0 0;
      font-weight: 800;
      font-size: 14px;
    }
    .section-header-icon { font-size: 20px; }
    .section-header-count {
      margin-right: auto;
      background: rgba(245,200,66,.2);
      border: 1px solid rgba(245,200,66,.4);
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 12px;
    }
    .section-body {
      background: white;
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 12px 12px;
      padding: 8px;
    }

    /* ═══════════════════════════════════════════
       BENEFICIARY CARD
       ═══════════════════════════════════════════ */
    .beneficiary-card {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      margin-bottom: 6px;
      overflow: hidden;
      transition: all .2s;
    }
    .beneficiary-card:hover {
      border-color: var(--gold);
      box-shadow: 0 3px 12px rgba(15,31,61,.1);
    }
    .beneficiary-card.selected {
      border-color: var(--blue);
      background: #eff6ff;
    }
    .beneficiary-card.warning {
      border-color: var(--orange);
    }
    .beneficiary-card.danger {
      border-color: var(--red);
    }

    .beneficiary-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      cursor: pointer;
      user-select: none;
    }
    .beneficiary-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: var(--blue);
      flex-shrink: 0;
    }
    .beneficiary-info {
      flex: 1;
      min-width: 0;
    }
    .beneficiary-name {
      font-weight: 800;
      font-size: 14px;
      color: var(--navy);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .beneficiary-sub {
      font-size: 11px;
      color: var(--text-lt);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .beneficiary-stats {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .badge-navy { background: var(--navy); color: var(--gold); }
    .badge-green { background: #dcfce7; color: #166534; }
    .badge-orange { background: #ffedd5; color: #9a3412; }
    .badge-red { background: #fee2e2; color: #991b1b; }
    .badge-blue { background: #dbeafe; color: #1e40af; }
    .badge-gray { background: #f1f5f9; color: #475569; }

    .beneficiary-arrow {
      font-size: 14px;
      color: var(--navy);
      transition: transform .3s;
      flex-shrink: 0;
    }
    .beneficiary-card.open .beneficiary-arrow {
      transform: rotate(180deg);
    }

    /* ═══════════════════════════════════════════
       ACCORDION BODY (Invoices Table)
       ═══════════════════════════════════════════ */
    .beneficiary-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height .4s ease;
      background: var(--gray-50);
    }
    .beneficiary-card.open .beneficiary-body {
      max-height: 3000px;
    }
    .beneficiary-body-inner {
      padding: 12px;
      border-top: 1px solid var(--border);
      overflow-x: auto;
    }

    /* ═══════════════════════════════════════════
       INVOICES TABLE
       ═══════════════════════════════════════════ */
    .inv-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      min-width: 900px;
    }
    .inv-table thead th {
      background: var(--navy);
      color: var(--gold);
      padding: 10px 8px;
      text-align: center;
      font-weight: 700;
      font-size: 11px;
      white-space: nowrap;
    }
    .inv-table tbody td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--gray-200);
      text-align: center;
      white-space: nowrap;
      color: var(--text);
      font-size: 11px;
    }
    .inv-table tbody tr:last-child td { border-bottom: none; }
    .inv-table tbody tr:hover { background: #fef9e7; }
    .inv-table .time-col {
      font-weight: 900;
      color: var(--navy);
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }
    .inv-table .voucher-link {
      color: var(--blue);
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
    }
    .inv-table .voucher-link:hover { color: var(--navy); }
    .inv-table .rest-pos {
      color: var(--red);
      font-weight: 800;
      font-family: 'Courier New', monospace;
    }
    .inv-table .rest-zero {
      color: var(--green);
      font-weight: 800;
    }
    .inv-table .pax-badge {
      background: var(--navy);
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
      display: inline-block;
      min-width: 22px;
    }
    .inv-table .cell-edit {
      cursor: pointer;
      background: #f0f4ff;
      transition: all .2s;
      font-weight: 700;
      color: var(--navy);
      border-radius: 6px;
      padding: 4px 6px !important;
    }
    .inv-table .cell-edit:hover {
      background: #e0e8ff;
      color: var(--blue);
    }
    .inv-table .trip-cell {
      font-weight: 700;
      color: var(--navy);
      max-width: 140px;
      white-space: normal;
      word-break: break-word;
      text-align: right;
    }
    .inv-table .acts-cell {
      font-size: 10px;
      color: #92400e;
      background: #fef9e7;
      border-radius: 6px;
      padding: 3px 6px !important;
      text-align: right;
      max-width: 200px;
      white-space: normal;
      word-break: break-word;
      line-height: 1.4;
    }
    .total-row td {
      background: #dbeafe !important;
      font-weight: 900;
      color: var(--navy) !important;
      border-top: 2px solid var(--navy);
      font-size: 11px;
    }

    /* ═══════════════════════════════════════════
       EMPTY & LOADING STATES
       ═══════════════════════════════════════════ */
    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-lt);
      background: white;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .empty-state-icon { font-size: 56px; margin-bottom: 12px; opacity: .6; }
    .empty-state h3 { font-size: 16px; color: var(--navy); margin-bottom: 6px; }
    .empty-state p { font-size: 13px; color: var(--text-lt); }

    .loader-wrap { text-align: center; padding: 60px; color: var(--text-lt); }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ═══════════════════════════════════════════
       MODAL
       ═══════════════════════════════════════════ */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,.6);
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: white;
      border-radius: 18px;
      max-width: 560px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
      animation: slideUp .3s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px) scale(.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--gold);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .modal-header h3 {
      color: var(--navy);
      font-size: 16px;
      font-weight: 800;
    }
    .modal-close {
      font-size: 24px;
      cursor: pointer;
      color: var(--gray-500);
      background: none;
      border: none;
      padding: 0 8px;
      line-height: 1;
    }
    .modal-close:hover { color: var(--red); }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-lt);
      margin-bottom: 6px;
    }
    .form-group textarea,
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-size: 13px;
      resize: vertical;
    }
    .form-group textarea:focus,
    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--blue);
      outline: none;
    }

    .modal-btns {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 16px;
    }
    .modal-btn {
      padding: 10px 24px;
      border: none;
      border-radius: 30px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      transition: all .2s;
    }
    .modal-btn.primary { background: var(--navy); color: var(--gold); }
    .modal-btn.primary:hover { background: var(--navy2); }
    .modal-btn.cancel { background: var(--gray-100); color: var(--text); }
    .modal-btn.cancel:hover { background: var(--gray-200); }

    /* ═══════════════════════════════════════════
       RECIPIENT SELECTION LIST (Modal)
       ═══════════════════════════════════════════ */
    .recipient-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 400px;
      overflow-y: auto;
    }
    .recipient-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all .2s;
      background: white;
    }
    .recipient-item:hover {
      border-color: var(--blue);
      background: #f0f4ff;
    }
    .recipient-item.selected {
      border-color: var(--green);
      background: #f0fdf4;
    }
    .recipient-item.no-phone {
      opacity: .5;
      cursor: not-allowed;
      background: #fef2f2;
      border-color: #fecaca;
    }
    .recipient-icon { font-size: 22px; flex-shrink: 0; }
    .recipient-info { flex: 1; min-width: 0; }
    .recipient-name {
      font-weight: 800;
      font-size: 13px;
      color: var(--navy);
    }
    .recipient-sub {
      font-size: 11px;
      color: var(--text-lt);
      margin-top: 2px;
    }
    .recipient-phone {
      font-family: monospace;
      font-size: 12px;
      color: var(--green);
      font-weight: 700;
    }
    .recipient-check {
      color: var(--green);
      font-size: 18px;
      flex-shrink: 0;
    }

    /* ═══════════════════════════════════════════
       TOAST
       ═══════════════════════════════════════════ */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 13px;
      color: white;
      z-index: 99999;
      box-shadow: 0 6px 20px rgba(0,0,0,.25);
      opacity: 0;
      transition: all .35s cubic-bezier(0.34,1.56,0.64,1);
      max-width: 90vw;
      text-align: center;

</head>

<script>
// ═══════════════════════════════════════════════════════════════════
// 🌐 GLOBAL STATE
// ═══════════════════════════════════════════════════════════════════
let currentUser = null;
let selectedFromISO = '';
let selectedToISO = '';
let activeTab = 'beneficiaries';

// ✅ البيانات
let planData = null;   // نتيجة getDailyPlanUnified
let beneficiaries = {
  vehicles: [],
  boats: [],
  instructors: [],
  suppliers: [],
  customers: []
};

// ✅ تحديد المستفيدين (Set من keys فريدة)
const selectedBeneficiaries = new Set();

// ✅ Cache للعملاء/المنفذين
let allSuppliersCache = [];
let allCustomersCache = [];

// ═══════════════════════════════════════════════════════════════════
// 🛠️ UTILITIES
// ═══════════════════════════════════════════════════════════════════
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fmtDateDDMMMYYYY(date) {
  if (!date) return '';
  const d = date instanceof Date ? date : new Date(date);
  if (isNaN(d.getTime())) return '';
  return String(d.getDate()).padStart(2, '0') + '/' + MONTHS[d.getMonth()] + '/' + d.getFullYear();
}

function isoToTxt(iso) {
  if (!iso) return '';
  const parts = iso.split('-');
  if (parts.length !== 3) return '';
  const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
  return fmtDateDDMMMYYYY(d);
}

function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function escHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[m]);
}

function roundToTwo(n) {
  if (typeof n !== 'number' || isNaN(n)) return 0;
  return Math.round((n + Number.EPSILON) * 100) / 100;
}

function showToast(msg, type) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.className = 'toast toast-' + (type || 'info');
  setTimeout(() => toast.classList.add('show'), 10);
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
}

function formatRest(rest, currency) {
  if (!rest || rest <= 0) return '<span class="rest-zero">✓</span>';
  return '<span class="rest-pos">' + roundToTwo(rest).toFixed(2) + ' ' + escHtml(currency || 'LE') + '</span>';
}

function formatRestSummary(restObj) {
  if (!restObj || Object.keys(restObj).length === 0) {
    return '<span class="rest-zero">✓</span>';
  }
  const parts = [];
  for (const [cur, amount] of Object.entries(restObj)) {
    if (amount > 0) parts.push(roundToTwo(amount).toFixed(2) + ' ' + cur);
  }
  if (parts.length === 0) return '<span class="rest-zero">✓</span>';
  return '<span class="rest-pos">' + parts.join(' | ') + '</span>';
}

// ═══════════════════════════════════════════════════════════════════
// 🌐 GAS — JSONP
// ═══════════════════════════════════════════════════════════════════
function gas(action, params) {
  params = params || {};
  return new Promise((resolve, reject) => {
    const user = Session.getUser();
    if (user && user.centerName && !params.centerName) {
      params.centerName = user.centerName;
    }

    const cbName = 'cb_' + Date.now() + '_' + Math.random().toString(36).substring(2, 10);
    const url = new URL(CONFIG.GAS_URL);
    url.searchParams.set('action', action);
    url.searchParams.set('callback', cbName);
    url.searchParams.set('_t', Date.now());

    Object.keys(params).forEach(key => {
      if (params[key] !== undefined && params[key] !== null && params[key] !== '') {
        url.searchParams.set(key, String(params[key]));
      }
    });

    const timeout = setTimeout(() => {
      if (window[cbName]) {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        reject(new Error('Timeout: ' + action));
      }
    }, 90000);

    window[cbName] = function(data) {
      clearTimeout(timeout);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      resolve(data);
    };

    const script = document.createElement('script');
    script.src = url.toString();
    script.onerror = function() {
      clearTimeout(timeout);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      reject(new Error('Network error: ' + action));
    };
    document.body.appendChild(script);
  });
}

// ═══════════════════════════════════════════════════════════════════
// 🔙 NAVIGATION
// ═══════════════════════════════════════════════════════════════════
function goBack() {
  const user = Session.getUser();
  if (user) Session.save(user);

  const dashMap = {
    'Admin': 'Dashboard.html',
    'Owner': 'OwnerDashboard.html',
    'Sales': 'SalesDashboard.html',
    'Accountant': 'AccountantDashboard.html',
    'FinancialManager': 'AccountantDashboard.html',
    'OperationsManager': 'OperationManager.html',
    'OperationsSupervisor': 'OperationSupervisor.html',
    'BranchManager': 'BranchManagerDashboard.html',
    'CenterManager': 'CenterManagerDashboard.html'
  };

  let dash = '';
  if (user && CONFIG.DASHBOARD_PAGES && CONFIG.DASHBOARD_PAGES[user.type]) {
    dash = CONFIG.DASHBOARD_PAGES[user.type];
  } else if (user && dashMap[user.type]) {
    dash = dashMap[user.type];
  } else {
    dash = 'OperationManager.html';
  }
  window.location.href = dash;
}

function switchTab(tabName) {
  activeTab = tabName;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tabName);
  });
  document.querySelectorAll('.tab-content').forEach(c => {
    c.classList.remove('active');
  });
  const target = document.getElementById('tab-' + tabName);
  if (target) target.classList.add('active');
}

function printCurrentTab() {
  window.print();
}

// ═══════════════════════════════════════════════════════════════════
// 📅 DATE PICKERS
// ═══════════════════════════════════════════════════════════════════
function openPicker(which) {
  const native = document.getElementById(which + 'Native');
  if (!native) return;
  const val = which === 'from' ? selectedFromISO : selectedToISO;
  native.value = val || todayISO();
  try { native.showPicker(); } catch (e) { native.click(); }
}

function onDateChanged(which, iso) {
  if (!iso) return;
  if (which === 'from') {
    selectedFromISO = iso;
    if (!selectedToISO || selectedToISO < selectedFromISO) {
      selectedToISO = iso;
      document.getElementById('toNative').value = iso;
      document.getElementById('toDisplay').value = isoToTxt(iso);
    }
  } else {
    selectedToISO = iso;
    if (selectedFromISO && selectedToISO < selectedFromISO) {
      showToast('⚠️ "إلى" يجب أن يكون بعد "من"', 'error');
      selectedToISO = selectedFromISO;
      document.getElementById('toNative').value = selectedFromISO;
      document.getElementById('toDisplay').value = isoToTxt(selectedFromISO);
      return;
    }
  }
  document.getElementById(which + 'Display').value = isoToTxt(iso);
  loadData();
}

function goToToday() {
  const today = todayISO();
  selectedFromISO = today;
  selectedToISO = today;
  document.getElementById('fromNative').value = today;
  document.getElementById('toNative').value = today;
  document.getElementById('fromDisplay').value = isoToTxt(today);
  document.getElementById('toDisplay').value = isoToTxt(today);
  loadData();
}

// ═══════════════════════════════════════════════════════════════════
// 📥 LOAD DATA
// ═══════════════════════════════════════════════════════════════════
async function loadData() {
  if (!selectedFromISO) selectedFromISO = todayISO();
  if (!selectedToISO) selectedToISO = selectedFromISO;

  // Show loaders
  document.getElementById('beneficiariesContent').innerHTML =
    '<div class="loader-wrap"><div class="spinner"></div>جاري تحميل المستفيدين...</div>';
  document.getElementById('managerContent').innerHTML =
    '<div class="loader-wrap"><div class="spinner"></div>جاري تحميل خطة المدير...</div>';

  try {
    // ✅ طلب واحد لكل شيء
    const result = await gas('getDailyPlanUnified', {
      fromDate: selectedFromISO,
      toDate: selectedToISO
    });

    if (!result || !result.success) {
      throw new Error(result && result.message || 'فشل تحميل البيانات');
    }

    planData = result;
    beneficiaries.vehicles = result.beneficiaries.vehicles || [];
    beneficiaries.boats = result.beneficiaries.boats || [];
    beneficiaries.instructors = result.beneficiaries.instructors || [];
    beneficiaries.suppliers = result.beneficiaries.suppliers || [];
    beneficiaries.customers = result.beneficiaries.customers || [];

    // ✅ تحديث الملخص
    updateSummary(result.summary);

    // ✅ عرض المستفيدين
    renderBeneficiaries();

    // ✅ عرض المدير
    renderManager();

    // ✅ تحديث عدّاد التحديد
    updateSelectionCount();

  } catch(e) {
    console.error('❌ loadData error:', e);
    document.getElementById('beneficiariesContent').innerHTML =
      '<div class="empty-state"><div class="empty-state-icon">⚠️</div><h3>فشل تحميل البيانات</h3><p>' + escHtml(e.message) + '</p></div>';
    document.getElementById('managerContent').innerHTML =
      '<div class="empty-state"><div class="empty-state-icon">⚠️</div><h3>فشل تحميل البيانات</h3><p>' + escHtml(e.message) + '</p></div>';
    showToast('❌ ' + e.message, 'error');
  }
}

// ═══════════════════════════════════════════════════════════════════
// 📊 UPDATE SUMMARY BAR
// ═══════════════════════════════════════════════════════════════════
function updateSummary(summary) {
  if (!summary) return;

  document.getElementById('summaryBar').style.display = 'flex';

  document.getElementById('sumTrips').textContent = summary.totalTrips || 0;
  document.getElementById('sumPax').textContent = summary.totalPax || 0;
  document.getElementById('sumVehicles').textContent = summary.totalVehicles || 0;
  document.getElementById('sumBoats').textContent = summary.totalBoats || 0;
  document.getElementById('sumInstructors').textContent = summary.totalInstructors || 0;
  document.getElementById('sumSuppliers').textContent = summary.totalSuppliers || 0;
  document.getElementById('sumCustomers').textContent = summary.totalCustomers || 0;

  const restObj = summary.totalRest || {};
  const hasRest = Object.keys(restObj).length > 0;
  if (hasRest) {
    document.getElementById('sumRestItem').style.display = 'flex';
    const parts = Object.entries(restObj)
      .filter(([c, v]) => v > 0)
      .map(([c, v]) => roundToTwo(v).toFixed(2) + ' ' + c);
    document.getElementById('sumRest').textContent = parts.join(' | ') || '—';
  } else {
    document.getElementById('sumRestItem').style.display = 'none';
  }
}

// ═══════════════════════════════════════════════════════════════════
// 📋 RENDER BENEFICIARIES
// ═══════════════════════════════════════════════════════════════════
function renderBeneficiaries() {
  const container = document.getElementById('beneficiariesContent');

  const totalCount =
    beneficiaries.vehicles.length +
    beneficiaries.boats.length +
    beneficiaries.instructors.length +
    beneficiaries.suppliers.length +
    beneficiaries.customers.length;

  if (totalCount === 0) {
    container.innerHTML =
      '<div class="empty-state"><div class="empty-state-icon">📭</div><h3>لا توجد بيانات لهذا النطاق</h3><p>لم يتم العثور على فواتير مطابقة للمعايير المحددة</p></div>';
    return;
  }

  let html = '';

  // 🚗 السيارات
  if (beneficiaries.vehicles.length > 0) {
    html += renderSection(
      'vehicles', '🚗', 'السيارات',
      beneficiaries.vehicles,
      renderVehicleCard
    );
  }

  // ⛵ المراكب
  if (beneficiaries.boats.length > 0) {
    html += renderSection(
      'boats', '⛵', 'المراكب',
      beneficiaries.boats,
      renderBoatCard
    );
  }

  // 👨‍🏫 المدربين
  if (beneficiaries.instructors.length > 0) {
    html += renderSection(
      'instructors', '👨‍🏫', 'المدربين',
      beneficiaries.instructors,
      renderInstructorCard
    );
  }

  // 🏢 المنفذين
  if (beneficiaries.suppliers.length > 0) {
    html += renderSection(
      'suppliers', '🏢', 'المنفذين',
      beneficiaries.suppliers,
      renderSupplierCustomerCard
    );
  }

  // 👤 العملاء
  if (beneficiaries.customers.length > 0) {
    html += renderSection(
      'customers', '👤', 'العملاء',
      beneficiaries.customers,
      renderSupplierCustomerCard
    );
  }

  container.innerHTML = html;
}

function renderSection(sectionKey, icon, label, items, cardRenderer) {
  const sectionId = 'section-' + sectionKey;

  let html = '<div class="section-group" data-section="' + sectionKey + '">';
  html += '  <div class="section-header">';
  html += '    <span class="section-header-icon">' + icon + '</span>';
  html += '    <span>━━━ ' + label + ' ━━━</span>';
  html += '    <span class="section-header-count">' + items.length + '</span>';
  html += '  </div>';
  html += '  <div class="section-body">';

  items.forEach(item => {
    html += cardRenderer(item, sectionKey);
  });

  html += '  </div>';
  html += '</div>';

  return html;
}

// ═══════════════════════════════════════════════════════════════════
// 🚗 VEHICLE CARD
// ═══════════════════════════════════════════════════════════════════
function renderVehicleCard(v, sectionKey) {
  const key = 'vehicle_' + v.vehicleId;
  const isSelected = selectedBeneficiaries.has(key);
  const cardClass = !v.licenseValid ? 'danger' : (v.licenseWarning ? 'warning' : '');
  const selectedClass = isSelected ? 'selected' : '';

    html += '      <div style="font-size:24px;font-weight:900;color:var(--navy);">' + (summary.totalVehicles || 0) + '</div>';
    html += '      <div style="font-size:11px;color:var(--text-lt);font-weight:700;">🚗 سيارات</div>';
    html += '    </div>';
    html += '    <div style="padding:12px;background:#f8fafc;border-radius:10px;text-align:center;">';
    html += '      <div style="font-size:24px;font-weight:900;color:var(--navy);">' + (summary.totalBoats || 0) + '</div>';
    html += '      <div style="font-size:11px;color:var(--text-lt);font-weight:700;">⛵ مراكب</div>';
    html += '    </div>';
    html += '    <div style="padding:12px;background:#f8fafc;border-radius:10px;text-align:center;">';
    html += '      <div style="font-size:24px;font-weight:900;color:var(--navy);">' + (summary.totalInstructors || 0) + '</div>';

    html += '    </div>';
    html += '  </div>';

    // Rest summary
    const restObj = summary.totalRest || {};

      const parts = Object.entries(restObj).filter(([c, v]) => v > 0).map(([c, v]) => roundToTwo(v).toFixed(2) + ' ' + c);

        html += '  <div style="margin-top:12px;padding:12px;background:#fef3c7;border-radius:10px;text-align:center;">';
        html += '    <div style="font-size:14px;font-weight:800;color:#92400e;">💰 إجمالي المتبقي</div>';
        html += '    <div style="font-size:16px;font-weight:900;color:#b45309;margin-top:4px;">' + parts.join(' | ') + '</div>';

    // ⚠️ التنبيهات

      html += '<div class="alerts-section">';
      html += '  <div class="alerts-title">⚠️ التنبيهات (' + alerts.length + ')</div>';
      for (const alert of alerts) {
        html += '  <div class="alert-item ' + alert.level + '">';
        html += '    <span>' + (alert.level === 'danger' ? '❌' : '⚠️') + '</span>';
        html += '    <span>' + escHtml(alert.message) + '</span>';
        html += '  </div>';
      }
      html += '</div>';
    } else {
      html += '<div class="alerts-section">';
      html += '  <div class="alerts-title" style="color:var(--green);">✅ لا توجد تنبيهات</div>';
      html += '</div>';
    }

    // 👥 الأطراف المعنية
    html += '<div class="alerts-section">';
    html += '  <div class="alerts-title">👥 الأطراف المعنية</div>';

    // سيارات
    if (result.beneficiaries.vehicles.length > 0) {
      html += '  <div style="margin-bottom:10px;">';
      html += '    <div style="font-weight:800;color:var(--navy);font-size:12px;margin-bottom:6px;">🚗 السيارات:</div>';
      for (const v of result.beneficiaries.vehicles) {
        html += '    <div style="padding:6px 10px;background:#f8fafc;border-radius:6px;margin-bottom:3px;font-size:11px;">';
        html += '      <strong>' + escHtml(v.driverName) + '</strong> (' + escHtml(v.licensePlate) + ') — ' + v.totalPax + ' فرد';
        html += '    </div>';
      }
      html += '  </div>';
    }

    // مراكب
    if (result.beneficiaries.boats.length > 0) {
      html += '  <div style="margin-bottom:10px;">';
      html += '    <div style="font-weight:800;color:var(--navy);font-size:12px;margin-bottom:6px;">⛵ المراكب:</div>';
      for (const b of result.beneficiaries.boats) {
        html += '    <div style="padding:6px 10px;background:#f8fafc;border-radius:6px;margin-bottom:3px;font-size:11px;">';
        html += '      <strong>' + escHtml(b.captainName) + '</strong> (' + escHtml(b.boatName) + ') — ' + b.totalPax + ' فرد';
        html += '    </div>';
      }
      html += '  </div>';
    }

    // مدربين
    if (result.beneficiaries.instructors.length > 0) {
      html += '  <div style="margin-bottom:10px;">';
      html += '    <div style="font-weight:800;color:var(--navy);font-size:12px;margin-bottom:6px;">👨‍🏫 المدربين:</div>';
      for (const i of result.beneficiaries.instructors) {
        const actTotal = Object.values(i.activitiesMap || {}).reduce((a, x) => a + x, 0);
        html += '    <div style="padding:6px 10px;background:#f8fafc;border-radius:6px;margin-bottom:3px;font-size:11px;">';
        html += '      <strong>' + escHtml(i.instructorName) + '</strong> — ' + actTotal + ' نشاط';
        html += '    </div>';
      }
      html += '  </div>';
    }

    // منفذين
    if (result.beneficiaries.suppliers.length > 0) {
      html += '  <div style="margin-bottom:10px;">';
      html += '    <div style="font-weight:800;color:var(--navy);font-size:12px;margin-bottom:6px;">🏢 المنفذين:</div>';
      for (const s of result.beneficiaries.suppliers) {
        html += '    <div style="padding:6px 10px;background:#f8fafc;border-radius:6px;margin-bottom:3px;font-size:11px;">';
        html += '      <strong>' + escHtml(s.supplierName) + '</strong> — ' + s.totalPax + ' فرد';
        html += '    </div>';
      }
      html += '  </div>';
    }

    // عملاء
    if (result.beneficiaries.customers.length > 0) {
      html += '  <div style="margin-bottom:10px;">';
      html += '    <div style="font-weight:800;color:var(--navy);font-size:12px;margin-bottom:6px;">👤 العملاء:</div>';
      for (const c of result.beneficiaries.customers) {
        html += '    <div style="padding:6px 10px;background:#f8fafc;border-radius:6px;margin-bottom:3px;font-size:11px;">';
        html += '      <strong>' + escHtml(c.customerName) + '</strong> — ' + c.totalPax + ' فرد';
        html += '    </div>';
      }
      html += '  </div>';
    }

    html += '</div>';

    container.innerHTML = html;

  } catch(e) {
    console.error('❌ renderManager error:', e);
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><h3>فشل تحميل خطة المدير</h3><p>' + escHtml(e.message) + '</p></div>';
  }
}

// ═══════════════════════════════════════════════════════════════════
// 🎯 SELECTION
// ═══════════════════════════════════════════════════════════════════
function toggleBeneficiaryCard(key) {
  const card = document.querySelector('.beneficiary-card[data-key="' + CSS.escape(key) + '"]');
  if (card) card.classList.toggle('open');
}

function toggleBeneficiarySelection(key, checkbox) {
  if (checkbox.checked) {
    selectedBeneficiaries.add(key);
  } else {
    selectedBeneficiaries.delete(key);
  }
  const card = checkbox.closest('.beneficiary-card');
  if (card) {
    card.classList.toggle('selected', checkbox.checked);
  }
  updateSelectionCount();
}

function selectAllBeneficiaries() {
  document.querySelectorAll('.beneficiary-card').forEach(card => {
    const key = card.dataset.key;
    if (!key) return;
    selectedBeneficiaries.add(key);
    const cb = card.querySelector('.beneficiary-checkbox');
    if (cb) cb.checked = true;
    card.classList.add('selected');
  });
  updateSelectionCount();
  showToast('✅ تم تحديد الكل', 'info');
}

function clearAllBeneficiaries() {
  selectedBeneficiaries.clear();
  document.querySelectorAll('.beneficiary-card').forEach(card => {
    card.classList.remove('selected');
    const cb = card.querySelector('.beneficiary-checkbox');
    if (cb) cb.checked = false;
  });
  updateSelectionCount();
  showToast('❌ تم إلغاء التحديد', 'info');
}

function updateSelectionCount() {
  document.getElementById('selectionCount').textContent = selectedBeneficiaries.size + ' محدد';
}

// ═══════════════════════════════════════════════════════════════════
// 📤 SEND MODAL
// ═══════════════════════════════════════════════════════════════════
function openSendModal(type) {
  if (selectedBeneficiaries.size === 0) {
    showToast('⚠️ الرجاء تحديد مستفيد واحد على الأقل', 'error');
    return;
  }

  const items = getSelectedBeneficiaryItems();
  if (items.length === 0) {
    showToast('⚠️ لم يتم العثور على العناصر', 'error');
    return;
  }

  const modal = document.getElementById('sendModal');
  const title = document.getElementById('sendModalTitle');
  const body = document.getElementById('sendModalBody');

  if (type === 'whatsapp') {
    title.textContent = '📱 إرسال واتساب';
    body.innerHTML = buildRecipientList(items, 'whatsapp');
  } else if (type === 'email') {
    title.textContent = '📧 إرسال إيميل';
    body.innerHTML = buildEmailForm(items);
  } else if (type === 'pdf') {
    title.textContent = '🖨️ إرسال PDF';
    body.innerHTML = buildPdfForm(items);
  }

  modal.classList.add('open');
}

function closeSendModal() {
  document.getElementById('sendModal').classList.remove('open');
}

function getSelectedBeneficiaryItems() {
  const items = [];

  for (const key of selectedBeneficiaries) {
    // vehicle_
    if (key.startsWith('vehicle_')) {
      const id = key.replace('vehicle_', '');
      const found = beneficiaries.vehicles.find(v => v.vehicleId === id);
      if (found) items.push({ ...found, _key: key, _type: 'vehicle' });
    }
    // boat_
    else if (key.startsWith('boat_')) {
      const id = key.replace('boat_', '');
      const found = beneficiaries.boats.find(b => b.boatId === id);
      if (found) items.push({ ...found, _key: key, _type: 'boat' });
    }
    // instr_
    else if (key.startsWith('instr_')) {
      const id = key.replace('instr_', '');
      const found = beneficiaries.instructors.find(i => i.id === id);
      if (found) items.push({ ...found, _key: key, _type: 'instructor' });
    }
    // supplier_
    else if (key.startsWith('supplier_')) {
      const id = key.replace('supplier_', '');
      const found = beneficiaries.suppliers.find(s => s.id === id);
      if (found) items.push({ ...found, _key: key, _type: 'supplier' });
    }
    // customer_
    else if (key.startsWith('customer_')) {
      const id = key.replace('customer_', '');
      const found = beneficiaries.customers.find(c => c.id === id);
      if (found) items.push({ ...found, _key: key, _type: 'customer' });
    }
  }

  return items;
}

// ═══════════════════════════════════════════════════════════════════
// 📱 WHATSAPP RECIPIENT LIST
// ═══════════════════════════════════════════════════════════════════
function buildRecipientList(items, channel) {
  let html = '<div style="font-size:12px;color:var(--text-lt);margin-bottom:12px;">اختر المستفيد لإرسال الرسالة إليه:</div>';
  html += '<div class="recipient-list">';

  for (const item of items) {
    const phone = getPhoneForItem(item);
    const hasPhone = phone && phone.length > 5;
    const name = getNameForItem(item);
    const icon = getIconForItem(item);
    const sub = getSubForItem(item);

    html += '<div class="recipient-item ' + (hasPhone ? '' : 'no-phone') + '" onclick="' + (hasPhone ? 'sendWhatsAppTo(\'' + escHtml(item._key) + '\')' : 'showToast(\'⚠️ لا يوجد رقم هاتف\', \'error\')') + '">';
    html += '  <span class="recipient-icon">' + icon + '</span>';
    html += '  <div class="recipient-info">';
    html += '    <div class="recipient-name">' + escHtml(name) + '</div>';
    html += '    <div class="recipient-sub">' + escHtml(sub) + '</div>';
    html += '  </div>';
    if (hasPhone) {
      html += '  <div class="recipient-phone">📞 ' + escHtml(phone) + '</div>';
    } else {
      html += '  <div style="font-size:11px;color:var(--red);">⚠️ لا يوجد رقم</div>';
    }
    html += '</div>';
  }

  html += '</div>';
  return html;
}

function getPhoneForItem(item) {
  if (item._type === 'vehicle') return item.driverPhone || '';
  if (item._type === 'boat') return item.captainPhone || '';
  if (item._type === 'instructor') return item.instructorPhone || '';
  if (item._type === 'supplier') return item.supplierPhone || '';
  if (item._type === 'customer') return item.customerPhone || '';
  return '';
}

function getNameForItem(item) {
  if (item._type === 'vehicle') return item.driverName + ' (' + item.licensePlate + ')';
  if (item._type === 'boat') return item.captainName + ' (' + item.boatName + ')';
  if (item._type === 'instructor') return item.instructorName;
  if (item._type === 'supplier') return item.supplierName;
  if (item._type === 'customer') return item.customerName;
  return '';
}

function getIconForItem(item) {
  if (item._type === 'vehicle') return '🚗';
  if (item._type === 'boat') return '⛵';
  if (item._type === 'instructor') return '👨‍🏫';
  if (item._type === 'supplier') return '🏢';
  if (item._type === 'customer') return '👤';
  return '📋';
}

function getSubForItem(item) {
  const parts = [];
  if (item.invoiceCount) parts.push(item.invoiceCount + ' فاتورة');
  if (item.totalPax) parts.push(item.totalPax + ' فرد');
  if (item.totalGoCount) parts.push('ذهاب: ' + item.totalGoCount + ' • عودة: ' + item.totalReturnCount);
  if (item.activitiesMap) {
    const total = Object.values(item.activitiesMap).reduce((a, x) => a + x, 0);
    if (total > 0) parts.push(total + ' نشاط');
  }
  return parts.join(' • ');
}

// ═══════════════════════════════════════════════════════════════════
// 📱 SEND WHATSAPP
// ═══════════════════════════════════════════════════════════════════
function sendWhatsAppTo(key) {
  const items = getSelectedBeneficiaryItems();
  const item = items.find(i => i._key === key);
  if (!item) return;

  const phone = getPhoneForItem(item);
  if (!phone) {
    showToast('⚠️ لا يوجد رقم هاتف', 'error');
    return;
  }

  const message = buildMessageForItem(item);
  const cleanPhone = phone.replace(/[^\d]/g, '');
  const url = 'https://wa.me/' + cleanPhone + '?text=' + encodeURIComponent(message);
  window.open(url, '_blank');

  closeSendModal();
  showToast('✅ تم فتح واتساب', 'success');
}

// ═══════════════════════════════════════════════════════════════════
// 📝 BUILD MESSAGE FOR ITEM
// ═══════════════════════════════════════════════════════════════════
function buildMessageForItem(item) {
  const fromDateStr = isoToTxt(selectedFromISO);
  const toDateStr = isoToTxt(selectedToISO);
  const periodStr = fromDateStr === toDateStr ? fromDateStr : (fromDateStr + ' → ' + toDateStr);

  let msg = '';

  if (item._type === 'vehicle') {
    msg += '🚗 *خطة عمل السيارة*\n';
    msg += '📅 ' + periodStr + '\n';
    msg += '━━━━━━━━━━━━━━━━\n\n';
    msg += '🚗 *السيارة:* ' + (item.licensePlate || '—') + '\n';
    msg += '👨‍✈️ *السائق:* ' + (item.driverName || '—') + '\n';
    msg += '🔄 *إجمالي الذهاب:* ' + (item.totalGoCount || 0) + '\n';
    msg += '🔙 *إجمالي العودة:* ' + (item.totalReturnCount || 0) + '\n';
    msg += '📊 *إجمالي التشغيلات:* ' + (item.totalPax || 0) + '\n';
    msg += '🧾 *عدد الفواتير:* ' + (item.invoiceCount || 0) + '\n\n';
    msg += '📋 *الجدول الزمني:*\n';
    msg += '━━━━━━━━━━━━━━━━\n';

    for (const inv of item.invoices) {
      msg += '\n⏰ *' + (inv.time || '--:--') + '*\n';
      msg += '   🏝️ الرحلة: ' + (inv.trip || '—') + '\n';
      msg += '   🏨 الفندق: ' + (inv.hotel || '—') + '\n';
      msg += '   🚪 الغرفة: ' + (inv.roomNo || '—') + '\n';
      msg += '   👤 العميل: ' + (inv.guestName || '—') + '\n';
      msg += '   🔄 ذهاب: ' + inv.goCount + ' • 🔙 عودة: ' + inv.returnCount + '\n';
    }
  }

  else if (item._type === 'boat') {
    msg += '⛵ *خطة عمل المركب*\n';
    msg += '📅 ' + periodStr + '\n';
    msg += '━━━━━━━━━━━━━━━━\n\n';
    msg += '⛵ *المركب:* ' + (item.boatName || '—') + '\n';
    msg += '👨‍✈️ *القائد:* ' + (item.captainName || '—') + '\n';
    msg += '👥 *إجمالي الأفراد:* ' + (item.totalPax || 0) + '\n';
    msg += '   👤 بالغ: ' + (item.totalAdults || 0) + ' • 👶 طفل: ' + (item.totalChildren || 0) + ' • 🍼 رضيع: ' + (item.totalInfants || 0) + '\n';
    msg += '🧾 *عدد الرحلات:* ' + (item.invoiceCount || 0) + '\n\n';
    msg += '📋 *الجدول الزمني:*\n';
    msg += '━━━━━━━━━━━━━━━━\n';

    for (const inv of item.invoices) {
      msg += '\n⏰ *' + (inv.time || '--:--') + '*\n';
      msg += '   🏝️ الرحلة: ' + (inv.trip || '—') + '\n';
      msg += '   🏨 الفندق: ' + (inv.hotel || '—') + '\n';
      msg += '   🚪 الغرفة: ' + (inv.roomNo || '—') + '\n';
      msg += '   👤 العميل: ' + (inv.guestName || '—') + '\n';
      msg += '   👥 الأفراد: ' + inv.totalPax + '\n';
    }
  }

  else if (item._type === 'instructor') {
    msg += '👨‍🏫 *خطة عمل المدرب*\n';
    msg += '📅 ' + periodStr + '\n';
    msg += '━━━━━━━━━━━━━━━━\n\n';
    msg += '👨‍🏫 *المدرب:* ' + (item.instructorName || '—') + '\n';
    if (item.role) msg += '🎭 *الدور:* ' + item.role + '\n';
    msg += '🧾 *عدد الرحلات:* ' + (item.invoiceCount || 0) + '\n\n';

    if (item.activitiesMap && Object.keys(item.activitiesMap).length > 0) {
      msg += '📋 *ملخص الأنشطة:*\n';
      for (const [actName, qty] of Object.entries(item.activitiesMap)) {
        msg += '   • ' + actName + ' × ' + qty + '\n';
      }
      msg += '\n';
    }

    msg += '📋 *الجدول الزمني:*\n';
    msg += '━━━━━━━━━━━━━━━━\n';

    for (const inv of item.invoices) {
      msg += '\n⏰ *' + (inv.time || '--:--') + '*\n';
      msg += '   🏝️ الرحلة: ' + (inv.trip || '—') + '\n';
      msg += '   🏨 الفندق: ' + (inv.hotel || '—') + '\n';
      msg += '   👤 العميل: ' + (inv.guestName || '—') + '\n';

      const acts = (inv.activities || []).map(a => (a.displayName || a.activityName || '') + '×' + (a.quantity || 0)).filter(x => !x.includes('×0')).join(', ');
      if (acts) msg += '   📋 الأنشطة: ' + acts + '\n';
    }
  }

  else if (item._type === 'supplier') {
    msg += '🏢 *خطة عمل المنفذ*\n';
    msg += '📅 ' + periodStr + '\n';
    msg += '━━━━━━━━━━━━━━━━\n\n';

    msg += '📋 *الفواتير:*\n';
    msg += '━━━━━━━━━━━━━━━━\n';

    for (const inv of item.invoices) {
      msg += '\n⏰ *' + (inv.time || '--:--') + '*\n';

    }
  }

  msg += '\n━━━━━━━━━━━━━━━━\n';
  msg += '🌊 Dive System';

  return msg;
}

// ═══════════════════════════════════════════════════════════════════
// 📧 EMAIL FORM
// ═══════════════════════════════════════════════════════════════════
function buildEmailForm(items) {
  let html = '<div class="form-group">';
  html += '<label>📧 البريد الإلكتروني للمستلم</label>';
  html += '<input type="email" id="emailRecipient" placeholder="example@email.com" required>';
  html += '</div>';

  html += '<div class="form-group">';
  html += '<label>📝 ملاحظات إضافية (اختياري)</label>';
  html += '<textarea id="emailNotes" rows="3" placeholder="سيتم إضافتها في نهاية الرسالة"></textarea>';
  html += '</div>';

  html += '<div style="background:var(--gray-50);padding:10px;border-radius:8px;font-size:11px;color:var(--text-lt);margin-bottom:12px;">';
  html += '📎 سيتم إرفاق خطة العمل لـ <strong>' + items.length + '</strong> مستفيد محدد';
  html += '</div>';

  html += '<div class="modal-btns">';
  html += '<button class="modal-btn cancel" onclick="closeSendModal()">إلغاء</button>';
  html += '<button class="modal-btn primary" onclick="submitEmail()">📧 إرسال</button>';
  html += '</div>';

  setTimeout(() => {
    const el = document.getElementById('emailRecipient');
    if (el) el.focus();
  }, 100);

  return html;
}

function submitEmail() {
  const email = (document.getElementById('emailRecipient')?.value || '').trim();
  const notes = (document.getElementById('emailNotes')?.value || '').trim();

  if (!email || !email.includes('@')) {
    showToast('⚠️ الرجاء إدخال بريد إلكتروني صحيح', 'error');
    return;
  }

  const items = getSelectedBeneficiaryItems();
  const subject = '🌊 خطة عمل يومية - ' + isoToTxt(selectedFromISO);
  const body = buildEmailBody(items, notes);

  const mailtoUrl = 'mailto:' + encodeURIComponent(email) +
    '?subject=' + encodeURIComponent(subject) +
    '&body=' + encodeURIComponent(body);

  window.location.href = mailtoUrl;
  closeSendModal();
  showToast('✅ تم فتح عميل البريد', 'success');
}

function buildEmailBody(items, notes) {
  const fromDateStr = isoToTxt(selectedFromISO);
  const toDateStr = isoToTxt(selectedToISO);
  const periodStr = fromDateStr === toDateStr ? fromDateStr : (fromDateStr + ' → ' + toDateStr);

  let body = 'خطة العمل اليومية\n';
  body += '📅 ' + periodStr + '\n';
  body += '━━━━━━━━━━━━━━━━━━\n\n';

  for (const item of items) {
    body += getIconForItem(item) + ' ' + getNameForItem(item) + '\n';
    body += '   عدد الفواتير: ' + (item.invoiceCount || 0) + '\n';

    if (item._type === 'vehicle') {
      body += '   ذهاب: ' + (item.totalGoCount || 0) + ' | عودة: ' + (item.totalReturnCount || 0) + '\n';
    } else if (item._type === 'boat') {
      body += '   إجمالي الأفراد: ' + (item.totalPax || 0) + '\n';
    } else if (item._type === 'instructor') {
      const actTotal = Object.values(item.activitiesMap || {}).reduce((a, x) => a + x, 0);
      body += '   إجمالي الأنشطة: ' + actTotal + '\n';
    } else {
      body += '   إجمالي الأفراد: ' + (item.totalPax || 0) + '\n';
    }

    body += '\n   📋 الجدول:\n';
    for (const inv of item.invoices) {
      body += '   ⏰ ' + (inv.time || '--:--') + ' | ' + (inv.trip || '—') + ' | ' + (inv.hotel || '—') + '\n';
    }
    body += '\n';
  }

  if (notes) {
    body += '━━━━━━━━━━━━━━━━━━\n';
    body += '📝 ملاحظات:\n' + notes + '\n';
  }

  body += '\n━━━━━━━━━━━━━━━━━━\n';
  body += '🌊 Dive System';

  return body;
}

// ═══════════════════════════════════════════════════════════════════
// ✏️ SUPPLIER/CUSTOMER SELECTION (Modal)
// ═══════════════════════════════════════════════════════════════════
async function openSupplierSelection(voucherNo, tripName, currentValue) {
  try {
    showToast('⏳ جاري تحميل المنفذين...', 'info');

    const suppliers = await gas('getSuppliersAndCustomersForTrip', {
      tripName: tripName,
      type: 'Supplier'
    });

    if (!Array.isArray(suppliers) || suppliers.length === 0) {
      showToast('⚠️ لا يوجد منفذين مرتبطين برحلة "' + tripName + '"', 'error');
      return;
    }

    showSelectionModal(voucherNo, tripName, suppliers, currentValue, 'supplier');

  } catch(e) {
    console.error('❌ openSupplierSelection error:', e);
    showToast('❌ ' + e.message, 'error');
  }
}

async function openCustomerSelection(voucherNo, tripName, currentValue) {
  try {
    showToast('⏳ جاري تحميل العملاء...', 'info');

    const customers = await gas('getSuppliersAndCustomersForTrip', {
      tripName: tripName,
      type: 'Customer'
    });

    if (!Array.isArray(customers) || customers.length === 0) {
      showToast('⚠️ لا يوجد عملاء مرتبطين برحلة "' + tripName + '"', 'error');
      return;
    }

    showSelectionModal(voucherNo, tripName, customers, currentValue, 'customer');

  } catch(e) {
    console.error('❌ openCustomerSelection error:', e);
    showToast('❌ ' + e.message, 'error');
  }
}

function showSelectionModal(voucherNo, tripName, items, currentValue, fieldType) {
  const modal = document.getElementById('selectionModal');
  const title = document.getElementById('selectionModalTitle');
  const body = document.getElementById('selectionModalBody');

  const label = fieldType === 'supplier' ? 'المنفذ' : 'العميل';
  title.textContent = 'اختر ' + label;

  let html = '<div style="text-align:center;margin-bottom:12px;font-size:11px;color:var(--text-lt);">';
  html += 'للرحلة: <strong>' + escHtml(tripName) + '</strong>';
  html += '</div>';

  html += '<div class="recipient-list">';

  // ✅ خيار "بدون"
  html += '<div class="recipient-item ' + (!currentValue ? 'selected' : '') + '" onclick="updateInvoiceField(\'' + escHtml(voucherNo) + '\', \'' + fieldType + '\', \'\')">';
  html += '  <span class="recipient-icon">❌</span>';
  html += '  <div class="recipient-info">';
  html += '    <div class="recipient-name">بدون ' + label + '</div>';
  html += '  </div>';
  html += '</div>';

  for (const item of items) {
    const isSelected = item.customerName === currentValue;
    const phone = item.phone || '';

    html += '<div class="recipient-item ' + (isSelected ? 'selected' : '') + '" onclick="updateInvoiceField(\'' + escHtml(voucherNo) + '\', \'' + fieldType + '\', \'' + escHtml(item.customerName) + '\')">';
    html += '  <span class="recipient-icon">' + (fieldType === 'supplier' ? '🏢' : '👤') + '</span>';
    html += '  <div class="recipient-info">';
    html += '    <div class="recipient-name">' + escHtml(item.customerName) + '</div>';
    if (item.category) {
      html += '    <div class="recipient-sub">' + escHtml(item.category) + '</div>';
    }
    html += '  </div>';
    if (phone) {
      html += '  <div class="recipient-phone" style="font-size:11px;">' + escHtml(phone) + '</div>';
    }
    if (isSelected) {
      html += '  <span class="recipient-check">✓</span>';
    }
    html += '</div>';
  }

  html += '</div>';

  body.innerHTML = html;
  modal.classList.add('open');
}

function closeSelectionModal() {
  document.getElementById('selectionModal').classList.remove('open');
}

async function updateInvoiceField(voucherNo, fieldType, value) {
  closeSelectionModal();
  const field = fieldType === 'supplier' ? 'supplier' : 'customer';
  const label = fieldType === 'supplier' ? 'المنفذ' : 'العميل';

  showToast('⏳ جاري تحديث ' + label + '...', 'info');

  try {
    const user = Session.getUser();
    const result = await gas('updateInvoiceFieldForDailyPlan', {
      voucherNo: voucherNo,
      field: field,
      value: value,
      centerName: user?.centerName || ''
    });

    if (result && result.success) {
      showToast('✅ تم تحديث ' + label, 'success');
      // ✅ إعادة تحميل البيانات
      setTimeout(() => loadData(), 400);
    } else {
      showToast('❌ ' + (result?.message || 'فشل التحديث'), 'error');
    }

  } catch(e) {
    console.error('❌ updateInvoiceField error:', e);
    showToast('❌ ' + e.message, 'error');
  }
}

// ═══════════════════════════════════════════════════════════════════
// ✏️ EDIT INVOICE (Navigation)
// ═══════════════════════════════════════════════════════════════════
function editInvoice(voucherNo) {
  if (!voucherNo) return;
  const user = Session.getUser();
  sessionStorage.setItem('currentUser', JSON.stringify(user));
  sessionStorage.setItem('sourcePage', 'DailyOperationsPlan');
  sessionStorage.setItem('centerName', user?.centerName || '');
  window.location.href = 'EditInvoice.html?voucherNo=' + encodeURIComponent(voucherNo) + '&from=dailyPlan&center=' + encodeURIComponent(user?.centerName || '');
}

// ═══════════════════════════════════════════════════════════════════
// 🚀 INITIALIZATION
// ═══════════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async function() {

  // ✅ تطبيق الثيم
  if (typeof Theme !== 'undefined' && Theme.applyToPage) {
    Theme.applyToPage();
    if (Theme.setPageTitle) Theme.setPageTitle('خطة العمل اليومية');
  }

  // ✅ التحقق من الجلسة
  if (!Session.checkValidity()) {
    return;
  }

  currentUser = Session.getUser();
  if (!currentUser) {
    location.href = 'index.html';
    return;
  }

  document.getElementById('userNameDisplay').textContent = currentUser.name || 'User';

  // ✅ قراءة التاريخ من URL / sessionStorage
  let incomingFrom = '';
  let incomingTo = '';
  try {
    const urlParams = new URLSearchParams(window.location.search);
    incomingFrom = urlParams.get('from') || urlParams.get('date') || '';
    incomingTo = urlParams.get('to') || incomingFrom;

    if (!incomingFrom) {
      const stored = sessionStorage.getItem('dailyPlanDate');
      if (stored) {
        incomingFrom = stored;
        incomingTo = stored;
        sessionStorage.removeItem('dailyPlanDate');
      }
    }
  } catch(e) {}

  // ✅ تحويل الصيغ
  function normalizeISO(val) {
    if (!val) return '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(val)) return val;
    if (/^\d{1,2}\/[A-Za-z]{3}\/\d{4}$/.test(val)) {
      const m = val.match(/^(\d{1,2})\/([A-Za-z]{3})\/(\d{4})$/);
      const mi = MONTHS.findIndex(x => x.toLowerCase() === m[2].toLowerCase());
      if (mi === -1) return '';
      return m[3] + '-' + String(mi + 1).padStart(2, '0') + '-' + m[1].padStart(2, '0');
    }
    return '';
  }

  const fromISO = normalizeISO(incomingFrom) || todayISO();
  const toISO = normalizeISO(incomingTo) || fromISO;

  selectedFromISO = fromISO;
  selectedToISO = toISO;

  document.getElementById('fromNative').value = fromISO;
  document.getElementById('fromDisplay').value = isoToTxt(fromISO);
  document.getElementById('toNative').value = toISO;
  document.getElementById('toDisplay').value = isoToTxt(toISO);

  console.log('📅 DailyPlan initialized:', fromISO, '→', toISO);

  // ✅ تحميل البيانات
  await loadData();
});

// ✅ ESC لإغلاق المودالات
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeSendModal();
    closeSelectionModal();
  }
});
