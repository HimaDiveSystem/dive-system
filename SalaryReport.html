<script>
// ============================================================
// ✅ استخدام Session و CONFIG و Theme من الملفات الموحدة
// ============================================================

let currentUser = null;
let tableData = [];
let isLoadingReport = false;   // ✅ جديد — لمنع Race Condition

// ──────────────────────────────────────────────
// ✅ JSONP helper - باستخدام CONFIG.GAS_URL
// ──────────────────────────────────────────────
// ──────────────────────────────────────────────
// ✅ JSONP helper - بدون Retry (لأن Retry يُسبب مشاكل callback)
// ──────────────────────────────────────────────
function jsonp(action, params = {}) {
  return new Promise((resolve, reject) => {
    // ✅ ✅ ✅ تحقق فوري: هل التقرير قيد التحميل؟
    if (window._jsonpInFlight) {
      console.log('⚠️ jsonp: طلب آخر قيد التنفيذ — إلغاء');
      reject(new Error('طلب آخر قيد التنفيذ'));
      return;
    }
    window._jsonpInFlight = true;
    
    const cb = 'cb_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
    params.action = action;
    params.callback = cb;
    
    const user = Session.getUser();
    if (user) {
      if (user.centerId && !params.centerId) params.centerId = user.centerId;
      if (user.centerName && !params.centerName) params.centerName = user.centerName;
    }
    
    const qs = Object.entries(params)
      .filter(([k, v]) => v !== undefined && v !== null)
      .map(([k, v]) => k + '=' + encodeURIComponent(String(v ?? '')))
      .join('&');
    
    const script = document.createElement('script');
    let completed = false;
    
    // ✅ Timeout نظيف
    const timeout = setTimeout(() => {
      if (completed) return;
      completed = true;
      delete window[cb];
      script.remove();
      window._jsonpInFlight = false;
      reject(new Error('انتهى الوقت (60 ثانية)'));
    }, 60000);
    
    window[cb] = (data) => {
      if (completed) return;
      completed = true;
      clearTimeout(timeout);
      delete window[cb];
      script.remove();
      window._jsonpInFlight = false;
      resolve(data);
    };
    
    script.onerror = () => {
      if (completed) return;
      completed = true;
      clearTimeout(timeout);
      delete window[cb];
      script.remove();
      window._jsonpInFlight = false;
      reject(new Error('خطأ في الاتصال'));
    };
    
    script.src = CONFIG.GAS_URL + '?' + qs;
    document.head.appendChild(script);
  });
}
// ═══════════════════════════════════════════════════════════════════
// fmt — دالة عامة لتنسيق الأرقام (تُستخدم في renderTable و openCommissionDetails)
// ═══════════════════════════════════════════════════════════════════
function fmt(n) {
  if (n === undefined || n === null || n === '' || n === 0) return '0';
  const num = parseFloat(n);
  if (isNaN(num)) return '0';
  return Math.round(num).toLocaleString();
}
// ──────────────────────────────────────────────
// ✅ دالة مساعدة لتنسيق القيم
// ──────────────────────────────────────────────
function formatValue(value, isCurrency = false) {
  if (value === undefined || value === null || value === '') return '—';
  const num = parseFloat(value);
  if (isNaN(num)) return '—';
  if (num === 0) return '—';
  if (isCurrency) return num.toLocaleString();
  if (Number.isInteger(num)) return num.toLocaleString();
  return num.toFixed(1);
}

// ──────────────────────────────────────────────
// ✅ تهيئة الصفحة
// ──────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  // تطبيق الثيم الموحد
  if (typeof Theme !== 'undefined') {
    Theme.applyToPage();
  }
  
  // ✅ استخدام Session.getUser()
  currentUser = Session.getUser();
  
  // ✅ التحقق من صحة الجلسة
  if (!currentUser) {
    window.location.href = 'index.html';
    return;
  }
  
  // عرض اسم المستخدم
  document.getElementById('userBadge').textContent = currentUser?.name || '—';

  // تعبئة سنوات
  const selYear = document.getElementById('selYear');
  const currentYear = new Date().getFullYear();
  for (let y = currentYear + 1; y >= 2020; y--) {
    const opt = document.createElement('option');
    opt.value = y; 
    opt.textContent = y;
    if (y === currentYear) opt.selected = true;
    selYear.appendChild(opt);
  }

  // قراءة المعاملات من URL
  const urlParams = new URLSearchParams(window.location.search);
  const month = urlParams.get('month');
  const year  = urlParams.get('year');
  if (month) document.getElementById('selMonth').value = month;
  if (year)  document.getElementById('selYear').value  = year;

  // إضافة الوقت في الفوتر
  const timeEl = document.getElementById('footerTime');
  if (timeEl) {
    const now = new Date();
    timeEl.textContent = now.toLocaleString('ar-EG');
  }

  // تحميل التقرير
  loadReport();
});

// ═══════════════════════════════════════════════════════════════════
// loadReport — تحميل تقرير المرتبات (Bootstrap Request)
// ═══════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════
// loadReport — تحميل تقرير المرتبات (Bootstrap Request)
// ═══════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════
// loadReport — مع Cache على الواجهة
// ═══════════════════════════════════════════════════════════════════
async function loadReport() {
  // ✅ 1. منع التحميل المتزامن
  if (isLoadingReport) {
    console.log('⚠️ loadReport: التحميل قيد التنفيذ — تجاهل');
    return;
  }
  
  const selMonthEl = document.getElementById('selMonth');
  const selYearEl  = document.getElementById('selYear');
  const month = selMonthEl ? selMonthEl.value : '';
  const year  = selYearEl  ? selYearEl.value  : '';
  
  if (!month || !year) {
    showToast('اختر الشهر والسنة', 'error');
    return;
  }
  
  // ✅ ✅ ✅ 2. Cache على sessionStorage (5 دقائق)
  const cacheKey = `salary_${month}_${year}_${currentUser?.centerId || ''}`;
  try {
    const cached = sessionStorage.getItem(cacheKey);
    const cachedTime = sessionStorage.getItem(cacheKey + '_time');
    
    if (cached && cachedTime && (Date.now() - parseInt(cachedTime)) < 300000) {
      console.log(`📦 loadReport: استخدام Cache (عمره ${Math.round((Date.now() - parseInt(cachedTime))/1000)}s)`);
      
      // ✅ استخدم البيانات المخزنة
      isLoadingReport = true;
      try {
        const cachedResult = JSON.parse(cached);
        processReportData(cachedResult, month, year);
        console.log('✅ loadReport: تم العرض من Cache');
      } catch(e) {
        console.warn('⚠️ Cache parse error:', e.message);
        sessionStorage.removeItem(cacheKey);
        sessionStorage.removeItem(cacheKey + '_time');
        // متابعة الطلب العادي
      } finally {
        isLoadingReport = false;
      }
      return;
    }
  } catch(e) {
    console.warn('⚠️ sessionStorage error:', e.message);
  }
  
  // ✅ 3. حظر 3 ثوانٍ (للأمان)
  if (window._lastLoadTime && (Date.now() - window._lastLoadTime < 3000)) {
    const wait = Math.ceil((3000 - (Date.now() - window._lastLoadTime)) / 1000);
    console.log(`⚠️ loadReport: انتظر ${wait} ثانية`);
    showToast(`انتظر ${wait} ثانية...`, 'info');
    return;
  }
  window._lastLoadTime = Date.now();
  
  isLoadingReport = true;
  
  // ✅ تعطيل الحقول
  if (selMonthEl) selMonthEl.disabled = true;
  if (selYearEl)  selYearEl.disabled  = true;
  
  // ✅ تحديث الأزرار
  const btnLoad = document.getElementById('btnLoadReport');
  const btnExcel = document.getElementById('btnExportExcel');
  
  if (btnLoad) {
    btnLoad.disabled = true;
    btnLoad.style.opacity = '0.6';
    btnLoad.style.cursor = 'wait';
    btnLoad.textContent = '⏳ جاري العرض...';
  }
  
  if (btnExcel) {
    btnExcel.disabled = true;
    btnExcel.style.opacity = '0.5';
    btnExcel.style.cursor = 'not-allowed';
  }
  
  document.getElementById('reportArea').innerHTML = '<div class="loader"></div>';
  document.getElementById('infoBar').style.display = 'none';
  
  try {
    console.log('📡 getSalaryReportBootstrap — إرسال طلب موحّد...');
    
    const result = await jsonp('getSalaryReportBootstrap', { month, year });
    
    console.log('📥 getSalaryReportBootstrap — النتيجة:', result);
    
    if (!result || !result.success) {
      document.getElementById('reportArea').innerHTML =
        '<div class="empty">❌ ' + (result?.message || 'فشل التحميل') + '</div>';
      return;
    }
    
    // ✅ ✅ ✅ 4. حفظ في Cache
    try {
      sessionStorage.setItem(cacheKey, JSON.stringify(result));
      sessionStorage.setItem(cacheKey + '_time', Date.now().toString());
      console.log('💾 loadReport: تم حفظ النتيجة في Cache');
    } catch(e) {
      console.warn('⚠️ Cache save error:', e.message);
    }
    
    // ✅ معالجة البيانات
    processReportData(result, month, year);
    
  } catch(e) {
    console.error('❌ loadReport error:', e);
    document.getElementById('reportArea').innerHTML =
      '<div class="empty">❌ خطأ: ' + e.message + '</div>';
    tableData = [];
  } finally {
    isLoadingReport = false;
    window._jsonpInFlight = false;
    
    if (selMonthEl) selMonthEl.disabled = false;
    if (selYearEl)  selYearEl.disabled  = false;
    
    if (btnLoad) {
      btnLoad.disabled = false;
      btnLoad.style.opacity = '1';
      btnLoad.style.cursor = 'pointer';
      btnLoad.textContent = '🔍 عرض التقرير';
    }
    
    if (btnExcel) {
      btnExcel.disabled = false;
      btnExcel.style.opacity = '1';
      btnExcel.style.cursor = 'pointer';
    }
    
    console.log('🔄 loadReport: تم إعادة تعيين الحالة');
  }
}

// ═══════════════════════════════════════════════════════════════════
// processReportData — معالجة بيانات التقرير (مستخرجة لدالة منفصلة)
// ═══════════════════════════════════════════════════════════════════
function processReportData(result, month, year) {
  const salResult = result.salary;
  const invoicesResult = result.invoices;
  const expResult = result.expenses;
  const ratesResult = result.rates;
  
  if (!ratesResult || !ratesResult.bUSD || !ratesResult.bEUR || !ratesResult.bGBP) {
    document.getElementById('reportArea').innerHTML =
      '<div class="empty">⚠️ لا توجد أسعار صرف في شيت Exchange_Rates<br><small>يرجى إدخال أسعار الصرف أولاً</small></div>';
    tableData = [];
    return;
  }
  
  const usdRate = parseFloat(ratesResult.bUSD);
  const eurRate = parseFloat(ratesResult.bEUR);
  
  if (!salResult || !salResult.success || !salResult.employees || salResult.employees.length === 0) {
    document.getElementById('reportArea').innerHTML =
      '<div class="empty">📭 لا توجد بيانات رواتب للشهر المحدد<br><small>تأكد من تسجيل الحضور وضغط "مزامنة" أولاً</small></div>';
    tableData = [];
    return;
  }
  
  const employees = salResult.employees;
  
    tableData = employees.map(emp => {
    // ✅ القراءة من الحقول الجديدة
    const workingDays = parseFloat(emp.workingDays) || 0;
    const baseSalary = parseFloat(emp.baseSalary) || 0;
    const managementSalary = parseFloat(emp.managementSalary) || 0;
    const dailyRate = parseFloat(emp.dailyRate) || 0;
    const execComm = parseFloat(emp.execComm) || 0;
    const upSellComm = parseFloat(emp.upSellComm) || 0;
    const salesComm = parseFloat(emp.salesCommission) || 0;
    
    const total = parseFloat(emp.total) || 0;
    const cuts = parseFloat(emp.cuts) || 0;
    const downPaymentLE = parseFloat(emp.downPaymentLE) || 0;
    const net = parseFloat(emp.net) || 0;
    const role = emp.role || 'Employee';
    
    // نحسب الراتب المستحق للعرض (Permanent Freelancer أو Permanent)
    // إذا كان baseSalary موجوداً، نعرضه
    return {
      userId: emp.userId || '',
      name: emp.name || '',
      role: role,
      workingDays: workingDays,
      baseSalary: baseSalary,
      managementSalary: managementSalary,
      dailyRate: dailyRate,
      execComm: execComm,
      upSellComm: upSellComm,
      salesComm: salesComm,
      total: total,
      cuts: cuts,
      downPaymentLE: downPaymentLE,
      net: net,
      deductionsDetails: emp.deductionsDetails || []
    };
  });  
  const totalCommissions = employees.reduce((sum, emp) =>    sum + (parseFloat(emp.execComm) || 0) + (parseFloat(emp.upSellComm) || 0) + (parseFloat(emp.salesCommission) || 0), 0);
  const totalAdvances    = employees.reduce((sum, emp) => sum + (parseFloat(emp.downPaymentLE) || 0), 0);
  
  document.getElementById('infoBar').style.display = 'flex';
  document.getElementById('infoText').textContent =
    `إجمالي العمولات المجمَّعة من الفواتير: ${Math.round(totalCommissions).toLocaleString()} LE  |  إجمالي المسحوبات: ${Math.round(totalAdvances).toLocaleString()} LE  |  سعر الصرف المستخدم: $1 = ${usdRate} LE، €1 = ${eurRate} LE`;
  
  renderTable(tableData, month, year);
}
  // ──────────────────────────────────────────────
// ✅ عرض الجدول
// ──────────────────────────────────────────────
function renderTable(rows, month, year) {
  if (!rows.length) {
    document.getElementById('reportArea').innerHTML =
      '<div class="empty">📭 لا توجد بيانات</div>';
    return;
  }

  function fmtDays(n) { return (Math.round(n*100)/100).toLocaleString(); }

  let html = `<div class="table-wrap"><table>
    <thead>
      <tr>
        <th>#</th>
        <th>الرقم</th>
        <th style="text-align:right;">الاسم</th>
        <th>الدور</th>
        <th>أيام العمل</th>
        <th>الراتب/اليومية</th>
        <th>راتب الإدارة</th>
        <th>إجمالي اليوميات</th>
        <th>عمولة تنفيذ</th>
        <th>عمولة UpSell</th>
        <th>عمولة سيلز</th>
        <th>الإجمالي</th>
        <th>الخصم</th>
        <th>السلف</th>
        <th>الصافي</th>
        <th>تفاصيل</th>
      </tr>
    </thead>
    <tbody>`;

  rows.forEach((r, i) => {
    const showDetailsBtn = true;

    let roleBadge = '';
    if (r.role === 'Instructor') roleBadge = '<span class="cell-role">👨‍🏫 Instructor</span>';
    else if (r.role === 'Helper') roleBadge = '<span class="cell-role" style="background:#fef3c7;color:#b45309;">🆘 Helper</span>';
    else if (r.role === 'Photographer') roleBadge = '<span class="cell-role" style="background:#e0f2fe;color:#0369a1;">📸 Photographer</span>';
    else if (r.role === 'Driver') roleBadge = '<span class="cell-role" style="background:#f1f5f9;color:#475569;">🚗 Driver</span>';
    else if (r.role === 'Captain') roleBadge = '<span class="cell-role" style="background:#f1f5f9;color:#475569;">⛵ Captain</span>';
    else if (r.role === 'TechnicalManager') roleBadge = '<span class="cell-role" style="background:#fef3c7;color:#92400e;">👔 Manager</span>';
    else roleBadge = `<span class="cell-role" style="background:#e2e8f0;color:#475569;">${escHtml(r.role)}</span>`;

    html += `<tr>
      <td>${i+1}</td>
      <td style="font-family:monospace;">${r.userId}</td>
      <td style="text-align:right; font-weight:bold;">${escHtml(r.name)}</td>
      <td>${roleBadge}</td>
      <td class="cell-days">${r.workingDays > 0 ? fmt(r.workingDays) : '—'}</td>
      <td class="cell-base-salary">${r.baseSalary > 0 ? fmt(r.baseSalary) : '—'}</td>
      <td class="cell-mgmt-salary">${r.managementSalary > 0 ? fmt(r.managementSalary) : '—'}</td>
      <td class="cell-daily">${r.dailyRate > 0 ? fmt(r.dailyRate) : '—'}</td>
      <td class="cell-exec-comm">${r.execComm > 0 ? fmt(r.execComm) : '—'}</td>
      <td class="cell-upsell-comm">${r.upSellComm > 0 ? fmt(r.upSellComm) : '—'}</td>
      <td class="cell-sales-comm">${r.salesComm > 0 ? fmt(r.salesComm) : '—'}</td>
      <td style="font-weight:700;">${r.total > 0 ? fmt(r.total) : '—'}</td>
      <td style="color:#dc2626;">${r.cuts > 0 ? fmt(r.cuts) : '—'}</td>
      <td style="color:#c0392b;">${r.downPaymentLE > 0 ? fmt(r.downPaymentLE) : '—'}</td>
      <td class="cell-net" style="font-weight:900;color:${r.net>=0?'#1e8449':'#e74c3c'};">${r.net !== 0 ? fmt(r.net) : '—'}</td>
      <td>
        ${showDetailsBtn 
          ? `<button class="btn-details" 
                     data-user-id="${escHtml(r.userId)}" 
                     data-user-name="${escHtml(r.name || '')}"
                     type="button"
                     style="background:#0d9488;color:white;border:none;padding:5px 10px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:700;">
               👁️
             </button>`
          : '—'
        }
      </td>
    </tr>`;
  });

  // ✅ حساب الإجماليات (الحقول الجديدة)
  let totals = {
    workingDays: 0, baseSalary: 0, mgmtSalary: 0, dailyRate: 0,
    execComm: 0, upSellComm: 0, salesComm: 0, total: 0, cuts: 0, downPayment: 0, net: 0
  };
  rows.forEach(r => {
    totals.workingDays += r.workingDays || 0;
    totals.baseSalary += r.baseSalary || 0;
    totals.mgmtSalary += r.managementSalary || 0;
    totals.dailyRate += r.dailyRate || 0;
    totals.execComm += r.execComm || 0;
    totals.upSellComm += r.upSellComm || 0;
    totals.salesComm += r.salesComm || 0;
    totals.total += r.total || 0;
    totals.cuts += r.cuts || 0;
    totals.downPayment += r.downPaymentLE || 0;
    totals.net += r.net || 0;
  });

  html += `<tr class="total-row" style="background:#1e2b4f;color:#ffd966;">
    <td colspan="4"><strong>الإجمالي الكلي</strong></td>
    <td><strong>${totals.workingDays > 0 ? fmt(totals.workingDays) : '—'}</strong></td>
    <td><strong>${totals.baseSalary > 0 ? fmt(totals.baseSalary) : '—'}</strong></td>
    <td><strong>${totals.mgmtSalary > 0 ? fmt(totals.mgmtSalary) : '—'}</strong></td>
    <td><strong>${totals.dailyRate > 0 ? fmt(totals.dailyRate) : '—'}</strong></td>
    <td><strong>${totals.execComm > 0 ? fmt(totals.execComm) : '—'}</strong></td>
    <td><strong>${totals.upSellComm > 0 ? fmt(totals.upSellComm) : '—'}</strong></td>
    <td><strong>${totals.salesComm > 0 ? fmt(totals.salesComm) : '—'}</strong></td>
    <td><strong>${totals.total > 0 ? fmt(totals.total) : '—'}</strong></td>
    <td><strong>${totals.cuts > 0 ? fmt(totals.cuts) : '—'}</strong></td>
    <td><strong>${totals.downPayment > 0 ? fmt(totals.downPayment) : '—'}</strong></td>
    <td><strong>${totals.net !== 0 ? fmt(totals.net) : '—'}</strong></td>
    <td>—</td>
  </tr>`;

  html += `</tbody></table></div>`;
  document.getElementById('reportArea').innerHTML = html;

  // ✅ ربط أزرار التفاصيل يدوياً
  setTimeout(function() {
    const detailsBtns = document.querySelectorAll('.btn-details');
    console.log('🔘 عدد أزرار التفاصيل:', detailsBtns.length);
    detailsBtns.forEach(function(btn) {
      function handler(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        const userId = btn.getAttribute('data-user-id');
        const userName = btn.getAttribute('data-user-name');
        console.log('👁️ ضغط على التفاصيل:', userId, userName);
        openCommissionDetails(userId, userName);
      }
      btn.onclick = handler;
      btn.addEventListener('touchend', handler, { passive: false });
    });
  }, 50);
}

// ═══════════════════════════════════════════════════════════════════
// openCommissionDetails — عرض تفاصيل الموظف (فواتير + دفعات + خصومات)
// ═══════════════════════════════════════════════════════════════════
async function openCommissionDetails(userId, employeeName) {
  console.log('🎯 openCommissionDetails:', userId, employeeName);

  const month = document.getElementById('selMonth').value;
  const year  = document.getElementById('selYear').value;

  if (!month || !year) {
    showToast('اختر الشهر والسنة أولاً', 'error');
    return;
  }

  if (window._commDetailsLoading) return;
  window._commDetailsLoading = true;

  // ─────────────────────────────────────────
  // Loader
  // ─────────────────────────────────────────
  const loadingModal = document.createElement('div');
  loadingModal.id = 'commDetailsLoading';
  loadingModal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;background:rgba(0,0,0,0.75);z-index:2147483647;display:flex;align-items:center;justify-content:center;';
  loadingModal.innerHTML = '<div style="background:white;border-radius:16px;padding:30px 40px;text-align:center;"><div style="border:4px solid #f3f3f3;border-top:4px solid #0d9488;border-radius:50%;width:40px;height:40px;animation:spin 0.9s linear infinite;margin:0 auto 15px;"></div><div style="font-weight:700;color:#1e2b4f;">جاري التحميل...</div></div>';
  document.body.appendChild(loadingModal);

  try {
    // ═══════════════════════════════════════════
    // 1. جلب تفاصيل العمولات
    // ═══════════════════════════════════════════
    const result = await jsonp('getCommissionDetails', {
      userId: Session.getUser()?.id || '',
      userType: Session.getUser()?.type || 'Accountant',
      centerName: Session.getUser()?.centerName || '',
      branchName: Session.getUser()?.branchName || '',
      targetSalesId: userId,
      fromDate: '01/' + month + '/' + year,
      toDate: '31/' + month + '/' + year
    });

    if (!result || !result.success) {
      const lm = document.getElementById('commDetailsLoading');
      if (lm) lm.remove();
      window._commDetailsLoading = false;
      showToast(result?.message || 'فشل تحميل التفاصيل', 'error');
      return;
    }

    const invoices = result.invoices || [];
    const totalComm = result.summary?.totalCommission || 0;

    window._currentInvoices = invoices;

    // ═══════════════════════════════════════════
    // 2. جلب الدفعات المقدمة من Expenses
    // ═══════════════════════════════════════════
    console.log('📡 جلب الدفعات المقدمة...');

    let advances = [];
    let advancesTotals = null;

    try {
      const advResult = await jsonp('getAdvancesForEmployee', {
        centerName: Session.getUser()?.centerName || '',
        employeeName: employeeName,
        month: month,
        year: year
      });

      console.log('📥 getAdvancesForEmployee result:', advResult);

      if (advResult && advResult.success) {
        advances = advResult.advances || [];
        advancesTotals = advResult.totals || null;
      }
    } catch(e) {
      console.warn('⚠️ فشل جلب الدفعات:', e);
    }

    window._currentAdvances = advances;
    window._advancesTotals = advancesTotals;

    // ═══════════════════════════════════════════
    // 3. جلب بيانات الموظف من tableData
    // ═══════════════════════════════════════════
    const empData = (window.tableData || tableData || []).find(e => 
      String(e.userId) === String(userId)
    );

    // ═══════════════════════════════════════════
    // 4. بناء جدول الفواتير
    // ═══════════════════════════════════════════
    let rowsHtml = '';
    if (invoices.length === 0) {
      rowsHtml = '<tr><td colspan="7" style="text-align:center;padding:20px;color:#999;">لا توجد فواتير مؤكدة بهذا الشهر</td></tr>';
    } else {
      invoices.forEach((inv, idx) => {
        rowsHtml += '<tr>' +
          '<td style="text-align:center;padding:6px 4px;">' + (idx + 1) + '</td>' +
          '<td style="text-align:center;padding:6px 4px;">' + escHtml(inv.voucherNo || '—') + '</td>' +
          '<td style="text-align:center;padding:6px 4px;">' + escHtml(inv.activeDate || '—') + '</td>' +
          '<td style="text-align:right;padding:6px 4px;">' + escHtml(inv.trip || '—') + '</td>' +
          '<td style="text-align:center;padding:6px 4px;">' + fmt(inv.paymentPrice || 0) + ' ' + escHtml(inv.invoiceCurrency || '') + '</td>' +
          '<td style="text-align:center;padding:6px 4px;">' + (inv.commissionRate || 0) + '%</td>' +
          '<td style="text-align:center;padding:6px 4px;color:#1e8449;font-weight:700;">' + fmt(inv.commission || 0) + ' LE</td>' +
        '</tr>';
      });
    }

    // ═══════════════════════════════════════════
    // 5. بناء جدول الدفعات المقدمة
    // ═══════════════════════════════════════════
    let advancesHtml = '';

    if (advances.length > 0) {
      let advRows = '';

      for (const adv of advances) {
        advRows += '<tr>' +
          '<td style="text-align:center;padding:6px 4px;border-bottom:1px solid #fed7aa;">' + escHtml(adv.date || '—') + '</td>' +
          '<td style="text-align:right;padding:6px 4px;border-bottom:1px solid #fed7aa;max-width:200px;word-wrap:break-word;">' + escHtml(adv.details || '—') + '</td>' +
          '<td style="text-align:center;padding:6px 4px;border-bottom:1px solid #fed7aa;">' + (adv.usd > 0 ? adv.usd : '—') + '</td>' +
          '<td style="text-align:center;padding:6px 4px;border-bottom:1px solid #fed7aa;">' + (adv.eur > 0 ? adv.eur : '—') + '</td>' +
          '<td style="text-align:center;padding:6px 4px;border-bottom:1px solid #fed7aa;">' + (adv.gbp > 0 ? adv.gbp : '—') + '</td>' +
          '<td style="text-align:center;padding:6px 4px;border-bottom:1px solid #fed7aa;">' + (adv.le > 0 ? adv.le : '—') + '</td>' +
          '<td style="text-align:center;padding:6px 4px;border-bottom:1px solid #fed7aa;">' + (adv.vUSD > 0 ? adv.vUSD : '—') + '</td>' +
          '<td style="text-align:center;padding:6px 4px;border-bottom:1px solid #fed7aa;">' + (adv.vEUR > 0 ? adv.vEUR : '—') + '</td>' +
          '<td style="text-align:center;padding:6px 4px;border-bottom:1px solid #fed7aa;">' + (adv.vGBP > 0 ? adv.vGBP : '—') + '</td>' +
          '<td style="text-align:center;padding:6px 4px;border-bottom:1px solid #fed7aa;">' + (adv.vLE > 0 ? adv.vLE : '—') + '</td>' +
        '</tr>';
      }

      // صف الإجماليات
      let totalRow = '';
      if (advancesTotals) {
        const t = advancesTotals;
        totalRow = '<tr style="background:#fed7aa;font-weight:800;">' +
          '<td colspan="2" style="text-align:center;padding:8px 6px;">الإجمالي</td>' +
          '<td style="text-align:center;padding:8px 6px;">' + (t.USD > 0 ? t.USD : '—') + '</td>' +
          '<td style="text-align:center;padding:8px 6px;">' + (t.EUR > 0 ? t.EUR : '—') + '</td>' +
          '<td style="text-align:center;padding:8px 6px;">' + (t.GBP > 0 ? t.GBP : '—') + '</td>' +
          '<td style="text-align:center;padding:8px 6px;">' + (t.LE > 0 ? t.LE : '—') + '</td>' +
          '<td style="text-align:center;padding:8px 6px;">' + (t.VUSD > 0 ? t.VUSD : '—') + '</td>' +
          '<td style="text-align:center;padding:8px 6px;">' + (t.VEUR > 0 ? t.VEUR : '—') + '</td>' +
          '<td style="text-align:center;padding:8px 6px;">' + (t.VGBP > 0 ? t.VGBP : '—') + '</td>' +
          '<td style="text-align:center;padding:8px 6px;">' + (t.VLE > 0 ? t.VLE : '—') + '</td>' +
        '</tr>';
      }

      advancesHtml = `
        <div style="margin-top:20px;">
          <div style="background:linear-gradient(135deg,#7c2d12,#ea580c);color:#fff;padding:10px 16px;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center;">
            <strong style="font-size:14px;">💵 الدفعات المقدمة (${advances.length})</strong>
            <span 
              style="background:rgba(255,255,255,0.2);padding:4px 12px;border-radius:20px;font-weight:700;font-size:13px;cursor:help;"
              title="${advancesTotals ? `$${advancesTotals.USD} + €${advancesTotals.EUR} + £${advancesTotals.GBP} + ${advancesTotals.LE}LE = ${fmt(empData?.downPaymentLE || 0)} LE` : ''}">
              ${empData && empData.downPaymentLE > 0 ? fmt(empData.downPaymentLE) + ' LE' : '—'}
            </span>
          </div>
          <div style="background:#fff7ed;border:1px solid #fed7aa;border-top:none;border-radius:0 0 10px 10px;padding:12px;">
            <div style="overflow-x:auto;border-radius:8px;">
              <table style="width:100%;border-collapse:collapse;font-size:11px;background:white;min-width:800px;">
                <thead>
                  <tr style="background:#fdba74;color:#7c2d12;">
                    <th style="padding:8px 6px;text-align:center;font-weight:800;">📅 التاريخ</th>
                    <th style="padding:8px 6px;text-align:right;font-weight:800;">التفاصيل</th>
                    <th style="padding:8px 6px;text-align:center;font-weight:800;">$</th>
                    <th style="padding:8px 6px;text-align:center;font-weight:800;">€</th>
                    <th style="padding:8px 6px;text-align:center;font-weight:800;">£</th>
                    <th style="padding:8px 6px;text-align:center;font-weight:800;">LE</th>
                    <th style="padding:8px 6px;text-align:center;font-weight:800;">Visa$</th>
                    <th style="padding:8px 6px;text-align:center;font-weight:800;">Visa€</th>
                    <th style="padding:8px 6px;text-align:center;font-weight:800;">Visa£</th>
                    <th style="padding:8px 6px;text-align:center;font-weight:800;">VisaLE</th>
                  </tr>
                </thead>
                <tbody>${advRows}${totalRow}</tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    } else {
      advancesHtml = `
        <div style="margin-top:20px;padding:12px;background:#f1f5f9;border-radius:10px;text-align:center;color:#64748b;font-size:12px;">
          ℹ️ لا توجد دفعات مقدمة لهذا الموظف في هذا الشهر
        </div>
      `;
    }

    // ═══════════════════════════════════════════
    // 6. بناء جدول الخصومات مع أزرار التعديل والحذف
    // ═══════════════════════════════════════════
    let deductionsHtml = '';
    let totalDeductionsLE = 0;

    if (empData && empData.deductionsDetails && empData.deductionsDetails.length > 0) {
      let dedRows = '';

      for (const ded of empData.deductionsDetails) {
        let amountText = '—';
        if (ded.computedType === 'cash') {
          amountText = `<span style="color:#dc2626;font-weight:700;">${fmt(ded.cashInLE)} LE</span>`;
          const parts = [];
          if (ded.cashUSD > 0) parts.push(`${ded.cashUSD}$`);
          if (ded.cashEUR > 0) parts.push(`${ded.cashEUR}€`);
          if (ded.cashGBP > 0) parts.push(`${ded.cashGBP}£`);
          if (ded.cashLE > 0)  parts.push(`${ded.cashLE}LE`);
          if (parts.length > 0) {
            amountText += `<div style="font-size:9px;color:#999;margin-top:2px;">${parts.join(' + ')}</div>`;
          }
          totalDeductionsLE += ded.cashInLE || 0;
        } else if (ded.computedType === 'days') {
          const dailyRate = (empData.monthlySalary || 0) / 30;
          const daysInLE = Math.round(dailyRate * (ded.daysCount || 0));
          amountText = `<span style="color:#b45309;font-weight:700;">${ded.daysCount} يوم</span>`;
          amountText += `<div style="font-size:9px;color:#999;margin-top:2px;">≈ ${fmt(daysInLE)} LE</div>`;
          totalDeductionsLE += daysInLE;
        }

        const actionsHtml = `
          <div style="display:flex;gap:4px;justify-content:center;">
            <button 
              onclick="openEditDeductionForm('${ded.deductionId}', '${empData.userId}', '${(empData.name || '').replace(/'/g, "\\'")}')"
              title="تعديل"
              style="background:#0d9488;color:#fff;border:none;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;">
              ✏️
            </button>
            <button 
              onclick="deleteDeduction('${ded.deductionId}', '${empData.userId}', '${(empData.name || '').replace(/'/g, "\\'")}')"
              title="حذف"
              style="background:#dc2626;color:#fff;border:none;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;">
              🗑️
            </button>
          </div>
        `;

        dedRows += `<tr>
          <td style="text-align:center;padding:8px 6px;border-bottom:1px solid #fecaca;">${escHtml(ded.date || '—')}</td>
          <td style="text-align:center;padding:8px 6px;border-bottom:1px solid #fecaca;">
            ${ded.computedType === 'cash' ? '💵 نقدي' : '📆 أيام'}
          </td>
          <td style="text-align:center;padding:8px 6px;border-bottom:1px solid #fecaca;">${amountText}</td>
          <td style="text-align:right;padding:8px 6px;border-bottom:1px solid #fecaca;max-width:200px;word-wrap:break-word;">${escHtml(ded.reason || '—')}</td>
          <td style="text-align:center;padding:8px 6px;border-bottom:1px solid #fecaca;">${escHtml(ded.deductedBy || '—')}</td>
          <td style="text-align:center;padding:8px 6px;border-bottom:1px solid #fecaca;">${actionsHtml}</td>
        </tr>`;
      }

      deductionsHtml = `
        <div style="margin-top:20px;">
          <div style="background:linear-gradient(135deg,#7f1d1d,#dc2626);color:#fff;padding:10px 16px;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center;">
            <strong style="font-size:14px;">⬇️ الخصومات المطبقة (${empData.deductionsDetails.length})</strong>
            <span style="background:rgba(255,255,255,0.2);padding:4px 12px;border-radius:20px;font-weight:700;font-size:13px;">
              ${fmt(Math.round(totalDeductionsLE))} LE
            </span>
          </div>
          <div style="background:#fef2f2;border:1px solid #fecaca;border-top:none;border-radius:0 0 10px 10px;padding:12px;">
            <div style="overflow-x:auto;border-radius:8px;">
              <table style="width:100%;border-collapse:collapse;font-size:11px;background:white;min-width:700px;">
                <thead>
                  <tr style="background:#fca5a5;color:#7f1d1d;">
                    <th style="padding:8px 6px;text-align:center;font-weight:800;">📅 التاريخ</th>
                    <th style="padding:8px 6px;text-align:center;font-weight:800;">النوع</th>
                    <th style="padding:8px 6px;text-align:center;font-weight:800;">القيمة</th>
                    <th style="padding:8px 6px;text-align:right;font-weight:800;">السبب</th>
                    <th style="padding:8px 6px;text-align:center;font-weight:800;">✍️ بواسطة</th>
                    <th style="padding:8px 6px;text-align:center;font-weight:800;">إجراءات</th>
                  </tr>
                </thead>
                <tbody>${dedRows}</tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    } else {
      deductionsHtml = `
        <div style="margin-top:20px;padding:12px;background:#f1f5f9;border-radius:10px;text-align:center;color:#64748b;font-size:12px;">
          ℹ️ لا توجد خصومات مطبقة على هذا الموظف لهذا الشهر
        </div>
      `;
    }

      // ═══════════════════════════════════════════

function exportToExcel() {

  html += '.commission-cell{background:#e8f5e9;color:#1b5e20;font-weight:bold;}';
  html += '.net-cell{background:#fff3e0;color:#e65100;font-weight:900;}';
  html += '.deduction-cell{color:#dc2626;font-weight:bold;}';
  html += '</style></head><body>';

    html += '</tr>';
  });
  
  // ═══════════════════════════════════════════════
  // 6. صف الإجماليات (متوافق مع 16 عموداً)
  // ═══════════════════════════════════════════════
  html += '<tr class="totals">';
  html += `<td colspan="4" style="text-align:center;padding:8px;">📊 TOTAL (${tableData.length} Employees)</td>`;
  html += `<td>${totals.workingDays > 0 ? totals.workingDays.toFixed(1) : '—'}</td>`;

  html += `<td>${totals.dailyRate > 0 ? Math.round(totals.dailyRate).toLocaleString() : '—'}</td>`;
  html += `<td>${totals.execComm > 0 ? Math.round(totals.execComm).toLocaleString() : '—'}</td>`;
  html += `<td>${totals.upSellComm > 0 ? Math.round(totals.upSellComm).toLocaleString() : '—'}</td>`;
  html += `<td>${totals.salesComm > 0 ? Math.round(totals.salesComm).toLocaleString() : '—'}</td>`;
  html += `<td>${totals.total > 0 ? Math.round(totals.total).toLocaleString() : '—'}</td>`;
  html += `<td>${totals.cuts > 0 ? Math.round(totals.cuts).toLocaleString() : '—'}</td>`;

// ✅ Toast
// ──────────────────────────────────────────────
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type==='error'?'t-err':type==='info'?'t-info':'t-ok') + ' show';
  setTimeout(() => { t.className = 'toast'; }, 3500);
}

// escHtml — تهريب HTML
// ═══════════════════════════════════════════════════════════════════
function escHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[m]));
}

    showToast('⚠️ يجب تسجيل الدخول', 'error');
    return;
  }
  
  // ─────────────────────────────────────────
  // 1. جلب قائمة الموظفين (مع cache)
  // ─────────────────────────────────────────
  if (!cachedEmployeesForDeduction) {
    showToast('⏳ جاري تحميل الموظفين...', 'info');
    try {
      const result = await jsonp('getEmployeesForDeduction', {
        centerName: currentUser.centerName
      });
      
      if (result && result.success) {
        cachedEmployeesForDeduction = result.employees || [];
        console.log('✅ Employees loaded:', cachedEmployeesForDeduction.length);
      } else {
        cachedEmployeesForDeduction = [];
        showToast('⚠️ لا يوجد موظفون', 'error');

    showToast('⚠️ لا يوجد موظفون متاحون', 'error');

  // ─────────────────────────────────────────
  // 2. تجهيز القيم الافتراضية

            </div>
            <div>
              <label style="display:block;font-size:12px;font-weight:700;color:#64748b;margin-bottom:5px;">📆 الشهر</label>
              <select id="ded_month" style="width:100%;padding:9px;border:2px solid #d0ddeb;border-radius:10px;font-size:13px;background:white;">
                ${monthsOptions}
              </select>
            </div>
            <div>
              <label style="display:block;font-size:12px;font-weight:700;color:#64748b;margin-bottom:5px;">📆 السنة</label>
              <select id="ded_year" style="width:100%;padding:9px;border:2px solid #d0ddeb;border-radius:10px;font-size:13px;background:white;">
                ${yearsOptions}
              </select>
            </div>
          </div>
          
          <!-- Row 2: الموظف -->
          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:12px;font-weight:700;color:#64748b;margin-bottom:5px;">👤 الموظف</label>
            <input list="ded_employees_list" id="ded_employee_search" placeholder="اكتب اسم الموظف..." autocomplete="off" 
                   style="width:100%;padding:9px;border:2px solid #d0ddeb;border-radius:10px;font-size:13px;">
            <datalist id="ded_employees_list">

          <!-- Row 3: نوع الخصم -->
          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:12px;font-weight:700;color:#64748b;margin-bottom:8px;">نوع الخصم</label>
            <div style="display:flex;gap:20px;">

                <input type="checkbox" id="ded_type_cash" onchange="onDeductionTypeChange('cash')" style="width:18px;height:18px;cursor:pointer;">

          </div>
          
          <!-- Row 4: حقول الخصم النقدي -->
          <div id="ded_cash_section" style="display:none;margin-bottom:14px;padding:12px;background:#fef2f2;border-radius:10px;border:1px solid #fecaca;">

              </div>
            </div>
          </div>
          
          <!-- Row 6: السبب -->
          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:12px;font-weight:700;color:#64748b;margin-bottom:5px;">📝 سبب الخصم</label>
            <textarea id="ded_reason" rows="2" placeholder="مثال: تأخير متكرر، غياب بدون إذن..." 
                      style="width:100%;padding:9px;border:2px solid #d0ddeb;border-radius:10px;font-size:13px;font-family:inherit;resize:vertical;"></textarea>
          </div>
          
          <!-- Row 7: خصم بواسطة -->
          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:12px;font-weight:700;color:#64748b;margin-bottom:5px;">✍️ خصم بواسطة</label>
            <input type="text" id="ded_deductedBy" value="${escHtml(currentUser?.name || '')}"

          </div>
          
        </div>
        
        <!-- Footer -->
        <div style="padding:14px 20px;background:#f8fafc;border-radius:0 0 16px 16px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid #e0e0e0;">
          <button onclick="closeDeductionForm()" style="background:#6c757d;color:#fff;border:none;padding:10px 24px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;">إلغاء</button>
          <button id="ded_saveBtn" onclick="submitDeduction()" style="background:#dc2626;color:#fff;border:none;padding:10px 28px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;">💾 حفظ الخصم</button>

      </div>
    </div>

  // إزالة أي مودال قديم
  const existing = document.getElementById('deductionFormModal');
  if (existing) existing.remove();
  
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  document.body.style.overflow = 'hidden';
  
  // ربط حدث التنبؤ بالموظف
  attachEmployeeSearchEvents();
}


// ─────────────────────────────────────────
// إغلاق فورم الخصم
// ─────────────────────────────────────────
function closeDeductionForm() {
  const modal = document.getElementById('deductionFormModal');
  if (modal) modal.remove();
  document.body.style.overflow = '';
}


// ─────────────────────────────────────────
// تغيير نوع الخصم
// ─────────────────────────────────────────
function onDeductionTypeChange(type) {
  const cashCb = document.getElementById('ded_type_cash');
  const daysCb = document.getElementById('ded_type_days');
  const cashSection = document.getElementById('ded_cash_section');
  const daysSection = document.getElementById('ded_days_section');
  
  // ✅ إذا اختار cash → ألغِ days
  if (type === 'cash' && cashCb.checked) {
    daysCb.checked = false;
    cashSection.style.display = 'block';
    daysSection.style.display = 'none';
  }
  // ✅ إذا اختار days → ألغِ cash
  else if (type === 'days' && daysCb.checked) {
    cashCb.checked = false;
    daysSection.style.display = 'block';
    cashSection.style.display = 'none';
  }
  // ✅ إذا ألغى الاختيار
  else {
    cashSection.style.display = 'none';
    daysSection.style.display = 'none';
  }
}


// ─────────────────────────────────────────
// تغيير preset الأيام
// ─────────────────────────────────────────
function onDaysPresetChange() {
  const preset = document.getElementById('ded_days_preset').value;
  const daysInput = document.getElementById('ded_daysCount');
  
  if (preset && preset !== 'custom') {
    daysInput.value = preset;
  } else if (preset === 'custom') {
    daysInput.value = '';
    daysInput.focus();
  }
}


// ─────────────────────────────────────────
// التنبؤ بالموظف (auto-complete)
// ─────────────────────────────────────────
function attachEmployeeSearchEvents() {
  const searchInput = document.getElementById('ded_employee_search');
  const employeeIdInput = document.getElementById('ded_employee_id');
  const employeeNameInput = document.getElementById('ded_employee_name');
  const display = document.getElementById('ded_employee_display');
  
  if (!searchInput) return;
  
  searchInput.addEventListener('input', function() {
    const val = this.value.trim();
    if (!val) {
      employeeIdInput.value = '';
      employeeNameInput.value = '';
      display.style.display = 'none';
      return;
    }
    
    // ✅ البحث عن الموظف
    const emp = cachedEmployeesForDeduction.find(e => 
      e.name === val || 
      `${e.name} (${e.id})` === val ||
      e.id === val
    );
    
    if (emp) {
      employeeIdInput.value = emp.id;
      employeeNameInput.value = emp.name;
      display.textContent = `✅ تم اختيار: ${emp.name} (${emp.id})`;
      display.style.display = 'block';
    } else {
      employeeIdInput.value = '';
      employeeNameInput.value = '';
      display.style.display = 'none';
    }
  });
}


// ─────────────────────────────────────────
// إرسال الفورم
// ─────────────────────────────────────────
async function submitDeduction() {
  const saveBtn = document.getElementById('ded_saveBtn');
  if (saveBtn.disabled) return;
  
  // ─────────────────────────────────────────
  // جمع البيانات
  // ─────────────────────────────────────────
  const dateInput = document.getElementById('ded_date').value;
  const month = document.getElementById('ded_month').value;
  const year = document.getElementById('ded_year').value;
  const employeeId = document.getElementById('ded_employee_id').value;
  const employeeName = document.getElementById('ded_employee_name').value;
  const reason = document.getElementById('ded_reason').value.trim();
  const deductedBy = document.getElementById('ded_deductedBy').value.trim();
  
  const isCash = document.getElementById('ded_type_cash').checked;
  const isDays = document.getElementById('ded_type_days').checked;
  
  // ─────────────────────────────────────────
  // التحقق
  // ─────────────────────────────────────────
  if (!dateInput) {
    showToast('⚠️ التاريخ مطلوب', 'error');
    return;
  }
  
  if (!employeeId) {
    showToast('⚠️ يجب اختيار الموظف من القائمة', 'error');
    document.getElementById('ded_employee_search').focus();
    return;
  }
  
  if (!isCash && !isDays) {
    showToast('⚠️ يجب اختيار نوع الخصم', 'error');
    return;
  }
  
  if (!deductedBy) {
    showToast('⚠️ حقل "خصم بواسطة" مطلوب', 'error');
    return;
  }
  
  // ─────────────────────────────────────────
  // تجهيز payload
  // ─────────────────────────────────────────
  const payload = {
    centerName: currentUser.centerName,
    date: dateInput,
    employeeId: employeeId,
    employeeName: employeeName,
    month: month,
    year: year,
    reason: reason,
    deductedBy: deductedBy
  };
  
  if (isCash) {
    payload.deductionType = 'cash';
    payload.cashUSD = parseFloat(document.getElementById('ded_cashUSD').value) || 0;
    payload.cashEUR = parseFloat(document.getElementById('ded_cashEUR').value) || 0;
    payload.cashGBP = parseFloat(document.getElementById('ded_cashGBP').value) || 0;
    payload.cashLE = parseFloat(document.getElementById('ded_cashLE').value) || 0;
    
    if (payload.cashUSD === 0 && payload.cashEUR === 0 && 
        payload.cashGBP === 0 && payload.cashLE === 0) {
      showToast('⚠️ أدخل مبلغاً واحداً على الأقل', 'error');
      return;
    }
  } else {
    payload.deductionType = 'days';
    payload.daysCount = parseFloat(document.getElementById('ded_daysCount').value) || 0;
    
    if (payload.daysCount <= 0) {
      showToast('⚠️ عدد الأيام مطلوب', 'error');
      return;
    }
  }
  
  // ─────────────────────────────────────────
  // الإرسال
  // ─────────────────────────────────────────
  saveBtn.disabled = true;
  saveBtn.textContent = '⏳ جاري الحفظ...';
  saveBtn.style.opacity = '0.7';
  
  try {
    const result = await jsonp('saveDeduction', payload);
    
    if (result && result.success) {
      showToast(`✅ ${result.message}`, 'success');
      closeDeductionForm();
      
      // ✅ إعادة تعيين الـ cache (لتحديث البيانات)
      // لا نحتاج إعادة تحميل الفواتير — فقط عند فتح التقرير مرة أخرى
    } else {
      showToast('❌ ' + (result?.message || 'فشل الحفظ'), 'error');
    }
  } catch(e) {
    console.error('❌ submitDeduction error:', e);
    showToast('❌ خطأ: ' + e.message, 'error');
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = '💾 حفظ الخصم';
    saveBtn.style.opacity = '1';
  }
}

// ✏️ updateDeductionSubmit — إرسال طلب تعديل خصم
// ═══════════════════════════════════════════════════════════════════
async function updateDeductionSubmit() {
  const saveBtn = document.getElementById('ded_saveBtn');
  if (saveBtn.disabled) return;
  
  const deductionId = document.getElementById('ded_deductionId').value;
  const dateInput   = document.getElementById('ded_date').value;
  const month       = document.getElementById('ded_month').value;
  const year        = document.getElementById('ded_year').value;
  const employeeId  = document.getElementById('ded_employee_id').value;
  const employeeName= document.getElementById('ded_employee_name').value;
  const reason      = document.getElementById('ded_reason').value.trim();
  const deductedBy  = document.getElementById('ded_deductedBy').value.trim();
  
  const isCash = document.getElementById('ded_type_cash').checked;
  const isDays = document.getElementById('ded_type_days').checked;
  
  if (!dateInput || !employeeId) {
    showToast('⚠️ التاريخ والموظف مطلوبان', 'error');
    return;
  }
  if (!isCash && !isDays) {
    showToast('⚠️ يجب اختيار نوع الخصم', 'error');
    return;
  }
  if (!deductedBy) {
    showToast('⚠️ حقل "خصم بواسطة" مطلوب', 'error');
    return;
  }
  
  const payload = {
    centerName: currentUser.centerName,
    deductionId: deductionId,
    date: dateInput,
    employeeId: employeeId,
    employeeName: employeeName,
    month: month,
    year: year,
    reason: reason,
    deductedBy: deductedBy
  };
  
  if (isCash) {
    payload.deductionType = 'cash';
    payload.cashUSD = parseFloat(document.getElementById('ded_cashUSD').value) || 0;
    payload.cashEUR = parseFloat(document.getElementById('ded_cashEUR').value) || 0;
    payload.cashGBP = parseFloat(document.getElementById('ded_cashGBP').value) || 0;
    payload.cashLE  = parseFloat(document.getElementById('ded_cashLE').value)  || 0;
    if (!payload.cashUSD && !payload.cashEUR && !payload.cashGBP && !payload.cashLE) {
      showToast('⚠️ أدخل مبلغاً واحداً على الأقل', 'error');
      return;
    }
  } else {
    payload.deductionType = 'days';
    payload.daysCount = parseFloat(document.getElementById('ded_daysCount').value) || 0;
    if (payload.daysCount <= 0) {
      showToast('⚠️ عدد الأيام مطلوب', 'error');
      return;
    }
  }
  
  saveBtn.disabled = true;
  saveBtn.textContent = '⏳ جاري التحديث...';
  saveBtn.style.opacity = '0.7';
  
  try {
    const result = await jsonp('updateDeduction', payload);
    
    if (result && result.success) {
      showToast('✅ ' + (result.message || 'تم التحديث'), 'success');
      closeDeductionForm();
      
      // ✅ إعادة تحميل التقرير لتحديث البيانات
      sessionStorage.removeItem(`salary_${month}_${year}_${currentUser.centerId}`);
      sessionStorage.removeItem(`salary_${month}_${year}_${currentUser.centerId}_time`);
      await loadReport();
      
      // ✅ إعادة فتح المودال إذا كانت الصفحة الحالية هي التقرير
      setTimeout(() => {
        if (typeof openCommissionDetails === 'function') {
          openCommissionDetails(employeeId, employeeName);
        }
      }, 1500);
    } else {
      showToast('❌ ' + (result?.message || 'فشل التحديث'), 'error');
    }
  } catch(e) {
    console.error('❌ updateDeductionSubmit error:', e);
    showToast('❌ خطأ: ' + e.message, 'error');
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = '💾 حفظ التعديل';
    saveBtn.style.opacity = '1';
  }
}


// ═══════════════════════════════════════════════════════════════════
// 🗑️ deleteDeduction — حذف خصم (Soft Delete) مع تأكيد
// ═══════════════════════════════════════════════════════════════════
async function deleteDeduction(deductionId, employeeId, employeeName) {
  if (!deductionId) return;
  
  // ✅ نافذة تأكيد مخصصة
  const confirmed = await showConfirmDialog(
    '🗑️ تأكيد الحذف',
    `هل أنت متأكد من حذف الخصم "${deductionId}"؟\n\nيمكن استرجاعه لاحقاً من الشيت (Soft Delete).`
  );
  
  if (!confirmed) return;
  
  showToast('⏳ جاري الحذف...', 'info');
  
  try {
    const result = await jsonp('cancelDeduction', {
      centerName: currentUser.centerName,
      deductionId: deductionId
    });
    
    if (result && result.success) {
      showToast('✅ تم حذف الخصم بنجاح', 'success');
      
      const month = document.getElementById('selMonth').value;
      const year  = document.getElementById('selYear').value;
      
      // ✅ إعادة تحميل التقرير
      sessionStorage.removeItem(`salary_${month}_${year}_${currentUser.centerId}`);
      sessionStorage.removeItem(`salary_${month}_${year}_${currentUser.centerId}_time`);
      await loadReport();
      
      // ✅ إعادة فتح المودال
      setTimeout(() => {
        if (typeof openCommissionDetails === 'function') {
          openCommissionDetails(employeeId, employeeName);
        }
      }, 1500);
    } else {
      showToast('❌ ' + (result?.message || 'فشل الحذف'), 'error');
    }
  } catch(e) {
    console.error('❌ deleteDeduction error:', e);
    showToast('❌ خطأ: ' + e.message, 'error');
  }
}


// ═══════════════════════════════════════════════════════════════════
// ✏️ openEditDeductionForm — فتح فورم الخصم في وضع التعديل
// ═══════════════════════════════════════════════════════════════════
async function openEditDeductionForm(deductionId, employeeId, employeeName) {
  // ✅ جلب بيانات الخصم من tableData
  const empData = (window.tableData || tableData || []).find(e => 
    String(e.userId) === String(employeeId)
  );
  
  let deduction = null;
  if (empData && empData.deductionsDetails) {
    deduction = empData.deductionsDetails.find(d => d.deductionId === deductionId);
  }
  
  if (!deduction) {
    showToast('⚠️ لم يتم العثور على بيانات الخصم', 'error');
    return;
  }
  
  // ✅ فتح فورم الخصم العادي
  await openDeductionForm();
  
  // ✅ تعبئة الفورم ببيانات الخصم
  setTimeout(() => {
    // ID الفورم للتعديل
    let hiddenId = document.getElementById('ded_deductionId');
    if (!hiddenId) {
      hiddenId = document.createElement('input');
      hiddenId.type = 'hidden';
      hiddenId.id = 'ded_deductionId';
      document.getElementById('ded_saveBtn').parentElement.parentElement.appendChild(hiddenId);
    }
    hiddenId.value = deductionId;
    
    // تغيير عنوان الفورم
    const title = document.querySelector('#deductionFormModal h3');
    if (title) title.textContent = '✏️ تعديل خصم - ' + deductionId;
    
    // تغيير زر الحفظ
    const saveBtn = document.getElementById('ded_saveBtn');
    if (saveBtn) {
      saveBtn.textContent = '💾 حفظ التعديل';
      saveBtn.onclick = updateDeductionSubmit;
    }
    
    // تعبئة التاريخ
    const dateInput = document.getElementById('ded_date');
    if (dateInput && deduction.date) {
      // تحويل dd/MMM/yyyy إلى YYYY-MM-DD
      const d = parseDateFromString(deduction.date);
      if (d) {
        const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        dateInput.value = iso;
      }
    }
    
    // تعبئة الشهر والسنة
    if (document.getElementById('ded_month')) document.getElementById('ded_month').value = deduction.month || '';
    if (document.getElementById('ded_year'))  document.getElementById('ded_year').value  = deduction.year  || '';
    
    // تعبئة الموظف
    const searchInput = document.getElementById('ded_employee_search');
    const idInput = document.getElementById('ded_employee_id');
    const nameInput = document.getElementById('ded_employee_name');
    const display = document.getElementById('ded_employee_display');
    
    if (searchInput) {
      searchInput.value = employeeName + ' (' + employeeId + ')';
      searchInput.disabled = true;  // لا يمكن تغيير الموظف في التعديل
    }
    if (idInput) idInput.value = employeeId;
    if (nameInput) nameInput.value = employeeName;
    if (display) {
      display.textContent = '✅ الموظف: ' + employeeName + ' (' + employeeId + ')';
      display.style.display = 'block';
    }
    
    // تعبئة نوع الخصم
    const cashCb = document.getElementById('ded_type_cash');
    const daysCb = document.getElementById('ded_type_days');
    
    if (deduction.deductionType === 'cash') {
      if (cashCb) {
        cashCb.checked = true;
        onDeductionTypeChange('cash');
      }
      if (document.getElementById('ded_cashUSD')) document.getElementById('ded_cashUSD').value = deduction.cashUSD || '';
      if (document.getElementById('ded_cashEUR')) document.getElementById('ded_cashEUR').value = deduction.cashEUR || '';
      if (document.getElementById('ded_cashGBP')) document.getElementById('ded_cashGBP').value = deduction.cashGBP || '';
      if (document.getElementById('ded_cashLE'))  document.getElementById('ded_cashLE').value  = deduction.cashLE  || '';
    } else if (deduction.deductionType === 'days') {
      if (daysCb) {
        daysCb.checked = true;
        onDeductionTypeChange('days');
      }
      if (document.getElementById('ded_daysCount')) document.getElementById('ded_daysCount').value = deduction.daysCount || '';
    }
    
    // تعبئة السبب
    if (document.getElementById('ded_reason')) document.getElementById('ded_reason').value = deduction.reason || '';
    
    // تعبئة خصم بواسطة
    if (document.getElementById('ded_deductedBy')) document.getElementById('ded_deductedBy').value = deduction.deductedBy || '';
    
  }, 100);
}

    html += '.info-summary{background:#dbeafe;padding:10px;text-align:center;font-weight:bold;font-size:12px;color:#1e40af;}';
    html += '.section-title{background:#1a3260;color:#f5c842;padding:10px;text-align:center;font-weight:bold;font-size:13px;}';
    html += '.ded-title{background:#7f1d1d;color:#fff;padding:10px;text-align:center;font-weight:bold;font-size:13px;}';
    html += '.adv-title{background:#7c2d12;color:#fff;padding:10px;text-align:center;font-weight:bold;font-size:13px;}';
    html += '.deduction-cell{color:#dc2626;font-weight:bold;}';
    html += '.commission-cell{color:#1b5e20;font-weight:bold;}';
    html += '.totals-row{background:#dbeafe;font-weight:bold;color:#000;}';
    html += '</style></head><body>';
    
    // ═══════════════════════════════════════════
    // 2. رأس التقرير
    // ═══════════════════════════════════════════
    const TOTAL_COLS = 8;
    
    html += '<table border="1">';
    html += `<tr><td colspan="${TOTAL_COLS}" class="title">👁️ تفاصيل الموظف — ${escHtml(employeeName)}</td></tr>`;
    html += `<tr><td colspan="${TOTAL_COLS}" class="subtitle">🏢 ${escHtml(currentUser.centerName || '')} &nbsp;|&nbsp; 📅 ${monthAr} / ${year} &nbsp;|&nbsp; 🆔 ${escHtml(userId)}</td></tr>`;
    html += `<tr><td colspan="${TOTAL_COLS}" class="info-summary">💰 إجمالي العمولات: ${fmt((empData.execComm||0) + (empData.upSellComm||0) + (empData.salesComm||0))} LE &nbsp;|&nbsp; ⬇️ إجمالي الخصومات: ${fmt(empData.cuts)} LE &nbsp;|&nbsp; 💵 الصافي المستحق: ${fmt(empData.net)} LE</td></tr>`;
    html += '</table>';
    html += '<br>';
    
        // ═══════════════════════════════════════════
    // 3. ملخص الموظف (بالأعمدة الجديدة)
    // ═══════════════════════════════════════════
    html += '<table border="1">';
    html += `<tr><td colspan="15" class="section-title">📋 ملخص الموظف</td></tr>`;
    html += '<tr>';
    ['#','الرقم','الاسم','الدور','أيام العمل','الراتب/اليومية','راتب الإدارة','إجمالي اليوميات','عمولة تنفيذ','عمولة UpSell','عمولة سيلز','الإجمالي','الخصم','السلف','الصافي'].forEach(h => {
      html += `<th>${h}</th>`;
    });
    html += '</tr>';
    html += '<tr>';
    html += `<td>1</td>`;
    html += `<td>${escHtml(empData.userId)}</td>`;
    html += `<td>${escHtml(empData.name)}</td>`;
    html += `<td>${escHtml(empData.role || '—')}</td>`;
    html += `<td>${empData.workingDays > 0 ? empData.workingDays.toFixed(1) : '—'}</td>`;
    html += `<td>${empData.baseSalary > 0 ? fmt(empData.baseSalary) : '—'}</td>`;
    html += `<td>${empData.managementSalary > 0 ? fmt(empData.managementSalary) : '—'}</td>`;
    html += `<td>${empData.dailyRate > 0 ? fmt(empData.dailyRate) : '—'}</td>`;
    html += `<td class="commission-cell">${empData.execComm > 0 ? fmt(empData.execComm) : '—'}</td>`;
    html += `<td class="commission-cell">${empData.upSellComm > 0 ? fmt(empData.upSellComm) : '—'}</td>`;
    html += `<td class="commission-cell">${empData.salesComm > 0 ? fmt(empData.salesComm) : '—'}</td>`;
    html += `<td><strong>${empData.total > 0 ? fmt(empData.total) : '—'}</strong></td>`;
    html += `<td class="deduction-cell">${empData.cuts > 0 ? fmt(empData.cuts) : '—'}</td>`;
    html += `<td>${empData.downPaymentLE > 0 ? fmt(empData.downPaymentLE) : '—'}</td>`;
    html += `<td><strong>${empData.net !== 0 ? fmt(empData.net) : '—'}</strong></td>`;
    html += '</tr>';
    html += '</table>';
    html += '<br>';
    
    // ═══════════════════════════════════════════
    // 4. الفواتير
    // ═══════════════════════════════════════════
    if (window._currentInvoices && window._currentInvoices.length > 0) {
      html += '<table border="1">';
      html += `<tr><td colspan="7" class="section-title">🧾 الفواتير المؤكدة (${window._currentInvoices.length})</td></tr>`;

        html += '</tr>';
      });
      html += '</table>';
      html += '<br>';
    }
    
    // ═══════════════════════════════════════════
    // 5. الدفعات المقدمة
    // ═══════════════════════════════════════════
    if (window._currentAdvances && window._currentAdvances.length > 0) {
      html += '<table border="1">';
      html += `<tr><td colspan="10" class="adv-title">💵 الدفعات المقدمة (${window._currentAdvances.length})</td></tr>`;
      html += '<tr><th>#</th><th>التاريخ</th><th>التفاصيل</th><th>$</th><th>€</th><th>£</th><th>LE</th><th>Visa$</th><th>Visa€</th><th>Visa£</th></tr>';
      
      window._currentAdvances.forEach((adv, idx) => {
        html += '<tr>';
        html += `<td>${idx + 1}</td>`;
        html += `<td>${escHtml(adv.date || '—')}</td>`;
        html += `<td>${escHtml(adv.details || '—')}</td>`;
        html += `<td>${adv.usd > 0 ? adv.usd : '—'}</td>`;
        html += `<td>${adv.eur > 0 ? adv.eur : '—'}</td>`;
        html += `<td>${adv.gbp > 0 ? adv.gbp : '—'}</td>`;
        html += `<td>${adv.le > 0 ? adv.le : '—'}</td>`;
        html += `<td>${adv.vUSD > 0 ? adv.vUSD : '—'}</td>`;
        html += `<td>${adv.vEUR > 0 ? adv.vEUR : '—'}</td>`;
        html += `<td>${adv.vGBP > 0 ? adv.vGBP : '—'}</td>`;
        html += '</tr>';
      });
      
      // صف الإجماليات
      if (window._advancesTotals) {
        const t = window._advancesTotals;
        html += '<tr class="totals-row">';
        html += `<td colspan="3">الإجمالي</td>`;
        html += `<td>${t.USD > 0 ? t.USD : '—'}</td>`;
        html += `<td>${t.EUR > 0 ? t.EUR : '—'}</td>`;
        html += `<td>${t.GBP > 0 ? t.GBP : '—'}</td>`;
        html += `<td>${t.LE > 0 ? t.LE : '—'}</td>`;
        html += `<td>${t.VUSD > 0 ? t.VUSD : '—'}</td>`;
        html += `<td>${t.VEUR > 0 ? t.VEUR : '—'}</td>`;
        html += `<td>${t.VGBP > 0 ? t.VGBP : '—'}</td>`;
        html += '</tr>';
      }
      html += '</table>';
      html += '<br>';
    }
    
    // ═══════════════════════════════════════════
    // 6. الخصومات
    // ═══════════════════════════════════════════
    if (empData.deductionsDetails && empData.deductionsDetails.length > 0) {
      html += '<table border="1">';
      html += `<tr><td colspan="6" class="ded-title">⬇️ الخصومات المطبقة (${empData.deductionsDetails.length})</td></tr>`;
      html += '<tr><th>#</th><th>التاريخ</th><th>النوع</th><th>القيمة</th><th>السبب</th><th>بواسطة</th></tr>';
      
      empData.deductionsDetails.forEach((ded, idx) => {
        let amountText = '';
        if (ded.computedType === 'cash') {
          amountText = `${fmt(ded.cashInLE)} LE`;
          const parts = [];
          if (ded.cashUSD > 0) parts.push(`${ded.cashUSD}$`);
          if (ded.cashEUR > 0) parts.push(`${ded.cashEUR}€`);
          if (ded.cashGBP > 0) parts.push(`${ded.cashGBP}£`);
          if (ded.cashLE > 0)  parts.push(`${ded.cashLE}LE`);
          if (parts.length > 0) amountText += ` (${parts.join(' + ')})`;
        } else {
          amountText = `${ded.daysCount} يوم`;
        }
        
        html += '<tr>';
        html += `<td>${idx + 1}</td>`;
        html += `<td>${escHtml(ded.date || '—')}</td>`;
        html += `<td>${ded.computedType === 'cash' ? '💵 نقدي' : '📆 أيام'}</td>`;
        html += `<td class="deduction-cell">${amountText}</td>`;
        html += `<td>${escHtml(ded.reason || '—')}</td>`;
        html += `<td>${escHtml(ded.deductedBy || '—')}</td>`;
        html += '</tr>';
      });
      html += '</table>';
    }
    
    html += '</body></html>';
    
    // ═══════════════════════════════════════════
    // 7. التنزيل
    // ═══════════════════════════════════════════
    const fileName = `Employee_${userId}_${month}_${year}.xls`;
    const blob = new Blob([html], { type: 'application/vnd.ms-excel;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    showToast('✅ تم تصدير التقرير بنجاح', 'success');
    
  } catch(e) {
    console.error('❌ exportModalToExcel error:', e);
    showToast('❌ فشل التصدير: ' + e.message, 'error');
  }
}

    html += '<td>' + escHtml(empData.name) + '</td>';
    html += '<td>' + escHtml(empData.role || '—') + '</td>';
    html += '<td>' + (empData.workingDays > 0 ? empData.workingDays.toFixed(1) : '—') + '</td>';
    html += '<td>' + (empData.baseSalary > 0 ? fmt(empData.baseSalary) : '—') + '</td>';
    html += '<td>' + (empData.managementSalary > 0 ? fmt(empData.managementSalary) : '—') + '</td>';
    html += '<td>' + (empData.dailyRate > 0 ? fmt(empData.dailyRate) : '—') + '</td>';
    html += '<td class="comm-cell">' + (empData.execComm > 0 ? fmt(empData.execComm) : '—') + '</td>';
    html += '<td class="comm-cell">' + (empData.upSellComm > 0 ? fmt(empData.upSellComm) : '—') + '</td>';
    html += '<td class="comm-cell">' + (empData.salesComm > 0 ? fmt(empData.salesComm) : '—') + '</td>';
    html += '<td><strong>' + (empData.total > 0 ? fmt(empData.total) : '—') + '</strong></td>';
    html += '<td class="ded-cell">' + (empData.cuts > 0 ? fmt(empData.cuts) : '—') + '</td>';
    html += '<td>' + (empData.downPaymentLE > 0 ? fmt(empData.downPaymentLE) : '—') + '</td>';
    html += '<td><strong>' + (empData.net !== 0 ? fmt(empData.net) : '—') + '</strong></td>';
    html += '</tr></table>';
    
    // ═══════════════════════════════════════════
    // 3. الفواتير
    // ═══════════════════════════════════════════
    if (window._currentInvoices && window._currentInvoices.length > 0) {
      html += '<h3>🧾 الفواتير المؤكدة (' + window._currentInvoices.length + ')</h3>';
      html += '<table><tr><th>#</th><th>الإيصال</th><th>التاريخ</th><th>الرحلة</th><th>المدفوع</th><th>%</th><th>العمولة</th></tr>';
      window._currentInvoices.forEach((inv, idx) => {
        html += '<tr>';
        html += '<td>' + (idx + 1) + '</td>';
        html += '<td>' + escHtml(inv.voucherNo || '—') + '</td>';
        html += '<td>' + escHtml(inv.activeDate || '—') + '</td>';
        html += '<td>' + escHtml(inv.trip || '—') + '</td>';
        html += '<td>' + fmt(inv.paymentPrice || 0) + ' ' + escHtml(inv.invoiceCurrency || '') + '</td>';
        html += '<td>' + (inv.commissionRate || 0) + '%</td>';
        html += '<td class="comm-cell">' + fmt(inv.commission || 0) + ' LE</td>';
        html += '</tr>';
      });
      html += '</table>';
    }
    
    // ═══════════════════════════════════════════
    // 4. الدفعات المقدمة
    // ═══════════════════════════════════════════
    if (window._currentAdvances && window._currentAdvances.length > 0) {
      html += '<h3 class="adv">💵 الدفعات المقدمة (' + window._currentAdvances.length + ')</h3>';
      html += '<table><tr><th>#</th><th>التاريخ</th><th>التفاصيل</th><th>$</th><th>€</th><th>£</th><th>LE</th><th>Visa$</th><th>Visa€</th><th>Visa£</th></tr>';
      window._currentAdvances.forEach((adv, idx) => {
        html += '<tr>';
        html += '<td>' + (idx + 1) + '</td>';
        html += '<td>' + escHtml(adv.date || '—') + '</td>';
        html += '<td>' + escHtml(adv.details || '—') + '</td>';
        html += '<td>' + (adv.usd > 0 ? adv.usd : '—') + '</td>';
        html += '<td>' + (adv.eur > 0 ? adv.eur : '—') + '</td>';
        html += '<td>' + (adv.gbp > 0 ? adv.gbp : '—') + '</td>';
        html += '<td>' + (adv.le > 0 ? adv.le : '—') + '</td>';
        html += '<td>' + (adv.vUSD > 0 ? adv.vUSD : '—') + '</td>';
        html += '<td>' + (adv.vEUR > 0 ? adv.vEUR : '—') + '</td>';
        html += '<td>' + (adv.vGBP > 0 ? adv.vGBP : '—') + '</td>';
        html += '</tr>';
      });
      if (window._advancesTotals) {
        const t = window._advancesTotals;
        html += '<tr class="totals-row"><td colspan="3">الإجمالي</td>';
        html += '<td>' + (t.USD > 0 ? t.USD : '—') + '</td>';
        html += '<td>' + (t.EUR > 0 ? t.EUR : '—') + '</td>';
        html += '<td>' + (t.GBP > 0 ? t.GBP : '—') + '</td>';
        html += '<td>' + (t.LE > 0 ? t.LE : '—') + '</td>';
        html += '<td>' + (t.VUSD > 0 ? t.VUSD : '—') + '</td>';
        html += '<td>' + (t.VEUR > 0 ? t.VEUR : '—') + '</td>';
        html += '<td>' + (t.VGBP > 0 ? t.VGBP : '—') + '</td>';
        html += '</tr>';
      }
      html += '</table>';
    }
    
    // ═══════════════════════════════════════════
    // 5. الخصومات
    // ═══════════════════════════════════════════
    if (empData.deductionsDetails && empData.deductionsDetails.length > 0) {
      html += '<h3 class="ded">⬇️ الخصومات المطبقة (' + empData.deductionsDetails.length + ')</h3>';
      html += '<table><tr><th>#</th><th>التاريخ</th><th>النوع</th><th>القيمة</th><th>السبب</th><th>بواسطة</th></tr>';
      empData.deductionsDetails.forEach((ded, idx) => {
        let amountText = '';
        if (ded.computedType === 'cash') {
          amountText = fmt(ded.cashInLE) + ' LE';
        } else {
          amountText = ded.daysCount + ' يوم';
        }
        html += '<tr>';
        html += '<td>' + (idx + 1) + '</td>';
        html += '<td>' + escHtml(ded.date || '—') + '</td>';
        html += '<td>' + (ded.computedType === 'cash' ? '💵 نقدي' : '📆 أيام') + '</td>';
        html += '<td class="ded-cell">' + amountText + '</td>';
        html += '<td>' + escHtml(ded.reason || '—') + '</td>';
        html += '<td>' + escHtml(ded.deductedBy || '—') + '</td>';
        html += '</tr>';
      });
      html += '</table>';
    }
    
    html += '<div style="text-align:center;margin-top:20px;padding:8px;font-size:10px;color:#94a3b8;">تم الطباعة بتاريخ ' + new Date().toLocaleString('ar-EG') + ' — Dive System</div>';
    html += '</body></html>';
    
    // ═══════════════════════════════════════════
    // 6. فتح نافذة الطباعة
    // ═══════════════════════════════════════════
    const printWindow = window.open('', '_blank', 'width=1200,height=800');
    if (!printWindow) {
      showToast('⚠️ يرجى السماح بالنوافذ المنبثقة', 'error');
      return;
    }
    
    printWindow.document.write(html);
    printWindow.document.close();
    
    setTimeout(() => {
      printWindow.focus();
      printWindow.print();
    }, 500);
    
  } catch(e) {
    console.error('❌ printModal error:', e);
    showToast('❌ فشل الطباعة: ' + e.message, 'error');
  }
}
// ──────────────────────────────────────────────
// ✅ العودة للصفحة السابقة
// ──────────────────────────────────────────────
function goBack() {
  // تحديث الجلسة
  if (currentUser) {
    Session.save(currentUser);
  }
  
  // ✅ استخدام CONFIG.DASHBOARD_PAGES مع fallback آمن
  const dashboards = CONFIG.DASHBOARD_PAGES || {
    'Admin': 'Dashboard.html',
    'Owner': 'OwnerDashboard.html', 
    'Sales': 'SalesDashboard.html',
    'Accountant': 'AccountantDashboard.html',
    'OperationManager': 'OperationManager.html',
    'OperationSupervisor': 'OperationSupervisor.html'
  };
  
  const userType = currentUser?.type || 'Sales';
  const targetPage = dashboards[userType] || 'Dashboard.html';
  
  // ✅ التوجيه الصحيح (بدون return)
  window.location.href = targetPage;
}
</script>
