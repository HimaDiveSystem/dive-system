<script>
// ============================================================
// ✅ استخدام Session و CONFIG و Theme من الملفات الموحدة
// ============================================================

let currentUser = null;
let tableData = [];
let isLoadingReport = false;   // ✅ جديد — لمنع Race Condition

// ──────────────────────────────────────────────
// ✅ JSONP helper - باستخدام CONFIG.GAS_URL
// ──────────────────────────────────────────────
function jsonp(action, params = {}, retryCount = 0) {
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
    params.action = action;
    params.callback = cb;
    
    const user = Session.getUser();
    if (user) {
      if (user.centerId && !params.centerId) params.centerId = user.centerId;
      if (user.centerName && !params.centerName) params.centerName = user.centerName;
    }
    
    const qs = Object.entries(params).map(([k,v]) => k+'='+encodeURIComponent(String(v??''))).join('&');
    const script = document.createElement('script');
    
    const timeout = setTimeout(() => {
      delete window[cb];
      script.remove();
      
      // ✅ Retry تلقائي عند timeout
      if (retryCount < 2) {
        console.log(`⚠️ jsonp timeout — إعادة المحاولة (${retryCount + 1}/2)...`);
        setTimeout(() => {
          jsonp(action, params, retryCount + 1).then(resolve).catch(reject);
        }, 1000);
      } else {
        reject(new Error('انتهى الوقت'));
      }
    }, 60000);   // ← 60 ثانية (بدلاً من 120)
    
    window[cb] = (data) => {
      clearTimeout(timeout);
      delete window[cb];
      script.remove();
      resolve(data);
    };
    
    script.onerror = () => {
      clearTimeout(timeout);
      delete window[cb];
      script.remove();
      
      // ✅ Retry تلقائي عند فشل التحميل
      if (retryCount < 2) {
        console.log(`⚠️ jsonp error — إعادة المحاولة (${retryCount + 1}/2)...`);
        setTimeout(() => {
          jsonp(action, params, retryCount + 1).then(resolve).catch(reject);
        }, 1500);
      } else {
        reject(new Error('خطأ في الاتصال'));
      }
    };
    
    script.src = CONFIG.GAS_URL + '?' + qs;
    document.head.appendChild(script);
  });
}

// ──────────────────────────────────────────────
// ✅ دالة مساعدة لتنسيق القيم
// ──────────────────────────────────────────────
function formatValue(value, isCurrency = false) {
  if (value === undefined || value === null || value === '') return '—';
  const num = parseFloat(value);
  if (isNaN(num)) return '—';
  if (num === 0) return '—';
  if (isCurrency) return num.toLocaleString();
  if (Number.isInteger(num)) return num.toLocaleString();
  return num.toFixed(1);
}

// ──────────────────────────────────────────────
// ✅ تهيئة الصفحة
// ──────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  // تطبيق الثيم الموحد
  if (typeof Theme !== 'undefined') {
    Theme.applyToPage();
  }
  
  // ✅ استخدام Session.getUser()
  currentUser = Session.getUser();
  
  // ✅ التحقق من صحة الجلسة
  if (!currentUser) {
    window.location.href = 'index.html';
    return;
  }
  
  // عرض اسم المستخدم
  document.getElementById('userBadge').textContent = currentUser?.name || '—';

  // تعبئة سنوات
  const selYear = document.getElementById('selYear');
  const currentYear = new Date().getFullYear();
  for (let y = currentYear + 1; y >= 2020; y--) {
    const opt = document.createElement('option');
    opt.value = y; 
    opt.textContent = y;
    if (y === currentYear) opt.selected = true;
    selYear.appendChild(opt);
  }

  // قراءة المعاملات من URL
  const urlParams = new URLSearchParams(window.location.search);
  const month = urlParams.get('month');
  const year  = urlParams.get('year');
  if (month) document.getElementById('selMonth').value = month;
  if (year)  document.getElementById('selYear').value  = year;

  // إضافة الوقت في الفوتر
  const timeEl = document.getElementById('footerTime');
  if (timeEl) {
    const now = new Date();
    timeEl.textContent = now.toLocaleString('ar-EG');
  }

  // تحميل التقرير
  loadReport();
});

// ──────────────────────────────────────────────
// ✅ تحميل التقرير
// ──────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════
// loadReport — تحميل تقرير المرتبات (Bootstrap Request)
// ═══════════════════════════════════════════════════════════════════
async function loadReport() {
  // ✅ منع التحميل المتزامن
  if (isLoadingReport) {
    console.log('⚠️ loadReport: التحميل قيد التنفيذ — تجاهل');
    return;
  }
  
  // ✅ ✅ ✅ جديد: انتظر 500ms قبل السماح بطلب جديد
  if (window._lastLoadTime && (Date.now() - window._lastLoadTime < 500)) {
    console.log('⚠️ loadReport: طلب سريع جداً — انتظر');
    return;
  }
  window._lastLoadTime = Date.now();
  
  isLoadingReport = true;
  
  const month = document.getElementById('selMonth').value;
  const year  = document.getElementById('selYear').value;
  
  if (!month || !year) {
    showToast('اختر الشهر والسنة', 'error');
    return;
  }
  
   
  // ✅ تحديث زر "عرض التقرير"
  const btnLoad = document.getElementById('btnLoadReport');
  const btnExcel = document.getElementById('btnExportExcel');
  
  if (btnLoad) {
    btnLoad.disabled = true;
    btnLoad.style.opacity = '0.6';
    btnLoad.style.cursor = 'wait';
    btnLoad.textContent = '⏳ جاري العرض...';
  }
  
  if (btnExcel) {
    btnExcel.disabled = true;
    btnExcel.style.opacity = '0.5';
    btnExcel.style.cursor = 'not-allowed';
  }
  
  // ✅ عرض loader
  document.getElementById('reportArea').innerHTML = '<div class="loader"></div>';
  document.getElementById('infoBar').style.display = 'none';
  
  try {
    // ✅ ✅ ✅ طلب واحد بدلاً من 4
    console.log('📡 getSalaryReportBootstrap — إرسال طلب موحّد...');
    
    const result = await jsonp('getSalaryReportBootstrap', { month, year });
    
    console.log('📥 getSalaryReportBootstrap — النتيجة:', result);
    
    if (!result || !result.success) {
      document.getElementById('reportArea').innerHTML =
        '<div class="empty">❌ ' + (result?.message || 'فشل التحميل') + '</div>';
      return;
    }
    
    // ✅ استخراج البيانات
    const salResult = result.salary;
    const invoicesResult = result.invoices;
    const expResult = result.expenses;
    const ratesResult = result.rates;
    
    // ═══════════════════════════════════════════════
    // التحقق من أسعار الصرف
    // ═══════════════════════════════════════════════
    if (!ratesResult || !ratesResult.bUSD || !ratesResult.bEUR || !ratesResult.bGBP) {
      document.getElementById('reportArea').innerHTML =
        '<div class="empty">⚠️ لا توجد أسعار صرف في شيت Exchange_Rates<br><small>يرجى إدخال أسعار الصرف أولاً</small></div>';
      tableData = [];
      return;
    }
    
    const usdRate = parseFloat(ratesResult.bUSD);
    const eurRate = parseFloat(ratesResult.bEUR);
    const gbpRate = parseFloat(ratesResult.bGBP);
    
    // ═══════════════════════════════════════════════
    // التحقق من بيانات المرتبات
    // ═══════════════════════════════════════════════
    if (!salResult || !salResult.success || !salResult.employees || salResult.employees.length === 0) {
      document.getElementById('reportArea').innerHTML =
        '<div class="empty">📭 لا توجد بيانات رواتب للشهر المحدد<br><small>تأكد من تسجيل الحضور وضغط "مزامنة" أولاً</small></div>';
      tableData = [];
      return;
    }
    
    const employees = salResult.employees;
    const invoices  = Array.isArray(invoicesResult) ? invoicesResult : [];
    const expenses  = Array.isArray(expResult) ? expResult : [];
    
      // ✅ العمولات تُحسب على السيرفر — لا حاجة لحسابها هنا
      const commissionMap = {};   // للتوافق فقط
      console.log('✅ Commission handled on server-side');
    
    // ═══════════════════════════════════════════════
    // حساب الدفعات المقدمة
    // ═══════════════════════════════════════════════
    const nameToId = {};
    employees.forEach(emp => {
      if (emp.name) nameToId[emp.name] = emp.userId;
    });

    const advanceMap = {};
    expenses.forEach(exp => {
      const expMonth = (exp.month || '').toString().trim();
      const expYear  = (exp.year  || '').toString().trim();
      if (expMonth !== month || expYear !== year) return;

      const account = (exp.account || '').toString().trim();
      const targetUserId = nameToId[account];
      if (!targetUserId) return;

      const usd = parseFloat(exp.usd) || 0;
      const eur = parseFloat(exp.eur) || 0;
      const gbp = parseFloat(exp.gbp) || 0;
      const le  = parseFloat(exp.le)  || 0;

      const totalLE = (usd * usdRate) + (eur * eurRate) + (gbp * gbpRate) + le;
      if (totalLE <= 0) return;

      advanceMap[targetUserId] = (advanceMap[targetUserId] || 0) + totalLE;
    });
    
    // ═══════════════════════════════════════════════
    // بناء صفوف التقرير
    // ═══════════════════════════════════════════════
   tableData = employees.map(emp => {
  const workingDays   = parseFloat(emp.workingDays)   || 0;
  const monthlySalary = parseFloat(emp.monthlySalary) || 0;
  const absentDays    = Math.max(0, 30 - workingDays);

  const salaryAmount = monthlySalary > 0
    ? Math.round((monthlySalary / 30) * workingDays)
    : (parseFloat(emp.salaryAmount) || 0);

  const commission     = parseFloat(emp.commission) || 0;   // ✅ من السيرفر
  const bonus          = parseFloat(emp.bonus) || 0;
  const total          = parseFloat(emp.total) || (salaryAmount + commission + bonus);   // ✅ من السيرفر
  const cuts           = parseFloat(emp.cuts) || 0;
  const insurance      = parseFloat(emp.insurance) || 0;
  const totalAfterCuts = total - cuts - insurance;
  const downPaymentLE  = parseFloat(emp.downPaymentLE) || 0;   // ✅ من السيرفر
  const net            = parseFloat(emp.net) || (totalAfterCuts - downPaymentLE);   // ✅ من السيرفر
      return {
        userId:         emp.userId        || '',
        name:           emp.name          || '',
        position:       emp.position      || '',
        workingDays:    workingDays,
        absentDays:     absentDays,
        monthlySalary:  monthlySalary,
        salaryAmount:   salaryAmount,
        commission:     commission,
        bonus:          bonus,
        total:          total,
        cuts:           cuts,
        insurance:      insurance,
        totalAfterCuts: totalAfterCuts,
        downPaymentLE:  downPaymentLE,
        net:            net
      };
    });
    
    // ═══════════════════════════════════════════════
    // معلومات إضافية
    // ═══════════════════════════════════════════════
    const totalCommissions = Object.values(commissionMap).reduce((a, b) => a + b, 0);
    const totalAdvances    = Object.values(advanceMap).reduce((a, b) => a + b, 0);
    
    document.getElementById('infoBar').style.display = 'flex';
    document.getElementById('infoText').textContent =
      `إجمالي العمولات المجمَّعة من الفواتير: ${Math.round(totalCommissions).toLocaleString()} LE  |  إجمالي المسحوبات: ${Math.round(totalAdvances).toLocaleString()} LE  |  سعر الصرف المستخدم: $1 = ${usdRate} LE، €1 = ${eurRate} LE`;
    
    // ✅ عرض الجدول
    renderTable(tableData, month, year);
    
    console.log('✅ loadReport: اكتمل بنجاح');
    
  } catch(e) {
    console.error('❌ loadReport error:', e);
    document.getElementById('reportArea').innerHTML =
      '<div class="empty">❌ خطأ: ' + e.message + '</div>';
    tableData = [];
  } finally {
    // ✅ ✅ ✅ إعادة تعيين الحالة دائماً
    isLoadingReport = false;
    
    if (btnLoad) {
      btnLoad.disabled = false;
      btnLoad.style.opacity = '1';
      btnLoad.style.cursor = 'pointer';
      btnLoad.textContent = '🔍 عرض التقرير';
    }
    
    if (btnExcel) {
      btnExcel.disabled = false;
      btnExcel.style.opacity = '1';
      btnExcel.style.cursor = 'pointer';
    }
    
    console.log('🔄 loadReport: تم إعادة تعيين الحالة');
  }
}
// ──────────────────────────────────────────────
// ✅ عرض الجدول
// ──────────────────────────────────────────────
function renderTable(rows, month, year) {
  if (!rows.length) {
    document.getElementById('reportArea').innerHTML =
      '<div class="empty">📭 لا توجد بيانات</div>';
    return;
  }

  let totals = {
    workingDays: 0, absentDays: 0,
    monthlySalary: 0, salaryAmount: 0,
    commission: 0, bonus: 0, total: 0,
    downPaymentLE: 0, net: 0
  };
  rows.forEach(r => {
    totals.workingDays   += r.workingDays || 0;
    totals.absentDays    += r.absentDays || 0;
    totals.monthlySalary += r.monthlySalary || 0;
    totals.salaryAmount  += r.salaryAmount || 0;
    totals.commission    += r.commission || 0;
    totals.bonus         += r.bonus || 0;
    totals.total         += r.total || 0;
    totals.downPaymentLE += r.downPaymentLE || 0;
    totals.net           += r.net || 0;
  });

  function fmt(n) { return Math.round(n).toLocaleString(); }
  function fmtDays(n) { return (Math.round(n*100)/100).toLocaleString(); }

      let html = `<div class="table-wrap"><table>
    <thead>
      <tr>
        <th>#</th>
        <th>الرقم الوظيفي</th>
        <th style="text-align:right;">الاسم</th>
        <th>الوظيفة</th>
        <th>أيام الحضور</th>
        <th>أيام الغياب</th>
        <th>الراتب الأساسي</th>
        <th>الراتب المستحق</th>
        <th>العمولة</th>
        <th>الحافز</th>
        <th>الإجمالي</th>
        <th>الخصم</th>
        <th>التأمينات</th>
        <th>صافي بعد الخصم</th>
        <th>الدفعة المقدمة</th>
        <th>الصافي المستحق</th>
        <th>تفاصيل</th>
      </tr>

// openCommissionDetails — عرض تفاصيل عمولات موظف معين
// ═══════════════════════════════════════════════════════════════════
function openCommissionDetails(userId, employeeName) {
  const month = document.getElementById('selMonth').value;
  const year  = document.getElementById('selYear').value;
  
  if (!month || !year) {
    showToast('اختر الشهر والسنة أولاً', 'error');
    return;
  }
  
  // ✅ فلترة الفواتير لهذا الموظف في هذا الشهر
  const empInvoices = (window._allInvoices || []).filter(inv => {
    const invMonth = (inv.month || '').toString().trim();
    const invYear  = (inv.year  || '').toString().trim();
    const state    = (inv.state || '').toString().trim().toLowerCase();
    const salesId  = (inv.salesId || '').toString().trim();
    
    if (invMonth !== month) return false;
    if (invYear !== year) return false;
    if (state !== 'confirmed') return false;
    if (salesId !== userId) return false;
    
    const comm = parseFloat(inv.commission) || 0;
    return comm > 0;
  });
  
  // ✅ حساب الإجمالي
  const totalComm = empInvoices.reduce((sum, inv) => {
    return sum + (parseFloat(inv.commission) || 0);
  }, 0);
  
  // ✅ بناء جدول التفاصيل
  let rowsHtml = '';
  if (empInvoices.length === 0) {
    rowsHtml = `<tr><td colspan="6" style="text-align:center;padding:20px;color:#999;">
      لا توجد فواتير مؤكدة بهذا الشهر
    </td></tr>`;
  } else {
    empInvoices.forEach((inv, idx) => {
      rowsHtml += `<tr>
        <td style="text-align:center;">${idx + 1}</td>
        <td>${inv.voucherNo || '—'}</td>
        <td>${inv.date || '—'}</td>
        <td style="text-align:right;">${inv.customerName || inv.customer || '—'}</td>
        <td style="text-align:center;">${inv.currency || '—'}</td>
        <td style="text-align:center;">${inv.amount || '—'}</td>
        <td style="text-align:center;color:#1e8449;font-weight:700;">${fmt(parseFloat(inv.commission) || 0)}</td>
      </tr>`;
    });
  }
  
  // ✅ HTML المودال
  const modalHtml = `
    <div id="commDetailsModal" style="
      position:fixed;top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,0.7);z-index:9999;
      display:flex;align-items:center;justify-content:center;
      padding:20px;box-sizing:border-box;
      animation:fadeIn 0.2s ease;
    " onclick="if(event.target===this) closeCommissionDetails()">
      
      <div style="
        background:#fff;border-radius:16px;
        max-width:1000px;width:100%;max-height:90vh;
        display:flex;flex-direction:column;
        box-shadow:0 20px 60px rgba(0,0,0,0.4);
        animation:slideUp 0.3s ease;
      ">
        
        <!-- Header -->
        <div style="
          padding:20px 25px;
          background:linear-gradient(135deg,#0d9488,#14b8a6);
          color:#fff;border-radius:16px 16px 0 0;
          display:flex;justify-content:space-between;align-items:center;
        ">
          <div>
            <h3 style="margin:0;font-size:18px;">👁️ تفاصيل عمولات — ${employeeName}</h3>
            <p style="margin:5px 0 0;opacity:0.9;font-size:13px;">
              ${month} / ${year} — الرقم الوظيفي: ${userId}
            </p>
          </div>
          <button onclick="closeCommissionDetails()" style="
            background:rgba(255,255,255,0.2);color:#fff;
            border:none;width:36px;height:36px;border-radius:50%;
            font-size:20px;cursor:pointer;transition:.2s;
          " onmouseover="this.style.background='rgba(255,255,255,0.4)'"
             onmouseout="this.style.background='rgba(255,255,255,0.2)'">×</button>
        </div>
        
        <!-- Body -->
        <div style="padding:20px 25px;overflow-y:auto;flex:1;">
          
          <div style="
            background:#e8f5e9;border-right:4px solid #1e8449;
            padding:15px 20px;border-radius:10px;margin-bottom:20px;
            display:flex;justify-content:space-between;align-items:center;
          ">
            <span style="font-weight:700;color:#1e8449;font-size:15px;">
              💰 إجمالي العمولات المحتسبة
            </span>
            <span style="font-weight:800;color:#1e8449;font-size:20px;">
              ${fmt(totalComm)} LE
            </span>
          </div>
          
          <div style="
            background:#f8f9fa;padding:12px 16px;border-radius:10px;
            margin-bottom:15px;font-size:13px;color:#666;
          ">
            📊 عدد الفواتير المؤكدة: <strong>${empInvoices.length}</strong>
          </div>
          
          <div style="overflow-x:auto;border-radius:10px;border:1px solid #e0e0e0;">
            <table style="width:100%;border-collapse:collapse;font-size:13px;">
              <thead>
                <tr style="background:#1e2b4f;color:#ffd966;">
                  <th style="padding:10px;text-align:center;">#</th>
                  <th style="padding:10px;text-align:right;">رقم الإيصال</th>
                  <th style="padding:10px;text-align:center;">التاريخ</th>
                  <th style="padding:10px;text-align:right;">اسم العميل</th>
                  <th style="padding:10px;text-align:center;">العملة</th>
                  <th style="padding:10px;text-align:center;">المبلغ</th>
                  <th style="padding:10px;text-align:center;">العمولة</th>
                </tr>
              </thead>
              <tbody>
                ${rowsHtml}
              </tbody>
            </table>
          </div>
          
        </div>
        
        <!-- Footer -->
        <div style="
          padding:15px 25px;background:#f8f9fa;
          border-radius:0 0 16px 16px;
          display:flex;justify-content:flex-end;gap:10px;
          border-top:1px solid #e0e0e0;
        ">
          <button onclick="closeCommissionDetails()" style="
            background:#6c757d;color:#fff;border:none;
            padding:10px 25px;border-radius:10px;
            font-size:14px;font-weight:700;cursor:pointer;
          ">إغلاق</button>
        </div>
        
      </div>
    </div>
    
    <style>
      @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
      @keyframes slideUp { from {transform:translateY(30px);opacity:0;} to {transform:translateY(0);opacity:1;} }
    </style>
  `;
  
  // ✅ إزالة أي مودال قديم + إضافة الجديد
  const existing = document.getElementById('commDetailsModal');
  if (existing) existing.remove();
  
  document.body.insertAdjacentHTML('beforeend', modalHtml);
}

// ✅ Toast
// ──────────────────────────────────────────────
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type==='error'?'t-err':type==='info'?'t-info':'t-ok') + ' show';
  setTimeout(() => { t.className = 'toast'; }, 3500);
}

// escHtml — تهريب HTML
// ═══════════════════════════════════════════════════════════════════
function escHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[m]));
}

// ✅ العودة للصفحة السابقة
// ──────────────────────────────────────────────
function goBack() {
  // تحديث الجلسة
  if (currentUser) {
    Session.save(currentUser);
  }
  
  // ✅ استخدام CONFIG.DASHBOARD_PAGES مع fallback آمن
  const dashboards = CONFIG.DASHBOARD_PAGES || {
    'Admin': 'Dashboard.html',
    'Owner': 'OwnerDashboard.html', 
    'Sales': 'SalesDashboard.html',
    'Accountant': 'AccountantDashboard.html',
    'OperationManager': 'OperationManager.html',
    'OperationSupervisor': 'OperationSupervisor.html'
  };
  
  const userType = currentUser?.type || 'Sales';
  const targetPage = dashboards[userType] || 'Dashboard.html';
  
  // ✅ التوجيه الصحيح (بدون return)
  window.location.href = targetPage;
}
</script>
