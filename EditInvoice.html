<script>
const GAS_URL = CONFIG.GAS_URL;
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let currentUser = null, currentInvoice = null, originalInvoice = null;
let allEmployees = [], exRatesCache = {};

// ============================================================
// ✅ الدوال الأساسية
// ============================================================
function esc(s) { if (s === undefined || s === null) return ''; return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function R2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
function dV(v) { const n = Number(v); return (n === 0 || isNaN(n)) ? '' : n; }
function formatDate(d) { if (!d) return ''; if (typeof d === 'string') return d; if (d instanceof Date) return `${String(d.getDate()).padStart(2,'0')}/${MONTHS[d.getMonth()]}/${d.getFullYear()}`; return ''; }
function parseDate(str) { if (!str) return null; const p = str.split('/'); if (p.length === 3) { const mi = MONTHS.findIndex(m => m.toLowerCase() === p[1].toLowerCase()); if (mi !== -1) return new Date(+p[2], mi, +p[0]); } return null; }
function dateToInput(s) { const d = parseDate(s); if (!d) return ''; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

// ============================================================
// ✅ دوال UI

function closeAlert() { document.getElementById('alertModal').classList.remove('open'); }
function closeCollectionModal() { document.getElementById('collectionModal').classList.remove('open'); }
function showLoader(show, msg = 'جاري المعالجة...') {
  if (show) { document.getElementById('pdfMsg').innerHTML = msg; document.getElementById('pdfOverlay').classList.add('open'); }
  else { document.getElementById('pdfOverlay').classList.remove('open'); }
}
function showAlert(msg, icon = 'ℹ️', btns = null) {
  const msgEl = document.getElementById('alertMsg');
  const iconEl = document.getElementById('alertIcon');
  const btnsEl = document.getElementById('alertBtns');
  
  if (msgEl) msgEl.innerHTML = msg;
  if (iconEl) iconEl.innerHTML = icon;
  if (btnsEl) {
    btnsEl.innerHTML = btns || '<button class="btn btn-primary" onclick="closeAlert()">موافق</button>';
  }
  
  const modal = document.getElementById('alertModal');
  if (modal) modal.classList.add('open');
}

function confirmExit() {
  showAlert('⚠️ هل أنت متأكد من إلغاء التعديلات؟', '⚠️', 
    '<button class="btn btn-primary" onclick="goBack()">نعم</button>' +
    '<button class="btn btn-danger" onclick="closeAlert()">لا</button>'
  );
}

function goBack() {
  try {
    if (window.history.length > 1) {
      window.history.back();
      return;
    }
    const returnUrl = sessionStorage.getItem('returnUrl') || '';
    if (returnUrl && !returnUrl.includes('login.html') && !returnUrl.includes('index.html')) {
      location.href = returnUrl;
      return;
    }
    const referrer = document.referrer || '';
    if (referrer && !referrer.includes('login.html') && !referrer.includes('index.html')) {
      window.location.href = referrer;
      return;
    }
    const user = currentUser || Session.getUser();
    const role = user?.role || 'Accountant';
    const dashboards = {
      'Admin': 'Dashboard.html',
      'Owner': 'OwnerDashboard.html',
      'Accountant': 'AccountantDashboard.html',
      'Sales': 'SalesDashboard.html',
      'OperationsManager': 'OperationManager.html',
      'OperationsSupervisor': 'OperationSupervisor.html',
      'Customer': 'CustomerDashboard.html'
    };
    location.href = dashboards[role] || 'AccountantDashboard.html';
  } catch(e) {
    try { window.history.back(); } catch(e2) { location.href = 'AccountantDashboard.html'; }
  }
}

// ============================================================
// ✅ POST Request باستخدام fetch مع text/plain (يمنع CORS Preflight)
// ============================================================
async function postRequest(action, params = {}) {
  // إضافة centerName تلقائياً
  if (currentInvoice && currentInvoice.centerName && !params.centerName) {
    params.centerName = currentInvoice.centerName;
  }
  if (currentUser && currentUser.centerName && !params.centerName && !currentInvoice) {
    params.centerName = currentUser.centerName;
  }
  
  params.action = action;
  
  try {
    const response = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
      body: JSON.stringify(params)
    });
    
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    
    return await response.json();
  } catch(err) {
    console.error('❌ postRequest error:', err);
    throw err;
  }
}

// ============================================================
// ✅ JSONP Request (يدعم GET و POST عبر iframe)
// ============================================================
function jsonpRequest(action, params = {}, isPost = false) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 99999);
    
    // إضافة centerName تلقائياً
    if (currentInvoice && currentInvoice.centerName && !params.centerName) {
      params.centerName = currentInvoice.centerName;
    }
    if (currentUser && currentUser.centerName && !params.centerName && !currentInvoice) {
      params.centerName = currentUser.centerName;
    }
    
    params.action = action;
    params.callback = cbName;
    
    // ✅ زيادة المهلة للـ POST (120 ثانية) والـ GET (60 ثانية)
    const timeoutMs = isPost ? 120000 : 60000;
    
    if (isPost) {
      // ✅ POST: استخدام iframe (الطريقة الوحيدة لتجاوز CORS)
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = GAS_URL;
      form.target = '_blank';
      form.style.display = 'none';
      
      for (const [key, value] of Object.entries(params)) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = String(value ?? '');
        form.appendChild(input);
      }
      
      const iframeName = 'iframe_' + cbName;
      const iframe = document.createElement('iframe');
      iframe.name = iframeName;
      iframe.style.display = 'none';
      document.body.appendChild(iframe);
      form.target = iframeName;
      
      let timeoutId;
      const checkInterval = setInterval(() => {
        try {
          const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
          if (iframeDoc && iframeDoc.body && iframeDoc.body.innerText) {
            const responseText = iframeDoc.body.innerText;
            if (responseText && responseText.trim()) {
              clearInterval(checkInterval);
              clearTimeout(timeoutId);
              document.body.removeChild(iframe);
              try {
                const result = JSON.parse(responseText);
                resolve(result);
              } catch(e) {
                resolve({ success: false, message: responseText });
              }
            }
          }
        } catch(e) {}
      }, 200);
      
      timeoutId = setTimeout(() => {
        clearInterval(checkInterval);
        document.body.removeChild(iframe);
        reject(new Error('POST timeout - استغرق الطلب أكثر من 120 ثانية'));
      }, timeoutMs);
      
      document.body.appendChild(form);
      form.submit();
      setTimeout(() => form.remove(), 1000);
      
    } else {
      // ✅ GET: JSONP للطلبات الصغيرة
      const qs = Object.entries(params).map(([k, v]) => k + '=' + encodeURIComponent(String(v ?? ''))).join('&');
      const url = GAS_URL + '?' + qs;
      const script = document.createElement('script');
      
      const timeoutId = setTimeout(() => {
        delete window[cbName];
        if (script.parentNode) script.remove();
        reject(new Error('JSONP timeout - استغرق الطلب أكثر من 60 ثانية'));
      }, timeoutMs);
      
      window[cbName] = (data) => {
        clearTimeout(timeoutId);
        delete window[cbName];
        if (script.parentNode) script.remove();
        resolve(data);
      };
      
      script.onerror = () => {
        clearTimeout(timeoutId);
        delete window[cbName];
        if (script.parentNode) script.remove();
        reject(new Error('Network error - فشل الاتصال بالخادم'));
      };
      
      script.src = url;
      document.head.appendChild(script);
    }
  });
}
// ============================================================
// ✅ دوال أسعار الصرف
// ============================================================
async function getRate(dateStr) {
  if (!dateStr) return null;
  if (exRatesCache[dateStr]) return exRatesCache[dateStr];
  try { 
    // ✅ استخدام postRequest بدلاً من jsonpRequest
    const r = await postRequest('getExchangeRate', { dateStr }); 
    if (r) { exRatesCache[dateStr] = r; return r; } 
  } catch(e) {}
  return null;
}

function rateFields(r) {
  if (!r) return null;
  if (r.cash) return r;
  return { cash: { USD: +r.sUSD || 47.5, EUR: +r.sEUR || 50.25, GBP: +r.sGBP || 60 }, visa: { USD: +r.sVUSD || 46.3, EUR: +r.sVEUR || 49, GBP: +r.sVGBP || 58.5, LE: +r.sVLE || 0.975 } };
}

// ============================================================
// ✅ دوال الحسابات
// ============================================================
function calcTotalFromItems() {
  let total = 0;
  for (let i = 0; i < 20; i++) {
    const el = document.getElementById(`total_${i}`);
    if (el && el.value) total += parseFloat(el.value) || 0;
  }
  return total;
}

async function updateTotals() {
  const itemsTotal = calcTotalFromItems();
  const discount = parseFloat(document.getElementById('discount')?.value) || 0;
  const currency = document.getElementById('invoiceCurrency')?.value || currentInvoice?.invoiceCurrency || 'LE';
  const activeDate = document.getElementById('activeDate')?.value;
  
  const cU = parseFloat(document.getElementById('cashUSD')?.value) || 0;
  const cE = parseFloat(document.getElementById('cashEUR')?.value) || 0;
  const cG = parseFloat(document.getElementById('cashGBP')?.value) || 0;
  const cL = parseFloat(document.getElementById('cashLE')?.value) || 0;
  const vU = parseFloat(document.getElementById('visaUSD')?.value) || 0;
  const vE = parseFloat(document.getElementById('visaEUR')?.value) || 0;
  const vG = parseFloat(document.getElementById('visaGBP')?.value) || 0;
  const vL = parseFloat(document.getElementById('visaLE')?.value) || 0;
  
  let paid = 0;
  if (activeDate && (cU + cE + cG + cL + vU + vE + vG + vL) > 0) {
    const raw = await getRate(activeDate);
    const r = rateFields(raw);
    if (r) {
      const totalLE = cU * r.cash.USD + cE * r.cash.EUR + cG * r.cash.GBP + cL +
                      vU * r.visa.USD + vE * r.visa.EUR + vG * r.visa.GBP + vL * (r.visa.LE || 0.975);
      if (currency === '$') paid = totalLE / r.cash.USD;
      else if (currency === '€') paid = totalLE / r.cash.EUR;
      else if (currency === '£') paid = totalLE / r.cash.GBP;
      else paid = totalLE;
    } else paid = cU + cE + cG + cL + vU + vE + vG + vL;
  } else paid = cU + cE + cG + cL + vU + vE + vG + vL;
  
  paid = R2(paid);
  const rest = R2(Math.max(0, itemsTotal - discount - paid));
  
  document.getElementById('displayActualPrice').textContent = itemsTotal.toFixed(2);
  document.getElementById('displayPaymentPrice').textContent = paid.toFixed(2);
  document.getElementById('displayRest').textContent = rest.toFixed(2);
  
  if (currentInvoice) {
    currentInvoice.actualPrice = itemsTotal;
    currentInvoice.paymentPrice = paid;
    currentInvoice.discount = discount;
    currentInvoice.rest = rest;
  }
}

function updateItemTotal(idx, price) {
  const qty = parseFloat(document.getElementById(`qty_${idx}`)?.value) || 0;
  const totalEl = document.getElementById(`total_${idx}`);
  if (totalEl) totalEl.value = (qty * price).toFixed(2);
  updateTotals();
}

// ============================================================
// ✅ دالة رفع التوقيع إلى Drive
// ============================================================
async function uploadSignatureImage(signatureData) {
  try {
    const base64Data = signatureData.split(',')[1];
    if (!base64Data) return { success: false, message: 'No image data' };
    
    const result = await postRequest('uploadSignatureImage', {
      b64: base64Data,
      voucherNo: 'temp_' + Date.now()
    });
    
    return result;
  } catch(e) {
    console.error('uploadSignatureImage error:', e);
    return { success: false, message: e.message };
  }
}


// ✅ دالة إنشاء PDF (باستخدام POST)
async function generatePDF() {
  if (!currentInvoice) {
    showAlert('⚠️ لا توجد فاتورة');
    return;
  }
  
  showLoader(true, '📄 جاري إنشاء PDF...');
  try {
    const result = await postRequest('saveAndGenerateSinglePDF_New', {
      voucherNo: currentInvoice.voucherNo,
      prices: JSON.stringify(currentInvoice.tripPrices || []),
      total: currentInvoice.actualPrice || 0,
      centerName: currentInvoice.centerName || currentUser?.centerName || ''
    });
    
    showLoader(false);
    
    if (result?.success && result?.url) {
      window.open(result.url, '_blank');
    } else {
      showAlert('❌ فشل إنشاء PDF: ' + (result?.message || 'خطأ غير معروف'));
    }
  } catch(err) {
    showLoader(false);
    showAlert('❌ خطأ: ' + err.message);
  }
}

async function updateCollectionSummary() {
  const currency = currentInvoice?.invoiceCurrency || 'LE';
  const activeDate = document.getElementById('activeDate')?.value;
  const cU = Number(document.getElementById('collUSD')?.value) || 0;
  const cE = Number(document.getElementById('collEUR')?.value) || 0;
  const cG = Number(document.getElementById('collGBP')?.value) || 0;
  const cL = Number(document.getElementById('collLE')?.value) || 0;
  const vU = Number(document.getElementById('collVisaUSD')?.value) || 0;
  const vE = Number(document.getElementById('collVisaEUR')?.value) || 0;
  const vG = Number(document.getElementById('collVisaGBP')?.value) || 0;
  const vL = Number(document.getElementById('collVisaLE')?.value) || 0;
  
  let collected = 0;
  if (activeDate && (cU + cE + cG + cL + vU + vE + vG + vL) > 0) {
    const raw = await getRate(activeDate);
    const r = rateFields(raw);
    if (r) {
      const totalLE = cU * r.cash.USD + cE * r.cash.EUR + cG * r.cash.GBP + cL +
                      vU * r.visa.USD + vE * r.visa.EUR + vG * r.visa.GBP + vL * (r.visa.LE || 0.975);
      if (currency === '$') collected = totalLE / r.cash.USD;
      else if (currency === '€') collected = totalLE / r.cash.EUR;
      else if (currency === '£') collected = totalLE / r.cash.GBP;
      else collected = totalLE;
    } else collected = cU + cE + cG + cL + vU + vE + vG + vL;
  } else collected = cU + cE + cG + cL + vU + vE + vG + vL;
  
  collected = R2(collected);
  const newRest = Math.max(0, R2(currentCollectionRest - collected));
  document.getElementById('collectionTotalDisplay').textContent = collected.toFixed(2);
  document.getElementById('newRestPreview').textContent = newRest.toFixed(2);
}

    let collectionDisabledReason = '';
    if (currentRest <= 0.01) collectionDisabledReason = 'لا يوجد مبلغ متبقي';
    else if (!canCollect) collectionDisabledReason = 'ليس لديك صلاحية تحصيل';
    
    const warnHtml = isPastDate ? 
      `<div class="warning-bar">⚠️ تاريخ التنفيذ (${currentInvoice.activeDate}) قد مضى — لا يمكن تعديل المدفوعات، ولكن يمكن التحصيل.</div>` : '';
    
    let collectorsOptions = '<option value="">-- اختر المحصل --</option>';
    if (allEmployees.length) {
      allEmployees.forEach(emp => {
        collectorsOptions += `<option value="${esc(emp.serial)}|${esc(emp.name)}">${esc(emp.name)} (${esc(emp.position || 'موظف')})</option>`;
      });
    }
    
    // ✅ أزرار
    const collectBtnHtml = (canCollect && currentRest > 0.01) ? 
      `<button class="btn btn-success" id="collectionBtn" onclick="openCollectionModal()" title="${collectionDisabledReason}">💰 تحصيل (المتبقي: ${currentRest.toFixed(2)})</button>` : 
      (canCollect ? `<button class="btn btn-success" id="collectionBtn" disabled style="opacity:0.5;cursor:not-allowed;" title="${collectionDisabledReason}">💰 تحصيل - ${collectionDisabledReason}</button>` : '');
    
    const saveBtnHtml = canSave ? 
      `<button class="btn btn-primary" onclick="saveChanges()">💾 حفظ التعديلات</button>` : '';
    
    const formHtml = `
      ${warnHtml}
      <input type="hidden" id="centerName" value="${esc(currentInvoice.centerName || '')}">
      
      <div class="card">
        <div class="card-header">👤 بيانات العميل</div>
        <div class="card-body">
          <div class="form-grid">
            <div><label>الهاتف</label><input type="text" id="contactNo" value="${esc(currentInvoice.contactNo)}" ${canEdit ? '' : 'disabled'}></div>
            <div><label>الاسم</label><input type="text" id="guestName" value="${esc(currentInvoice.guestName)}" ${canEdit ? '' : 'disabled'}></div>
            <div><label>الجنسية</label><input type="text" id="nationality" value="${esc(currentInvoice.nationality)}" ${canEdit ? '' : 'disabled'}></div>
          </div>
        </div>
      </div>
      
      <div class="card">
        <div class="card-header">🏝️ تفاصيل الرحلة</div>
        <div class="card-body">
          <div class="hotel-row">
            <div><label>الفندق</label><input type="text" id="hotel" value="${esc(currentInvoice.hotel)}" ${canEdit ? '' : 'disabled'}></div>
            <div><label>الغرفة</label><input type="text" id="roomNo" value="${esc(currentInvoice.roomNo)}" ${canEdit ? '' : 'disabled'}></div>
            <div><label>بالغين</label><input type="number" id="adultCount" value="${dV(currentInvoice.adultCount)}" ${canEdit ? '' : 'disabled'}></div>
            <div><label>أطفال</label><input type="number" id="childCount" value="${dV(currentInvoice.childCount)}" ${canEdit ? '' : 'disabled'}></div>
            <div><label>رضع</label><input type="number" id="infantCount" value="${dV(currentInvoice.infantCount)}" ${canEdit ? '' : 'disabled'}></div>
          </div>
          <div class="form-grid">
            <div><label>تاريخ التنفيذ</label><input type="date" id="activeDate" value="${dateToInput(currentInvoice.activeDate)}" onchange="updateTotals()" ${canEdit ? '' : 'disabled'}></div>
            <div><label>الوقت</label><input type="text" id="tripTime" value="${currentInvoice.time || ''}" placeholder="--:--" ${canEdit ? '' : 'disabled'}></div>
            <div><label>عملة الفاتورة</label><select id="invoiceCurrency" onchange="changeTrip()" ${canEdit ? '' : 'disabled'}>
              <option value="$" ${currentInvoice.invoiceCurrency === '$' ? 'selected' : ''}>USD</option>
              <option value="€" ${currentInvoice.invoiceCurrency === '€' ? 'selected' : ''}>EUR</option>
              <option value="£" ${currentInvoice.invoiceCurrency === '£' ? 'selected' : ''}>GBP</option>
              <option value="LE" ${currentInvoice.invoiceCurrency === 'LE' ? 'selected' : ''}>EGP</option>
            </select></div>
          </div>
          <div><label>الرحلة</label><select id="tripName" onchange="changeTrip()" ${canEdit ? '' : 'disabled'}>${tripsOpts}</select></div>
          <div class="trip-table">
            <table>
              <thead>
                <tr>
                  <th style="text-align:left; padding:8px; background:#1a3260; color:#f5c842;">البند</th>
                  <th style="padding:8px; background:#1a3260; color:#f5c842;">الكمية</th>
                  <th style="padding:8px; background:#1a3260; color:#f5c842;">السعر</th>
                  <th style="padding:8px; background:#1a3260; color:#f5c842;">الإجمالي</th>
                </tr>
              </thead>
              <tbody id="itemsBody">
                ${tRows || '<tr><td colspan="4" style="text-align:center; padding:20px;">لا توجد بنود</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      </div>
      
      <div class="card">
        <div class="card-header">💰 المدفوعات</div>
        <div class="card-body">
          <div class="totals-strip">
            <div class="total-item"><div class="label">الخصم</div><input type="number" id="discount" step="0.01" value="${dV(currentInvoice.discount)}" oninput="updateTotals()" ${canEdit ? '' : 'disabled'}></div>
            <div class="total-item"><div class="label">الإجمالي</div><div class="value" id="displayActualPrice">${(currentInvoice.actualPrice || 0).toFixed(2)}</div></div>
            <div class="total-item"><div class="label">المدفوع</div><div class="value" id="displayPaymentPrice">${(currentInvoice.paymentPrice || 0).toFixed(2)}</div></div>
            <div class="total-item"><div class="label">المتبقي</div><div class="value" id="displayRest">${(currentInvoice.rest || 0).toFixed(2)}</div></div>
          </div>
          <div class="payment-section"><div class="payment-label">💵 كاش</div><div class="payment-grid">
            <div class="payment-card"><label>USD</label><input type="number" id="cashUSD" step="0.01" value="${dV(currentInvoice.cashUSD)}" oninput="updateTotals()" ${disablePayments ? 'disabled' : ''}></div>
            <div class="payment-card"><label>EUR</label><input type="number" id="cashEUR" step="0.01" value="${dV(currentInvoice.cashEUR)}" oninput="updateTotals()" ${disablePayments ? 'disabled' : ''}></div>
            <div class="payment-card"><label>GBP</label><input type="number" id="cashGBP" step="0.01" value="${dV(currentInvoice.cashGBP)}" oninput="updateTotals()" ${disablePayments ? 'disabled' : ''}></div>
            <div class="payment-card"><label>EGP</label><input type="number" id="cashLE" step="0.01" value="${dV(currentInvoice.cashLE)}" oninput="updateTotals()" ${disablePayments ? 'disabled' : ''}></div>
          </div></div>
          <div class="payment-section"><div class="payment-label">💳 فيزا</div><div class="payment-grid">
            <div class="payment-card"><label>Visa USD</label><input type="number" id="visaUSD" step="0.01" value="${dV(currentInvoice.visaUSD)}" oninput="updateTotals()" ${disablePayments ? 'disabled' : ''}></div>
            <div class="payment-card"><label>Visa EUR</label><input type="number" id="visaEUR" step="0.01" value="${dV(currentInvoice.visaEUR)}" oninput="updateTotals()" ${disablePayments ? 'disabled' : ''}></div>
            <div class="payment-card"><label>Visa GBP</label><input type="number" id="visaGBP" step="0.01" value="${dV(currentInvoice.visaGBP)}" oninput="updateTotals()" ${disablePayments ? 'disabled' : ''}></div>
            <div class="payment-card"><label>Visa EGP</label><input type="number" id="visaLE" step="0.01" value="${dV(currentInvoice.visaLE)}" oninput="updateTotals()" ${disablePayments ? 'disabled' : ''}></div>
          </div></div>
          <div style="margin-top:12px"><label>ملاحظات</label><textarea id="notes" rows="2" ${canEdit ? '' : 'disabled'}>${esc(currentInvoice.notes)}</textarea></div>
        </div>
      </div>
      
      <div class="card">
        <div class="card-header">🏢 معلومات إضافية</div>
        <div class="card-body">
          <div class="form-grid">
            <div><label>المنفذ</label><input type="text" id="supplier" value="${esc(currentInvoice.supplier)}" readonly></div>
            <div><label>العميل</label><input type="text" id="customer" value="${esc(currentInvoice.customer)}" readonly></div>
            <div><label>الحالة</label><select id="state" ${canEdit ? '' : 'disabled'}>
              <option value="pending" ${currentInvoice.state === 'pending' ? 'selected' : ''}>⏳ قيد الانتظار</option>
              <option value="Confirmed" ${(currentInvoice.state === 'Confirmed' || currentInvoice.state === 'confirmed') ? 'selected' : ''}>✅ مؤكد</option>
              <option value="cancel" ${currentInvoice.state === 'cancel' ? 'selected' : ''}>❌ ملغي</option>
            </select></div>
          </div>
        </div>
      </div>
      
      <div style="display:flex; gap:10px; justify-content:center; margin-top:20px; flex-wrap:wrap;">
        ${collectBtnHtml}
        ${saveBtnHtml}
        <button class="btn btn-danger" onclick="confirmExit()">❌ إلغاء</button>
      </div>
    `;
    
    document.querySelector('.loader').style.display = 'none';
    document.getElementById('formContent').style.display = 'block';
    document.getElementById('formContent').innerHTML = formHtml;
    
    await updateTotals();
    showLoader(false);
    
  } catch(err) {
    showLoader(false);
    showAlert('خطأ: ' + err.message, '<button class="btn btn-primary" onclick="goBack()">رجوع</button>');
  }
}

// ============================================================
// ✅ تحميل الصفحة
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  let userData = null;
  
  try {
    const storedUser = sessionStorage.getItem('currentUser');
    if (storedUser) {
      const parsed = JSON.parse(storedUser);
      if (parsed && parsed.id) {
        userData = parsed;
        console.log('✅ تم استعادة المستخدم من sessionStorage');
      }
    }
  } catch(e) {
    console.warn('⚠️ فشل parsing user data:', e);
  }
  
  if (!userData || !userData.id) {
    try {
      const sessionUser = Session.getUser();
      if (sessionUser && typeof sessionUser === 'object' && sessionUser.id) {
        userData = sessionUser;
        console.log('✅ تم استعادة المستخدم من Session.getUser()');
      }
    } catch(e) {
      console.warn('⚠️ فشل استعادة المستخدم من Session.getUser():', e);
    }
  }
  
  if (userData && userData.id) {
    currentUser = userData;
    console.log('✅ Current User:', currentUser);
    console.log('✅ Permissions:', currentUser.permissions || []);
    
    try {
      if (typeof Session !== 'undefined' && Session.save) {
        Session.save(userData);
        console.log('✅ تم إعادة حفظ المستخدم في Session API');
      }
    } catch(e) {
      console.warn('⚠️ فشل حفظ المستخدم في Session API:', e);
    }
    
    const centerName = currentUser.centerName || '';
    if (centerName) {
      sessionStorage.setItem('centerName', centerName);
    }
    loadInvoice();
  } else {
    console.warn('⚠️ لا توجد جلسة نشطة، جاري التوجيه لتسجيل الدخول');
    showAlert('⚠️ انتهت صلاحية الجلسة، يرجى تسجيل الدخول مرة أخرى', '⏰', 
      '<button class="btn btn-primary" onclick="window.location.href=\'login.html\'">تسجيل الدخول</button>'
    );
  }
});

// ============================================================
// ✅ ربط الدوال بالـ window
// ============================================================
window.goBack = goBack;
window.closeAlert = closeAlert;
window.closeCollectionModal = closeCollectionModal;
window.updateTotals = updateTotals;
window.updateItemTotal = updateItemTotal;
window.saveChanges = saveChanges;
window.openCollectionModal = openCollectionModal;
window.submitCollection = submitCollection;
window.updateCollectionSummary = updateCollectionSummary;
window.changeTrip = changeTrip;
window.shareInvoiceWhatsApp = shareInvoiceWhatsApp;
window.confirmExit = confirmExit;
window.generatePDF = generatePDF;

</script>
</body>
</html>
