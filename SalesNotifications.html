<!DOCTYPE html>
<html dir="rtl">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes, viewport-fit=cover">
  <title>🔔 تنبيهات وإحصائيات المبيعات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="ui.js"></script>
  <script src="config.js"></script>
  <script src="session.js"></script>

  <style>
    :root {
      --navy: #0f1f3d; --navy2: #1a3260; --gold: #f5c842; --gold2: #e6b800;
      --blue: #2563eb; --green: #16a34a; --red: #dc2626; --orange: #ea580c; --purple: #7c3aed;
      --bg: #f0f4f8; --card: #fff; --border: #dde4f0; --text: #1a2540; --text-lt: #5a6a8a;
      --radius: 16px; --shadow: 0 4px 24px rgba(15,31,61,.10);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    
    body { background: var(--navy); color: var(--text); min-height: 100vh; padding: 0; }

    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 36px;
      min-height: 80vh;
      background: var(--bg);
      border: 8px solid var(--navy);
      box-shadow: 0 0 0 4px rgba(30,43,79,0.1);
    }

    @media (max-width: 768px) {
      .main-content { border-width: 4px; padding: 16px 18px; }
    }

    .header { background: linear-gradient(135deg, var(--navy), var(--navy2)); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; border-radius: 16px; margin-bottom: 20px; }
    .header h2 { color: var(--gold); display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 900; }
    .back-btn { background: transparent; border: 2px solid rgba(255,255,255,0.3); color: white; padding: 6px 16px; border-radius: 40px; cursor: pointer; font-weight: 700; font-size: 12px; transition: 0.2s; }
    .back-btn:hover { border-color: var(--gold); color: var(--gold); }

    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px; flex-wrap: wrap; }
    .tab-btn { background: #e2e8f0; color: var(--text-lt); border: none; padding: 10px 20px; border-radius: 40px; cursor: pointer; font-weight: 700; font-size: 14px; transition: 0.3s; }
    .tab-btn.active { background: var(--navy); color: var(--gold); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .filter-bar { background: #f8f9fa; padding: 15px; border-radius: 16px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; border: 2px solid var(--border); }
    .filter-bar label { font-weight: 700; color: var(--navy); font-size: 14px; }
    .filter-bar input { padding: 8px 15px; border: 2px solid var(--border); border-radius: 40px; font-family: inherit; }
    .btn-filter { background: var(--navy); color: var(--gold); border: none; padding: 8px 20px; border-radius: 40px; cursor: pointer; font-weight: 700; font-size: 13px; transition: 0.3s; }
    .btn-filter:hover { background: var(--navy2); }
    .btn-filter:disabled { opacity: 0.6; cursor: not-allowed; }

    .totals-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .total-card { background: white; border-radius: 12px; padding: 15px; text-align: center; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .total-card .lbl { font-size: 11px; color: var(--text-lt); font-weight: 700; margin-bottom: 5px; }
    .total-card .val { font-size: 20px; font-weight: 900; color: var(--navy); }
    .total-card .sub { font-size: 12px; color: var(--green); font-weight: 700; margin-top: 4px; }

    .notifications-list { display: flex; flex-direction: column; gap: 15px; }
    .notification-card { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 20px; transition: 0.3s; position: relative; border-right: 6px solid var(--green); box-shadow: var(--shadow); }
    .notification-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(30,43,79,0.1); }
    
    .notif-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
    .notif-title { font-size: 16px; font-weight: 700; color: var(--navy); }
    .notif-title span { color: var(--red); }
    .notif-time { font-size: 12px; color: var(--text-lt); background: #f8fafc; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); }
    
    .notif-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 15px; background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
    .detail-item { text-align: center; }
    .detail-label { font-size: 11px; color: var(--text-lt); margin-bottom: 5px; font-weight: 700; }
    .detail-value { font-size: 15px; font-weight: 900; color: var(--navy); }
    
    .activities-text { margin-top: 12px; padding: 10px; background: #fffbeb; border: 1px dashed #fde68a; border-radius: 8px; font-size: 12px; color: #92400e; font-weight: 600; text-align: center; }

    .chart-card { background: white; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 18px; margin-bottom: 20px; }
    .chart-card h3 { color: var(--navy); font-size: 15px; font-weight: 800; margin-bottom: 15px; display: flex; align-items: center; gap: 7px; }
    .chart-wrap { position: relative; height: 350px; width: 100%; }
    
    .tbls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .tbl-card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; }
    .tbl-card-head { padding: 12px 16px; background: linear-gradient(90deg, var(--navy), var(--navy2)); }
    .tbl-card-head h3 { color: var(--gold); font-size: 14px; font-weight: 800; }
    
    .dtbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .dtbl thead th { background: #f0f4f8; color: var(--text-lt); padding: 10px 12px; font-weight: 700; text-align: center; font-size: 12px; }
    .dtbl thead th:first-child { text-align: right; }
    .dtbl tbody td { padding: 10px 12px; border-bottom: 1px solid #f0f4f8; color: var(--text); text-align: center; }
    .dtbl tbody td:first-child { text-align: right; font-weight: 600; }
    .dtbl tbody tr:hover td { background: #f8faff; }
    .amt { font-family: monospace; font-weight: 700; color: var(--navy); text-align: center !important; }

    .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--navy); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 40px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .footer { text-align: center; padding: 10px; color: #94a3b8; font-size: 10px; border-top: 1px solid var(--border); margin-top: 20px; }
  </style>
</head>
<body>

<div class="main-content">
  <div class="header">
    <h2>📈 تنبيهات وإحصائيات المبيعات</h2>
    <button class="back-btn" onclick="goBack()">🔙 العودة</button>
  </div>
  
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('notifications', this)">🔔 الحجوزات الجديدة</button>
    <button class="tab-btn" onclick="switchTab('stats', this)">📊 تحليل المبيعات</button>
  </div>

  <!-- تبويب التنبيهات -->
  <div id="tab-notifications" class="tab-content active">
    <div class="filter-bar">
      <label>📅 حجوزات اليوم (تاريخ الإصدار):</label>
      <input type="date" id="notifDate" onchange="loadNotifications()">
      <button class="btn-filter" id="btnUpdateNotif" onclick="loadNotifications()">تحديث</button>
    </div>
    
    <div id="dailyTotalsStrip" class="totals-strip"></div>

    <div id="notificationsContainer">
      <div class="loader"></div>
    </div>
  </div>

  <!-- تبويب الإحصائيات -->
  <div id="tab-stats" class="tab-content">
    <div class="filter-bar">
      <label>📊 تحليل المبيعات للفترة المحددة:</label>
      <input type="date" id="statsDateFrom" onchange="loadStats()">
      <span style="color:#64748b; font-weight:bold;">إلى</span>
      <input type="date" id="statsDateTo" onchange="loadStats()">
      <button class="btn-filter" id="btnShowStats" onclick="loadStats()">عرض الإحصائيات</button>
    </div>
    <div id="statsContainer">
      <div class="chart-card">
        <h3>📊 إجمالي المبيعات لكل مندوب (بالجنيه المصري)</h3>
        <div class="chart-wrap">
          <canvas id="salesChart"></canvas>
        </div>
      </div>
      <div id="statsTableContainer"></div>
    </div>
  </div>

  <div class="footer">
    <span>© 2025 <strong style="color:#1e2b4f;">🌊 Dive System</strong> — جميع الحقوق محفوظة</span>
  </div>
</div>

<script>
const GAS = CONFIG.GAS_URL;
let currentUser = null;
let salesChartInstance = null;

async function apiRequest(action, params = {}) {
  try {
    const url = new URL(GAS);
    url.searchParams.set('action', action);
    
    if (currentUser && currentUser.centerName && !params.centerName) {
      params.centerName = currentUser.centerName;
    }
    
    Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, String(v ?? '')));
    
    const response = await fetch(url.toString());
    if (!response.ok) throw new Error('HTTP ' + response.status);
    
    const result = await response.json();
    console.log(`📡 apiRequest("${action}") ->`, result);
    return result;
  } catch (e) {
    console.error(`❌ apiRequest("${action}") error:`, e);
    throw e;
  }
}

function formatDateToStr(dateObj) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${String(dateObj.getDate()).padStart(2,'0')}/${months[dateObj.getMonth()]}/${dateObj.getFullYear()}`;
}

document.addEventListener('DOMContentLoaded', () => {
  const userData = sessionStorage.getItem('currentUser');
  if (!userData) { window.location.href = 'index.html'; return; }
  currentUser = JSON.parse(userData);

  const today = new Date().toISOString().split('T')[0];
  document.getElementById('notifDate').value = today;
  document.getElementById('statsDateFrom').value = today;
  document.getElementById('statsDateTo').value = today;

  loadNotifications();
});

function switchTab(tabName, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  
  btn.classList.add('active');
  document.getElementById('tab-' + tabName).classList.add('active');

  if (tabName === 'stats') {
    loadStats();
  }
}

// 1. جلب وعرض التنبيهات
async function loadNotifications() {
  const container = document.getElementById('notificationsContainer');
  const totalsContainer = document.getElementById('dailyTotalsStrip');
  const btn = document.getElementById('btnUpdateNotif');
  
  btn.disabled = true;
  btn.innerHTML = '⏳ جاري التحميل...';
  
  container.innerHTML = '<div class="loader"></div>';
  totalsContainer.innerHTML = '';
  
  const dateVal = document.getElementById('notifDate').value;
  if (!dateVal) {
    btn.disabled = false;
    btn.innerHTML = 'تحديث';
    return;
  }

  const dateStr = formatDateToStr(new Date(dateVal));

  try {
    // ✅ استخدمنا getInvoicesByDateRangeOnly لجلب كل الفواتير ثم الفلترة
    const fromDateStr = dateStr;
    const toDateStr = dateStr; // نفس اليوم
    const result = await apiRequest('getInvoicesByDateRangeOnly', {
        fromDate: fromDateStr,
        toDate: toDateStr,
        centerName: currentUser.centerName
    });
    
    let invoices = [];
    if (Array.isArray(result)) {
      invoices = result;
    } else if (result && result.success && result.data) {
      invoices = result.data;
    }

    if (invoices.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:40px; color:#64748b;">لا توجد حجوزات في هذا التاريخ</div>';
      return;
    }

    // ترتيب تنازلي حسب الوقت
    invoices.sort((a, b) => {
        const timeA = a.time || '00:00';
        const timeB = b.time || '00:00';
        return timeB.localeCompare(timeA);
    });

    let totalSales = { USD: 0, EUR: 0, GBP: 0, LE: 0 };
    let totalPaid  = { USD: 0, EUR: 0, GBP: 0, LE: 0 };

    let html = '<div class="notifications-list">';
    
    invoices.forEach(inv => {
      const salesName = inv.salesName || 'غير معروف';
      const totalAmount = parseFloat(inv.actualPrice) || 0;
      const paidAmount = parseFloat(inv.paymentPrice) || 0;
      const currency = inv.invoiceCurrency || 'LE';
      const tripName = inv.trip || 'رحلة غير محددة';
      const activitiesText = inv.activitiesText || '';
      
      const state = (inv.state || '').toLowerCase();
      if (state !== 'cancel' && state !== 'refund') {
        if (currency === '$') { totalSales.USD += totalAmount; totalPaid.USD += paidAmount; }
        else if (currency === '€') { totalSales.EUR += totalAmount; totalPaid.EUR += paidAmount; }
        else if (currency === '£') { totalSales.GBP += totalAmount; totalPaid.GBP += paidAmount; }
        else { totalSales.LE += totalAmount; totalPaid.LE += paidAmount; }
      }

      html += `
        <div class="notification-card">
          <div class="notif-header">
            <div class="notif-title">📝 أضاف <span>${salesName}</span> فاتورة جديدة</div>
            <div class="notif-time">🕒 ${inv.time || '—'} | رقم: ${inv.voucherNo}</div>
          </div>
          
          <div class="notif-body">
            <div class="detail-item">
              <div class="detail-label">إجمالي الفاتورة</div>
              <div class="detail-value" style="color:#27ae60;">${totalAmount.toFixed(2)} ${currency}</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">المدفوع منها</div>
              <div class="detail-value" style="color:#3498db;">${paidAmount.toFixed(2)} ${currency}</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">الرحلة</div>
              <div class="detail-value">${tripName}</div>
            </div>
          </div>
          
          ${activitiesText ? `<div class="activities-text">📋 الأنشطة: ${activitiesText}</div>` : ''}
        </div>
      `;
    });
    html += '</div>';
    container.innerHTML = html;

    totalsContainer.innerHTML = `
      <div class="total-card">
        <div class="lbl">إجمالي مبيعات الدولار</div>
        <div class="val">${totalSales.USD.toFixed(2)} $</div>
        <div class="sub">المدفوع: ${totalPaid.USD.toFixed(2)} $</div>
      </div>
      <div class="total-card">
        <div class="lbl">إجمالي مبيعات اليورو</div>
        <div class="val">${totalSales.EUR.toFixed(2)} €</div>
        <div class="sub">المدفوع: ${totalPaid.EUR.toFixed(2)} €</div>
      </div>
      <div class="total-card">
        <div class="lbl">إجمالي مبيعات الإسترليني</div>
        <div class="val">${totalSales.GBP.toFixed(2)} £</div>
        <div class="sub">المدفوع: ${totalPaid.GBP.toFixed(2)} £</div>
      </div>
      <div class="total-card">
        <div class="lbl">إجمالي مبيعات الجنيه</div>
        <div class="val">${totalSales.LE.toFixed(2)} LE</div>
        <div class="sub">المدفوع: ${totalPaid.LE.toFixed(2)} LE</div>
      </div>
    `;

  } catch(e) {
    console.error(e);
    container.innerHTML = '<div style="text-align:center; padding:40px; color:red;">حدث خطأ أثناء جلب البيانات</div>';
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'تحديث';
  }
}

// 2. جلب وعرض الإحصائيات
async function loadStats() {
  const fromVal = document.getElementById('statsDateFrom').value;
  const toVal = document.getElementById('statsDateTo').value;
  const btn = document.getElementById('btnShowStats');
  const tableContainer = document.getElementById('statsTableContainer');
  
  if (!fromVal || !toVal) return;

  btn.disabled = true;
  btn.innerHTML = '⏳ جاري التحميل...';
  tableContainer.innerHTML = '<div class="loader"></div>';

  try {
    const dateFromStr = formatDateToStr(new Date(fromVal));
    const dateToStr = formatDateToStr(new Date(toVal));

    const result = await apiRequest('getSalesStatsForPeriod', {
        fromDate: dateFromStr,
        toDate: dateToStr,
        centerName: currentUser.centerName
    });
    
    if (!result || !result.success) {
        throw new Error(result.message || 'فشل جلب الإحصائيات');
    }

    const salesData = result.salesData || [];
    const topTrips = result.topTrips || [];
    const topBranches = result.topBranches || [];
    const topNats = result.topNats || [];

    const labels = salesData.map(item => item.name);
    const dataValues = salesData.map(item => item.paidLE); 

    const ctx = document.getElementById('salesChart').getContext('2d');
    if (salesChartInstance) salesChartInstance.destroy();

    salesChartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'إجمالي المدفوعات (بالجنيه المصري)',
          data: dataValues,
          backgroundColor: 'rgba(37,99,235,0.8)',
          borderColor: 'rgba(37,99,235,1)',
          borderWidth: 1,
          borderRadius: 8
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { 
            legend: { position: 'top', labels: { font: { family: 'Cairo' } } },
            tooltip: {
                callbacks: {
                    label: function(context) {
                        return context.dataset.label + ': ' + context.raw.toFixed(2) + ' LE';
                    }
                }
            }
        },
        scales: {
          y: { beginAtZero: true, ticks: { font: { family: 'Cairo' } } },
          x: { ticks: { font: { family: 'Cairo' } } }
        }
      }
    });

    function buildTable(title, data, label) {
        if (!data.length) return `<div class="tbl-card"><div class="tbl-card-head"><h3>${title}</h3></div><div class="no-data" style="padding:20px; text-align:center;">لا توجد بيانات</div></div>`;
        let rows = '';
        data.forEach(([name, val]) => {
            rows += `<tr><td>${name || 'غير معروف'}</td><td class="amt">${val.toFixed(2)} LE</td></tr>`;
        });
        return `
            <div class="tbl-card">
                <div class="tbl-card-head"><h3>${title}</h3></div>
                <table class="dtbl">
                    <thead><tr><th>${label}</th><th>المبلغ (LE)</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>
        `;
    }

    let salesTableHtml = `
      <div class="tbl-card">
        <div class="tbl-card-head"><h3>📋 تفاصيل المبيعات لكل مندوب</h3></div>
        <table class="dtbl">
          <thead>
            <tr>
              <th>مندوب المبيعات</th>
              <th>عدد الفواتير</th>
              <th>إجمالي المدفوع ($)</th>
              <th>إجمالي المدفوع (€)</th>
              <th>إجمالي المدفوع (£)</th>
              <th>إجمالي المدفوع (LE)</th>
              <th style="background:#d1fae5; color:#065f46;">الإجمالي المحول (LE)</th>
            </tr>
          </thead>
          <tbody>
    `;
    if (salesData.length === 0) {
        salesTableHtml += `<tr><td colspan="7" style="text-align:center; padding:20px;">لا توجد بيانات في هذه الفترة</td></tr>`;
    } else {
        salesData.forEach(item => {
            salesTableHtml += `
              <tr>
                <td>${item.name}</td>
                <td>${item.count}</td>
                <td class="amt">${item.currencies.USD.toFixed(2)}</td>
                <td class="amt">${item.currencies.EUR.toFixed(2)}</td>
                <td class="amt">${item.currencies.GBP.toFixed(2)}</td>
                <td class="amt">${item.currencies.LE.toFixed(2)}</td>
                <td class="amt" style="background:#ecfdf5; color:#047857; font-weight:bold;">${item.paidLE.toFixed(2)}</td>
              </tr>
            `;
        });
    }
    salesTableHtml += `</tbody></table></div>`;

    tableContainer.innerHTML = `
      ${salesTableHtml}
      <div class="tbls-grid" style="margin-top: 20px;">
        ${buildTable('🏝️ المبيعات حسب الرحلة (LE)', topTrips, 'الرحلة')}
        ${buildTable('🏛️ المبيعات حسب الفرع (LE)', topBranches, 'الفرع')}
        ${buildTable('🌍 المبيعات حسب الجنسية (LE)', topNats, 'الجنسية')}
      </div>
    `;

  } catch(e) {
    console.error(e);
    tableContainer.innerHTML = '<div style="text-align:center; padding:40px; color:red;">حدث خطأ في جلب الإحصائيات</div>';
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'عرض الإحصائيات';
  }
}

function goBack() {
  window.location.href = 'OwnerDashboard.html';
}

window.switchTab = switchTab;
window.loadNotifications = loadNotifications;
window.loadStats = loadStats;
window.goBack = goBack;
</script>
</body>
</html>
