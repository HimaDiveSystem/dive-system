<!DOCTYPE html>
<html dir="rtl">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes, viewport-fit=cover">
  <title>🔔 تنبيهات المبيعات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- مكتبة Chart.js للرسم البياني -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="ui.js"></script>
  <script src="config.js"></script>
  <script src="session.js"></script>

  <style>
    :root {
      --color-primary: #1e2b4f;
      --color-secondary: #f5c842;
      --color-success: #27ae60;
      --color-danger: #e74c3c;
      --color-light: #f0f4f8;
      --gradient-primary: linear-gradient(135deg, #1e2b4f 0%, #152238 100%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body { background: linear-gradient(135deg, #0f1f3d 0%, #1a3260 100%); min-height: 100vh; padding: 20px; }

    .page-wrapper { max-width: 1200px; margin: 0 auto; background: white; border-radius: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; min-height: 80vh; }

    .header { background: var(--gradient-primary); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .header h2 { color: #ffd966; display: flex; align-items: center; gap: 8px; font-size: 18px; }
    .back-btn { background: #ffd966; color: #1e2b4f; border: none; padding: 6px 16px; border-radius: 40px; cursor: pointer; font-weight: 600; font-size: 12px; }

    .content { padding: 20px; }

    /* التبويبات */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    .tab-btn { background: #e2e8f0; color: #64748b; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.3s; }
    .tab-btn.active { background: var(--color-primary); color: #ffd966; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* كروت التنبيهات */
    .notifications-list { display: flex; flex-direction: column; gap: 15px; }
    .notification-card { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 16px; padding: 20px; transition: 0.3s; position: relative; border-right: 6px solid var(--color-success); }
    .notification-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(30,43,79,0.1); }
    
    .notif-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .notif-title { font-size: 16px; font-weight: bold; color: var(--color-primary); }
    .notif-time { font-size: 12px; color: #64748b; background: white; padding: 4px 10px; border-radius: 20px; border: 1px solid #e2e8f0;}
    
    .notif-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 15px; background: white; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; }
    .detail-item { text-align: center; }
    .detail-label { font-size: 11px; color: #64748b; margin-bottom: 5px; }
    .detail-value { font-size: 15px; font-weight: bold; color: var(--color-primary); }
    
    /* الرسم البياني */
    .chart-container { background: white; padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0; margin-top: 20px; position: relative; height: 400px; width: 100%; }
    
    /* فلتر التاريخ */
    .filter-bar { background: #f8f9fa; padding: 15px; border-radius: 16px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; border: 2px solid #d0ddeb; }
    .filter-bar input { padding: 8px 15px; border: 2px solid #d0ddeb; border-radius: 40px; font-family: inherit; }
    .btn-filter { background: var(--color-primary); color: white; border: none; padding: 8px 20px; border-radius: 40px; cursor: pointer; font-weight: 600; font-size: 13px; }

    .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--color-primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 40px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .footer { text-align: center; padding: 10px; color: #94a3b8; font-size: 10px; border-top: 1px solid #e2e8f0; margin-top: 20px; }
  </style>
</head>
<body>

<div class="page-wrapper">
  <div class="header">
    <h2>📈 تنبيهات وإحصائيات المبيعات</h2>
    <button class="back-btn" onclick="goBack()">🔙 العودة</button>
  </div>
  
  <div class="content">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('notifications', this)">🔔 الحجوزات الجديدة</button>
      <button class="tab-btn" onclick="switchTab('stats', this)">📊 إحصائيات المبيعات</button>
    </div>

    <!-- تبويب التنبيهات -->
    <div id="tab-notifications" class="tab-content active">
      <div class="filter-bar">
        <label>📅 عرض حجوزات تاريخ:</label>
        <input type="date" id="notifDate" onchange="loadNotifications()">
        <button class="btn-filter" onclick="loadNotifications()">تحديث</button>
      </div>
      <div id="notificationsContainer">
        <div class="loader"></div>
      </div>
    </div>

    <!-- تبويب الإحصائيات -->
    <div id="tab-stats" class="tab-content">
      <div class="filter-bar">
        <label>📅 إحصائيات تاريخ:</label>
        <input type="date" id="statsDate" onchange="loadStats()">
        <button class="btn-filter" onclick="loadStats()">عرض الإحصائيات</button>
      </div>
      <div class="chart-container">
        <canvas id="salesChart"></canvas>
      </div>
    </div>
  </div>

  <div class="footer">
    <span>© 2025 <strong style="color:#1e2b4f;">🌊 Dive System</strong> — جميع الحقوق محفوظة</span>
  </div>
</div>

<script>
const GAS = CONFIG.GAS_URL;
let currentUser = null;
let salesChartInstance = null;

// دالة الطلب الموحدة
function jsonpRequest(action, params = {}) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 99999);
    if (currentUser && currentUser.centerName && !params.centerName) {
      params.centerName = currentUser.centerName;
    }
    params.action = action;
    params.callback = cbName;

    const qs = Object.entries(params).map(([k,v]) => k + '=' + encodeURIComponent(String(v ?? ''))).join('&');
    const script = document.createElement('script');
    const timeout = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 60000);
    const cleanup = () => { clearTimeout(timeout); delete window[cbName]; script.remove(); };
    window[cbName] = data => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('network error')); };
    script.src = GAS + '?' + qs;
    document.head.appendChild(script);
  });
}

// تهيئة الصفحة
document.addEventListener('DOMContentLoaded', () => {
  const userData = sessionStorage.getItem('currentUser');
  if (!userData) { window.location.href = 'index.html'; return; }
  currentUser = JSON.parse(userData);

  // تعيين تاريخ اليوم كافتراضي
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('notifDate').value = today;
  document.getElementById('statsDate').value = today;

  loadNotifications();
});

// تبديل التبويبات
function switchTab(tabName, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  
  btn.classList.add('active');
  document.getElementById('tab-' + tabName).classList.add('active');

  if (tabName === 'stats') {
    loadStats();
  }
}

// جلب وعرض التنبيهات (الحجوزات الجديدة)
async function loadNotifications() {
  const container = document.getElementById('notificationsContainer');
  container.innerHTML = '<div class="loader"></div>';
  
  const dateVal = document.getElementById('notifDate').value;
  if (!dateVal) return;

  // تحويل التاريخ إلى dd/MMM/yyyy
  const d = new Date(dateVal);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dateStr = `${String(d.getDate()).padStart(2,'0')}/${months[d.getMonth()]}/${d.getFullYear()}`;

  try {
    // نجلب فواتير هذا اليوم
    const invoices = await jsonpRequest('getInvoicesByDate', { dateStr: dateStr });
    
    if (!invoices || invoices.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:40px; color:#64748b;">لا توجد حجوزات في هذا التاريخ</div>';
      return;
    }

    // ترتيب الفواتير من الأحدث للأقدم (حسب الوقت)
    invoices.sort((a, b) => {
        const timeA = a.time || '00:00';
        const timeB = b.time || '00:00';
        return timeB.localeCompare(timeA);
    });

    let html = '<div class="notifications-list">';
    invoices.forEach(inv => {
      const salesName = inv.salesName || 'غير معروف';
      const totalAmount = parseFloat(inv.actualPrice) || 0;
      const paidAmount = parseFloat(inv.paymentPrice) || 0;
      const currency = inv.invoiceCurrency || 'LE';
      const tripName = inv.trip || 'رحلة غير محددة';
      
      html += `
        <div class="notification-card">
          <div class="notif-header">
            <div class="notif-title">📝 أضاف <span style="color:#e74c3c;">${salesName}</span> فاتورة جديدة</div>
            <div class="notif-time">🕒 ${inv.time || '—'} | رقم: ${inv.voucherNo}</div>
          </div>
          
          <div class="notif-body">
            <div class="detail-item">
              <div class="detail-label">إجمالي الفاتورة</div>
              <div class="detail-value" style="color:#27ae60;">${totalAmount.toFixed(2)} ${currency}</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">المدفوع منها</div>
              <div class="detail-value" style="color:#3498db;">${paidAmount.toFixed(2)} ${currency}</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">الرحلة</div>
              <div class="detail-value">${tripName}</div>
            </div>
          </div>
        </div>
      `;
    });
    html += '</div>';
    container.innerHTML = html;

  } catch(e) {
    console.error(e);
    container.innerHTML = '<div style="text-align:center; padding:40px; color:red;">حدث خطأ أثناء جلب البيانات</div>';
  }
}

// جلب وعرض الإحصائيات والرسم البياني
async function loadStats() {
  const dateVal = document.getElementById('statsDate').value;
  if (!dateVal) return;

  const d = new Date(dateVal);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dateStr = `${String(d.getDate()).padStart(2,'0')}/${months[d.getMonth()]}/${d.getFullYear()}`;

  try {
    const result = await jsonpRequest('getSalesStatsByDate', { dateStr: dateStr });
    
    if (!result.success || !result.data) {
      alert('فشل جلب الإحصائيات');
      return;
    }

    const labels = result.data.map(item => item.salesName);
    const dataValues = result.data.map(item => item.totalSales);

    // رسم المخطط البياني
    const ctx = document.getElementById('salesChart').getContext('2d');
    
    // تدمير المخطط القديم إذا وجد
    if (salesChartInstance) {
      salesChartInstance.destroy();
    }

    salesChartInstance = new Chart(ctx, {
      type: 'bar', // مخطط أعمدة
      data: {
        labels: labels,
        datasets: [{
          label: 'إجمالي المبيعات (المدفوع)',
          data: dataValues,
          backgroundColor: 'rgba(30, 43, 79, 0.8)',
          borderColor: 'rgba(30, 43, 79, 1)',
          borderWidth: 1,
          borderRadius: 8
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'top', labels: { font: { family: 'Cairo' } } },
          tooltip: {
            callbacks: {
              label: function(context) {
                return 'المبيعات: ' + context.parsed.y.toFixed(2);
              }
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: { font: { family: 'Cairo' } }
          },
          x: {
            ticks: { font: { family: 'Cairo' } }
          }
        }
      }
    });

  } catch(e) {
    console.error(e);
    alert('حدث خطأ في جلب الإحصائيات');
  }
}

function goBack() {
  window.location.href = 'OwnerDashboard.html';
}

window.switchTab = switchTab;
window.loadNotifications = loadNotifications;
window.loadStats = loadStats;
window.goBack = goBack;
</script>
</body>
</html>
