<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#0f1f3d">
  <title>Center Portal</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Config for API -->
  <script src="config.js"></script>

  <style>
    :root {
      --navy: #0f1f3d;
      --navy2: #1a3260;
      --gold: #f5c842;
      --gold2: #e6b800;
      --bg: #f0f4f8;
      --card: #ffffff;
      --text: #1a2540;
      --text-lt: #5a6a8a;
      --border: #dde4f0;
      --green: #16a34a;
      --red: #dc2626;
      --blue: #2563eb;
      --radius: 16px;
      --radius-lg: 24px;
      --shadow: 0 4px 24px rgba(15,31,61,0.08);
      --shadow-lg: 0 12px 32px rgba(15,31,61,0.15);
      --font: 'Cairo', 'Tajawal', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--navy);
      color: var(--text);
      min-height: 100vh;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── التطبيق ── */
    #app {
      width: 100%;
      max-width: 1000px;
      background: var(--bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ── الهيدر ── */
    .header {
      background: linear-gradient(135deg, var(--navy), var(--navy2));
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
      position: relative;
    }
    .header-center {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-logo {
      width: 50px; height: 50px;
      background: white;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold);
      padding: 2px;
    }
    .header-title {
      color: var(--gold);
      font-size: 20px;
      font-weight: 800;
      line-height: 1.2;
    }
    .header-subtitle {
      color: rgba(255,255,255,0.7);
      font-size: 12px;
      font-weight: 600;
    }
    .lang-selector {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 8px 12px;
      border-radius: 20px;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }
    .lang-selector option { background: var(--navy); color: white; }

    /* ── التبويبات ── */
    .tabs-nav {
      display: flex;
      background: white;
      border-bottom: 2px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs-nav::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex: 1;
      padding: 15px 10px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--text-lt);
      font-family: var(--font);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 80px;
    }
    .tab-btn.active {
      color: var(--navy);
      border-bottom-color: var(--gold);
      background: #f8fafc;
    }
    .tab-icon { font-size: 20px; }

    /* ── المحتوى ── */
    .content-area {
      flex: 1;
      padding: 20px;
      position: relative;
    }
    .tab-content {
      display: none;
      animation: fadeIn 0.4s ease;
    }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ── عناصر عامة ── */
    .card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .card-body { padding: 16px; }
    .section-title {
      color: var(--navy);
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 30px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--navy); color: var(--gold); width: 100%; }
    .btn-gold { background: var(--gold); color: var(--navy); width: 100%; }

    /* ── Loading & Error ── */
    .loading-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 60px 20px; gap: 15px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--navy); color: white; padding: 12px 24px; border-radius: 30px;
      font-weight: 700; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transition: 0.3s; z-index: 9999; opacity: 0; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.error { background: var(--red); }
    .toast.success { background: var(--green); }

    /* Responsive */
    @media (max-width: 600px) {
      body { padding: 0; }
      #app { border-radius: 0; min-height: 100vh; }
      .header { padding: 15px; }
      .header-title { font-size: 18px; }
      .tab-btn { font-size: 12px; }
      .tab-icon { font-size: 18px; }
      .content-area { padding: 15px; }
    }
  </style>
</head>
<body>

  <div id="app">
    
    <!-- ═══════ الهيدر ═══════ -->
    <div class="header">
      <div class="header-center">
        <img id="centerLogo" src="" alt="Logo" class="header-logo" style="display:none;" onerror="this.style.display='none'">
        <div>
          <div class="header-title" id="headerCenterName">Loading...</div>
          <div class="header-subtitle">Online Booking Portal</div>
        </div>
      </div>
      <select class="lang-selector" id="langSelector" onchange="changeLanguage(this.value)">
        <option value="en">🇬🇧 English</option>
        <option value="ar">🇪🇬 العربية</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="it">🇮🇹 Italiano</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="es">🇪🇸 Español</option>
      </select>
    </div>

    <!-- ═══════ التبويبات ═══════ -->
    <div class="tabs-nav">
      <button class="tab-btn active" onclick="switchTab('info')" id="btn-tab-info">
        <span class="tab-icon">ℹ️</span>
        <span data-i18n="tabInfo">About</span>
      </button>
      <button class="tab-btn" onclick="switchTab('trips')" id="btn-tab-trips">
        <span class="tab-icon">🏝️</span>
        <span data-i18n="tabTrips">Trips & Prices</span>
      </button>
      <button class="tab-btn" onclick="switchTab('book')" id="btn-tab-book">
        <span class="tab-icon">🎫</span>
        <span data-i18n="tabBook">Book Now</span>
      </button>
      <button class="tab-btn" onclick="switchTab('feedback')" id="btn-tab-feedback">
        <span class="tab-icon">⭐</span>
        <span data-i18n="tabFeedback">Feedback</span>
      </button>
    </div>

    <!-- ═══════ المحتوى ═══════ -->
    <div class="content-area">
      
      <!-- Tab 1: About -->
      <div id="tab-info" class="tab-content active">
        <div class="loading-screen" id="infoLoading">
          <div class="spinner"></div>
          <p data-i18n="loading">Loading...</p>
        </div>
        <div id="infoContent" style="display:none;"></div>
      </div>

      <!-- Tab 2: Trips -->
      <div id="tab-trips" class="tab-content">
        <div class="loading-screen" id="tripsLoading" style="display:none;">
          <div class="spinner"></div>
          <p data-i18n="loading">Loading...</p>
        </div>
        <div id="tripsContent"></div>
      </div>

      <!-- Tab 3: Book -->
      <div id="tab-book" class="tab-content">
        <div id="bookContent"></div>
      </div>

      <!-- Tab 4: Feedback -->
      <div id="tab-feedback" class="tab-content">
        <div id="feedbackContent"></div>
      </div>

    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- سكربتات -->
  <script>
    // ═══════════════════════════════════════════════════════════════
    // ✅ المتغيرات العامة
    // ═══════════════════════════════════════════════════════════════
    const GAS_URL = CONFIG.GAS_URL;
    
    let centerName = '';
    let salesName = '';
    let salesId = '';
    let branchId = '';
    let branchName = '';
    
    let currentLang = 'en';
    let centerData = null;
    
    // الترجمات الأساسية (سيتم استبدالها بالترجمة الكاملة لاحقاً)
    const I18N = {
      en: {
        tabInfo: 'About', tabTrips: 'Trips', tabBook: 'Book', tabFeedback: 'Feedback',
        loading: 'Loading...', error: 'Error', noData: 'No data available'
      },
      ar: {
        tabInfo: 'عن المركز', tabTrips: 'الرحلات', tabBook: 'حجز', tabFeedback: 'التقييمات',
        loading: 'جاري التحميل...', error: 'خطأ', noData: 'لا توجد بيانات'
      }
    };

    // ═══════════════════════════════════════════════════════════════
    // ✅ دالة الاتصال بـ GAS (JSONP)
    // ═══════════════════════════════════════════════════════════════
    function callGAS(action, params = {}) {
      return new Promise((resolve, reject) => {
        const callbackName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
        params.action = action;
        params.callback = callbackName;

        const queryString = Object.keys(params)
          .map(k => `${k}=${encodeURIComponent(params[k])}`)
          .join('&');

        const script = document.createElement('script');
        script.src = `${GAS_URL}?${queryString}`;
        
        const timeout = setTimeout(() => {
          cleanUp();
          reject(new Error('Timeout'));
        }, 30000);

        window[callbackName] = function(data) {
          clearTimeout(timeout);
          cleanUp();
          resolve(data);
        };

        function cleanUp() {
          if (script.parentNode) script.parentNode.removeChild(script);
          delete window[callbackName];
        }

        script.onerror = () => {
          clearTimeout(timeout);
          cleanUp();
          reject(new Error('Network error'));
        };

        document.body.appendChild(script);
      });
    }

    // ═══════════════════════════════════════════════════════════════
    // ✅ أدوات مساعدة
    // ═══════════════════════════════════════════════════════════════
    function showToast(msg, type = 'info') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + type;
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function t(key) {
      return (I18N[currentLang] && I18N[currentLang][key]) || I18N['en'][key] || key;
    }

    function changeLanguage(lang) {
      currentLang = lang;
      document.getElementById('langSelector').value = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.textContent = t(key);
      });
      
      // إعادة تحميل التبويب الحالي
      if (document.getElementById('tab-info').classList.contains('active') && centerData) {
        renderInfoTab();
      }
      if (document.getElementById('tab-trips').classList.contains('active')) {
        loadTrips();
      }
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById('tab-' + tabName).classList.add('active');
      document.getElementById('btn-tab-' + tabName).classList.add('active');

      // تحميل البيانات عند الحاجة
      if (tabName === 'trips') {
        loadTrips();
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // ✅ التهيئة (عند فتح الصفحة)
    // ═══════════════════════════════════════════════════════════════
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. قراءة الـ Parameters من الرابط
      const urlParams = new URLSearchParams(window.location.search);
      centerName = urlParams.get('center') || '';
      salesName  = urlParams.get('salesName') || '';
      salesId    = urlParams.get('salesId') || '';
      branchId   = urlParams.get('branchId') || '';
      branchName = urlParams.get('branchName') || '';

      // 2. لغة افتراضية
      currentLang = urlParams.get('lang') || 'en';
      document.getElementById('langSelector').value = currentLang;

      // 3. التحقق من وجود اسم المركز
      if (!centerName) {
        document.getElementById('app').innerHTML = `
          <div class="loading-screen">
            <div style="font-size:50px;">⚠️</div>
            <h2>Center Not Found</h2>
            <p>لم يتم العثور على المركز. يرجى مسح رمز QR صحيح.</p>
          </div>
        `;
        return;
      }

      // 4. تحميل بيانات المركز
      await loadCenterData();
    });

    // ═══════════════════════════════════════════════════════════════
    // ✅ تحميل بيانات المركز
    // ═══════════════════════════════════════════════════════════════
    async function loadCenterData() {
      try {
        const result = await callGAS('getCenterPublicInfo', { centerName });
        
        if (!result || !result.success) {
          throw new Error(result?.message || 'Center not found');
        }
        
        centerData = result.data;
        
        // تحديث الهيدر
        document.getElementById('headerCenterName').textContent = centerData.centerName;
        
        if (centerData.centerLogo) {
          const logoImg = document.getElementById('centerLogo');
          logoImg.src = centerData.centerLogo;
          logoImg.style.display = 'block';
        }

        // عرض Tab 1
        document.getElementById('infoLoading').style.display = 'none';
        document.getElementById('infoContent').style.display = 'block';
        renderInfoTab();
        
      } catch (e) {
        console.error(e);
        document.getElementById('infoLoading').innerHTML = `<div style="color:red; text-align:center;">
          <h3>❌ Failed to load center data</h3>
          <p>${e.message}</p>
        </div>`;
      }
    }

    // (سيتم استكمال الدوال المتبقية في الأجزاء القادمة)
  </script>
</body>
</html>
