<html dir="ltr" lang="en">

  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #0f1f3d; --navy2: #1a3260; --gold: #f5c842; --gold2: #e6b800;
      --bg: #f0f4f8; --card: #ffffff; --text: #1a2540; --text-lt: #5a6a8a;
      --border: #dde4f0; --green: #16a34a; --red: #dc2626; --blue: #2563eb;
      --radius: 16px; --radius-lg: 24px; --shadow: 0 4px 24px rgba(15,31,61,0.08);
      --shadow-lg: 0 12px 32px rgba(15,31,61,0.15); --font: 'Cairo', 'Tajawal', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font); background: var(--navy); color: var(--text); min-height: 100vh; padding: 15px; display: flex; flex-direction: column; align-items: center; }
    #app { width: 100%; max-width: 1000px; background: var(--bg); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden; min-height: 85vh; display: flex; flex-direction: column; position: relative; }
    
    /* Header */
    .header { background: linear-gradient(135deg, var(--navy), var(--navy2)); padding: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; }
    .header-center { display: flex; align-items: center; gap: 12px; }
    .header-logo { width: 55px; height: 55px; background: white; border-radius: 50%; object-fit: contain; border: 2px solid var(--gold); padding: 4px; display: none; }
    .header-title { color: var(--gold); font-size: 22px; font-weight: 800; line-height: 1.2; }
    .header-subtitle { color: rgba(255,255,255,0.7); font-size: 12px; font-weight: 600; }
    .lang-selector { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 12px; border-radius: 20px; font-family: var(--font); font-size: 13px; font-weight: 600; cursor: pointer; outline: none; }
    .lang-selector option { background: var(--navy); color: white; }

    /* Tabs */
    .tabs-nav { display: flex; background: white; border-bottom: 2px solid var(--border); overflow-x: auto; scrollbar-width: none; }
    .tabs-nav::-webkit-scrollbar { display: none; }
    .tab-btn { flex: 1; padding: 15px 10px; background: none; border: none; border-bottom: 3px solid transparent; color: var(--text-lt); font-family: var(--font); font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 80px; }
    .tab-btn.active { color: var(--navy); border-bottom-color: var(--gold); background: #f8fafc; }
    .tab-icon { font-size: 20px; }

    /* Content */
    .content-area { flex: 1; padding: 20px; position: relative; }
    .tab-content { display: none; animation: fadeIn 0.4s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* General */
    .card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 16px; overflow: hidden; }
    .card-body { padding: 18px; }
    .section-title { color: var(--navy); font-size: 16px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .btn { padding: 12px 20px; border: none; border-radius: 30px; font-family: var(--font); font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--navy); color: var(--gold); width: 100%; }
    .btn-gold { background: var(--gold); color: var(--navy); width: 100%; }
    .btn-outline { border: 2px solid var(--navy); color: var(--navy); background: transparent; }

    /* Loading & Toast */
    .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 15px; }
    .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--navy); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--navy); color: white; padding: 12px 24px; border-radius: 30px; font-weight: 700; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: 0.3s; z-index: 9999; opacity: 0; pointer-events: none; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.error { background: var(--red); }
    .toast.success { background: var(--green); }

    /* Forms */
    .fgroup { margin-bottom: 14px; }
    .fgroup label { display: block; font-size: 12px; font-weight: 700; color: var(--text-lt); margin-bottom: 6px; }
    .fc { width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: 10px; font-size: 14px; font-family: var(--font); color: var(--text); background: #fafbfd; outline: none; transition: 0.2s; }
    .fc:focus { border-color: var(--navy); background: white; }

    /* Tab 1 */
    .info-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .info-item { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; }
    .info-item .icon { font-size: 18px; margin-top: 2px; }
    .info-item .text strong { color: var(--navy); display: block; font-size: 12px; }
    .info-item .text span { color: var(--text); font-weight: 600; }
    .rating-stars { color: var(--gold); font-size: 18px; letter-spacing: 2px; }
    .rating-big { font-size: 32px; font-weight: 900; color: var(--navy); }
    .review-card { border-bottom: 1px solid var(--border); padding: 12px 0; }
    .review-card:last-child { border-bottom: none; }
    
    /* Tab 2 */
    .trip-card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 16px; }
    .trip-img {
      width: 100%;
      height: auto;
      max-height: 350px;
      object-fit: contain;
      background: #f0f4f8;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      z-index: 1;
    }
    .trip-img:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      z-index: 9999;
      border-radius: 12px;
    }
    .trip-header { padding: 14px 16px; background: var(--navy); display: flex; justify-content: space-between; align-items: center; }
    .trip-name { color: var(--gold); font-size: 16px; font-weight: 800; }
    .trip-category { color: rgba(255,255,255,0.6); font-size: 12px; }
    .trip-body { padding: 16px; }
    .trip-desc { font-size: 13px; color: var(--text-lt); line-height: 1.6; margin-bottom: 12px; white-space: pre-line; }
    .trip-items { display: flex; flex-direction: column; gap: 8px; }
    .trip-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #f8fafd; border-radius: 8px; font-size: 13px; font-weight: 600; }
    .trip-price { color: var(--green); font-weight: 800; font-size: 15px; }
    .trip-price.zero { color: var(--text-lt); opacity: 0.5; }

    /* Image Viewer Modal */
    .image-viewer-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 99999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      backdrop-filter: blur(5px);
    }
    .image-viewer-modal .close-btn {
      position: absolute;
      top: 20px; right: 30px;
      color: white;
      font-size: 40px;
      cursor: pointer;
      font-weight: bold;
      line-height: 1;
    }
    .image-viewer-modal img {
      max-width: 90%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    @media (max-width: 600px) {
      body { padding: 0; }
      #app { border-radius: 0; min-height: 100vh; }
      .header { padding: 15px; }
      .header-title { font-size: 18px; }
      .tab-btn { font-size: 12px; }
      .tab-icon { font-size: 18px; }
      .content-area { padding: 15px; }
    }
  </style>
</head>

      <!-- Tab 2: Trips -->

        </div>

      </div>

      <!-- Tab 3: Book -->
      <div id="tab-book" class="tab-content">
        <div class="card">
          <div class="card-body">
            <h3 class="section-title" data-i18n="bookTitle">Booking Details</h3>
            
            <div class="fgroup">
              <label data-i18n="lblName">Full Name</label>
              <input type="text" id="bookName" class="fc" placeholder="John Doe" oninput="capitalizeWords(this)">

            </div>
            
            <div class="fgroup">
              <label data-i18n="lblPhone">Phone Number</label>
              <!-- ✅ إضافة رسالة توضيحية أسفل الحقل -->
              <div style="font-size: 11px; color: #e74c3c; margin-bottom: 6px; font-weight: 600;" data-i18n="msgPhoneCode">
                ⚠️ Please include your country code (e.g. +20 for Egypt)
              </div>
              <input type="tel" id="bookPhone" class="fc" placeholder="+201012345678">
            </div>
            
            <div class="fgroup">
              <label data-i18n="lblNationality">Nationality</label>
              <input type="text" id="bookNationality" class="fc" list="portalNationsList" placeholder="Start typing...">
              <datalist id="portalNationsList"></datalist>
            </div>
            
            <div class="fgroup">
              <label data-i18n="lblHotel">Hotel</label>
              <input type="text" id="bookHotel" class="fc" list="portalHotelsList" placeholder="Start typing..." oninput="capitalizeWords(this)">
              <datalist id="portalHotelsList"></datalist>
            </div>
            
            <div class="fgroup">
              <label data-i18n="lblRoom">Room No.</label>
              <input type="text" id="bookRoom" class="fc" placeholder="e.g. 101">
            </div>
            
            <button class="btn btn-primary" onclick="goToBooking()" style="margin-top:10px;" data-i18n="btnProceed">Proceed to Booking</button>
          </div>
        </div>
      </div>

          </div>

        </div>

    // ✅ GAS & Utils
    // ═══════════════════════════════════════════════════════════════
    function callGAS(action, params = {}) {
      return new Promise((resolve, reject) => {
        const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
        params.action = action; params.callback = cbName;
        const qs = Object.keys(params).map(k => `${k}=${encodeURIComponent(params[k])}`).join('&');
        const script = document.createElement('script');
        script.src = `${GAS_URL}?${qs}`;
        const timeout = setTimeout(() => { cleanUp(); reject(new Error('Timeout')); }, 30000);
        window[cbName] = (data) => { clearTimeout(timeout); cleanUp(); resolve(data); };
        function cleanUp() { if (script.parentNode) script.parentNode.removeChild(script); delete window[cbName]; }
        script.onerror = () => { clearTimeout(timeout); cleanUp(); reject(new Error('Network')); };
        document.body.appendChild(script);
      });
    }

    function showToast(msg, type = 'info') {
      const el = document.getElementById('toast');
      el.textContent = msg; el.className = 'toast show ' + type;
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    function getDriveDirectUrl(url) {
      if (!url) return '';
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (match) return 'https://drive.google.com/thumbnail?id=' + match[1] + '&sz=w400';
      return url;
    }

    // ✅ دالة تحويل أول حرف من كل كلمة إلى حرف كبير
    function capitalizeWords(input) {
      let start = input.selectionStart;
      let end = input.selectionEnd;
      let value = input.value;
      
      // تحويل أول حرف من كل كلمة
      value = value.replace(/\b\w/g, function(char) {
        return char.toUpperCase();
      });
      
      input.value = value;
      // إعادة مؤشر الكتابة لمكانه
      input.setSelectionRange(start, end);
    }

    // ═══════════════════════════════════════════════════════════════
    async function submitFeedback(voucher, tripName, date, phone) {
      const overallRating = document.querySelector('input[name="overallRating"]:checked').value;
      const comment = document.getElementById('rateComment').value.trim();
      
      let criteriaRatings = {};
      let tripCriteria = [];
      
      const currentTripData = tripsData.find(t => t.tripName === tripName);
      if (currentTripData && currentTripData.criteria) {
        tripCriteria = currentTripData.criteria.split('\n')
          .map(c => c.replace(/^[_\*\-\s]+/, '').trim())
          .filter(c => c.length > 0);
      }

      tripCriteria.forEach((c, idx) => {
        const selected = document.querySelector(`input[name="crit_${idx}"]:checked`);
        if (selected) {
          criteriaRatings[c] = selected.value;
        }
      });

      const submitBtn = document.querySelector('#fbModal .btn-gold');
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Sending...'; }

      try {
        const res = await callGAS('submitClientFeedback', {
          centerName, 
          voucherNo: voucher, 
          tripName: tripName, 
          tripDate: date, 
          guestPhone: phone, 
          overallRating: overallRating,
          comment: comment, 
          criteriaRatings: JSON.stringify(criteriaRatings),
          recommend: true
        });

        if (res.success) {
          showToast(t('msgThank'), 'success');
          document.getElementById('fbModal').remove();
          loadUserTrips();
        } else {
          showToast(res.message, 'error');
          if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Submit Review'; }
        }
      } catch (e) { 
        showToast(e.message, 'error'); 
        if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Submit Review'; }
      }
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById('tab-' + tabName).classList.add('active');
      document.getElementById('btn-tab-' + tabName).classList.add('active');

      if (tabName === 'trips') loadTrips();
    }
    // ✅ دالة إظهار باقي التقييمات
    function showAllReviews(btn) {
      const hiddenReviews = document.querySelectorAll('.review-item');
      hiddenReviews.forEach(rev => {
        rev.style.display = 'block';
      });
      btn.parentElement.style.display = 'none'; // إخفاء الزر بعد الضغط
    }
       function changeLanguage(lang) {
      currentLang = lang;
      document.getElementById('langSelector').value = lang;
      
      // تغيير اتجاه الصفحة للعربية
      document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      document.documentElement.lang = lang;
      
      // تحديث النصوص
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.getAttribute('data-i18n'));
      });

      if (centerData) renderInfoTab();
      if (document.getElementById('tab-trips').classList.contains('active')) {
        tripsData = []; 
        loadTrips();
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // ✅ دوال عرض الصورة بالحجم الكامل
    // ═══════════════════════════════════════════════════════════════
    function openImageViewer(url) {
      const modal = document.getElementById('imageViewerModal');
      const img = document.getElementById('fullSizeImage');
      if (url && modal && img) {
        img.src = url;
        modal.style.display = 'flex';
      }
    }

    function closeImageViewer() {
      document.getElementById('imageViewerModal').style.display = 'none';
    }
  </script>
</body>
</html>
