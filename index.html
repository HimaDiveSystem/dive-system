<!DOCTYPE html>
<html dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ✅ إضافة الخط ونظام الثيم الموحد -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="ui.js"></script>
  <title>🌊 Dive System | تسجيل الدخول</title>
  <style>
    /* ✅ متغيرات الثيم الموحد */
:root {
  --color-primary: #1e2b4f;
  --color-secondary: #f5c842;
  --color-success: #27ae60;
  --color-danger: #e74c3c;
  --gradient-primary: linear-gradient(135deg, #1e2b4f 0%, #152238 100%);
  --gradient-secondary: linear-gradient(135deg, #f5c842 0%, #e6b800 100%);
  --radius-lg: 16px;
  --radius-xl: 24px;
  --shadow-lg: 0 20px 60px rgba(0,0,0,0.3);
}
    * { margin:0; padding:0; box-sizing:border-box; }
 
      body {
  font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  height: 100vh; display: flex; justify-content: center; align-items: center;
  overflow: hidden; position: relative;
  background: var(--gradient-primary);
}
    .dark-bg {
      position: fixed; inset:0; z-index:0;
      background-image: url('https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=1920&auto=format&fit=crop');
      background-size: cover; background-position: center; background-repeat: no-repeat;
      filter: brightness(0.4) contrast(1.1);
    }
    .container {
      position: relative; z-index:2;
      width: 95%; max-width: 1100px; display: flex; gap:50px;
      align-items: center; justify-content: center; padding: 20px;
    }
    .illustration-side { flex:1; display:flex; flex-direction:column; gap:18px; max-width:420px; }
    .illustration-card {
      background: rgba(255,255,255,0.85); backdrop-filter: blur(8px);
      border-radius:24px; padding:20px; border:1px solid rgba(255,255,255,0.3);
      box-shadow:0 15px 30px rgba(0,0,0,0.2); display:flex; gap:16px; align-items:center; transition:.25s;
    }
    .illustration-card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.95); }
    .illustration-icon {
      width:60px; height:60px; border-radius:50%;
      background: linear-gradient(135deg,#0284c7,#0f2b4b);
      display:flex; align-items:center; justify-content:center;
      font-size:32px; color:white; flex-shrink:0;
    }
    .illustration-text h3 { color:#0b1a2e; font-size:18px; font-weight:600; margin-bottom:4px; }
    .illustration-text p  { color:#1e2b4f; font-size:13px; line-height:1.5; }

    .card {
      width:420px; background:white; border-radius:var(--radius-xl); box-shadow:var(--shadow-lg);
      border:1px solid rgba(255,255,255,0.5);
    }
    .card h2 { text-align:center; margin-bottom:30px; color:#0b1a2e; font-size:32px; font-weight:700; }
    .input-group { margin-bottom:22px; }
    .input-group label { display:block; margin-bottom:6px; color:#0f2b4b; font-weight:500; font-size:14px; }
    .input-group input {
      width:100%; padding:16px 18px; border-radius:14px; border:1px solid #cbd5e1;
      background:#f8fafc; color:#0b1a2e; font-size:16px; transition:.2s; direction:ltr; text-align:left;
    }
    .input-group input:focus { outline:none; border-color:#0284c7; box-shadow:0 0 0 3px rgba(2,132,199,0.2); }

    .checkbox-label {
      display:flex; align-items:center; gap:8px;
      color:#1e2b4f; font-size:14px; margin:16px 0; cursor:pointer; user-select:none;
    }
    .checkbox-label input[type="checkbox"] {
      accent-color:#0284c7; width:16px; height:16px; cursor:pointer; flex-shrink:0;
    }

    .btn-login {
      width:100%; padding:16px; border:none; border-radius:14px;
     background: var(--gradient-primary);
color: var(--color-secondary);
      color:white; font-size:18px; font-weight:bold; cursor:pointer;
      transition:.25s; box-shadow:0 8px 20px rgba(2,132,199,0.3);
    }
    .btn-login:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 12px 28px rgba(2,132,199,0.5); }
    .btn-login:disabled { opacity:0.65; cursor:not-allowed; transform:none; }

    .custom-modal {
      display:none; position:fixed; top:0; left:0; width:100%; height:100%;
      align-items:center; justify-content:center; z-index:10000;
      background:rgba(0,0,0,0.5); backdrop-filter:blur(5px);
    }
    .modal-content {
      background:white; border-radius:28px; padding:35px 30px;
      max-width:380px; width:90%; text-align:center;
      box-shadow:0 25px 60px rgba(0,0,0,0.3);
    }
    .modal-icon { font-size:48px; margin-bottom:14px; }
    .modal-content h3 { color:#0b1a2e; font-size:17px; line-height:1.6; margin-bottom:20px; }
    .modal-btn {
      background: linear-gradient(135deg,#0f2b4b,#0284c7);
      color:white; border:none; padding:13px 45px;
      border-radius:40px; font-size:16px; font-weight:600; cursor:pointer; transition:.2s;
    }
    .modal-btn:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(2,132,199,0.4); }

    .loading-overlay {
      display:none; position:fixed; top:0; left:0; width:100%; height:100%;
      align-items:center; justify-content:center; z-index:10000;
      background:rgba(0,0,0,0.5); backdrop-filter:blur(5px);
    }
    .loading-container {
      background:white; padding:28px 36px; border-radius:60px;
      display:flex; align-items:center; gap:16px;
      box-shadow:0 20px 50px rgba(0,0,0,0.2);
    }
    .spinner {
      width:28px; height:28px; border:4px solid #e2e8f0;
      border-top-color:#0284c7; border-radius:50%;
      animation:spin .7s linear infinite; flex-shrink:0;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loading-text { color:#0b1a2e; font-size:16px; font-weight:600; }

    @media (max-width:900px) {
      .container { flex-direction:column; }
      .illustration-side { order:2; flex-direction:row; flex-wrap:wrap; }
      .card { order:1; width:100%; }
    }
    @media (max-width:480px) {
      .card { padding:32px 24px; }
      .illustration-side { display:none; }
    }
  </style>
</head>
<body>

<div class="dark-bg"></div>

<div class="container">

  <div class="illustration-side">
    <div class="illustration-card">
      <div class="illustration-icon">📊</div>
      <div class="illustration-text">
        <h3>نظام إدارة متكامل</h3>
        <p>تحكم كامل في المراكز والفروع والموظفين</p>
      </div>
    </div>
    <div class="illustration-card">
      <div class="illustration-icon">💰</div>
      <div class="illustration-text">
        <h3>فواتير وميزانيات</h3>
        <p>إصدار فواتير دقيقة ومتابعة الميزانيات</p>
      </div>
    </div>
    <div class="illustration-card">
      <div class="illustration-icon">📈</div>
      <div class="illustration-text">
        <h3>تقارير وتحليلات</h3>
        <p>تقارير مبيعات وعمولات وأرباح</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>🌊  نظام إدارة متكامل</h2>

    <div class="input-group">
      <label>البريد الإلكتروني</label>
      <input type="email" id="email" placeholder="example@domain.com" autocomplete="username">
    </div>

    <div class="input-group">
      <label>كلمة المرور</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <label class="checkbox-label">
      <input type="checkbox" id="showPass">
      إظهار كلمة المرور
    </label>

    <button class="btn-login" id="loginBtn" onclick="login()">تسجيل الدخول</button>
  </div>

</div>

<!-- مودال التنبيه -->
<div id="customAlertModal" class="custom-modal">
  <div class="modal-content">
    <div class="modal-icon" id="alertIcon">ℹ️</div>
    <h3 id="alertMessage"></h3>
    <button class="modal-btn" id="alertOk">موافق</button>
  </div>
</div>

<!-- شاشة التحميل -->
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-container">
    <div class="spinner"></div>
    <span class="loading-text">جاري التحقق...</span>
  </div>
</div>
<script src="config.js"></script>
<script src="session.js"></script>
<script>
  // ============================================================
// ✅ API - نسخة محسّنة للاتصال بالخادم (تعمل على الهاتف)
// ============================================================
const API = {
    async get(action, params = {}) {
        // ✅ بناء URL
        const url = new URL(CONFIG.GAS_URL);
        url.searchParams.set('action', action);
        url.searchParams.set('_t', Date.now());
        Object.entries(params).forEach(([k, v]) => {
            if (v !== undefined && v !== null) {
                url.searchParams.set(k, String(v));
            }
        });

        console.log('📡 API.get - URL:', url.toString());

        // ✅ محاولة 1: fetch (مع إعدادات CORS)
        try {
            const response = await fetch(url.toString(), {
                method: 'GET',
                mode: 'cors',
                cache: 'no-cache',
                headers: {
                    'Accept': 'application/json'
                }
            });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const text = await response.text();
            console.log('📡 API.get - response text:', text.substring(0, 200));
            
            // ✅ محاولة parse JSON
            try {
                return JSON.parse(text);
            } catch(e) {
                // ✅ إذا كان الرد JSONP (يبدأ بـ callback)
                const jsonpMatch = text.match(/\((.+)\)$/);
                if (jsonpMatch) {
                    return JSON.parse(jsonpMatch[1]);
                }
                throw new Error('Invalid JSON response');
            }
        } catch(fetchError) {
            console.warn('⚠️ fetch failed, trying JSONP:', fetchError.message);
            
            // ✅ محاولة 2: JSONP (حل بديل للهاتف)
            return this.jsonp(action, params);
        }
    },

    // ✅ JSONP مع timeout أطول للهاتف
    jsonp(action, params = {}) {
        return new Promise((resolve, reject) => {
            const callbackName = 'cb_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            const url = new URL(CONFIG.GAS_URL);
            url.searchParams.set('action', action);
            url.searchParams.set('callback', callbackName);
            url.searchParams.set('_t', Date.now());
            Object.entries(params).forEach(([k, v]) => {
                if (v !== undefined && v !== null) {
                    url.searchParams.set(k, String(v));
                }
            });

            console.log('📡 API.jsonp - URL:', url.toString());

            // ✅ تعيين الدالة callback
            window[callbackName] = function(data) {
                console.log('📡 API.jsonp - callback received');
                delete window[callbackName];
                if (script.parentNode) {
                    script.parentNode.removeChild(script);
                }
                resolve(data);
            };

            // ✅ إنشاء script tag
            const script = document.createElement('script');
            script.src = url.toString();
            script.async = true;
            
            // ✅ Timeout أطول للهاتف (30 ثانية)
            const timeoutId = setTimeout(() => {
                console.error('❌ API.jsonp - timeout after 30s');
                delete window[callbackName];
                if (script.parentNode) {
                    script.parentNode.removeChild(script);
                }
                reject(new Error('انتهى وقت الاتصال بالخادم'));
            }, 30000);

            script.onerror = function() {
                console.error('❌ API.jsonp - script load error');
                clearTimeout(timeoutId);
                delete window[callbackName];
                if (script.parentNode) {
                    script.parentNode.removeChild(script);
                }
                reject(new Error('فشل تحميل السكربت'));
            };

            script.onload = function() {
                clearTimeout(timeoutId);
            };

            document.head.appendChild(script);
        });
    },

    // ✅ دالة تسجيل الدخول
    async login(email, password) {
        console.log('📡 API.login - START:', email);
        try {
            // ✅ محاولة fetch أولاً
            const result = await this.get('login', { email, password });
            console.log('📡 API.login - result:', result);
            return result;
        } catch(e) {
            console.warn('⚠️ API.login - fetch failed, trying JSONP directly');
            // ✅ محاولة JSONP مباشرة
            try {
                const result = await this.jsonp('login', { email, password });
                console.log('📡 API.login - JSONP result:', result);
                return result;
            } catch(jsonpError) {
                console.error('❌ API.login - all methods failed:', jsonpError);
                return { success: false, message: 'تعذّر الاتصال بالخادم. تحقق من رابط Web App.' };
            }
        }
    }
};

  // ============================================================
  // إظهار / إخفاء كلمة المرور
  // ============================================================
  document.getElementById('showPass').addEventListener('change', function() {
    document.getElementById('password').type = this.checked ? 'text' : 'password';
  });

  // Enter للتسجيل
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !document.getElementById('loginBtn').disabled) login();
  });

  // ============================================================
  // دالة تسجيل الدخول (باستخدام Session)
  // ============================================================
async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!email || !password) {
        showAlert('يرجى إدخال البريد الإلكتروني وكلمة المرور', '⚠️');
        return;
    }

    setLoading(true);

    try {
        const result = await API.login(email, password);

        if (!result?.success) {
            showAlert(result?.message || 'بيانات الدخول غير صحيحة', '❌');
            return;
        }

        // ✅ ✅ ✅ التأكد من وجود صلاحيات قبل الحفظ
        if (!result.user.permissions || result.user.permissions.length === 0) {
            console.warn('⚠️ لا توجد صلاحيات للمستخدم، جاري جلب الصلاحيات الافتراضية...');
            // ✅ جلب الصلاحيات الافتراضية حسب نوع المستخدم
            const defaultPerms = getDefaultPermissionsForType(result.user.type);
            result.user.permissions = defaultPerms;
        }

        // ✅ حفظ المستخدم
        Session.save(result.user);
        
        // ✅ ✅ ✅ حفظ في localStorage.userPermissions كنسخة احتياطية
        localStorage.setItem('userPermissions', JSON.stringify(result.user.permissions));
        
        // ✅ التوجيه
        const page = CONFIG.DASHBOARD_PAGES[result.user?.type] || 'Dashboard.html';
        window.location.href = page;

    } catch(err) {
        console.error('Login error:', err);
        showAlert('تعذّر الاتصال بالخادم.\nتحقق من رابط Web App.', '❌');
    } finally {
        setLoading(false);
    }
}

// ✅ دالة مساعدة للصلاحيات الافتراضية
function getDefaultPermissionsForType(userType) {
    const permissionsMap = {
        'Admin': ['ManageAll', 'ManageCenters', 'ManageBranches', 'ManageUsers', 'ManagePermissions'],
        'Owner': ['ViewBranches', 'ViewStaff', 'ViewInvoices', 'ViewSalesReport', 'ViewCashRegister'],
        'Accountant': ['ViewCustomersSuppliers', 'AddCustomerSupplier', 'EditCustomerSupplier', 'DeleteCustomerSupplier', 'UpdateCustomerPrices'],
        'Sales': ['CreateInvoice', 'ViewInvoices', 'ViewBookingsToday'],
        'Customer': ['ViewCustomerAccount', 'ViewCustomerInvoices']
    };
    return permissionsMap[userType] || [];
}
  // ============================================================
  // دوال مساعدة
  // ============================================================
  function setLoading(show) {
    document.getElementById('loginBtn').disabled            = show;
    document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
  }

  function showAlert(message, icon) {
    document.getElementById('alertMessage').textContent = message;
    document.getElementById('alertIcon').textContent    = icon || 'ℹ️';
    const modal = document.getElementById('customAlertModal');
    modal.style.display = 'flex';
    document.getElementById('alertOk').onclick = () => modal.style.display = 'none';
  }

  // ============================================================
  // تطبيق الثيم عند تحميل الصفحة
  // ============================================================
  document.addEventListener('DOMContentLoaded', function() {
    if (typeof Theme !== 'undefined' && Theme.applyToPage) {
      Theme.applyToPage();
    }
    // ✅ التحقق من وجود جلسة سابقة - لا نوجه تلقائياً
    // المستخدم يبقى في صفحة الدخول
  });
</script>
</body>
</html>
