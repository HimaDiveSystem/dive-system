<!DOCTYPE html>
<html dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <title>🌊 Dive System | تسجيل الدخول</title>
  <style>
    :root {
      --color-primary: #1e2b4f;
      --color-secondary: #f5c842;
      --gradient-primary: linear-gradient(135deg, #1e2b4f 0%, #152238 100%);
      --radius-xl: 24px;
      --shadow-lg: 0 20px 60px rgba(0,0,0,0.3);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      height: 100vh; display: flex; justify-content: center; align-items: center;
      background: var(--gradient-primary);
    }
    .card {
      width: 420px;
      max-width: 95%;
      background: white;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: 40px 32px;
    }
    .card h2 {
      text-align: center;
      color: #0b1a2e;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 30px;
    }
    .input-group { margin-bottom: 20px; }
    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: #0f2b4b;
      font-weight: 500;
      font-size: 14px;
    }
    .input-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #0b1a2e;
      font-size: 16px;
      transition: .2s;
      direction: ltr;
      text-align: left;
    }
    .input-group input:focus {
      outline: none;
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2,132,199,0.2);
    }
    .btn-login {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #1e2b4f 0%, #152238 100%);
      color: #f5c842;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: .25s;
    }
    .btn-login:hover:not(:disabled) { transform: translateY(-2px); }
    .btn-login:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
    .error-msg {
      color: #dc2626;
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
      display: none;
    }
    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }
    .loading-container {
      background: white;
      padding: 28px 36px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 4px solid #e2e8f0;
      border-top-color: #0284c7;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #0b1a2e; font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>

<div class="card">
  <h2>🌊 Dive System</h2>

  <div class="input-group">
    <label>البريد الإلكتروني</label>
    <input type="email" id="email" placeholder="example@domain.com">
  </div>

  <div class="input-group">
    <label>كلمة المرور</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>

  <button class="btn-login" id="loginBtn" onclick="login()">تسجيل الدخول</button>
  <div id="errorMsg" class="error-msg"></div>
</div>

<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-container">
    <div class="spinner"></div>
    <span class="loading-text">جاري التحقق...</span>
  </div>
</div>

<script>
// ============================================================
// ✅ CONFIG مباشر (بدون ملف خارجي لتجنب مشاكل التحميل)
// ============================================================
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbzjv8iFYX6vm_3hsbKEHWRLRhFoGISm6TSQcDINgkkff14yjpoBY-rYGCqJFlpF5u3g/exec',
  DASHBOARD_PAGES: {
    Admin: 'Dashboard.html',
    Owner: 'OwnerDashboard.html',
    Sales: 'SalesDashboard.html',
    Accountant: 'AccountantDashboard.html',
    Customer: 'CustomerDashboard.html'
  }
};

// ============================================================
// ✅ Session مبسط (بدون ملف خارجي)
// ============================================================
const Session = {
  save(user) {
    try {
      const dataToStore = {
        user: user,
        expiry: Date.now() + (24 * 60 * 60 * 1000)
      };
      localStorage.setItem('currentUser', JSON.stringify(dataToStore));
      sessionStorage.setItem('currentUser', JSON.stringify(user));
      if (user.permissions) {
        localStorage.setItem('userPermissions', JSON.stringify(user.permissions));
      }
      console.log('✅ Session.save - user saved:', user.name);
    } catch(e) {
      console.error('Session.save error:', e);
    }
  },
  
  getUser() {
    try {
      const stored = localStorage.getItem('currentUser');
      if (stored) {
        const data = JSON.parse(stored);
        if (data.expiry && Date.now() < data.expiry) {
          const user = data.user || {};
          // استعادة الصلاحيات
          if (!user.permissions || user.permissions.length === 0) {
            const permStored = localStorage.getItem('userPermissions');
            if (permStored) {
              user.permissions = JSON.parse(permStored);
            }
          }
          return user;
        }
      }
      return null;
    } catch(e) {
      console.error('Session.getUser error:', e);
      return null;
    }
  }
};

// ============================================================
// ✅ API - باستخدام JSONP فقط (يعمل على الهاتف)
// ============================================================
const API = {
  jsonp(action, params) {
    return new Promise((resolve, reject) => {
      const callbackName = 'cb_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
      const url = new URL(CONFIG.GAS_URL);
      url.searchParams.set('action', action);
      url.searchParams.set('callback', callbackName);
      url.searchParams.set('_t', Date.now());
      
      Object.entries(params || {}).forEach(([k, v]) => {
        if (v !== undefined && v !== null) {
          url.searchParams.set(k, String(v));
        }
      });

      console.log('📡 JSONP URL:', url.toString());

      window[callbackName] = function(data) {
        console.log('📡 JSONP response:', data);
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        resolve(data);
      };

      const script = document.createElement('script');
      script.src = url.toString();
      script.async = true;
      
      const timeoutId = setTimeout(() => {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        reject(new Error('انتهى وقت الاتصال'));
      }, 30000);

      script.onerror = function() {
        clearTimeout(timeoutId);
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        reject(new Error('فشل تحميل السكربت'));
      };

      script.onload = function() {
        clearTimeout(timeoutId);
      };

      document.head.appendChild(script);
    });
  },

  async login(email, password) {
    try {
      return await this.jsonp('login', { email, password });
    } catch(e) {
      console.error('❌ Login error:', e);
      return { success: false, message: 'تعذّر الاتصال بالخادم. تحقق من رابط Web App.' };
    }
  }
};

// ============================================================
// ✅ دالة تسجيل الدخول
// ============================================================
async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  const errorMsg = document.getElementById('errorMsg');

  errorMsg.style.display = 'none';
  document.getElementById('loginBtn').disabled = true;
  document.getElementById('loadingOverlay').style.display = 'flex';

  if (!email || !password) {
    errorMsg.textContent = 'يرجى إدخال البريد الإلكتروني وكلمة المرور';
    errorMsg.style.display = 'block';
    document.getElementById('loginBtn').disabled = false;
    document.getElementById('loadingOverlay').style.display = 'none';
    return;
  }

  try {
    const result = await API.login(email, password);
    console.log('📡 Login result:', result);

    if (!result?.success) {
      errorMsg.textContent = result?.message || 'بيانات الدخول غير صحيحة';
      errorMsg.style.display = 'block';
      return;
    }

    // ✅ حفظ المستخدم
    Session.save(result.user);
    
    // ✅ التوجيه
    const page = CONFIG.DASHBOARD_PAGES[result.user?.type] || 'Dashboard.html';
    window.location.href = page;

  } catch(err) {
    console.error('❌ Login error:', err);
    errorMsg.textContent = 'تعذّر الاتصال بالخادم. تحقق من رابط Web App.';
    errorMsg.style.display = 'block';
  } finally {
    document.getElementById('loginBtn').disabled = false;
    document.getElementById('loadingOverlay').style.display = 'none';
  }
}

// Enter للتسجيل
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') login();
});
</script>
</body>
</html>
