<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قائمة الدخل (التقرير المالي)</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="ui.js"></script>
  <script src="config.js"></script>
  <script src="session.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --navy: #0f1f3d; --gold: #f5c842; --bg: #f0f4f8; --card: #fff; --border: #dde4f0; --text: #1a2540; --text-lt: #5a6a8a;
      --green: #16a34a; --red: #dc2626; --blue: #2563eb;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); }
    
    .header { background: linear-gradient(135deg, var(--navy), #1a3260); color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
    .header h2 { color: var(--gold); font-size: 20px; font-weight: 800; }
    .back-btn { background: transparent; border: 2px solid rgba(255,255,255,.3); color: white; padding: 6px 15px; border-radius: 40px; cursor: pointer; font-weight: 700; transition: all .2s; }
    .back-btn:hover { border-color: var(--gold); color: var(--gold); }
    
    .page { max-width: 900px; margin: 20px auto; padding: 0 15px; }
    .filter-card { background: var(--card); border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; gap: 15px; align-items: flex-end; margin-bottom: 25px; flex-wrap: wrap; }
    .fg { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 150px; }
    .fg label { font-size: 12px; font-weight: 700; color: var(--text-lt); }
    .fc { padding: 10px; border: 2px solid var(--border); border-radius: 8px; font-family: inherit; }
    .btn { background: var(--navy); color: var(--gold); border: none; padding: 10px 25px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: all .2s; }
    .btn:hover { background: #1a3260; }
    .btn-print { background: #e2e8f0; color: var(--navy); }
    
    /* Income Statement Table */
    .statement { background: var(--card); border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; margin-bottom: 25px; }
    .stmt-header { background: var(--navy); color: var(--gold); padding: 15px 20px; font-size: 18px; font-weight: 800; text-align: center; }
    .stmt-section { padding: 20px; border-bottom: 2px solid var(--border); }
    .stmt-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--border); font-size: 15px; }
    .stmt-row:last-child { border-bottom: none; }
    .stmt-row.bold { font-weight: 800; font-size: 17px; padding-top: 15px; }
    .stmt-row.total { background: #eff6ff; padding: 15px; border-radius: 8px; margin-top: 10px; border: 1px solid #bfdbfe; }
    .stmt-row.grand-total { background: var(--navy); color: white; padding: 20px; border-radius: 8px; margin-top: 15px; font-size: 20px; }
    .amount { font-family: monospace; font-size: 16px; direction: ltr; }
    .amount.pos { color: var(--green); }
    .amount.neg { color: var(--red); }
    
    .chart-box { background: var(--card); border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); height: 350px; margin-bottom: 25px; }
  </style>
</head>
<body>
  <div class="header">
    <h2>📄 قائمة الدخل المالي</h2>
    <div>
      <span id="userName" style="margin-left:15px; font-size:14px;"></span>
      <button class="back-btn" onclick="goBack()">← رجوع</button>
    </div>
  </div>

  <div class="page">
    <div class="filter-card">
      <div class="fg"><label>من تاريخ</label><input type="date" class="fc" id="fromDate"></div>
      <div class="fg"><label>إلى تاريخ</label><input type="date" class="fc" id="toDate"></div>
      <button class="btn" onclick="loadReport()">🔍 عرض</button>
      <button class="btn btn-print" onclick="window.print()">🖨️ طباعة</button>
    </div>

    <div id="content" style="text-align:center; padding:50px; color:var(--text-lt);">جاري التحميل...</div>
  </div>

  <script>
    let currentUser = null;

    function fmt(n) { return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof Theme !== 'undefined' && Theme.applyToPage) Theme.applyToPage();
      if (!Session.checkValidity()) return;
      currentUser = Session.getUser();
      if (!currentUser) return;
      document.getElementById('userName').innerText = currentUser.name;

      const today = new Date();
      const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
      document.getElementById('fromDate').value = monthStart.toISOString().split('T')[0];
      document.getElementById('toDate').value = today.toISOString().split('T')[0];
      
      loadReport();
    });

    async function loadReport() {
      const fromDate = document.getElementById('fromDate').value;
      const toDate = document.getElementById('toDate').value;
      
      document.getElementById('content').innerHTML = '<div style="text-align:center; padding:50px;">⏳ جاري الحساب...</div>';

      try {
        const res = await callGAS('getDailyFinancialReport', { fromDate, toDate, centerName: currentUser.centerName });
        if (!res.success) throw new Error(res.message);
        render(res);
      } catch (e) {
        document.getElementById('content').innerHTML = `<div style="text-align:center; padding:50px; color:var(--red);">❌ ${e.message}</div>`;
      }
    }

    function render(r) {
      const s = r.summary;
      const rev = r.details.revenue;
      const cost = r.details.costs;

      let html = `
        <div class="statement">
          <div class="stmt-header">
            قائمة الدخل للفترة من ${r.period.from} إلى ${r.period.to}
          </div>
          
          <!-- 1. الإيرادات -->
          <div class="stmt-section">
            <div class="stmt-row bold">الإيرادات (Revenue)</div>
            <div class="stmt-row"><span>إجمالي المبيعات (Actual Price)</span> <span class="amount pos">${fmt(rev.actualLE)} LE</span></div>
            <div style="padding-right:20px; font-size:13px; color:var(--text-lt);">
              <div class="stmt-row"><span>- المحصل النقدي (Paid)</span> <span class="amount">${fmt(rev.paidLE)} LE</span></div>
              <div class="stmt-row"><span>- المتبقي (Rest)</span> <span class="amount">${fmt(rev.restLE)} LE</span></div>
            </div>
            <div class="stmt-row" style="margin-top:10px; color:var(--text-lt);"><span>إيرادات غير محققة (Pending)</span> <span class="amount">${fmt(rev.pendingLE)} LE</span></div>
          </div>

          <!-- 2. التكاليف والمصروفات -->
          <div class="stmt-section">
            <div class="stmt-row bold">التكاليف والمصروفات (Costs & Expenses)</div>
            <div class="stmt-row"><span>تكلفة تنفيذ الرحلات</span> <span class="amount neg">${fmt(cost.tripCostsLE)} LE</span></div>
            <div class="stmt-row"><span>رسوم إلزامية (Mandatory Fees)</span> <span class="amount neg">${fmt(cost.mandatoryFeesLE)} LE</span></div>
            <div class="stmt-row"><span>تكاليف منفذين خارجيين</span> <span class="amount neg">${fmt(cost.externalTripsLE)} LE</span></div>
            <div class="stmt-row"><span>تكاليف الموظفين (مرتبات + عمولات)</span> <span class="amount neg">${fmt(cost.staffCostsLE)} LE</span></div>
            <div class="stmt-row"><span>مصروفات تشغيلية وإيجارات</span> <span class="amount neg">${fmt(cost.operationalLE)} LE</span></div>
            <div class="stmt-row"><span>استردادات (Refunds)</span> <span class="amount neg">${fmt(cost.refundsLE)} LE</span></div>
            <div class="stmt-row total"><span>إجمالي التكاليف</span> <span class="amount neg bold">${fmt(s.totalCostsLE)} LE</span></div>
          </div>

          <!-- 3. صافي الربح -->
          <div class="stmt-row grand-total">
            <span>صافي الربح (Net Profit)</span>
            <span class="amount" style="color: ${s.netProfitLE >= 0 ? '#4ade80' : '#f87171'}">${fmt(s.netProfitLE)} LE</span>
          </div>
          <div class="stmt-row" style="justify-content:center; color:var(--text-lt); font-size:14px; border:none; margin-top:10px;">
            هامش الربح: <strong style="color:var(--navy); margin-left:5px;">${fmt(s.profitMargin)}%</strong>
          </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
          <div class="chart-box"><canvas id="chartRev"></canvas></div>
          <div class="chart-box"><canvas id="chartCost"></canvas></div>
        </div>
      `;

      document.getElementById('content').innerHTML = html;

      // Charts
      Chart.defaults.color = '#5a6a8a';
      Chart.defaults.font.family = 'Cairo';
      
      new Chart(document.getElementById('chartRev'), {
        type: 'doughnut',
        data: {
          labels: ['محصل', 'متبقي', 'تحت التنفيذ'],
          datasets: [{ data: [rev.paidLE, rev.restLE, rev.pendingLE], backgroundColor: ['#16a34a', '#f59e0b', '#94a3b8'] }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' }, title: { display: true, text: 'تحليل الإيرادات' } } }
      });

      new Chart(document.getElementById('chartCost'), {
        type: 'doughnut',
        data: {
          labels: ['تنفيذ رحلات', 'رسوم', 'موظفين', 'تشغيلية'],
          datasets: [{ data: [cost.tripCostsLE, cost.mandatoryFeesLE, cost.staffCostsLE, cost.operationalLE], backgroundColor: ['#ef4444', '#dc2626', '#8b5cf6', '#3b82f6'] }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' }, title: { display: true, text: 'تحليل التكاليف' } } }
      });
    }

    function goBack() { window.location.href = currentUser?.type === 'Accountant' ? 'AccountantDashboard.html' : 'Dashboard.html'; }
  </script>
</body>
</html>
