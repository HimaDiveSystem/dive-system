<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes">
  <title>التقرير المالي اليومي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <script src="ui.js"></script>
  <script src="config.js"></script>
  <script src="session.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --navy: #0f1f3d; --navy2: #1a3260; --gold: #f5c842; --gold2: #e6b800;
      --blue: #2563eb; --green: #16a34a; --red: #dc2626; --purple: #7c3aed;
      --bg: #f0f4f8; --card: #fff; --border: #dde4f0; --text: #1a2540; --text-lt: #5a6a8a;
      --radius: 16px; --shadow: 0 4px 24px rgba(15,31,61,.10);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    
    .header { background: linear-gradient(135deg, var(--navy), var(--navy2)); color: white; padding: 13px 22px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(15,31,61,.25); flex-wrap: wrap; gap: 10px; }
    .header h2 { color: var(--gold); font-size: 18px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .user-chip { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); border-radius: 40px; padding: 4px 13px; color: white; font-size: 12px; font-weight: 600; }
    .back-btn { background: transparent; border: 2px solid rgba(255,255,255,.3); color: white; padding: 4px 13px; border-radius: 40px; cursor: pointer; font-weight: 700; font-size: 12px; font-family: 'Cairo', sans-serif; transition: all .2s; }
    .back-btn:hover { border-color: var(--gold); color: var(--gold); }
    
    .page { max-width: 1200px; margin: 0 auto; padding: 20px 16px 50px; }
    .filter-card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 18px; margin-bottom: 18px; }
    .fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
    .fg { display: flex; flex-direction: column; gap: 5px; }
    .fg label { font-size: 11px; font-weight: 700; color: var(--text-lt); text-transform: uppercase; letter-spacing: .4px; }
    .fc { padding: 8px 12px; border: 2px solid var(--border); border-radius: 10px; font-size: 13px; font-family: 'Cairo', sans-serif; color: var(--text); background: white; height: 40px; }
    .fc:focus { border-color: var(--blue); outline: none; }
    .fbtn { padding: 9px 22px; border: none; border-radius: 40px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: 'Cairo', sans-serif; transition: all .2s; display: flex; align-items: center; gap: 6px; }
    .fbtn-run { background: linear-gradient(135deg, var(--navy), var(--navy2)); color: var(--gold); }
    
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .card { background: linear-gradient(135deg, #1e293b, #0f172a); padding: 20px; border-radius: 12px; border: 1px solid #334155; color: #fff; }
    .card .label { font-size: 12px; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
    .card .value { font-size: 24px; font-weight: 800; }
    .card.revenue .value { color: #10b981; }
    .card.costs .value { color: #ef4444; }
    .card.profit .value { color: #3b82f6; }
    .card.margin .value { color: #a78bfa; }

    .section { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .section-title { font-size: 16px; font-weight: 700; color: var(--navy); margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #f1f5f9; padding: 10px; text-align: right; color: var(--text-lt); font-weight: 600; }
    td { padding: 10px; border-bottom: 1px solid var(--border); }
    tr:hover td { background: #f8fafc; }
    .positive { color: var(--green); font-weight: 700; }
    .negative { color: var(--red); font-weight: 700; }
    .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .chart-box { background: #fff; border-radius: 12px; padding: 20px; border: 1px solid var(--border); box-shadow: var(--shadow); height: 350px; }
    .loading { text-align: center; padding: 50px; color: var(--text-lt); }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    @media (max-width: 900px) { .chart-grid { grid-template-columns: 1fr; } }
    @media print { .header, .filter-card, .user-chip, .back-btn { display: none !important; } body { background: #fff; } .card, .section { box-shadow: none; border: 1px solid #ccc; } }
  </style>
</head>
<body>

  <div class="header">
    <h2>🧾 التقرير المالي اليومي</h2>
    <div class="header-right">
      <span class="user-chip" id="userNameDisplay">جاري التحميل...</span>
      <button class="back-btn" onclick="goBack()">← رجوع</button>
    </div>
  </div>

  <div class="page">
    <div class="filter-card">
      <div class="fgrid">
        <div class="fg"><label>من تاريخ</label><input type="date" class="fc" id="fromDate"></div>
        <div class="fg"><label>إلى تاريخ</label><input type="date" class="fc" id="toDate"></div>
        <div style="display:flex; align-items:flex-end; gap:10px;">
          <button class="fbtn fbtn-run" onclick="loadReport()">🔍 عرض التقرير</button>
          <button class="fbtn" style="background:#e2e8f0; color:#0f1f3d;" onclick="window.print()">🖨️ طباعة</button>
        </div>
      </div>
    </div>

    <div id="content">
      <div class="loading"><div class="spinner"></div>جاري تحميل البيانات...</div>
    </div>
  </div>

  <script>
    let currentUser = null;

    function fmt(n) {
      if (n === undefined || n === null) return '0.00';
      return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof Theme !== 'undefined' && Theme.applyToPage) {
        Theme.applyToPage();
        Theme.setPageTitle('التقرير المالي اليومي');
      }

      if (!Session.checkValidity()) return;
      currentUser = Session.getUser();
      if (!currentUser) return;

      document.getElementById('userNameDisplay').textContent = currentUser.name || 'User';

      const today = new Date();
      const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
      const formatForInput = (d) => {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      };

      document.getElementById('fromDate').value = formatForInput(monthStart);
      document.getElementById('toDate').value = formatForInput(today);

      loadReport();
    });

    async function loadReport() {
      const fromDate = document.getElementById('fromDate').value;
      const toDate = document.getElementById('toDate').value;
      if (!fromDate || !toDate) return alert('اختر التاريخين');

      document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div>جاري حساب التقرير...</div>';

      try {
        const res = await callGAS('getDailyFinancialReport', {
          fromDate: fromDate,
          toDate: toDate,
          centerName: currentUser.centerName
        });

        if (!res.success) {
          document.getElementById('content').innerHTML = `<div class="loading" style="color:var(--red);">❌ ${res.message}</div>`;
          return;
        }

        renderReport(res);
      } catch (e) {
        document.getElementById('content').innerHTML = `<div class="loading" style="color:var(--red);">❌ خطأ في الاتصال: ${e.message}</div>`;
      }
    }

    function renderReport(r) {
      const s = r.summary;
      const rv = r.revenue;
      const cs = r.costs;

      let html = '';

      html += `<div style="text-align:center; margin-bottom:20px; font-weight:700; color:var(--text-lt);">
        الفترة: من <b style="color:var(--navy)">${r.period.from}</b> إلى <b style="color:var(--navy)">${r.period.to}</b>
      </div>`;

      html += `<div class="cards">
        <div class="card revenue"><div class="label">إجمالي الإيرادات</div><div class="value">${fmt(s.totalRevenueLE)} LE</div></div>
        <div class="card costs"><div class="label">إجمالي التكاليف</div><div class="value">${fmt(s.totalCostsLE)} LE</div></div>
        <div class="card profit"><div class="label">صافي الربح</div><div class="value">${fmt(s.netProfitLE)} LE</div></div>
        <div class="card margin"><div class="label">هامش الربح</div><div class="value">${fmt(s.profitMargin)} %</div></div>
      </div>`;

      html += `<div class="chart-grid">
        <div class="chart-box"><canvas id="chartRevenue"></canvas></div>
        <div class="chart-box"><canvas id="chartCosts"></canvas></div>
      </div>`;

      // 1. الإيرادات
      html += `<div class="section"><div class="section-title">1. الإيرادات المحققة (فواتير مؤكدة)</div>
        <table><thead><tr><th>الفاتورة</th><th>التاريخ</th><th>الرحلة</th><th>العميل</th><th>السيلز</th><th>العملة</th><th>Actual Price</th><th>Actual LE</th><th>Payment LE</th></tr></thead><tbody>`;
      rv.confirmed.list.forEach(inv => {
        html += `<tr><td>${inv.voucherNo}</td><td>${inv.activeDate}</td><td>${inv.trip}</td><td>${inv.guestName}</td><td>${inv.salesName}</td><td>${inv.currency}</td>
          <td>${fmt(inv.actualPrice)}</td><td>${fmt(inv.actualLE)}</td><td class="positive">${fmt(inv.paymentPriceLE)}</td></tr>`;
      });
      html += `<tr style="background:#f8fafc; font-weight:700"><td colspan="7">الإجمالي (${rv.confirmed.count} فاتورة)</td><td>${fmt(rv.confirmed.actualLE)}</td><td class="positive">${fmt(rv.confirmed.paidLE)}</td></tr>`;
      html += `</tbody></table></div>`;

      // 2. تحت التنفيذ
      if (rv.pending.count > 0) {
        html += `<div class="section"><div class="section-title" style="color:#d97706;">2. إيرادات غير محققة (تحت التنفيذ - Pending)</div>
          <div style="color:#92400e; margin-bottom:10px; font-size:13px; font-weight:700;">⚠️ هذه أرباح متوقعة لم تُحقق بعد</div>
          <table><thead><tr><th>الفاتورة</th><th>التاريخ</th><th>الرحلة</th><th>العميل</th><th>Actual LE</th><th>Paid LE</th><th>Rest</th></tr></thead><tbody>`;
        rv.pending.list.forEach(inv => {
          html += `<tr><td>${inv.voucherNo}</td><td>${inv.activeDate}</td><td>${inv.trip}</td><td>${inv.guestName}</td>
            <td>${fmt(inv.actualLE)}</td><td>${fmt(inv.paymentPriceLE)}</td><td>${fmt(inv.rest)}</td></tr>`;
        });
        html += `<tr style="background:#f8fafc; font-weight:700"><td colspan="4">الإجمالي (${rv.pending.count})</td><td>${fmt(rv.pending.actualLE)}</td><td>-</td><td>-</td></tr>`;
        html += `</tbody></table></div>`;
      }

      // 3. إيرادات أخرى
      if (rv.other.totalLE > 0 || rv.exchangeGain.totalLE > 0) {
        html += `<div class="section"><div class="section-title">3. إيرادات أخرى وتحويل العملة</div>
          <table><thead><tr><th>النوع / الحساب</th><th>العدد</th><th>الإجمالي LE</th></tr></thead><tbody>`;
        
        rv.other.byAccount.forEach(a => {
          html += `<tr><td>${a.name}</td><td>${a.count}</td><td class="positive">${fmt(a.totalLE)}</td></tr>`;
        });
        if (rv.exchangeGain.totalLE > 0) {
          html += `<tr><td>أرباح تحويل العملة</td><td>-</td><td class="positive">${fmt(rv.exchangeGain.totalLE)}</td></tr>`;
        }
        
        html += `<tr style="background:#f8fafc; font-weight:700"><td colspan="2">الإجمالي</td><td class="positive">${fmt(rv.other.totalLE + rv.exchangeGain.totalLE)}</td></tr></tbody></table></div>`;
      }

      // ══════════════════════════════
      // التكاليف
      // ══════════════════════════════
      
      // 4. تكاليف السيارات
      if (cs.vehiclesLE > 0) {
        html += `<div class="section" style="background:#fef2f2; border-color:#fecaca;"><div class="section-title" style="color:#991b1b; border-color:#fecaca;">4. تكاليف السيارات (Vehicles)</div>
          <table><tbody>
            <tr><td>إجمالي تكلفة السيارات للفترة</td><td class="negative" style="text-align:left; font-size:16px;"><b>${fmt(cs.vehiclesLE)} LE</b></td></tr>
          </tbody></table>
        </div>`;
      }

      // 5. تكاليف المراكب
      if (cs.boatsLE > 0) {
        html += `<div class="section" style="background:#fef2f2; border-color:#fecaca;"><div class="section-title" style="color:#991b1b; border-color:#fecaca;">5. تكاليف المراكب (Boats)</div>
          <table><tbody>
            <tr><td>إجمالي تكلفة المراكب للفترة</td><td class="negative" style="text-align:left; font-size:16px;"><b>${fmt(cs.boatsLE)} LE</b></td></tr>
          </tbody></table>
        </div>`;
      }

      // 6. تكاليف المدربين
      if (cs.instructorsLE > 0) {
        html += `<div class="section" style="background:#fef2f2; border-color:#fecaca;"><div class="section-title" style="color:#991b1b; border-color:#fecaca;">6. تكاليف المدربين (Instructors)</div>
          <table><tbody>
            <tr><td>إجمالي تكلفة المدربين للفترة</td><td class="negative" style="text-align:left; font-size:16px;"><b>${fmt(cs.instructorsLE)} LE</b></td></tr>
          </tbody></table>
        </div>`;
      }

      // 7. تكاليف الموظفين (مرتبات + عمولات)
      if (cs.staffCostsLE > 0) {
        html += `<div class="section"><div class="section-title">7. تكاليف الموظفين (مرتبات + عمولات)</div>
          <table><tbody>
            <tr><td>إجمالي تكلفة الموظفين للفترة</td><td class="negative" style="text-align:left; font-size:16px;"><b>${fmt(cs.staffCostsLE)} LE</b></td></tr>
          </tbody></table>
        </div>`;
      }

      // 8. المصروفات التشغيلية
      if (cs.operational.totalLE > 0) {
        html += `<div class="section"><div class="section-title">8. المصروفات التشغيلية والإيجارات</div>
          <table><thead><tr><th>الحساب</th><th>العدد</th><th>الإجمالي LE</th></tr></thead><tbody>`;
        cs.operational.byAccount.forEach(a => {
          html += `<tr><td>${a.name}</td><td>${a.count}</td><td class="negative">${fmt(a.totalLE)}</td></tr>`;
        });
        html += `<tr style="background:#f8fafc; font-weight:700"><td colspan="2">الإجمالي</td><td class="negative">${fmt(cs.operational.totalLE)}</td></tr></tbody></table></div>`;
      }

      // 9. الاستردادات
      if (cs.refunds.totalLE > 0) {
        html += `<div class="section"><div class="section-title">9. الاستردادات (Refunds)</div>
          <table><thead><tr><th>التاريخ</th><th>التفاصيل</th><th>المبلغ LE</th></tr></thead><tbody>`;
        cs.refunds.list.forEach(d => {
          html += `<tr><td>${d.date}</td><td>${d.details}</td><td class="negative">${fmt(d.totalLE)}</td></tr>`;
        });
        html += `<tr style="background:#f8fafc; font-weight:700"><td colspan="2">الإجمالي</td><td class="negative">${fmt(cs.refunds.totalLE)}</td></tr></tbody></table></div>`;
      }

      // 10. الملخص
      html += `<div class="section" style="background:linear-gradient(135deg, #eff6ff, #dbeafe); border-color:#bfdbfe;"><div class="section-title" style="color:#1e3a8a; border-color:#bfdbfe;">10. الملخص النهائي</div>
        <table><tbody>
          <tr><td>إجمالي الإيرادات المحققة</td><td class="positive" style="text-align:left; font-size:16px;"><b>${fmt(s.totalRevenueLE)} LE</b></td></tr>
          <tr><td>إجمالي التكاليف</td><td class="negative" style="text-align:left; font-size:16px;"><b>${fmt(s.totalCostsLE)} LE</b></td></tr>
          <tr style="background:#1e3a8a; color:white;"><td style="font-size:18px; padding:15px;"><b>صافي الربح</b></td><td style="text-align:left; font-size:22px; padding:15px;" class="${s.netProfitLE >= 0 ? 'text-green-400' : 'text-red-400'}"><b>${fmt(s.netProfitLE)} LE</b></td></tr>
          <tr><td>هامش الربح</td><td style="text-align:left; color:#7c3aed; font-size:18px;"><b>${fmt(s.profitMargin)} %</b></td></tr>
        </tbody></table></div>`;

      document.getElementById('content').innerHTML = html;

      drawCharts(r);
    }

    function drawCharts(r) {
      const rv = r.revenue;
      const cs = r.costs;

      Chart.defaults.color = '#5a6a8a';
      Chart.defaults.borderColor = '#e2e8f0';

      new Chart(document.getElementById('chartRevenue'), {
        type: 'doughnut',
        data: {
          labels: ['محصل نقدي', 'إيرادات أخرى', 'تحويل عملة'],
          datasets: [{
            data: [rv.confirmed.paidLE, rv.other.totalLE, rv.exchangeGain.totalLE],
            backgroundColor: ['#10b981', '#3b82f6', '#f59e0b']
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
      });

      new Chart(document.getElementById('chartCosts'), {
        type: 'doughnut',
        data: {
          labels: ['سيارات', 'مراكب', 'مدربين', 'موظفين', 'تشغيلية'],
          datasets: [{
            data: [cs.vehiclesLE, cs.boatsLE, cs.instructorsLE, cs.staffCostsLE, cs.operational.totalLE],
            backgroundColor: ['#ef4444', '#dc2626', '#f97316', '#a855f7', '#6366f1']
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
      });
    }

    function goBack() {
      if (currentUser && currentUser.type === 'Accountant') {
        window.location.href = 'AccountantDashboard.html';
      } else {
        window.location.href = 'Dashboard.html';
      }
    }
  </script>
</body>
</html>
