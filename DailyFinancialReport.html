<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التقرير المالي اليومي</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI','Cairo',Arial,sans-serif; background:#0f172a; color:#e2e8f0; min-height:100vh; }
.app { display:flex; min-height:100vh; }
.sidebar { width:250px; background:#020617; border-left:1px solid #1e293b; padding:20px 0; }
.logo { padding:0 20px 20px; font-size:20px; font-weight:800; color:#f5c842; border-bottom:1px solid #1e293b; margin-bottom:15px; }
.nav-item { padding:12px 20px; color:#94a3b8; cursor:pointer; transition:.2s; border-right:3px solid transparent; }
.nav-item:hover, .nav-item.active { background:#0f172a; color:#f5c842; border-right-color:#f5c842; }
.main { flex:1; padding:25px; overflow-y:auto; }
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; flex-wrap:wrap; gap:15px; }
.header h1 { font-size:24px; color:#f5c842; }
.filters { display:flex; gap:10px; flex-wrap:wrap; }
.filters input, .filters button { padding:10px 15px; border-radius:8px; border:1px solid #334155; background:#1e293b; color:#e2e8f0; font-family:inherit; }
.filters button { background:#f5c842; color:#0f172a; font-weight:700; cursor:pointer; border:none; }
.filters button:hover { background:#facc15; }
.cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:15px; margin-bottom:25px; }
.card { background:linear-gradient(135deg, #1e293b, #0f172a); padding:20px; border-radius:12px; border:1px solid #334155; }
.card .label { font-size:12px; color:#94a3b8; margin-bottom:8px; text-transform:uppercase; letter-spacing:.5px; }
.card .value { font-size:24px; font-weight:800; }
.card.revenue .value { color:#10b981; }
.card.costs .value { color:#ef4444; }
.card.profit .value { color:#3b82f6; }
.card.margin .value { color:#a78bfa; }
.section { background:#1e293b; border-radius:12px; padding:20px; margin-bottom:20px; border:1px solid #334155; }
.section-title { font-size:16px; font-weight:700; color:#f5c842; margin-bottom:15px; padding-bottom:10px; border-bottom:1px solid #334155; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { background:#0f172a; padding:10px; text-align:right; color:#94a3b8; font-weight:600; }
td { padding:10px; border-bottom:1px solid #334155; }
tr:hover td { background:#0f172a; }
.amount { font-weight:700; }
.positive { color:#10b981; }
.negative { color:#ef4444; }
.badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
.badge.green { background:#10b981; color:#fff; }
.badge.orange { background:#f59e0b; color:#fff; }
.badge.blue { background:#3b82f6; color:#fff; }
.loading { text-align:center; padding:50px; color:#94a3b8; }
.chart-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
.chart-box { background:#1e293b; border-radius:12px; padding:20px; border:1px solid #334155; height:350px; }
@media (max-width:900px) { .chart-grid { grid-template-columns:1fr; } .sidebar { display:none; } }
@media print { .sidebar, .filters, .nav-item { display:none !important; } body { background:#fff; color:#000; } .card, .section { background:#fff; border:1px solid #ccc; color:#000; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">💰 التقارير المالية</div>
    <div class="nav-item active">📊 التقرير اليومي</div>
    <div class="nav-item" onclick="location.href='AnnualBudget.html'">📅 التقرير السنوي</div>
  </aside>
  <main class="main">
    <div class="header">
      <h1>📊 التقرير المالي اليومي</h1>
      <div class="filters">
        <input type="date" id="fromDate">
        <input type="date" id="toDate">
        <button onclick="loadReport()">🔍 عرض</button>
        <button onclick="window.print()">🖨️ طباعة</button>
        <button onclick="exportExcel()">📥 Excel</button>
      </div>
    </div>
    <div id="content"><div class="loading">جاري التحميل...</div></div>
  </main>
</div>

<script>
let currentUser = null;
let lastReport = null;

// ⚠️ عدّل هذا الجزء ليتوافق مع config.js لديك
const API_URL = 'https://script.google.com/macros/s/AKfycb__YOUR_DEPLOYMENT_ID__/exec';

async function api(action, params = {}) {
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  for (const k in params) url.searchParams.set(k, params[k]);
  const res = await fetch(url.toString());
  return res.json();
}

function fmt(n) {
  if (n === undefined || n === null) return '0.00';
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

async function init() {
  try {
    const sess = localStorage.getItem('currentUser');
    if (sess) currentUser = JSON.parse(sess);
  } catch(e) {}
  
  if (!currentUser) {
    document.getElementById('content').innerHTML = '<div class="loading">⚠️ يجب تسجيل الدخول أولاً</div>';
    return;
  }
  
  const today = new Date().toISOString().split('T')[0];
  const monthStart = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0];
  document.getElementById('fromDate').value = monthStart;
  document.getElementById('toDate').value = today;
  loadReport();
}

async function loadReport() {
  const fromDate = document.getElementById('fromDate').value;
  const toDate = document.getElementById('toDate').value;
  if (!fromDate || !toDate) return alert('اختر التاريخين');
  
  document.getElementById('content').innerHTML = '<div class="loading">⏳ جاري حساب التقرير...</div>';
  
  const res = await api('getDailyFinancialReport', {
    fromDate, toDate, centerName: currentUser.centerName
  });
  
  if (!res.success) {
    document.getElementById('content').innerHTML = `<div class="loading">❌ ${res.message}</div>`;
    return;
  }
  
  lastReport = res;
  renderReport(res);
}

function renderReport(r) {
  const s = r.summary;
  const rv = r.revenue;
  const cs = r.costs;
  
  let html = '';
  
  // Header
  html += `<div style="text-align:center; margin-bottom:20px; color:#94a3b8;">
    الفترة: من <b style="color:#f5c842">${r.period.from}</b> إلى <b style="color:#f5c842">${r.period.to}</b>
  </div>`;
  
  // Cards
  html += `<div class="cards">
    <div class="card revenue"><div class="label">إجمالي الإيرادات</div><div class="value">${fmt(s.totalRevenueLE)} LE</div></div>
    <div class="card costs"><div class="label">إجمالي التكاليف</div><div class="value">${fmt(s.totalCostsLE)} LE</div></div>
    <div class="card profit"><div class="label">صافي الربح</div><div class="value">${fmt(s.netProfitLE)} LE</div></div>
    <div class="card margin"><div class="label">هامش الربح</div><div class="value">${fmt(s.profitMargin)} %</div></div>
  </div>`;
  
  // Chart
  html += `<div class="chart-grid">
    <div class="chart-box"><canvas id="chartRevenue"></canvas></div>
    <div class="chart-box"><canvas id="chartCosts"></canvas></div>
  </div>`;
  
  // 1. الإيرادات
  html += `<div class="section"><div class="section-title">1. الإيرادات المحققة (فواتير مؤكدة)</div>
    <table><thead><tr><th>الفاتورة</th><th>التاريخ</th><th>الرحلة</th><th>العميل</th><th>السيلز</th><th>العملة</th><th>Actual Price</th><th>Actual LE</th><th>Payment LE</th></tr></thead><tbody>`;
  rv.confirmed.list.forEach(inv => {
    html += `<tr><td>${inv.voucherNo}</td><td>${inv.activeDate}</td><td>${inv.trip}</td><td>${inv.guestName}</td><td>${inv.salesName}</td><td>${inv.currency}</td>
      <td class="amount">${fmt(inv.actualPrice)}</td><td class="amount">${fmt(inv.actualPriceLE)}</td><td class="amount positive">${fmt(inv.paymentPriceLE)}</td></tr>`;
  });
  html += `<tr style="background:#0f172a; font-weight:700"><td colspan="7">الإجمالي (${rv.confirmed.count} فاتورة)</td><td>${fmt(rv.confirmed.actualPriceLE)}</td><td class="positive">${fmt(rv.confirmed.paymentPriceLE)}</td></tr>`;
  html += `</tbody></table></div>`;
  
  // 2. تحت التنفيذ
  if (rv.pending.count > 0) {
    html += `<div class="section"><div class="section-title">2. إيرادات غير محققة (تحت التنفيذ - Pending)</div>
      <div style="color:#f59e0b; margin-bottom:10px; font-size:13px;">⚠️ هذه أرباح متوقعة لم تُحقق بعد</div>
      <table><thead><tr><th>الفاتورة</th><th>التاريخ</th><th>الرحلة</th><th>العميل</th><th>Actual LE</th><th>Paid LE</th><th>Rest</th></tr></thead><tbody>`;
    rv.pending.list.forEach(inv => {
      html += `<tr><td>${inv.voucherNo}</td><td>${inv.activeDate}</td><td>${inv.trip}</td><td>${inv.guestName}</td>
        <td>${fmt(inv.actualPriceLE)}</td><td>${fmt(inv.paymentPriceLE)}</td><td>${fmt(inv.rest)}</td></tr>`;
    });
    html += `<tr style="background:#0f172a; font-weight:700"><td colspan="4">الإجمالي (${rv.pending.count})</td><td>${fmt(rv.pending.actualPriceLE)}</td><td>${fmt(rv.pending.paymentPriceLE)}</td><td>${fmt(rv.pending.restLE)}</td></tr>`;
    html += `</tbody></table></div>`;
  }
  
  // 3. إيرادات أخرى
  if (rv.other.totalLE > 0) {
    html += `<div class="section"><div class="section-title">3. إيرادات أخرى</div>
      <table><thead><tr><th>الحساب</th><th>العدد</th><th>الإجمالي LE</th></tr></thead><tbody>`;
    rv.other.byAccount.forEach(a => {
      html += `<tr><td>${a.name}</td><td>${a.count}</td><td class="positive">${fmt(a.totalLE)}</td></tr>`;
    });
    html += `<tr style="background:#0f172a; font-weight:700"><td colspan="2">الإجمالي</td><td class="positive">${fmt(rv.other.totalLE)}</td></tr></tbody></table></div>`;
  }
  
  // 4. تحويل العملة (إيراد)
  if (rv.exchangeGain.totalLE > 0) {
    html += `<div class="section"><div class="section-title">4. أرباح تحويل العملة</div>
      <table><thead><tr><th>التاريخ</th><th>التفاصيل</th><th>المبلغ LE</th></tr></thead><tbody>`;
    rv.exchangeGain.details.forEach(d => {
      html += `<tr><td>${d.date}</td><td>${d.details}</td><td class="positive">${fmt(d.totalLE)}</td></tr>`;
    });
    html += `<tr style="background:#0f172a; font-weight:700"><td colspan="2">الإجمالي</td><td class="positive">${fmt(rv.exchangeGain.totalLE)}</td></tr></tbody></table></div>`;
  }
  
  // ══════════════════════════════
  // التكاليف
  // ══════════════════════════════
  html += `<div class="section" style="background:#7f1d1d; border-color:#dc2626;"><div class="section-title" style="color:#fff; border-color:#dc2626;">5. تكاليف تنفيذ الرحلات</div>
    <table><thead><tr><th>الفاتورة</th><th>الرحلة</th><th>Direct Cost LE</th></tr></thead><tbody>`;
  cs.directCosts.list.forEach(d => {
    html += `<tr><td>${d.voucherNo}</td><td>${d.trip}</td><td class="negative">${fmt(d.directCost_LE)}</td></tr>`;
  });
  html += `<tr style="background:#0f172a; font-weight:700"><td colspan="2">الإجمالي (${cs.directCosts.count})</td><td class="negative">${fmt(cs.directCosts.totalLE)}</td></tr></tbody></table>
    <div style="margin-top:10px; font-size:13px; color:#fca5a5;">Mandatory Fees: <b>${fmt(cs.mandatoryFees.totalLE)} LE</b> (${cs.mandatoryFees.count} فاتورة)</div>
  </div>`;
  
  // 6. العمولات
  html += `<div class="section"><div class="section-title">6. عمولات السيلز</div>
    <table><thead><tr><th>السيلز</th><th>عدد الفواتير</th><th>الإجمالي LE</th></tr></thead><tbody>`;
  cs.commissions.bySales.forEach(s => {
    html += `<tr><td>${s.name}</td><td>${s.count}</td><td class="negative">${fmt(s.totalLE)}</td></tr>`;
  });
  html += `<tr style="background:#0f172a; font-weight:700"><td colspan="2">الإجمالي (${cs.commissions.count})</td><td class="negative">${fmt(cs.commissions.totalLE)}</td></tr></tbody></table></div>`;
  
  // 7. المرتبات
  html += `<div class="section"><div class="section-title">7. المرتبات المستحقة (Accrual)</div>
    <table><thead><tr><th>الموظف</th><th>الراتب</th><th>العمولة</th><th>الخصومات</th><th>الصافي LE</th></tr></thead><tbody>`;
  cs.salaries.employees.forEach(e => {
    html += `<tr><td>${e.name}</td><td>${fmt(e.salaryAmount)}</td><td>${fmt(e.commission)}</td><td>${fmt(e.cuts)}</td><td class="negative">${fmt(e.total)}</td></tr>`;
  });
  html += `<tr style="background:#0f172a; font-weight:700"><td colspan="4">الإجمالي</td><td class="negative">${fmt(cs.salaries.totalLE)}</td></tr></tbody></table></div>`;
  
  // 8. المصروفات التشغيلية
  html += `<div class="section"><div class="section-title">8. المصروفات التشغيلية</div>
    <table><thead><tr><th>الحساب</th><th>العدد</th><th>الإجمالي LE</th></tr></thead><tbody>`;
  cs.operational.byAccount.forEach(a => {
    html += `<tr><td>${a.name}</td><td>${a.count}</td><td class="negative">${fmt(a.totalLE)}</td></tr>`;
  });
  html += `<tr style="background:#0f172a; font-weight:700"><td colspan="2">الإجمالي</td><td class="negative">${fmt(cs.operational.totalLE)}</td></tr></tbody></table></div>`;
  
  // 9. الاستردادات
  if (cs.refunds.totalLE > 0) {
    html += `<div class="section"><div class="section-title">9. الاستردادات (Refunds)</div>
      <table><thead><tr><th>التاريخ</th><th>التفاصيل</th><th>المبلغ LE</th></tr></thead><tbody>`;
    cs.refunds.list.forEach(d => {
      html += `<tr><td>${d.date}</td><td>${d.details}</td><td class="negative">${fmt(d.totalLE)}</td></tr>`;
    });
    html += `<tr style="background:#0f172a; font-weight:700"><td colspan="2">الإجمالي</td><td class="negative">${fmt(cs.refunds.totalLE)}</td></tr></tbody></table></div>`;
  }
  
  // 10. خسائر تحويل العملة
  if (cs.exchangeLoss.totalLE > 0) {
    html += `<div class="section"><div class="section-title">10. خسائر تحويل العملة</div>
      <table><thead><tr><th>التاريخ</th><th>التفاصيل</th><th>المبلغ LE</th></tr></thead><tbody>`;
    cs.exchangeLoss.details.forEach(d => {
      html += `<tr><td>${d.date}</td><td>${d.details}</td><td class="negative">${fmt(d.totalLE)}</td></tr>`;
    });
    html += `<tr style="background:#0f172a; font-weight:700"><td colspan="2">الإجمالي</td><td class="negative">${fmt(cs.exchangeLoss.totalLE)}</td></tr></tbody></table></div>`;
  }
  
  // 11. ملخص
  html += `<div class="section" style="background:linear-gradient(135deg, #1e3a8a, #1e40af); border-color:#3b82f6;"><div class="section-title" style="color:#fff; border-color:#3b82f6;">11. الملخص النهائي</div>
    <table><tbody>
      <tr><td>إجمالي الإيرادات المحققة</td><td class="positive" style="text-align:left; font-size:16px;"><b>${fmt(s.totalRevenueLE)} LE</b></td></tr>
      <tr><td>إجمالي التكاليف</td><td class="negative" style="text-align:left; font-size:16px;"><b>${fmt(s.totalCostsLE)} LE</b></td></tr>
      <tr style="background:#0f172a;"><td style="font-size:18px; padding:15px;"><b>صافي الربح</b></td><td style="text-align:left; font-size:22px; padding:15px;" class="${s.netProfitLE >= 0 ? 'positive' : 'negative'}"><b>${fmt(s.netProfitLE)} LE</b></td></tr>
      <tr><td>هامش الربح</td><td style="text-align:left; color:#a78bfa; font-size:18px;"><b>${fmt(s.profitMargin)} %</b></td></tr>
    </tbody></table></div>`;
  
  document.getElementById('content').innerHTML = html;
  
  // Charts
  drawCharts(r);
}

function drawCharts(r) {
  const rv = r.revenue;
  const cs = r.costs;
  
  new Chart(document.getElementById('chartRevenue'), {
    type: 'doughnut',
    data: {
      labels: ['فواتير مؤكدة', 'إيرادات أخرى', 'تحويل عملة'],
      datasets: [{
        data: [rv.confirmed.paymentPriceLE, rv.other.totalLE, rv.exchangeGain.totalLE],
        backgroundColor: ['#10b981', '#3b82f6', '#f59e0b']
      }]
    },
    options: {
      plugins: { legend: { labels: { color: '#e2e8f0' } }, title: { display: true, text: 'توزيع الإيرادات', color: '#f5c842' } }
    }
  });
  
  new Chart(document.getElementById('chartCosts'), {
    type: 'doughnut',
    data: {
      labels: ['تنفيذ رحلات', 'رسوم إلزامية', 'عمولات سيلز', 'مرتبات', 'مصروفات تشغيلية', 'استردادات'],
      datasets: [{
        data: [cs.directCosts.totalLE, cs.mandatoryFees.totalLE, cs.commissions.totalLE, cs.salaries.totalLE, cs.operational.totalLE, cs.refunds.totalLE],
        backgroundColor: ['#ef4444', '#dc2626', '#f97316', '#a855f7', '#6366f1', '#f59e0b']
      }]
    },
    options: {
      plugins: { legend: { labels: { color: '#e2e8f0' } }, title: { display: true, text: 'توزيع التكاليف', color: '#f5c842' } }
    }
  });
}

function exportExcel() {
  if (!lastReport) return alert('اعرض التقرير أولاً');
  const r = lastReport;
  let csv = '\uFEFF'; // BOM
  csv += 'التقرير المالي اليومي\n';
  csv += `الفترة,${r.period.from} - ${r.period.to}\n\n`;
  csv += 'الملخص\n';
  csv += 'البيان,المبلغ LE\n';
  csv += `إجمالي الإيرادات,${r.summary.totalRevenueLE}\n`;
  csv += `إجمالي التكاليف,${r.summary.totalCostsLE}\n`;
  csv += `صافي الربح,${r.summary.netProfitLE}\n`;
  csv += `هامش الربح,${r.summary.profitMargin}%\n\n`;
  
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `FinancialReport_${r.period.from}_${r.period.to}.csv`;
  link.click();
}

init();
</script>
</body>
</html>
