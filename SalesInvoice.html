<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="theme-color" content="#1e2b4f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="description" content="Dive System - Sales Invoice">
  <meta name="author" content="Dive System">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes, viewport-fit=cover">
  <title>Sales Invoice</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <script src="session.js"></script>
  <script src="ui.js"></script>
  <style>
    :root{
      --navy:#0f1f3d;--navy2:#1a3260;--gold:#f5c842;--gold2:#e6b800;
      --blue:#2563eb;--blue-lt:#3b82f6;--green:#16a34a;--red:#dc2626;
      --bg:#f0f4f8;--card:#fff;--border:#dde4f0;--text:#1a2540;--text-lt:#5a6a8a;
      --radius:16px;--radius-sm:10px;
      --shadow:0 4px 24px rgba(15,31,61,.10);--shadow-lg:0 8px 40px rgba(15,31,61,.16);
      --ticker-h:42px;--header-h:60px;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Cairo',sans-serif;background:linear-gradient(135deg, #0f1f3d 0%, #1a3260 100%);color:var(--text);min-height:100vh;width:100%;overflow-x:hidden;padding:20px;}
    #stickyTop{position:fixed;top:0;left:0;right:0;z-index:1000;width:100%;overflow:hidden;background:linear-gradient(90deg,#07111f,#0f1f3d);}
    #stickyTop::-webkit-scrollbar{height:3px;}
    #stickyTop::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px;}
    .ticker-bar{height:var(--ticker-h);background:linear-gradient(90deg,#07111f,#0f1f3d 50%,#07111f);border-bottom:2px solid var(--gold);display:flex;align-items:center;width:100%;overflow:hidden;}
    .ticker-label{flex-shrink:0;background:var(--gold);color:var(--navy);font-weight:900;font-size:11px;padding:0 12px;height:100%;display:flex;align-items:center;gap:5px;}
    .ticker-track{flex:1;overflow:hidden;display:inline-block;}
    .ticker-inner{display:inline-flex;align-items:center;white-space:nowrap;animation:tick 22s linear infinite;will-change:transform;}
    .ticker-inner:hover{animation-play-state:paused;}
    @keyframes tick{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
    .ticker-item{display:inline-flex;align-items:center;gap:5px;padding:0 16px;color:#cbd5e1;font-size:12px;font-weight:600;border-right:1px solid rgba(255,255,255,.1);}
    .ticker-item .rl{color:#94a3b8;font-size:10px;}
    .ticker-item .rv{color:var(--gold);font-weight:900;font-size:13px;font-family:'Tajawal',monospace;}
    .ticker-item .rt{background:rgba(245,200,66,.15);border:1px solid rgba(245,200,66,.3);color:var(--gold);font-size:9px;padding:1px 5px;border-radius:20px;}
    .ticker-sep{display:inline-flex;align-items:center;padding:0 8px;color:rgba(245,200,66,.35);font-size:16px;}
    .ticker-date{flex-shrink:0;color:#64748b;font-size:10px;padding:0 12px;}
    .header{height:var(--header-h);background:linear-gradient(135deg,var(--navy),var(--navy2));display:flex;justify-content:space-between;align-items:center;padding:0 20px;width:100%;overflow:hidden;}
    .header-title{display:inline-flex;align-items:center;gap:8px;color:var(--gold);font-size:18px;font-weight:900;flex-shrink:0;}
    .header-title .icon{background:rgba(245,200,66,.15);border:1px solid rgba(245,200,66,.25);border-radius:8px;padding:4px 7px;font-size:16px;}
    .header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;min-width:0;}
    .user-chip{min-width:0;overflow:hidden;}
    .user-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px;}
    .user-chip{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:40px;padding:4px 12px;color:white;font-size:12px;font-weight:600;flex-shrink:0;}
    .avatar{width:26px;height:26px;background:var(--gold);color:var(--navy);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;}
    .meta-pill{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#94a3b8;font-size:10px;padding:2px 8px;border-radius:20px;flex-shrink:0;}
    .back-btn{background:transparent;border:2px solid rgba(255,255,255,.28);color:white;padding:5px 14px;border-radius:40px;cursor:pointer;font-weight:700;font-size:12px;font-family:'Cairo',sans-serif;transition:all .2s;flex-shrink:0;}
    .back-btn:hover{border-color:var(--gold);color:var(--gold);}
    .page{padding-top:calc(var(--ticker-h) + var(--header-h) + 18px);padding-bottom:50px;width:100%;max-width:1100px;margin:0 auto;padding-left:15px;padding-right:15px;min-height:100vh;}
    .hotel-row{display:grid;grid-template-columns:1fr 90px 68px 68px 68px;gap:11px;align-items:end;margin-top:12px;}
    @media(max-width:680px){.hotel-row{grid-template-columns:1fr 80px 62px 62px 62px;}}
    @media(max-width:480px){.hotel-row{grid-template-columns:1fr 70px 58px 58px 58px;}}
    .compact-num{padding:9px 5px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-family:'Cairo',sans-serif;font-weight:700;color:var(--text);background:#fafbfd;width:100%;height:43px;text-align:center;-webkit-appearance:none;appearance:none;}
    .compact-num:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1);outline:none;background:white;}
    .compact-num::placeholder{color:#b0bac9;font-weight:400;}
    .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
    .fgroup{display:flex;flex-direction:column;gap:5px;position:relative;}
    .fgroup label{font-size:11px;font-weight:700;color:var(--text-lt);text-transform:uppercase;letter-spacing:.5px;}
    .fgroup label.req::after{content:' *';color:var(--red);}
    .fc{padding:9px 13px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:'Cairo',sans-serif;color:var(--text);background:#fafbfd;width:100%;height:43px;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none;}
    .fc:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1);outline:none;background:white;}
    .fc::placeholder{color:#b0bac9;}
    select.fc{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='%235a6a8a' stroke-width='2.5'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:left 11px center;padding-left:33px;}
    input[list].fc{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='%235a6a8a' stroke-width='2.5'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:left 11px center;padding-left:33px;}
    textarea.fc{height:auto;resize:vertical;}
    .phone-row{display:flex;gap:7px;align-items:center;}
    .phone-code{width:78px;flex-shrink:0;}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width: 640px) {
      .hotel-row{display:grid;grid-template-columns:1fr 70px 70px 70px 70px;gap:8px;}
      .hotel-row .fgroup:first-child{grid-column: span 5;}
    }
    .compact-num[type="tel"]{-webkit-appearance: none;appearance: none;}
    .persons-row{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:8px;}
    @media(max-width: 640px){.persons-row{gap:8px;}}
    .ac-wrap{position:relative;flex:1;}
    .ac-drop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:white;border:2px solid var(--blue);border-radius:var(--radius-sm);box-shadow:0 8px 24px rgba(15,31,61,.18);max-height:250px;overflow-y:auto;z-index:600;display:none;}
    .ac-drop.open{display:block;}
    .ac-item{padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .12s;display:flex;flex-direction:column;gap:2px;}
    .ac-item:last-child{border-bottom:none;}
    .ac-item:hover{background:#f0f4ff;}
    .ac-item .ac-n{font-weight:700;color:var(--navy);}
    .ac-item .ac-s{font-size:11px;color:var(--text-lt);}
    .card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;}
    .card-head{padding:11px 18px;background:linear-gradient(90deg,var(--navy),var(--navy2));display:flex;align-items:center;gap:8px;}
    .card-head h3{color:var(--gold);font-size:14px;font-weight:800;letter-spacing:.2px;}
    .ch-icon{background:rgba(245,200,66,.2);border-radius:7px;padding:3px 6px;font-size:13px;}
    .card-body{padding:15px;}
    .time-btn-display{width:100%;height:43px;padding:9px 13px;border:2px solid var(--border);border-radius:var(--radius-sm);background:#fafbfd;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-family:'Cairo',sans-serif;color:var(--text);transition:border-color .2s;}
    .time-btn-display:hover{border-color:var(--blue);}
    .time-btn-display .ph{color:#b0bac9;}
    .trip-table{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border);}
    .trip-table table{width:100%;border-collapse:collapse;}
    .trip-table thead th{background:linear-gradient(90deg,var(--navy),var(--navy2));color:var(--gold);padding:10px 11px;font-size:11px;font-weight:700;text-align:center;text-transform:uppercase;letter-spacing:.3px;}
    .trip-table thead th:first-child{text-align:left;}
    .trip-table tbody tr:hover{background:#f8faff;}
    .trip-table td{padding:9px 11px;border-bottom:1px solid #f0f4f8;font-size:13px;vertical-align:middle;}
    .trip-table td:not(:first-child){text-align:center;}
    .trip-table input[type="number"]{width:70px;padding:5px;border:2px solid var(--border);border-radius:8px;text-align:center;font-size:14px;font-weight:700;font-family:'Cairo',sans-serif;background:#fafbfd;}
    .trip-table input[type="number"]:focus{border-color:var(--blue);outline:none;}
    .trip-table input[readonly]{background:#f0f4f8;color:var(--text-lt);}
    .calc-card{background:linear-gradient(135deg,#fafbff,#f0f4fa);}
    .totals-strip{display:flex;justify-content:space-around;align-items:center;flex-wrap:wrap;gap:14px;padding:16px;border-bottom:2px dashed var(--border);}
    .total-tile{text-align:center;}
    .total-tile .tl{font-size:10px;font-weight:700;color:var(--text-lt);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
    .total-tile .tv{font-size:32px;font-weight:900;color:var(--navy);line-height:1;}
    .total-tile .tc{font-size:13px;color:var(--gold2);font-weight:700;margin-left:3px;}
    .total-tile input{width:110px;padding:7px;border:2px solid var(--border);border-radius:11px;text-align:center;font-size:14px;font-weight:700;font-family:'Cairo',sans-serif;background:white;}
    .total-tile input:focus{border-color:var(--blue);outline:none;}
    .pay-grp-lbl{padding:5px 16px 2px;font-size:10px;font-weight:800;color:var(--text-lt);text-transform:uppercase;letter-spacing:.7px;}
    .pay-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 15px;}
    .pay-cell{background:white;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 8px;text-align:center;}
    .pay-cell:focus-within{box-shadow:0 0 0 2px var(--blue);border-color:var(--blue);}
    .pay-cell label{display:block;font-size:10px;font-weight:700;color:var(--text-lt);text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px;}
    .pay-cell input{width:100%;border:none;background:transparent;text-align:center;font-size:14px;font-weight:700;font-family:'Cairo',sans-serif;color:var(--text);outline:none;}
    .rest-strip{padding:14px 16px;border-top:2px dashed var(--border);display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;}
    .rest-big{font-size:36px;font-weight:900;color:var(--navy);}
    .rest-cur{font-size:16px;font-weight:700;color:var(--gold2);}
    .rest-lbl{font-size:10px;font-weight:700;color:var(--text-lt);text-transform:uppercase;letter-spacing:.5px;}
    .sig-btn{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:white;border:none;padding:11px 26px;border-radius:40px;font-weight:700;font-size:13px;cursor:pointer;font-family:'Cairo',sans-serif;box-shadow:0 4px 14px rgba(124,58,237,.3);transition:all .2s;}
    .sig-btn:hover{transform:translateY(-2px);}
    .sig-preview{margin-top:10px;display:none;border:2px dashed var(--border);border-radius:11px;padding:8px;background:#fafbfd;}
    .sig-preview img{max-height:70px;max-width:100%;border-radius:5px;}
    .action-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding-top:4px;}
    .btn{padding:12px 26px;border:none;border-radius:40px;font-weight:800;font-size:13px;cursor:pointer;font-family:'Cairo',sans-serif;display:flex;align-items:center;gap:6px;transition:all .2s;}
    .btn:hover{transform:translateY(-2px);}
    .btn:disabled{opacity:.55;cursor:not-allowed;transform:none;}
    .btn-save{background:linear-gradient(135deg,var(--navy),var(--navy2));color:var(--gold);box-shadow:0 4px 14px rgba(15,31,61,.3);}
    .btn-clear{background:#f1f5f9;color:var(--text);}
    .btn-new{background:linear-gradient(135deg,var(--green),#15803d);color:white;box-shadow:0 4px 14px rgba(22,163,74,.3);}
    .warn-bar{background:#fffbeb;border:2px solid #f59e0b;border-radius:var(--radius-sm);padding:11px 14px;color:#92400e;font-weight:600;font-size:12px;margin-bottom:14px;text-align:center;}
    .err-bar{background:#fef2f2;border:2px solid var(--red);border-radius:var(--radius-sm);padding:12px 14px;color:#7f1d1d;font-weight:600;font-size:12px;margin-bottom:14px;text-align:center;}
    .session-badge{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid var(--blue-lt);border-radius:var(--radius);padding:10px 16px;margin-bottom:14px;display:flex;align-items:center;gap:8px;font-weight:700;color:var(--navy);flex-wrap:wrap;}
    .session-badge .cnt{background:var(--blue);color:white;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(4px);}
    .modal.open{display:flex;}
    .modal-box{background:white;width:90%;max-width:500px;border-radius:22px;padding:26px;text-align:center;box-shadow:0 25px 50px rgba(0,0,0,.3);}
    .modal-icon{font-size:44px;margin-bottom:10px;}
    .modal-msg{color:var(--navy);font-size:15px;font-weight:700;margin-bottom:18px;white-space:pre-wrap;line-height:1.6;}
    .modal-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
    .sig-canvas{border:2px solid var(--border);border-radius:11px;background:white;width:100%;height:180px;cursor:crosshair;touch-action:none;margin:12px 0;}
    .sig-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
    .pdf-ov{display:none;position:fixed;inset:0;background:rgba(10,22,40,.88);z-index:99999;align-items:center;justify-content:center;flex-direction:column;gap:18px;backdrop-filter:blur(4px);}
    .pdf-ov.show{display:flex;}
    .pdf-spin{width:60px;height:60px;border:5px solid rgba(255,255,255,.15);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;}
    .pdf-ov p{color:white;font-size:16px;font-weight:700;text-align:center;}
    .clock-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);align-items:center;justify-content:center;z-index:10000;backdrop-filter:blur(6px);}
    .clock-modal.open{display:flex;}
    .clock-box{background:white;width:90%;max-width:340px;border-radius:28px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5);}
    .ck-head{background:linear-gradient(135deg,var(--navy),var(--navy2));padding:18px 20px;text-align:center;}
    .ck-head-title{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;opacity:.8;}
    .ck-time-big{font-size:56px;font-weight:900;color:white;letter-spacing:4px;font-family:'Tajawal',monospace;line-height:1;margin-bottom:12px;}
    .ck-mode-row{display:flex;justify-content:center;gap:8px;}
    .ck-mode-pill{padding:4px 18px;border-radius:20px;font-size:12px;font-weight:700;font-family:'Cairo',sans-serif;border:2px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.5);cursor:pointer;transition:all .2s;}
    .ck-mode-pill.active{background:var(--gold);color:var(--navy);border-color:var(--gold);}
    .ck-face-wrap{padding:18px;background:#f5f7fb;display:flex;justify-content:center;align-items:center;}
    .ck-svg-wrap{width:230px;height:230px;cursor:crosshair;position:relative;}
    .ck-svg-wrap svg{width:100%;height:100%;display:block;-webkit-tap-highlight-color:transparent;}
    .ck-foot{display:flex;gap:8px;padding:14px 16px;background:white;border-top:1px solid var(--border);}
    .ck-btn{flex:1;padding:11px;border:none;border-radius:40px;font-weight:700;font-size:13px;cursor:pointer;font-family:'Cairo',sans-serif;transition:all .2s;}
    .ck-btn:hover{transform:translateY(-1px);}
    .ck-clear{background:#f1f5f9;color:var(--text);}
    .ck-cancel{background:#fee2e2;color:var(--red);}
    .ck-set{background:linear-gradient(135deg,var(--green),#15803d);color:white;box-shadow:0 3px 10px rgba(22,163,74,.3);}
    .trip-loading{display:flex;align-items:center;gap:8px;padding:12px;color:var(--text-lt);font-size:13px;}
    .trip-loading-spin{width:18px;height:18px;border:2.5px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;flex-shrink:0;}
    @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
    .page-wrapper{max-width:1100px;margin:0 auto;background:white;border-radius:30px;box-shadow:0 20px 60px rgba(0,0,0,0.3);overflow:hidden;padding:20px 16px 50px;min-height:80vh;}
    @media(max-width:680px){.pay-grid{grid-template-columns:repeat(2,1fr);}:root{--ticker-h:36px;--header-h:54px;}.ck-svg-wrap{width:200px;height:200px;}.ck-time-big{font-size:44px;}}
  </style>
</head>
<body>

<div id="stickyTop">
  <div class="ticker-bar">
    <div class="ticker-label">💱 Exchange Rates</div>
    <div class="ticker-track"><div class="ticker-inner" id="tickerInner"><span class="ticker-item" style="color:#475569">⏳ Loading...</span></div></div>
    <div class="ticker-date" id="tickerDate"></div>
  </div>
  <div class="header">
    <div class="header-right">
      <button class="back-btn" onclick="goBack()">← Back</button>
    </div>
    <div class="header-right">
      <div class="user-chip"><div class="avatar" id="userAvatar">?</div><span id="userNameDisplay">...</span></div>
      <span class="meta-pill" id="centerDisplay" style="display:none"></span>
      <span class="meta-pill" id="branchDisplay" style="display:none"></span>
    </div>
  </div>
</div>

<div class="page-wrapper"><div id="mainContent"></div></div>

<div class="pdf-ov" id="pdfOverlay"><div class="pdf-spin"></div><p id="pdfMsg">⏳ Processing...</p></div>

<div id="signatureModal" class="modal">
  <div class="modal-box">
    <div class="modal-icon">✍️</div>
    <div class="modal-msg">Guest Signature</div>
    <canvas id="signatureCanvas" class="sig-canvas" width="440" height="180"></canvas>
    <div class="sig-actions">
      <button class="btn btn-new" onclick="confirmSignature()">✅ Confirm</button>
      <button class="btn btn-clear" onclick="clearSigCanvas()">🔄 Clear</button>
      <button class="btn btn-clear" onclick="closeSigModal()">❌ Cancel</button>
    </div>
  </div>
</div>

<div id="clockModal" class="clock-modal">
  <div class="clock-box">
    <div class="ck-head">
      <div class="ck-head-title">Select Time</div>
      <div class="ck-time-big" id="ckDisplay"><span id="ckH">--</span>:<span id="ckM">--</span></div>
      <div class="ck-mode-row">
        <button class="ck-mode-pill active" id="modeHour" onclick="setClockMode('hour')">Hour</button>
        <button class="ck-mode-pill" id="modeMin" onclick="setClockMode('minute')">Minute</button>
      </div>
    </div>
    <div class="ck-face-wrap">
      <div class="ck-svg-wrap" id="ckWrap">
        <svg id="ckSVG" viewBox="0 0 230 230" xmlns="http://www.w3.org/2000/svg">
          <circle cx="115" cy="115" r="112" fill="#eef2f8" stroke="#dde4f0" stroke-width="1.5"/>
          <circle cx="115" cy="115" r="64" fill="rgba(37,99,235,.04)" stroke="rgba(37,99,235,.12)" stroke-width="1" stroke-dasharray="4 3"/>
          <g id="ckTicks"></g><g id="ckNums"></g>

const GAS = CONFIG.GAS_URL;
const DASH = {
  Admin: 'Dashboard.html',
  Owner: 'OwnerDashboard.html',
  Sales: 'SalesDashboard.html',
  Accountant: 'AccountantDashboard.html',
  Customer: 'CustomerDashboard.html'
};

  
let currentUser = null, signatureData = null, sessionVouchers = [];
let tripDef = [], tripPrices = [], tripCategory = '', tripHasCost = false;
let sigCanvas = null, sigCtx = null, isDrawing = false, lastX = 0, lastY = 0;
let ckHour = null, ckMin = null, ckMode = 'hour';

  rate: null,
  rateByDate: {},

// ═══════════════════════════════════════════════════════════════════
// 🌐 Cache keys (sessionStorage)
// ═══════════════════════════════════════════════════════════════════
const CACHE_KEYS = {
  NATIONALITIES: 'sales_cached_nationalities_v2',
  HOTELS: 'sales_cached_hotels_v2'
};

function getCachedList(key) {
  try {
    const raw = sessionStorage.getItem(key);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
  } catch (e) {}
  return null;
}

function setCachedList(key, list) {
  try {
    if (Array.isArray(list) && list.length > 0) {
      sessionStorage.setItem(key, JSON.stringify(list));
    }
  } catch (e) {}
}

// ========== Core gas() ==========
function gas(action, params = {}) {
  const u = new URL(GAS);
  u.searchParams.set('action', action);
  Object.entries(params).forEach(([k, v]) => {
    if (v === undefined || v === null || v === '') return;
    if (k === 'signatureData' || k === 'sigPart1' || k === 'sigPart2') return;
    if (typeof v === 'object') {
      u.searchParams.set(k, JSON.stringify(v));
    } else {
      u.searchParams.set(k, String(v));
    }
  });
  return fetch(u.toString(), { method: 'GET', redirect: 'follow' })
    .then(r => r.json())
    .catch(err => { console.error(`❌ ${action} failed:`, err); throw err; });
}

async function uploadSignatureImage(signatureData) {
  try {
    const base64Data = signatureData.split(',')[1];
    if (!base64Data) return { success: false, message: 'No image data' };
    return await gas('uploadSignatureImage', { b64: base64Data, voucherNo: 'temp_' + Date.now() });
  } catch (e) {
    console.error('uploadSignatureImage error:', e);
    return { success: false, message: e.message };
  }
}

async function gasWithSig(action, params) {
  const sigData = params.signatureData || '';
  const baseParams = { ...params };
  delete baseParams.signatureData;
  if (sigData && sigData.startsWith('data:image')) {
    try {
      const uploadResult = await uploadSignatureImage(sigData);
      if (uploadResult.success) baseParams.signatureUrl = uploadResult.url;
    } catch (e) {}
  } else if (sigData && !sigData.startsWith('data:image')) {
    baseParams.signatureUrl = sigData;
  }
  return gas(action, baseParams);
}

function saveUserWithExpiry(userData) {
  const dataToStore = { user: userData, expiry: Date.now() + (24 * 60 * 60 * 1000) };
  localStorage.setItem('currentUser', JSON.stringify(dataToStore));
}

function getUserWithExpiry() {
  const stored = localStorage.getItem('currentUser');
  if (!stored) return null;
  try {
    const data = JSON.parse(stored);
    if (data.expiry && Date.now() < data.expiry) return data.user;
    localStorage.removeItem('currentUser');
    return null;
  } catch (e) {
    localStorage.removeItem('currentUser');
    return null;
  }
}

// ═══════════════════════════════════════════════════════════════════
// DOMContentLoaded
// ═══════════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', function() {
  if (typeof Theme !== 'undefined' && Theme.applyToPage) {
    Theme.applyToPage();
    Theme.setPageTitle('Sales Invoice');
  }
  if (typeof Session !== 'undefined' && Session.checkValidity) {
    if (!Session.checkValidity()) return;
  }
  
  let ud = null;
  if (typeof Session !== 'undefined' && Session.getUser) ud = Session.getUser();
  if (!ud) ud = getUserWithExpiry();
  if (!ud) {
    const p = new URLSearchParams(location.search).get('user');
    if (p) { try { ud = JSON.parse(decodeURIComponent(p)); saveUserWithExpiry(ud); } catch (e) {} }
  }
  if (!ud) { location.href = 'index.html'; return; }
  try { currentUser = ud; } catch { location.href = 'index.html'; return; }
  
  if (currentUser.type !== 'Sales' && currentUser.type !== 'Admin') {
    showAlert('⚠️ You do not have permission to create sales invoices', '⚠️');
    const dp = DASH[currentUser.type] || 'Dashboard.html';
    setTimeout(() => { location.href = dp; }, 1500);
    return;
  }
  
  document.getElementById('userNameDisplay').textContent = currentUser.name || 'User';
  document.getElementById('userAvatar').textContent = (currentUser.name || 'U')[0].toUpperCase();
  if (currentUser.centerName) {
    const e = document.getElementById('centerDisplay');
    e.textContent = '🏢 ' + currentUser.centerName;
    e.style.display = '';
  }
  if (currentUser.branchName) {
    const e = document.getElementById('branchDisplay');
    e.textContent = '📍 ' + currentUser.branchName;
    e.style.display = '';
  }
  
  // ✅ عرض النموذج فوراً
  renderForm();
  
  // ✅ تحميل البيانات بالتوازي
  loadBackgroundData();
});

// ═══════════════════════════════════════════════════════════════════
// Background Data Loading (Parallel + sessionStorage Cache)
// ═══════════════════════════════════════════════════════════════════
function loadBackgroundData() {
  // ✅ 1. Cache أولاً (فوري)
  const cachedNats = getCachedList(CACHE_KEYS.NATIONALITIES);
  const cachedHotels = getCachedList(CACHE_KEYS.HOTELS);
  
  if (cachedNats) {
    setNationalitiesList(cachedNats);
    console.log('⚡ Nationalities from cache:', cachedNats.length);
  }
  if (cachedHotels) {
    setHotelsList(cachedHotels);
    console.log('⚡ Hotels from cache:', cachedHotels.length);
  }
  
  // ✅ 2. تحميل متوازي
  const promises = [
    gas('getLatestExchangeRates', { centerName: currentUser?.centerName }),
    gas('checkExchangeRateStatus', { centerName: currentUser?.centerName }),
    gas('getUniqueTrips', { centerName: currentUser?.centerName }),
    gas('getInvoiceCustomers', { centerName: currentUser?.centerName })
  ];
  
  // ✅ جلب الجنسيات/الفنادق من الدوال الجديدة
  promises.push(cachedNats ? Promise.resolve(null) : gas('getNationalitiesForDropdown').catch(() => null));
  promises.push(cachedHotels ? Promise.resolve(null) : gas('getHotelsForDropdown').catch(() => null));
  
  Promise.all(promises).then(([rates, status, trips, customers, nationalities, hotels]) => {
    
    // ---- Rates ----
    if (rates) {
      C.rate = rates;
      const td = fmtDateKey(new Date());
      if (!C.rateByDate[td]) C.rateByDate[td] = rates;
      
      const items = [
        { lbl: 'USD $', v: rates.bUSD || rates.sUSD },
        { lbl: 'EUR €', v: rates.bEUR || rates.sEUR },
        { lbl: 'GBP £', v: rates.bGBP || rates.sGBP }
      ].filter(x => x.v && +x.v > 0);
      
      const tickerItems = items.map(it => {
        const val = +it.v;
        const display = Number.isInteger(val) ? val.toString() : val.toFixed(2);
        return `<span class="ticker-item"><span class="rl">${it.lbl}</span><span class="rv">${display}</span></span>`;
      });
      const h = tickerItems.join('<span class="ticker-sep">◆</span>');
      document.getElementById('tickerInner').innerHTML = h + '<span class="ticker-sep" style="padding:0 20px"></span>' + h;
      
      const rawDate = rates.date || '';
      let displayDate = rawDate;
      if (rawDate && (rawDate.includes('T') || rawDate.match(/^\d{4}-\d{2}-\d{2}/))) {
        try {
          const d = new Date(rawDate);
          if (!isNaN(d)) {
            const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            displayDate = String(d.getDate()).padStart(2, '0') + '/' + MN[d.getMonth()] + '/' + d.getFullYear();
          }
        } catch (e) {}
      }
      document.getElementById('tickerDate').textContent = '📅 ' + displayDate;
    }
    
    // ---- Exchange rate status ----
    if (status && status.status !== 'ok') {
      if (status.status === 'block') {
        document.getElementById('mainContent').innerHTML =
          `<div class="err-bar">⛔ ${status.message}<br>Please update exchange rates first.</div>
           <div style="text-align:center"><button class="btn btn-clear" onclick="goBack()">← Back</button></div>`;
      } else if (status.status === 'warning') {
        const w = document.createElement('div');
        w.className = 'warn-bar';
        w.textContent = '⚠️ ' + (status.message || '');
        const mc = document.getElementById('mainContent');
        if (mc) mc.insertBefore(w, mc.firstChild);
      }
    }
    
    // ---- Nationalities ----
    if (nationalities && Array.isArray(nationalities) && nationalities.length > 0) {
      setNationalitiesList(nationalities);
      setCachedList(CACHE_KEYS.NATIONALITIES, nationalities);
    }
    
    // ---- Hotels ----
    if (hotels && Array.isArray(hotels) && hotels.length > 0) {
      setHotelsList(hotels);
      setCachedList(CACHE_KEYS.HOTELS, hotels);
    }
    
    // ---- Trips ----
    if (trips && Array.isArray(trips)) {
      const dl = document.getElementById('tripsList');
      if (dl) dl.innerHTML = trips.map(t => `<option value="${t.name || t}">`).join('');
    }
    
    // ---- Customers ----
    if (customers && Array.isArray(customers)) {
      const map = new Map();
      customers.forEach(c => {
        if (c.phone) {
          map.set(c.phone, {
            phone: c.phone,
            name: c.name || '',
            nationality: c.nationality || '',
            hotel: c.hotel || '',
            roomNo: c.roomNo || ''
          });
        }
      });
      C.customers = Array.from(map.values());
      console.log('✅ Customers loaded:', C.customers.length);
    }
    
  }).catch(err => {
    console.warn('⚠️ Some data failed to load:', err);
  });
}

// ========== Utilities ==========
function R2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtDateKey(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function goBack() {
  if (currentUser && typeof Session !== 'undefined' && Session.save) Session.save(currentUser);
  const returnUrl = sessionStorage.getItem('returnUrl');
  if (returnUrl) location.href = returnUrl;
  else {
    const ut = currentUser?.type || 'Admin';
    location.href = DASH[ut] || 'Dashboard.html';
  }
}
function showPDFOv(m) { document.getElementById('pdfMsg').textContent = m; document.getElementById('pdfOverlay').classList.add('show'); }
function hidePDFOv() { document.getElementById('pdfOverlay').classList.remove('show'); }
function showAlert(msg, icon, btns) {
  document.getElementById('alertMsg').textContent = msg;
  document.getElementById('alertIcon').textContent = icon || 'ℹ️';
  document.getElementById('alertBtns').innerHTML = btns || '<button class="btn btn-save" onclick="closeAlert()">OK</button>';
  document.getElementById('alertModal').classList.add('open');
}
function closeAlert() { document.getElementById('alertModal').classList.remove('open'); }
function setBtns(d) { ['btnSave','btnNewBooking','btnClear'].forEach(id => { const e = document.getElementById(id); if (e) e.disabled = d; }); }

function showPDFsModal(links) {
  const lh = links.map(v => `

        📄 ${v.voucherNo}
      </a>

        📱 WhatsApp
      </button>

  showAlert(links.length > 1 ? `✅ ${links.length} invoices saved` : '✅ Invoice saved', '✅',

async function shareInvoiceWhatsApp(voucherNo) {
  try {
    showPDFOv('📱 Preparing WhatsApp...');
    const invoice = await gas('getInvoiceByVoucher', { voucherNo, centerName: currentUser?.centerName });
    if (!invoice?.success) { hidePDFOv(); showAlert('❌ Invoice not found', '❌'); return; }
    
    const data = invoice.invoice;
    const centerName = data.centerName || 'Our Diving Center';
    let phone = (data.contactNo || '').replace(/[^0-9+]/g, '');
    if (phone.startsWith('0')) phone = '20' + phone.substring(1);
    if (!phone.startsWith('+')) phone = '+' + phone;
    if (!phone || phone === '+') { hidePDFOv(); showAlert('❌ No phone number found', '❌'); return; }
    
    const pdfUrl = data.invoicePdf || '';
    const pdfLink = pdfUrl ? `%0A%0A📄 *Invoice PDF:* ${pdfUrl}` : '';
    
    const message =
      `Dear ${data.guestName || 'Guest'},%0A%0A` +
      `Thank you for booking with ${centerName}.%0A%0A` +
      `*Booking Confirmation*%0A` +
      `Voucher No: ${data.voucherNo || ''}%0A` +
      `Trip: ${data.trip || ''}%0A` +
      `Date: ${data.activeDate || ''}${data.time ? ' at ' + data.time : ''}%0A` +
      `Total Amount: ${data.actualPrice || 0} ${data.invoiceCurrency || 'USD'}%0A` +
      `Balance Due: ${data.rest || 0} ${data.invoiceCurrency || 'USD'}%0A` +
      `Sales Rep: ${data.salesName || ''}%0A` +
      `${pdfLink}%0A%0A` +
      `We look forward to welcoming you soon! 🙏`;
    
    const waAppUrl = `whatsapp://send?phone=${phone}&text=${message}`;
    const waWebUrl = `https://wa.me/${phone}?text=${message}`;
    hidePDFOv();
    
    if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      window.location.href = waAppUrl;
      setTimeout(() => { if (!document.hidden) window.location.href = waWebUrl; }, 2000);
    } else {
      window.open(waWebUrl, '_blank');
    }
  } catch (err) {
    console.error('❌ shareInvoiceWhatsApp error:', err);
    hidePDFOv();
    showAlert('❌ Error: ' + err.message, '❌');
  }
}

async function getRate(dateStr, centerName) {
  if (!dateStr) return C.rate || null;
  if (C.rateByDate[dateStr]) return C.rateByDate[dateStr];
  try {
    const r = await gas('getExchangeRate', { dateStr, centerName: centerName || currentUser?.centerName });
    if (r) { C.rateByDate[dateStr] = r; return r; }
  } catch (e) { console.warn('rate fetch error:', e); }
  return C.rate || null;
}

function rateFields(r) {
  if (!r) return null;
  if (r.cash) return r;
  return {
    cash: { USD: +r.sUSD || 47.5, EUR: +r.sEUR || 50.25, GBP: +r.sGBP || 60 },
    visa: { USD: +r.sVUSD || 46.3, EUR: +r.sVEUR || 49, GBP: +r.sVGBP || 58.5, LE: +r.sVLE || 0.975 }
  };
}

function directPaid(cur, cU, cE, cG, cL, vU, vE, vG, vL) {
  if (cur === '$') return cU + vU;
  if (cur === '€') return cE + vE;
  if (cur === '£') return cG + vG;
  return cL + vL;
}

let nameSearchTimeout = null;

// ========== Phone Autocomplete ==========
function onPhoneInput() {

// ========== Guest Name: Space + Title Case ==========
function onGuestNameKeydown(e) {
  const el = e.target;
  if (!el) return;
  
  if (e.key === ' ' || e.keyCode === 32) {
    e.preventDefault();
    
    const value = el.value;
    const cursorPos = el.selectionStart;
    const beforeCursor = value.substring(0, cursorPos);
    const afterCursor = value.substring(cursorPos);
    
    const lastSpaceIdx = beforeCursor.lastIndexOf(' ');
    const currentWord = beforeCursor.substring(lastSpaceIdx + 1);
    
    let capitalized = currentWord;
    if (currentWord && currentWord.length > 0 && /^[a-zA-Z]/.test(currentWord)) {
      capitalized = currentWord.charAt(0).toUpperCase() + currentWord.slice(1).toLowerCase();
    }
    
    const newValue = value.substring(0, lastSpaceIdx + 1) + capitalized + ' ' + afterCursor;
    el.value = newValue;
    
    const newPos = lastSpaceIdx + 1 + capitalized.length + 1;
    el.setSelectionRange(newPos, newPos);
    
    onNameInput();
    return;
  }
  
  if (e.key === 'Backspace') {
    setTimeout(() => onNameInput(), 0);
  }
}

function onGuestNameInput() {
  onNameInput();
}

function onGuestNameBlur() {
  applyTitleCase('guestName');
}

function applyTitleCase(inputId) {
  if (!inputId) return;
  const el = document.getElementById(inputId);
  if (!el) return;
  
  const originalValue = el.value;
  const cursorPos = el.selectionStart;
  const newValue = toTitleCase(originalValue);
  if (newValue === originalValue) return;
  
  const lengthDiff = newValue.length - originalValue.length;
  el.value = newValue;
  const newCursorPos = Math.max(0, Math.min(newValue.length, cursorPos + lengthDiff));
  el.setSelectionRange(newCursorPos, newCursorPos);
}

function toTitleCase(str) {
  if (!str) return '';
  return str.replace(/([A-Za-z\u0600-\u06FF]+)/g, function(word) {
    if (/^[\u0600-\u06FF]/.test(word)) return word;
    return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
  });
}

function onNameInput() {
  const nameVal = (document.getElementById('guestName').value || '').trim().toLowerCase();
  if (nameSearchTimeout) clearTimeout(nameSearchTimeout);
  if (nameVal.length < 2) { closeAC('acNameDrop'); return; }
  nameSearchTimeout = setTimeout(() => {
    const filtered = C.customers.filter(c => c.name && c.name.toLowerCase().includes(nameVal)).slice(0, 6);
    renderAC('acNameDrop', filtered);
  }, 100);
}

 */
function onNationalityBlur() {
  const input = document.getElementById('nationality');
  if (!input) return;
  const value = (input.value || '').trim();
  if (!value) return;
  
  if (_nationalitiesList.length > 0) {
    const isValid = _nationalitiesList.some(n => n.toLowerCase() === value.toLowerCase());
    
    if (!isValid) {
      const lowerValue = value.toLowerCase();
      const suggestion = _nationalitiesList.find(n => n.toLowerCase().startsWith(lowerValue));
      
      if (suggestion) {
        input.value = suggestion;
      } else {
        input.value = '';
        showAlert(`⚠️ "${value}" is not in the nationality list.\nPlease select from the dropdown.`, '⚠️');
      }
    } else {
      // ✅ تطبيع الحالة
      const exact = _nationalitiesList.find(n => n.toLowerCase() === value.toLowerCase());
      if (exact && exact !== value) input.value = exact;
    }
  }
}

// ========== Customer Autocomplete ==========
function renderAC(id, hits) {
  const d = document.getElementById(id);
  if (!d) return;
  if (!hits.length) { d.classList.remove('open'); d.innerHTML = ''; return; }
  d._hits = hits;
  d.innerHTML = hits.map((c, i) => `
    <div class="ac-item" onclick="acPick('${id}', ${i})">
      <span class="ac-n">${esc(c.name) || '—'}</span>
      <span class="ac-s">📞 ${esc(c.phone) || ''} ${c.hotel ? '🏨 ' + esc(c.hotel) : ''}</span>
    </div>
  `).join('');
  d.classList.add('open');
}

function acPick(id, i) {
  const d = document.getElementById(id);
  if (!d || !d._hits) return;
  const c = d._hits[i];
  if (!c) return;
  if (c.name) document.getElementById('guestName').value = c.name;
  if (c.nationality) document.getElementById('nationality').value = c.nationality;
  if (c.hotel) document.getElementById('hotel').value = c.hotel;
  if (c.roomNo) document.getElementById('roomNo').value = c.roomNo;
  const code = document.getElementById('phoneCode');
  const num = document.getElementById('phoneNumber');
  if (c.phone && num) {
    let cleanPhone = c.phone.replace(/^(00|\+)/, '');
    num.value = cleanPhone;
    code.value = '+';
  }
  closeAC('acPhoneDrop');
  closeAC('acNameDrop');
}

function closeAC(id) {

  if (d) { d.classList.remove('open'); d.innerHTML = ''; }

function onTripFieldChange() {

  const cont = document.getElementById('tripSelectionContainer');

  } else {

    resetTrip();
  }

function onTripNameInput() { resetTrip(); document.getElementById('tripItemsContainer').innerHTML = ''; }
function resetTrip() { tripDef = []; tripPrices = []; tripCategory = ''; tripHasCost = false; }
function loadTripDef() {
  const tn = document.getElementById('tripName')?.value?.trim();
  const cur = document.getElementById('invoiceCurrency')?.value;
  if (tn && cur) loadTripData(tn, cur);
}

async function loadTripData(tripName, currency) {
  if (!tripName || !currency) return;
  const centerName = currentUser?.centerName;
  const key = tripName + '|' + currency + '|' + centerName;
  if (C.trips[key]) { applyTrip(C.trips[key]); return; }
  
  document.getElementById('tripItemsContainer').innerHTML = `<div class="trip-loading"><div class="trip-loading-spin"></div>Loading trip data...</div>`;
  try {
    const d = await gas('getTripData', { tripName, currency, centerName });
    if (!d || !d.items || !d.items.length) {
      document.getElementById('tripItemsContainer').innerHTML = '';
      showAlert('Trip not found: ' + tripName, '⚠️');
      return;
    }
    C.trips[key] = d;
    applyTrip(d);
  } catch (e) {
    document.getElementById('tripItemsContainer').innerHTML = '';
    showAlert('Error loading trip: ' + e.message, '❌');
  }
}

function applyTrip(d) {
  tripDef = d.items;
  tripPrices = d.prices || [];
  tripCategory = d.category || '';
  tripHasCost = d.hasCost === true;
  renderTripTable();
}
  
function renderTripTable() {
  if (!tripDef || !tripDef.length) return;
  let rows = '';
  for (let i = 0; i < tripDef.length; i++) {
    if (!tripDef[i]) continue;
    rows += `<tr><td style="font-weight:600">${tripDef[i]}</td><td><input type="number" id="qty_${i}" min="0" oninput="calcRow(${i})"></td><td><input type="number" id="price_${i}" value="${tripPrices[i] || 0}" readonly></td><td><input type="number" id="total_${i}" readonly></td></tr>`;
  }
  document.getElementById('tripItemsContainer').innerHTML = `<div class="trip-table"><table><thead><tr><th style="text-align:left;padding-left:14px">Item</th><th>QTY</th><th>Price</th><th>Total</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  scheduleCalc();
}
  
function calcRow(i) {
  const p = +document.getElementById(`price_${i}`)?.value || 0;
  const q = +document.getElementById(`qty_${i}`)?.value || 0;
  const totalField = document.getElementById(`total_${i}`);
  // ✅ إذا كانت الكمية صفر، اترك Total فارغاً
  totalField.value = (q > 0) ? (q * p).toFixed(2) : '';
  scheduleCalc();
}
  

function calcTotal() {
  let t = 0, i = 0;
  while (document.getElementById(`total_${i}`)) { t += +document.getElementById(`total_${i}`).value || 0; i++; }
  return t;
}

let _calcTimeout = null;
function scheduleCalc() { clearTimeout(_calcTimeout); _calcTimeout = setTimeout(updateAllCalc, 300); }

let _isUpdating = false;
async function updateAllCalc() {
  if (_isUpdating) return;
  _isUpdating = true;
  try {
    const actual = calcTotal();
    const cur = document.getElementById('invoiceCurrency')?.value || '';
    const ds = document.getElementById('activeDate')?.value;
    const el = id => document.getElementById(id);
    if (el('displayActualPrice')) el('displayActualPrice').textContent = actual.toFixed(2);
    if (el('actualPriceCurrency')) el('actualPriceCurrency').textContent = cur;
    const disc = +el('discount')?.value || 0;
    const cU = +el('cashUSD')?.value || 0, cE = +el('cashEUR')?.value || 0, cG = +el('cashGBP')?.value || 0, cL = +el('cashLE')?.value || 0;
    const vU = +el('visaUSD')?.value || 0, vE = +el('visaEUR')?.value || 0, vG = +el('visaGBP')?.value || 0, vL = +el('visaLE')?.value || 0;
    const raw = ds ? await getRate(ds, currentUser?.centerName) : C.rate;
    let paid = 0;
    const r = rateFields(raw);
    if (r) {
      const LE = cU * r.cash.USD + cE * r.cash.EUR + cG * r.cash.GBP + cL + vU * r.visa.USD + vE * r.visa.EUR + vG * r.visa.GBP + vL * (r.visa.LE || 0.975);
      if (cur === '$') paid = R2(LE / r.cash.USD);
      else if (cur === '€') paid = R2(LE / r.cash.EUR);
      else if (cur === '£') paid = R2(LE / r.cash.GBP);
      else paid = R2(LE);
    } else { paid = directPaid(cur, cU, cE, cG, cL, vU, vE, vG, vL); }
    const rest = R2(actual - disc - paid);
    if (el('displayRest')) el('displayRest').textContent = rest.toFixed(2);
    if (el('restCurrency')) el('restCurrency').textContent = cur;
  } finally { _isUpdating = false; }
}

function updateSessionBadge() {
  let b = document.getElementById('sessionBadge');
  if (!sessionVouchers.length) { if (b) b.remove(); return; }
  if (!b) {
    b = document.createElement('div');
    b.id = 'sessionBadge';
    b.className = 'session-badge';
    const mc = document.getElementById('mainContent');
    mc.insertBefore(b, mc.firstChild);
  }
  const lk = sessionVouchers.map(v => `<a href="${v.url}" target="_blank" rel="noopener" style="color:var(--blue);font-weight:700;text-decoration:none;font-size:12px">📄 ${v.voucherNo}</a>`).join(' ');
  b.innerHTML = `<span class="cnt">${sessionVouchers.length}</span><strong>${sessionVouchers.length} booking${sessionVouchers.length > 1 ? 's' : ''}</strong><span style="flex:1;display:flex;gap:6px;flex-wrap:wrap;align-items:center">${lk}</span><span style="font-size:11px;color:var(--green)">✅ Click Save to finish</span>`;
}

// ========== Collect Data ==========
async function collectData() {
  const el = id => document.getElementById(id);
  let phoneNumberRaw = el('phoneNumber')?.value || '';
  let phoneNumberDigits = phoneNumberRaw.replace(/\D/g, '');
  let fullPhoneForSheet = '00' + phoneNumberDigits;
  let acts = [], i = 0;
  while (el(`qty_${i}`)) {
    const q = +el(`qty_${i}`).value || 0;
    if (q > 0 && tripDef[i]) acts.push(`${tripDef[i]}×${q}`);
    i++;
  }
  const items = Array.from({ length: 10 }, (_, j) => +(el(`qty_${j}`)?.value) || 0);
  let actualPrice = 0;
  items.forEach((q, j) => { if (q && tripPrices[j]) actualPrice += q * tripPrices[j]; });
  const cU = +el('cashUSD')?.value || 0, cE = +el('cashEUR')?.value || 0, cG = +el('cashGBP')?.value || 0, cL = +el('cashLE')?.value || 0;
  const vU = +el('visaUSD')?.value || 0, vE = +el('visaEUR')?.value || 0, vG = +el('visaGBP')?.value || 0, vL = +el('visaLE')?.value || 0;
  const disc = +el('discount')?.value || 0;
  const cur = el('invoiceCurrency')?.value || '';
  const ds = el('activeDate')?.value;
  let paid = 0;
  const raw = ds ? await getRate(ds) : C.rate;
  const r = rateFields(raw);
  if (r) {
    const LE = cU * r.cash.USD + cE * r.cash.EUR + cG * r.cash.GBP + cL + vU * r.visa.USD + vE * r.visa.EUR + vG * r.visa.GBP + vL * (r.visa.LE || 0.975);
    if (cur === '$') paid = R2(LE / r.cash.USD);
    else if (cur === '€') paid = R2(LE / r.cash.EUR);
    else if (cur === '£') paid = R2(LE / r.cash.GBP);
    else paid = R2(LE);
  } else paid = directPaid(cur, cU, cE, cG, cL, vU, vE, vG, vL);
  const prices = [];
  for (let i = 0; i < 10; i++) {
    const priceEl = document.getElementById(`price_${i}`);
    prices.push(priceEl ? parseFloat(priceEl.value) || 0 : 0);
  }
  return {
    salesId: currentUser?.id || '',
    salesName: currentUser?.name || '',
    centerName: currentUser?.centerName || '',
    branchName: currentUser?.branchName || '',
    guestName: el('guestName')?.value || '',
    nationality: el('nationality')?.value || '',
    contactNo: fullPhoneForSheet,
    hotel: el('hotel')?.value || '',
    roomNo: el('roomNo')?.value || '',
    activeDate: ds,
    time: el('tripTime')?.value || '',
    trip: el('tripName')?.value || '',
    invoiceCurrency: cur,
    item0: items[0], item1: items[1], item2: items[2], item3: items[3], item4: items[4],
    item5: items[5], item6: items[6], item7: items[7], item8: items[8], item9: items[9],
    cashUSD: cU, cashEUR: cE, cashGBP: cG, cashLE: cL,
    visaUSD: vU, visaEUR: vE, visaGBP: vG, visaLE: vL,
    notes: el('notes')?.value || '',
    discount: disc,
    actualPrice: actualPrice,
    paymentPrice: paid,
    rest: R2(actualPrice - disc - paid),
    adultCount: +el('adultCount')?.value || 0,
    childCount: +el('childCount')?.value || 0,
    infantCount: +el('infantCount')?.value || 0,
    activitiesText: acts.join(' | '),
    signatureData: signatureData || '',
    cost: tripHasCost,
    state: 'pending',
    pricesArray: prices
  };
}

// ========== Validate ==========
async function validate() {
  const inv = await collectData();
  if (!inv.guestName) { showAlert('Please enter guest name', '⚠️'); return null; }
  if (!inv.contactNo) { showAlert('Please enter phone number', '⚠️'); return null; }
  if (!inv.nationality) { showAlert('Please enter nationality', '⚠️'); return null; }
  if (!inv.hotel) { showAlert('Please enter hotel', '⚠️'); return null; }
  if (!inv.activeDate) { showAlert('Please enter execution date', '⚠️'); return null; }
  if (!inv.time) { showAlert('Please select departure time', '⚠️'); return null; }
  if (!inv.invoiceCurrency) { showAlert('Please select invoice currency', '⚠️'); return null; }
  if (!inv.trip) { showAlert('Please select trip name', '⚠️'); return null; }
  
  // ✅ التحقق الصارم من الجنسية
  if (_nationalitiesList.length > 0) {
    const isValid = _nationalitiesList.some(n => n.toLowerCase() === inv.nationality.toLowerCase().trim());
    if (!isValid) {
      showAlert(`⚠️ Nationality "${inv.nationality}" is not registered.\nPlease select a nationality from the official list.`, '⚠️');
      return null;
    }
  }
  return inv;
}

// ========== Save Invoice ==========
async function saveInvoice() {
  try {
    setBtns(true);
    showPDFOv('💾 Saving invoice...');
    const formData = await collectData();
    if (!formData) { hidePDFOv(); setBtns(false); return; }
    
    // ✅ التحقق الصارم من الجنسية
    if (_nationalitiesList.length > 0) {
      const isValid = _nationalitiesList.some(n => n.toLowerCase() === formData.nationality.toLowerCase().trim());
      if (!isValid) {
        hidePDFOv();
        setBtns(false);
        showAlert(`⚠️ Nationality "${formData.nationality}" is not registered.\nPlease select a nationality from the official list.`, '⚠️');
        return;
      }
    }
    
    const prices = [];
    for (let i = 0; i < 10; i++) {
      const priceEl = document.getElementById(`price_${i}`);
      prices.push(priceEl ? parseFloat(priceEl.value) || 0 : 0);
    }
    formData.pricesArray = prices;
    
    let uploadedSignatureUrl = '';
    if (signatureData && signatureData.startsWith('data:image')) {
      try {
        const uploadResult = await uploadSignatureImage(signatureData);
        if (uploadResult.success) uploadedSignatureUrl = uploadResult.url;
      } catch (e) {}
    }
    formData.signatureUrl = uploadedSignatureUrl;
    formData.signatureData = '';
    
    const saveResult = await gas('saveInvoice', formData);
    if (!saveResult?.success) throw new Error(saveResult?.message || 'Save failed');
    const voucherNo = saveResult.voucherNo;
    const signatureUrlFromServer = saveResult.signatureUrl || '';
    
    showPDFOv('📄 Generating PDF...');
    const pdfResult = await gas('saveAndGenerateSinglePDF_New', {
      voucherNo: voucherNo,
      prices: JSON.stringify(prices),
      signatureUrl: signatureUrlFromServer || '',
      centerName: currentUser?.centerName
    });
    hidePDFOv();
    
    if (!pdfResult?.success) {
      showAlert('Saved but PDF failed: ' + (pdfResult?.message || ''), '⚠️');
      return;
    }
    const allVouchers = [...sessionVouchers, { voucherNo, url: pdfResult.url }];
    sessionVouchers = [];
    clearFormFull();
    showPDFsModal(allVouchers);
  } catch (err) {
    console.error('❌ Error:', err);
    hidePDFOv();
    showAlert('Error: ' + err.message, '❌');
  } finally { setBtns(false); }
}

async function newBooking() {
  try {
    setBtns(true);
    showPDFOv('💾 Saving booking...');
    const formData = await validate();
    if (!formData) { hidePDFOv(); setBtns(false); return; }
    const prices = formData.pricesArray || [];
    const saveResult = await gasWithSig('saveInvoice', formData);
    if (!saveResult?.success) throw new Error(saveResult?.message || 'Save failed');
    const voucherNo = saveResult.voucherNo;
    showPDFOv('📄 Generating PDF...');
    const pdfResult = await gas('saveAndGenerateSinglePDF_New', { voucherNo, prices: JSON.stringify(prices) });
    hidePDFOv();
    if (pdfResult?.success) {
      sessionVouchers.push({ voucherNo, url: pdfResult.url });
      updateSessionBadge();
      clearFormPartial();
      showAlert(`✅ Saved ${voucherNo}\n${sessionVouchers.length} booking(s) in session`, '✅');
    } else { showAlert('Saved but PDF failed', '⚠️'); }
  } catch (err) {
    console.error('❌ Error:', err);
    hidePDFOv();
    showAlert('Error: ' + err.message, '❌');
  } finally { setBtns(false); }
}

// ========== Clear Form ==========
function clearFormFull() {
  signatureData = null;
  resetTrip();
  ckHour = null; ckMin = null;
  ['phoneNumber','guestName','nationality','hotel','roomNo','adultCount','childCount','infantCount','activeDate','invoiceCurrency','notes','discount','tripName'].forEach(id => {
    const e = document.getElementById(id);
    if (e) e.value = '';
  });
  document.getElementById('tripItemsContainer').innerHTML = '';
  document.getElementById('tripSelectionContainer').style.display = 'none';
  const sp = document.getElementById('sigPreview');
  if (sp) { sp.style.display = 'none'; sp.innerHTML = ''; }
  ['displayActualPrice','displayRest'].forEach(id => { const e = document.getElementById(id); if (e) e.textContent = '0.00'; });
  ['cashUSD','cashEUR','cashGBP','cashLE','visaUSD','visaEUR','visaGBP','visaLE'].forEach(id => { const e = document.getElementById(id); if (e) e.value = ''; });
  document.getElementById('tripTime').value = '';
  const td = document.getElementById('timeDisplayText');
  if (td) { td.textContent = 'Select time...'; td.classList.add('ph'); }
  updateSessionBadge();
}

function clearFormPartial() {
  resetTrip();
  ckHour = null; ckMin = null;
  ['activeDate','notes','discount','tripName'].forEach(id => { const e = document.getElementById(id); if (e) e.value = ''; });
  document.getElementById('tripItemsContainer').innerHTML = '';
  document.getElementById('tripSelectionContainer').style.display = 'none';
  document.getElementById('tripTime').value = '';
  const td = document.getElementById('timeDisplayText');
  if (td) { td.textContent = 'Select time...'; td.classList.add('ph'); }
  if (signatureData) {
    const sp = document.getElementById('sigPreview');
    if (sp) { sp.style.display = 'block'; sp.innerHTML = `<img src="${signatureData}" alt="Signature">`; }
  }
  ['displayActualPrice','displayRest'].forEach(id => { const e = document.getElementById(id); if (e) e.textContent = '0.00'; });
  ['cashUSD','cashEUR','cashGBP','cashLE','visaUSD','visaEUR','visaGBP','visaLE'].forEach(id => { const e = document.getElementById(id); if (e) e.value = ''; });
}

function clearForm() {
  if (sessionVouchers.length) {
    showAlert(`Warning: ${sessionVouchers.length} booking(s) in session.\nClear form only or cancel session?`, '⚠️',
      `<button class="btn btn-clear" onclick="clearFormPartial();closeAlert()">Clear Form Only</button><button class="btn btn-save" onclick="cancelSession()">Cancel Session</button>`);
  } else clearFormFull();
}

function cancelSession() { sessionVouchers = []; clearFormFull(); closeAlert(); }

// ========== Clock Picker ==========
function buildClockFace() {
  const tg = document.getElementById('ckTicks'), ng = document.getElementById('ckNums');
  if (!tg || !ng || tg.children.length) return;
  for (let i = 0; i < 60; i++) {
    const a = (i * 6 - 90) * Math.PI / 180, maj = i % 5 === 0, r1 = maj ? 96 : 103, r2 = 109;
    const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln.setAttribute('x1', CX + r1 * Math.cos(a));
    ln.setAttribute('y1', CY + r1 * Math.sin(a));
    ln.setAttribute('x2', CX + r2 * Math.cos(a));
    ln.setAttribute('y2', CY + r2 * Math.sin(a));
    ln.setAttribute('stroke', maj ? '#0f1f3d' : '#c5cfe0');
    ln.setAttribute('stroke-width', maj ? '2.5' : '1');
    tg.appendChild(ln);
  }
  for (let i = 1; i <= 12; i++) {
    const a = (i * 30 - 90) * Math.PI / 180;
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', CX + 82 * Math.cos(a));
    t.setAttribute('y', CY + 82 * Math.sin(a));
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('dominant-baseline', 'central');
    t.setAttribute('font-size', '14');
    t.setAttribute('font-weight', '700');
    t.setAttribute('fill', '#1a2540');
    t.setAttribute('font-family', 'Cairo,sans-serif');
    t.textContent = i;
    ng.appendChild(t);
  }
  for (let i = 1; i <= 12; i++) {
    const a = (i * 30 - 90) * Math.PI / 180;
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', CX + 54 * Math.cos(a));
    t.setAttribute('y', CY + 54 * Math.sin(a));
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('dominant-baseline', 'central');
    t.setAttribute('font-size', '9');
    t.setAttribute('font-weight', '600');
    t.setAttribute('fill', '#94a3b8');
    t.setAttribute('font-family', 'Cairo,sans-serif');
    t.textContent = (i + 12) % 24 || 12;
    ng.appendChild(t);
  }
}

function updateHands() {
  const h = ckHour !== null ? ckHour : 0, m = ckMin !== null ? ckMin : 0;
  const ha = ((h % 12) * 30 + (m * 0.5) - 90) * Math.PI / 180, ma = (m * 6 - 90) * Math.PI / 180;
  const hx = CX + 50 * Math.cos(ha), hy = CY + 50 * Math.sin(ha), mx = CX + 68 * Math.cos(ma), my = CY + 68 * Math.sin(ma);
  const hh = document.getElementById('ckHandH');
  if (hh) { hh.setAttribute('x2', hx); hh.setAttribute('y2', hy); }
  const hm = document.getElementById('ckHandM');
  if (hm) { hm.setAttribute('x2', mx); hm.setAttribute('y2', my); }
  const dot = document.getElementById('ckDot');
  if (dot) {
    if (ckMode === 'hour' && ckHour !== null) { dot.setAttribute('cx', hx); dot.setAttribute('cy', hy); dot.setAttribute('opacity', '1'); }
    else if (ckMode === 'minute' && ckMin !== null) { dot.setAttribute('cx', mx); dot.setAttribute('cy', my); dot.setAttribute('opacity', '1'); }
    else dot.setAttribute('opacity', '0');
  }
  const hs = ckHour !== null ? (ckHour < 10 ? '0' + ckHour : '' + ckHour) : '--';
  const ms = ckMin !== null ? (ckMin < 10 ? '0' + ckMin : '' + ckMin) : '--';
  const hEl = document.getElementById('ckH'), mEl = document.getElementById('ckM');
  if (hEl) { hEl.textContent = hs; hEl.style.color = ckMode === 'hour' ? 'var(--gold)' : 'white'; }
  if (mEl) { mEl.textContent = ms; mEl.style.color = ckMode === 'minute' ? 'var(--gold)' : 'white'; }
}

function openClockModal() {
  buildClockFace();
  const ex = document.getElementById('tripTime').value;
  if (ex) { const [h, m] = ex.split(':'); ckHour = +h; ckMin = +m; }
  else { ckHour = null; ckMin = null; }
  ckMode = 'hour';
  document.getElementById('modeHour').classList.add('active');
  document.getElementById('modeMin').classList.remove('active');
  updateHands();
  document.getElementById('clockModal').classList.add('open');
  bindClockTouch();
}

function closeClockModal() { document.getElementById('clockModal').classList.remove('open'); }
function clearClock() { ckHour = null; ckMin = null; updateHands(); }

function confirmClock() {
  if (ckHour === null || ckMin === null) { showAlert('Please select hour and minute', '⚠️'); return; }
  const t = (ckHour < 10 ? '0' + ckHour : '' + ckHour) + ':' + (ckMin < 10 ? '0' + ckMin : '' + ckMin);
  document.getElementById('tripTime').value = t;
  const td = document.getElementById('timeDisplayText');
  if (td) { td.textContent = t; td.classList.remove('ph'); }
  closeClockModal();
  onTripFieldChange();
}

function setClockMode(m) {
  ckMode = m;
  document.getElementById('modeHour').classList.toggle('active', m === 'hour');
  document.getElementById('modeMin').classList.toggle('active', m === 'minute');
  updateHands();
}

function bindClockTouch() {
  const wrap = document.getElementById('ckWrap');
  if (!wrap) return;
  const nw = wrap.cloneNode(true);
  wrap.parentNode.replaceChild(nw, wrap);
  nw.addEventListener('click', onClockClick);
  nw.addEventListener('touchend', e => { e.preventDefault(); onClockClick(e.changedTouches[0]); }, { passive: false });
}

function onClockClick(e) {
  const wrap = document.getElementById('ckWrap');
  if (!wrap) return;
  const rect = wrap.getBoundingClientRect();
  const sx = ((e.clientX || e.pageX) - rect.left) * (230 / rect.width);
  const sy = ((e.clientY || e.pageY) - rect.top) * (230 / rect.height);
  const dx = sx - CX, dy = sy - CY, dist = Math.sqrt(dx * dx + dy * dy);
  let angle = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
  if (angle < 0) angle += 360;
  if (ckMode === 'hour') {
    let h = Math.round(angle / 30) % 12;
    if (h === 0) h = 12;
    if (dist < 65) h = (h === 12 ? 0 : h) + 12;
    ckHour = h % 24;
    ckMode = 'minute';
    document.getElementById('modeHour').classList.remove('active');
    document.getElementById('modeMin').classList.add('active');
  } else { ckMin = Math.round(angle / 6) % 60; }
  updateHands();
}

// ========== Signature ==========
function openSigModal() {
  document.getElementById('signatureModal').classList.add('open');
  sigCanvas = document.getElementById('signatureCanvas');
  sigCtx = sigCanvas.getContext('2d');
  sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
  sigCtx.strokeStyle = '#0f1f3d';
  sigCtx.lineWidth = 2.5;
  sigCtx.lineCap = 'round';
  sigCtx.lineJoin = 'round';
  sigCanvas.addEventListener('touchstart', tStart, { passive: false });
  sigCanvas.addEventListener('touchmove', tMove, { passive: false });
  sigCanvas.addEventListener('touchend', () => isDrawing = false);
  sigCanvas.addEventListener('mousedown', mDown);
  sigCanvas.addEventListener('mousemove', mMove);
  sigCanvas.addEventListener('mouseup', () => isDrawing = false);
  sigCanvas.addEventListener('mouseleave', () => isDrawing = false);
}

function closeSigModal() { document.getElementById('signatureModal').classList.remove('open'); }
function clearSigCanvas() { if (sigCtx) sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height); }

function confirmSignature() {
  if (!sigCanvas) return;
  const tempCanvas = document.createElement('canvas');
  const ctx = tempCanvas.getContext('2d');
  const newWidth = 200, newHeight = 80;
  tempCanvas.width = newWidth;
  tempCanvas.height = newHeight;
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, newWidth, newHeight);
  ctx.drawImage(sigCanvas, 0, 0, sigCanvas.width, sigCanvas.height, 0, 0, newWidth, newHeight);
  signatureData = tempCanvas.toDataURL('image/jpeg', 0.4);
  const sp = document.getElementById('sigPreview');
  if (sp) { sp.style.display = 'block'; sp.innerHTML = `<img src="${signatureData}" alt="Signature" style="max-width:150px; border:1px solid #ccc;">`; }
  closeSigModal();
}

function getPos(c, e) {
  const r = c.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (c.width / r.width), y: (e.clientY - r.top) * (c.height / r.height) };
}

function mDown(e) { isDrawing = true; const p = getPos(sigCanvas, e); lastX = p.x; lastY = p.y; }
function mMove(e) { if (!isDrawing) return; const p = getPos(sigCanvas, e); sigCtx.beginPath(); sigCtx.moveTo(lastX, lastY); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); lastX = p.x; lastY = p.y; }
function tStart(e) { e.preventDefault(); const t = e.touches[0], p = getPos(sigCanvas, t); isDrawing = true; lastX = p.x; lastY = p.y; }
function tMove(e) { e.preventDefault(); if (!isDrawing) return; const t = e.touches[0], p = getPos(sigCanvas, t); sigCtx.beginPath(); sigCtx.moveTo(lastX, lastY); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); lastX = p.x; lastY = p.y; }

// ========== Expose Globally ==========
window.setNationalitiesList = setNationalitiesList;
window.setHotelsList = setHotelsList;
window.onNationalityBlur = onNationalityBlur;
window.fillDatalist = fillDatalist;
window.onGuestNameInput = onGuestNameInput;
window.onGuestNameKeydown = onGuestNameKeydown;
window.onGuestNameBlur = onGuestNameBlur;
window.applyTitleCase = applyTitleCase;
window.toTitleCase = toTitleCase;
</script>
